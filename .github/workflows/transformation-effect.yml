          path: ${{ runner.temp }}/external-conformance-eligibility
          if-no-files-found: ignore
          retention-days: 30
      - name: Seal capability evidence
        run: |
          cd "$RUNNER_TEMP/external-capability-execution"
          sha256sum observation.json report.json suite.json replay-report.json replay-suite.json > manifest.sha256
      - name: Upload capability evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: external-capability-go127-${{ env.SUBJECT_SHA }}
          path: ${{ runner.temp }}/external-capability-execution
          if-no-files-found: ignore
          retention-days: 30
      - name: Seal execution evidence
        run: |
          result="$RUNNER_TEMP/external-ecosystem-execution"
          cd "$result"
          sha256sum observation.json report.json suite.json replay-report.json replay-suite.json > manifest.sha256
      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: external-ecosystem-go127-baseline-${{ env.SUBJECT_SHA }}
          path: ${{ runner.temp }}/external-ecosystem-execution
          if-no-files-found: ignore
          retention-days: 30

  language-delivery-scorecard:
    name: language-delivery-scorecard
    needs:
      - language-concept-artifact
      - language-source-execution
      - user-journey-scorecard
    if: needs.language-concept-artifact.outputs.predecessor-mode == 'RESOLVED'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      GOTOOLCHAIN: go1.27.0
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: true
      - name: Reduce fixed language delivery contract
        shell: bash
        run: bash scripts/language-delivery-scorecard/main.sh
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: language-delivery-scorecard-${{ env.HEAD_SHA }}
          path: |
            delivery-output/report.json
            delivery-output/unknown-report.json
            delivery-evidence/manifest.json
          if-no-files-found: error
          retention-days: 30

  language-source-execution:
    name: language-source-execution
    needs: [language-concept-artifact]
    if: >-
      needs.language-concept-artifact.outputs.predecessor-mode == 'RESOLVED' &&
      (
        github.event_name == 'pull_request' ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          (github.event.workflow_run.head_branch == 'dev' || github.event.workflow_run.head_branch == 'main')
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: go1.27.0
      HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 1
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: true
      - name: Execute Gooo source and reduce fixed receipts
        shell: bash
        run: bash scripts/language-source-execution/main.sh
      - name: Upload exact-head source execution artifact
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: language-source-execution-${{ env.HEAD_SHA }}
          path: source-execution-output
          if-no-files-found: error
          retention-days: 30

  language-artifact-oracle:
    name: language-artifact-oracle
    needs: [language-source-execution]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: go1.27.0
      HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 1
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: true
      - name: Download exact source execution artifact
        uses: actions/download-artifact@v7
        with:
          name: language-source-execution-${{ env.HEAD_SHA }}
          path: source-execution-output
      - name: Evaluate source artifacts with a dependency-separated oracle
        shell: bash
        run: bash scripts/language-artifact-oracle/main.sh
      - name: Upload exact-head artifact oracle
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: language-artifact-oracle-${{ env.HEAD_SHA }}
          path: artifact-oracle-output
          if-no-files-found: error
          retention-days: 30

  language-source-binding-promotion:
    name: language-source-binding-promotion
    needs: [language-source-execution, language-artifact-oracle]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: go1.27.0
      HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
      SOURCE_EXECUTION_INPUT: source-execution-input
      ARTIFACT_ORACLE_INPUT: artifact-oracle-input
      PROMOTION_OUTPUT: source-binding-promotion-output
    steps:
      - name: Check out the exact source identity
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
      - name: Bind the declared Go 1.27 toolchain
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Download structural source execution evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: language-source-execution-${{ env.HEAD_SHA }}
          path: source-execution-input
      - name: Download independent source binding evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: language-artifact-oracle-${{ env.HEAD_SHA }}
          path: artifact-oracle-input
      - name: Promote only the independently bound claim
        shell: bash
        run: bash scripts/language-source-binding-promotion/main.sh
      - name: Upload append-only source binding promotion receipt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: language-source-binding-promotion-${{ env.HEAD_SHA }}
          path: source-binding-promotion-output
          if-no-files-found: error
          retention-days: 30
