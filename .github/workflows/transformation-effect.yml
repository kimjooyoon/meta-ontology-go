          path: ${{ runner.temp }}/language-deterministic-query/first/binding
          if-no-files-found: error
          retention-days: 30
      - name: Upload exact-head Go interoperation
        uses: actions/upload-artifact@v6
        with:
          name: language-go-interoperation-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/language-go-interoperation/first/interop
