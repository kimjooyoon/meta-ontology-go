          done
          cmp "$result/first-receipt.json" "$result/replay-receipt.json"
          cmp "$result/first-suite.json" "$result/replay-suite.json"
          cmp "$result/first-summary.md" "$result/replay-summary.md"
          jq -e '.decision == "AUTHORIZED_SHADOW" and .resolution == "EXACT" and .enforcement_effect == "NO_EFFECT"' "$result/first-receipt.json"
          jq -e '.completed == 10 and .total == 10 and .basis_points == 10000 and .unknown_indicators == 0' "$result/first-receipt.json"
          jq -e '.open_claims == 0 and .discharged_claims == 10 and .rejected_claims == 0' "$result/first-receipt.json"
          jq -e '.execution_authority == false and .repository_mutation_authority == false and .promotion_authority == false' "$result/first-receipt.json"
          jq -e '.decision == "PASS" and .passed == 12 and .total == 12 and .coverage_bps == 10000' "$result/first-suite.json"
          cat "$result/first-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Seal capability authorization foundation evidence
        run: |
          cd "$RUNNER_TEMP/external-capability-authorization-foundation"
          sha256sum metadata.json first-receipt.json replay-receipt.json \
            first-suite.json replay-suite.json first-summary.md replay-summary.md > manifest.sha256

      - name: Upload capability authorization foundation evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: external-capability-authorization-foundation-${{ env.SUBJECT_SHA }}
          path: ${{ runner.temp }}/external-capability-authorization-foundation
