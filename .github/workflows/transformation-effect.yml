            -toolchain-use-cases "$usecase_first/artifact.json" \
            -language-syntax-roundtrip "$syntax_first/artifact.json" \
            -language-diagnostic-provenance "$diagnostic_first/artifact.json" \
            -language-package-runtime "$runtime_first/artifact.json" \
            -toolchain-cli "$cli_first/artifact.json" \
            -toolchain-format-fix "$format_fix_first/artifact.json" \
            -toolchain-lsp "$lsp_first/artifact.json" \
            -toolchain-conformance "$conformance_first/artifact.json" \
            -toolchain-cross-platform-release "$release_first/artifact.json" \
            -expected-repository "$GITHUB_REPOSITORY" \
            -expected-sha "$HEAD_SHA" \
            -expected-predecessor-sha "$predecessor_sha" \
            -check "$readiness_first/artifact.json"
          (
            cd "$readiness_first"
            sha256sum artifact.json > artifact.json.sha256
          )
          if [[ "$PREDECESSOR_MODE" == "RESOLVED" ]]; then
            improvement_first="$RUNNER_TEMP/language-readiness-improvement/first"
            improvement_replay="$RUNNER_TEMP/language-readiness-improvement/replay"
            baseline="$RUNNER_TEMP/language-readiness-baseline-a/artifact.json"
            baseline_reference="$RUNNER_TEMP/language-readiness-baseline-reference-a.json"
            mkdir -p "$improvement_first" "$improvement_replay"
            for target in "$improvement_first" "$improvement_replay"; do
              go run ./cmd/language-readiness-witness/transition \
                -root "$GITHUB_WORKSPACE" \
                -before "$baseline" \
                -baseline-reference "$baseline_reference" \
                -after "$readiness_first/artifact.json" \
                -expected-sha "$HEAD_SHA" \
                -output "$target/artifact.json"
            done
            cmp -s "$improvement_first/artifact.json" "$improvement_replay/artifact.json"
            go run ./cmd/language-readiness-witness/transition \
              -root "$GITHUB_WORKSPACE" \
              -before "$baseline" \
              -baseline-reference "$baseline_reference" \
              -after "$readiness_first/artifact.json" \
              -expected-sha "$HEAD_SHA" \
              -check "$improvement_first/artifact.json"
            (
              cd "$improvement_first"
              sha256sum artifact.json > artifact.json.sha256
            )
          fi
      - name: Measure exact predecessor bindings
        if: steps.proposal-predecessor.outputs.mode != 'BLOCKED' && steps.readiness-predecessor.outputs.mode != 'BLOCKED'
        run: |
          for suffix in a b; do
            go run ./cmd/language-readiness-witness/predecessor-binding \
              --root "$GITHUB_WORKSPACE" \
              --expected-sha "$HEAD_SHA" \
              --output "$RUNNER_TEMP/language-readiness-predecessor-binding-$suffix.json" \
              --check
          done
          cmp "$RUNNER_TEMP/language-readiness-predecessor-binding-a.json" \
            "$RUNNER_TEMP/language-readiness-predecessor-binding-b.json"
      - name: Prove exact predecessor binding transition
        if: steps.readiness-predecessor.outputs.mode == 'RESOLVED'
        run: |
          for suffix in a b; do
            go run ./cmd/language-readiness-witness/predecessor-binding/transition \
              --root "$GITHUB_WORKSPACE" \
              --before "$RUNNER_TEMP/language-readiness-binding-baseline-a.json" \
              --after "$RUNNER_TEMP/language-readiness-predecessor-binding-a.json" \
