  user-journey-scorecard:
    name: user-journey-scorecard
    needs: [language-concept-artifact]
    if: >-
      needs.language-concept-artifact.outputs.predecessor-mode == 'RESOLVED' &&
      (
        github.event_name == 'pull_request' ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          (github.event.workflow_run.head_branch == 'dev' || github.event.workflow_run.head_branch == 'main')
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: go1.27.0
      HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: true
      - name: Download exact functional CLI receipt
        uses: actions/download-artifact@v7
        with:
          name: toolchain-cli-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/user-journey/upstream
      - name: Observe user journeys and reduce audience views
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/user-journey"
          binary="$work/gooo"
          contract="$GITHUB_WORKSPACE/examples/user-journey-scorecard/contract.json"
          upstream="$work/upstream/artifact.json"
          expected_journeys="$(jq '.journeys | length' "$contract")"
          expected_samples="$(jq '.samples_per_journey * (.journeys | length)' "$contract")"
          mkdir -p "$work/first" "$work/replay" "$work/negative"
          go build -trimpath -o "$binary" ./cmd/gooo
          bash ./scripts/user-journey-profile/main.sh "$binary" "$GITHUB_WORKSPACE" "$HEAD_SHA" "$work/profile.json" 5
          common=(
            -root "$GITHUB_WORKSPACE"
            -executable "$binary"
            -expected-head "$HEAD_SHA"
            -contract "$contract"
            -upstream "$upstream"
            -profile "$work/profile.json"
          )
          go run ./cmd/user-journey-scorecard "${common[@]}" -output "$work/first/report.json"
          go run ./cmd/user-journey-scorecard "${common[@]}" -output "$work/replay/report.json"
          cmp -s "$work/first/report.json" "$work/replay/report.json"
          go run ./cmd/user-journey-scorecard "${common[@]}" -check "$work/first/report.json"
          jq -e --argjson expected_journeys "$expected_journeys" --argjson expected_samples "$expected_samples" '
            .schema == "gooo/user-journey-scorecard/v1" and
            .status == "PASS" and .decision == "PASS" and .resolution == "EXACT" and
            .summary.coordinates.satisfied == 15 and .summary.coordinates.total == 15 and
            .summary.functional.upstream_cases == 12 and .summary.functional.positive_journeys == $expected_journeys and
            .summary.resources.samples_observed == $expected_samples and .summary.resources.samples_expected == $expected_samples and
            .summary.resources.envelopes_passed == $expected_journeys and
            .summary.meta.bindings == (.summary.functional.upstream_cases + $expected_journeys) and .summary.meta.unknowns == 0 and
            (.views[] | select(.Audience == "USER") | .Satisfied == 6 and .Total == 6) and
            (.views[] | select(.Audience == "TOOL_AUTHOR") | .Satisfied == 10 and .Total == 10) and
            (.views[] | select(.Audience == "GOVERNOR") | .Satisfied == 15 and .Total == 15) and
            .resource_observation_mode == "RUNNER_SCOPED_NONDETERMINISTIC" and
            .resource_measurement_replay_authority == false and .reducer_replay_verified == true and
            .repository_writes == 0 and .mutation_authority == false
          ' "$work/first/report.json"
          jq '.subject_sha = "UNKNOWN"' "$work/profile.json" > "$work/negative/head.json"
          jq '(.samples[0].max_rss_kib) = 262145' "$work/profile.json" > "$work/negative/rss.json"
          jq '.samples = .samples[:-1]' "$work/profile.json" > "$work/negative/missing.json"
          for case in head rss missing; do
            changed=("${common[@]}")
            changed[11]="$work/negative/$case.json"
            go run ./cmd/user-journey-scorecard "${changed[@]}" -output "$work/negative/$case-report.json"
          done
          jq -e '.status == "FAIL_CLOSED" and .resolution == "LOWER_RESOLUTION"' "$work/negative/head-report.json"
          jq -e '.status == "FAIL_CLOSED" and .resolution == "INVARIANT_ONLY" and .summary.resources.rss_violations == 1' "$work/negative/rss-report.json"
          jq -e '.status == "FAIL_CLOSED" and .resolution == "LOWER_RESOLUTION"' "$work/negative/missing-report.json"
          jq -r '"### Gooo user journey scorecard\n- decision: \(.decision) / \(.resolution)\n- USER: \(.views[0].Satisfied)/\(.views[0].Total)\n- TOOL_AUTHOR: \(.views[1].Satisfied)/\(.views[1].Total)\n- GOVERNOR: \(.views[2].Satisfied)/\(.views[2].Total)\n- functional CLI: \(.summary.functional.upstream_cases)/12\n- samples: \(.summary.resources.samples_observed)/\(.summary.resources.samples_expected)\n- binary: \(.summary.resources.binary_size_bytes) bytes / \(.summary.resources.binary_size_limit) limit\n- measurement mode: \(.resource_observation_mode)\n- receipt: \(.digest)\n\n| journey | wall ms min/median/max | RSS KiB min/median/max |\n| --- | ---: | ---: |", (.journeys[] | "| \(.ID) | \(.WallMinMS)/\(.WallMedianMS)/\(.WallMaxMS) | \(.RSSMinKiB)/\(.RSSMedianKiB)/\(.RSSMaxKiB) |")' "$work/first/report.json" >> "$GITHUB_STEP_SUMMARY"
          test -z "$(git status --porcelain)"
      - name: Upload exact-head user journey scorecard
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: user-journey-scorecard-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/user-journey
          if-no-files-found: error
          retention-days: 30

  promotion-authorized-continuity:
    name: promotion-authorized-continuity
    needs:
      - guarded-promotion-receipt
      - rollback-fixed-point-recovery
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'dev'
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: go1.27.0
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check out exact transformation subject
        uses: actions/checkout@v5
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Go 1.27
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
      - name: Download exact guarded promotion receipt
        uses: actions/download-artifact@v7
        with:
          name: guarded-promotion-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/promotion-continuity/guard
      - name: Download exact rollback route receipt
        uses: actions/download-artifact@v7
        with:
          name: rollback-fixed-point-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/promotion-continuity/recovery
      - name: Prove authorized successor twice
        shell: bash
        run: |
          set -euo pipefail
          guard="$RUNNER_TEMP/promotion-continuity/guard/guarded-promotion-a.json"
          recovery="$RUNNER_TEMP/promotion-continuity/recovery/rollback-fixed-point-a.json"
          first="$RUNNER_TEMP/promotion-continuity/output/a"
          replay="$RUNNER_TEMP/promotion-continuity/output/b"
          test -f "$guard"
          test -f "$recovery"
          mkdir -p "$first" "$replay"
          for target in "$first" "$replay"; do
            go run ./cmd/promotion-authorized-continuity \
              --head "$HEAD_SHA" --guard "$guard" --recovery "$recovery" \
              --out "$target/report.json"
          done
          cmp "$first/report.json" "$replay/report.json"
      - name: Upload authorization continuity receipt
        uses: actions/upload-artifact@v6
        with:
          name: promotion-authorized-continuity-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/promotion-continuity/output/a/report.json
          if-no-files-found: error
          retention-days: 30

  vertical-slice-closure-eligibility:
    name: vertical slice closure eligibility
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      GOTOOLCHAIN: go1.27.0
      SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.SUBJECT_SHA }}
      - name: Set up Go 1.27
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: false
      - name: Generate fixed eligibility receipts
        shell: bash
        env:
          OUTPUT_DIR: ${{ runner.temp }}/vertical-slice-closure-eligibility
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          go run ./cmd/vertical-slice-closure-eligibility-witness             --subject-sha "$SUBJECT_SHA" --output "$OUTPUT_DIR/suite.json"
          for case_id in exact assurance-unavailable shadow-unavailable assurance-digest-mismatch             shadow-digest-mismatch unknown-top-decision semantic-link-mismatch observed-write; do
            go run ./cmd/vertical-slice-closure-eligibility-witness               --subject-sha "$SUBJECT_SHA" --case "$case_id"               --output "$OUTPUT_DIR/$case_id.json"
          done
          go run ./cmd/vertical-slice-closure-eligibility-witness             --subject-sha "$SUBJECT_SHA" --output "$OUTPUT_DIR/replay.json"
          cmp "$OUTPUT_DIR/suite.json" "$OUTPUT_DIR/replay.json"
      - name: Verify exact eligibility semantics
        shell: bash
        env:
          OUTPUT_DIR: ${{ runner.temp }}/vertical-slice-closure-eligibility
        run: |
          set -euo pipefail
          jq -e '
            .decision == "ELIGIBLE" and .resolution == "EXACT" and
            .cases_total == 8 and .cases_passed == 8 and .coverage_bps == 10000 and
            .eligible_exact == 1 and .unknown_fail_closed == 3 and
            .invariant_fail_closed == 4 and .repository_writes == 0 and
            .promotion_applied == 0
          ' "$OUTPUT_DIR/suite.json"
          jq -e '
            .decision == "ELIGIBLE" and .resolution == "EXACT" and
            .summary.before_operating == 10 and .summary.eligible_operating == 11 and
            .summary.official_operating == 10 and .repository_writes == 0 and
            .promotion_applied == 0
          ' "$OUTPUT_DIR/exact.json"
          jq -e '
            .decision == "FAIL_CLOSED" and .resolution == "UNKNOWN" and
            .enforcement_effect == "BLOCK" and
            .reason == "VERTICAL_SLICE_ELIGIBILITY_DECISION_UNKNOWN"
          ' "$OUTPUT_DIR/unknown-top-decision.json"
          sha256sum "$OUTPUT_DIR"/*.json > "$OUTPUT_DIR/manifest.sha256"
      - name: Upload vertical slice eligibility artifact
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: vertical-slice-closure-eligibility-${{ env.SUBJECT_SHA }}
          path: ${{ runner.temp }}/vertical-slice-closure-eligibility
          if-no-files-found: error
          retention-days: 14

  external-ecosystem-reference-conformance:
    name: external ecosystem reference conformance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: go1.27.0
      SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.SUBJECT_SHA }}
      - name: Set up Go 1.27
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: false
      - name: Fetch immutable external reference documents
        shell: bash
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/external-ecosystem-reference/evidence
          OUTPUT_DIR: ${{ runner.temp }}/external-ecosystem-reference/output
          UPSTREAM_SHA: cf0d4bf32da393dbda97e3572f216731013ffa55
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR" "$OUTPUT_DIR"
          : > "$EVIDENCE_DIR/README.md"
          : > "$EVIDENCE_DIR/go.mod"
          readme_status=EXACT
          gomod_status=EXACT
          if ! curl --fail --silent --show-error --location --retry 2 "https://raw.githubusercontent.com/cosmos72/gomacro/$UPSTREAM_SHA/README.md" -o "$EVIDENCE_DIR/README.md"; then readme_status=UNAVAILABLE; : > "$EVIDENCE_DIR/README.md"; fi
          if ! curl --fail --silent --show-error --location --retry 2 "https://raw.githubusercontent.com/cosmos72/gomacro/$UPSTREAM_SHA/go.mod" -o "$EVIDENCE_DIR/go.mod"; then gomod_status=UNAVAILABLE; : > "$EVIDENCE_DIR/go.mod"; fi
          jq -n --arg readme "$readme_status" --arg gomod "$gomod_status" --arg upstream "$UPSTREAM_SHA" '{schema:"gooo/external-fetch/v1",upstream_sha:$upstream,readme:$readme,go_mod:$gomod}' > "$OUTPUT_DIR/fetch.json"
      - name: Generate fixed external reference receipts
        shell: bash
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/external-ecosystem-reference/evidence
          OUTPUT_DIR: ${{ runner.temp }}/external-ecosystem-reference/output
        run: |
          set -euo pipefail
          go run ./cmd/external-ecosystem-conformance-witness --subject-sha "$SUBJECT_SHA" --readme "$EVIDENCE_DIR/README.md" --go-mod "$EVIDENCE_DIR/go.mod" --output "$OUTPUT_DIR/suite.json"
          for case_id in exact readme-unavailable gomod-unavailable unknown-relation readme-digest-mismatch gomod-digest-mismatch commit-mismatch license-mismatch external-execution observed-write; do
            go run ./cmd/external-ecosystem-conformance-witness --subject-sha "$SUBJECT_SHA" --case "$case_id" --readme "$EVIDENCE_DIR/README.md" --go-mod "$EVIDENCE_DIR/go.mod" --output "$OUTPUT_DIR/$case_id.json"
          done
          go run ./cmd/external-ecosystem-conformance-witness --subject-sha "$SUBJECT_SHA" --readme "$EVIDENCE_DIR/README.md" --go-mod "$EVIDENCE_DIR/go.mod" --output "$OUTPUT_DIR/replay.json"
          cmp "$OUTPUT_DIR/suite.json" "$OUTPUT_DIR/replay.json"
      - name: Verify external reference semantics
        shell: bash
        env:
          OUTPUT_DIR: ${{ runner.temp }}/external-ecosystem-reference/output
        run: |
          set -euo pipefail
          jq -e '.decision == "REFERENCE_BOUND" and .resolution == "EXACT" and .cases_total == 10 and .cases_passed == 10 and .coverage_bps == 10000 and .reference_bound_exact == 1 and .unknown_fail_closed == 3 and .invariant_fail_closed == 6 and .repository_writes == 0 and .external_executions == 0 and .official_mutations == 0' "$OUTPUT_DIR/suite.json"
          jq -e '.decision == "REFERENCE_BOUND" and .resolution == "EXACT" and .enforcement_effect == "NO_EFFECT" and .summary.reference_denominator == 8 and .summary.bound_capabilities == 8 and .summary.implemented_capabilities == 0 and .summary.language_before_operating == 10 and .summary.language_official_after == 10 and .repository_writes == 0 and .external_executions == 0 and .promotion_applied == 0' "$OUTPUT_DIR/exact.json"
          jq -e '.decision == "FAIL_CLOSED" and .resolution == "UNKNOWN" and .enforcement_effect == "BLOCK" and .reason == "EXTERNAL_ECOSYSTEM_RELATION_UNKNOWN"' "$OUTPUT_DIR/unknown-relation.json"
          jq -e '.decision == "FAIL_CLOSED" and .resolution == "INVARIANT_ONLY" and .enforcement_effect == "BLOCK" and .reason == "EXTERNAL_ECOSYSTEM_EXECUTION_OBSERVED"' "$OUTPUT_DIR/external-execution.json"
          jq -e '.decision == "FAIL_CLOSED" and .resolution == "INVARIANT_ONLY" and .enforcement_effect == "BLOCK" and .reason == "EXTERNAL_ECOSYSTEM_WRITE_OBSERVED"' "$OUTPUT_DIR/observed-write.json"
          sha256sum "$OUTPUT_DIR"/*.json > "$OUTPUT_DIR/manifest.sha256"
      - name: Upload external ecosystem reference artifact
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: external-ecosystem-reference-conformance-${{ env.SUBJECT_SHA }}
          path: ${{ runner.temp }}/external-ecosystem-reference/output
          if-no-files-found: error
          retention-days: 14

  external-ecosystem-go127-baseline:
    name: external ecosystem Go 1.27 baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: local
      GOWORK: "off"
      GOFLAGS: -mod=readonly
      SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 0
          path: gooo
      - name: Checkout pinned gomacro
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: cosmos72/gomacro
          ref: cf0d4bf32da393dbda97e3572f216731013ffa55
          fetch-depth: 1
          path: gomacro
      - name: Set up exact Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: false
      - name: Allocate isolated caches
        run: |
          printf 'GOCACHE=%s\n' "$RUNNER_TEMP/go-build" >> "$GITHUB_ENV"
          printf 'GOMODCACHE=%s\n' "$RUNNER_TEMP/go-mod" >> "$GITHUB_ENV"
      - name: Conform with Go 1.27 tools
        working-directory: gooo
        run: |
          test -z "$(git status --porcelain --untracked-files=all)"
          go fix ./internal/meta/externalecosystemexecution ./cmd/external-ecosystem-execution-witness \
            ./internal/meta/externalcapabilityexecution/... ./cmd/external-capability-execution-witness/...
          find internal/meta/externalecosystemexecution cmd/external-ecosystem-execution-witness \
            internal/meta/externalcapabilityexecution cmd/external-capability-execution-witness \
            -name '*.go' -type f -print0 | xargs -0 gofmt -w
          git diff --binary > "$RUNNER_TEMP/go-1.27-tools.patch"
          if test -s "$RUNNER_TEMP/go-1.27-tools.patch"; then
            git diff --stat
            exit 1
          fi
      - name: Upload Go 1.27 correction
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: go-1.27-tool-correction-${{ env.SUBJECT_SHA }}
          path: ${{ runner.temp }}/go-1.27-tools.patch
          if-no-files-found: ignore
          retention-days: 7
      - name: Run fixed conformance tests
        working-directory: gooo
        run: |
          go test -count=1 ./internal/meta/externalecosystemexecution ./cmd/external-ecosystem-execution-witness
          go test -count=1 ./internal/meta/externalcapabilityexecution/... ./cmd/external-capability-execution-witness/...
          go test -count=1 ./internal/verify
      - name: Observe twice and replay
        working-directory: gooo
        run: |
          result="$RUNNER_TEMP/external-ecosystem-execution"
          mkdir -p "$result"
          observe_status=0
          go run ./cmd/external-ecosystem-execution-witness \
            --mode observe --source-root "$GITHUB_WORKSPACE/gooo" --external-root "$GITHUB_WORKSPACE/gomacro" \
            --observation "$result/observation.json" --report "$result/report.json" \
            --suite "$result/suite.json" || observe_status=$?
          test "$observe_status" -eq 1
          replay_status=0
          go run ./cmd/external-ecosystem-execution-witness \
            --mode replay --observation "$result/observation.json" \
            --report "$result/replay-report.json" --suite "$result/replay-suite.json" || replay_status=$?
          test "$replay_status" -eq 1
          cmp "$result/report.json" "$result/replay-report.json"
          cmp "$result/suite.json" "$result/replay-suite.json"
      - name: Assert exact baseline
        run: |
          result="$RUNNER_TEMP/external-ecosystem-execution"
          jq -e '.decision == "FAIL_CLOSED" and .resolution == "EXACT"' "$result/report.json"
          jq -e '.completed == 6 and .total == 8 and .basis_points == 7500' "$result/report.json"
          jq -e '.unknown_indicators == 0 and .external_executions == 2 and .repository_writes == 0' "$result/report.json"
          jq -e '.official_mutation_count == 0 and .promotion_count == 0' "$result/report.json"
          jq -e '([.indicators[].status] | map(select(. == "SATISFIED")) | length) == 6' "$result/report.json"
          jq -e '([.indicators[].status] | map(select(. == "UNSATISFIED")) | length) == 2' "$result/report.json"
          jq -e '([.proofs[] | select(.mode == "FOUNDATION" or .mode == "REGRESSION") | .status] | all(. == "SATISFIED"))' "$result/report.json"
          jq -e '([.proofs[] | select(.mode == "COHERENCE") | .status] | all(. == "UNSATISFIED"))' "$result/report.json"
          jq -e '.passed == 10 and .total == 10 and .unresolved == 0 and .unknown_expected == 3 and .invariant_expected == 6' "$result/suite.json"
          jq -e '.reference.binding_exact == true and (.runs | length) == 2' "$result/observation.json"
          jq -e '([.runs[] | .exit_code == 1 and .passed == false and (.unknown_events | length) == 0] | all)' "$result/observation.json"
          jq -e '([.runs[].normalized_sha256] | unique) == ["sha256:0bb017f6c946d799c5fef316462dd03ad667fcfbfd99a69c1d1cfe61c4812f93"]' "$result/observation.json"
          jq -e '([.runs[] | [.outcomes[] | select(.action == "fail" or .action == "build-fail")] | length] | all(. == 8))' "$result/observation.json"
          jq -e '.official_mutation_count == 0 and .promotion_count == 0' "$result/observation.json"
      - name: Execute capability-scoped metaprogramming twice
        working-directory: gooo
        run: |
          parent="$RUNNER_TEMP/external-ecosystem-execution/report.json"
          result="$RUNNER_TEMP/external-capability-execution"
          mkdir -p "$result"
          go run ./cmd/external-capability-execution-witness \
            --mode observe --subject-sha "$SUBJECT_SHA" \
            --source-root "$GITHUB_WORKSPACE/gooo" --external-root "$GITHUB_WORKSPACE/gomacro" \
            --parent-report "$parent" --observation "$result/observation.json" \
            --report "$result/report.json" --suite "$result/suite.json"
          go run ./cmd/external-capability-execution-witness \
            --mode replay --observation "$result/observation.json" \
            --report "$result/replay-report.json" --suite "$result/replay-suite.json"
          cmp "$result/report.json" "$result/replay-report.json"
          cmp "$result/suite.json" "$result/replay-suite.json"
      - name: Assert exact capability boundary
        run: |
          result="$RUNNER_TEMP/external-capability-execution"
          jq -e '.decision == "CAPABILITY_EXECUTABLE" and .resolution == "EXACT"' "$result/report.json"
          jq -e '.completed == 10 and .total == 10 and .basis_points == 10000' "$result/report.json"
          jq -e '.driver_completed == 4 and .outcome_completed == 3 and .guardrail_completed == 3' "$result/report.json"
          jq -e '.external_executions == 4 and .repository_writes == 0 and .external_repository_writes == 0' "$result/report.json"
          jq -e '.parent.decision == "FAIL_CLOSED" and .parent.resolution == "EXACT"' "$result/report.json"
          jq -e '.parent.completed == 6 and .parent.total == 8 and .parent.basis_points == 7500' "$result/report.json"
          jq -e '.official_mutation_count == 0 and .promotion_count == 0' "$result/report.json"
          jq -e '([.proofs[].status] | all(. == "SATISFIED"))' "$result/report.json"
          jq -e '.passed == 15 and .total == 15 and .unknown_expected == 3 and .invariant_expected == 11' "$result/suite.json"
          jq -e '.available == true and .replay_exact == true and (.runs | length) == 2' "$result/observation.json"
          jq -e '([.runs[] | .status == "SATISFIED" and .arithmetic == "42" and .function == "55"] | all)' "$result/observation.json"
      - name: Compile capability authorization meta-policy twice
        working-directory: gooo
        run: |
          result="$RUNNER_TEMP/external-capability-authorization"
          policy="examples/external-capability-execution/authorization/policy.gooo"
          mkdir -p "$result/policy"
          go run ./cmd/gooo check "$policy"
          go run ./cmd/gooo generate "$policy" --out "$result/policy/first"
          go run ./cmd/gooo generate "$policy" --out "$result/policy/replay"
          cmp "$result/policy/first/semantic.gooo.go" "$result/policy/replay/semantic.gooo.go"
          for pass in first replay; do
            jq -S 'del(.generated_file)' "$result/policy/$pass/semantic.gooo.manifest.jsonl" \
              > "$result/policy/$pass-manifest.normalized.json"
          done
          cmp "$result/policy/first-manifest.normalized.json" \
            "$result/policy/replay-manifest.normalized.json"
      - name: Issue and check default-deny authorization twice
        working-directory: gooo
        env:
          AUTH_RUN_ID: ${{ github.run_id }}
          AUTH_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          result="$RUNNER_TEMP/external-capability-authorization"
          report="$RUNNER_TEMP/external-capability-execution/report.json"
          policy="examples/external-capability-execution/authorization/policy.gooo"
          command="./cmd/external-capability-execution-witness/authorization"
          go run "$command" --mode issue --subject-sha "$SUBJECT_SHA" \
            --run-id "$AUTH_RUN_ID" --run-attempt "$AUTH_RUN_ATTEMPT" \
            --capability-report "$report" --policy-source "$policy" \
            --policy-generated "$result/policy/first" --envelope "$result/envelope.json"
          for pass in first replay; do
            go run "$command" --mode check --subject-sha "$SUBJECT_SHA" \
              --run-id "$AUTH_RUN_ID" --run-attempt "$AUTH_RUN_ATTEMPT" \
              --capability-report "$report" --policy-source "$policy" \
              --policy-generated "$result/policy/first" --envelope "$result/envelope.json" \
              --receipt "$result/$pass-receipt.json" --suite "$result/$pass-suite.json" \
              --summary "$result/$pass-summary.md" --expect-decision FAIL_CLOSED
          done
          cmp "$result/first-receipt.json" "$result/replay-receipt.json"
          cmp "$result/first-suite.json" "$result/replay-suite.json"
          cmp "$result/first-summary.md" "$result/replay-summary.md"
          cat "$result/first-summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Assert explicit bootstrap resolution
        run: |
          result="$RUNNER_TEMP/external-capability-authorization"
          receipt="$result/first-receipt.json"
          suite="$result/first-suite.json"
          jq -e '.decision == "FAIL_CLOSED" and .resolution == "UNKNOWN" and .enforcement_effect == "BLOCK"' "$receipt"
          jq -e '.completed == 9 and .total == 10 and .basis_points == 9000 and .unknown_indicators == 1' "$receipt"
          jq -e '.open_claims == 1 and .discharged_claims == 9 and .rejected_claims == 0' "$receipt"
          jq -e '.unknowns == [{"stage":"AUTHORIZE/policy-foundation","indicator_id":"gooo.metric.external-capability-authorization-policy-foundation.v1","reason":"POLICY_FOUNDATION_UNAVAILABLE"}]' "$receipt"
          jq -e '.execution_authority == false and .repository_mutation_authority == false and .promotion_authority == false' "$receipt"
          jq -e '.repository_writes == 0 and .official_mutation_count == 0 and .promotion_count == 0' "$receipt"
          jq -e '([.reader_views[] | select(.reader == "LOCAL_EVIDENCE")][0] | .completed == 9 and .total == 9 and .resolution == "EXACT")' "$receipt"
          jq -e '([.reader_views[] | select(.reader == "AUTHORIZATION")][0] | .completed == 9 and .total == 10 and .resolution == "UNKNOWN")' "$receipt"
          jq -e '.decision == "PASS" and .passed == 20 and .total == 20 and .coverage_bps == 10000' "$suite"
          jq -e '.authorized_cases == 1 and .unknown_cases == 7 and .denied_cases == 12' "$suite"
      - name: Seal capability authorization evidence
        run: |
          cd "$RUNNER_TEMP/external-capability-authorization"
          sha256sum envelope.json first-receipt.json replay-receipt.json \
            first-suite.json replay-suite.json first-summary.md replay-summary.md > manifest.sha256
      - name: Upload capability authorization evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: external-capability-authorization-${{ env.SUBJECT_SHA }}
          path: ${{ runner.temp }}/external-capability-authorization
          if-no-files-found: ignore
          retention-days: 30
      - name: Download immutable authorization foundation
        working-directory: gooo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          result="$RUNNER_TEMP/external-capability-authorization-foundation"
          foundation="examples/external-capability-execution/authorization/foundation.json"
          mkdir -p "$result/prior"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/9631439149" > "$result/metadata.json"
          jq -e '.id == 9631439149 and .expired == false' "$result/metadata.json"
