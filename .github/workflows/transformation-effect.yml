      - name: Upload exact-head diagnostic provenance readiness binding
        uses: actions/upload-artifact@v6
        with:
          name: language-diagnostic-provenance-readiness-binding-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/language-diagnostic-provenance-readiness-binding/first
          if-no-files-found: error
          retention-days: 30
      - name: Upload exact-head language package runtime
        uses: actions/upload-artifact@v6
        with:
          name: language-package-runtime-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/language-package-runtime/first
