name: Transformation effect ledger

on:
  pull_request:
    branches: [dev, main]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  cross-platform-release:
    name: cross-platform release (${{ matrix.platform }})
    if: >-
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        (github.event.workflow_run.head_branch == 'dev' || github.event.workflow_run.head_branch == 'main')
      )
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - platform: darwin-amd64
            runner: macos-15-intel
            goos: darwin
            goarch: amd64
          - platform: windows-amd64
            runner: windows-2025
            goos: windows
            goarch: amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: go1.27.0
      HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: true
      - name: Build, execute, and replay native release candidate
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/toolchain-release-${{ matrix.platform }}"
          go run ./cmd/toolchain-release-platform-witness \
            --root "$GITHUB_WORKSPACE" \
            --output-dir "$output" \
            --expected-head "$HEAD_SHA" \
            --platform-id "${{ matrix.platform }}" \
            --runner "${{ matrix.runner }}" \
            --expected-goos "${{ matrix.goos }}" \
            --expected-goarch "${{ matrix.goarch }}"
      - name: Upload exact platform release receipt
        uses: actions/upload-artifact@v6
        with:
          name: toolchain-release-platform-${{ matrix.platform }}-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/toolchain-release-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 30

  source-splitter-conformance:
    name: source-splitter-conformance
    if: >-
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        (github.event.workflow_run.head_branch == 'dev' || github.event.workflow_run.head_branch == 'main')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: go1.27.0
      HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
    steps:
      - name: Check out exact head
        uses: actions/checkout@v5
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0

      - name: Set up Go 1.27
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: true

      - name: Build isolated SplitGo subject
        shell: bash
        run: |
          set -euo pipefail
          work="$GITHUB_WORKSPACE/.ci-tmp/source-splitter-conformance"
          fixture="$work/fixture"
          output="$work/output"
          mkdir -p "$fixture" "$output"
          cat > "$fixture/go.mod" <<'EOF'
          module fixture

          go 1.27.0
          EOF
          {
            echo 'package fixture'
            echo
            echo 'func Alpha() int {'
            echo '  total := 0'
            for value in $(seq 1 40); do echo "  total += $value"; done
            echo '  return total'
            echo '}'
            echo
            echo 'func Beta() int {'
            echo '  total := 0'
            for value in $(seq 41 80); do echo "  total += $value"; done
            echo '  return total'
            echo '}'
          } > "$fixture/fixture.go"
          cp "$fixture/fixture.go" "$output/source.go"

      - name: Run actor and independent evaluator twice
        shell: bash
        run: |
          set -euo pipefail
          work="$GITHUB_WORKSPACE/.ci-tmp/source-splitter-conformance"
          fixture="$work/fixture"
          output="$work/output"
          METRICS_COMMIT_SHA="$HEAD_SHA" go run ./scripts/line-metrics \
            -root "$fixture" -storage-root "$fixture" -json > "$output/source-metrics.json"
          go run ./scripts/source-splitter \
            -root "$fixture" \
            -metrics "$output/source-metrics.json" \
            -sha "$HEAD_SHA" \
            -subject fixture.go \
            -evidence-json > "$output/actor-evidence.json"
          for suffix in a b; do
            go run ./scripts/source-splitter-conformance-ci \
              -contract examples/source-splitter-conformance/contract.json \
              -evidence "$output/actor-evidence.json" \
              -expected-sha "$HEAD_SHA" \
              -output "$output/artifact-$suffix.json"
          done
          cmp "$output/artifact-a.json" "$output/artifact-b.json"
          go run ./scripts/source-splitter-conformance-ci \
            -contract examples/source-splitter-conformance/contract.json \
            -evidence "$output/actor-evidence.json" \
            -expected-sha "$HEAD_SHA" \
            -check "$output/artifact-a.json"
          cp -R "$fixture" "$output/candidate"
          sha256sum "$output/artifact-a.json" > "$output/artifact-a.sha256"

      - name: Upload exact-head conformance artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: source-splitter-conformance-${{ env.HEAD_SHA }}
          path: .ci-tmp/source-splitter-conformance/output
          if-no-files-found: error
          retention-days: 30

  guarded-promotion-receipt:
    name: guarded-promotion-receipt
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact CI subject
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Set up Go 1.27
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: true

      - name: Select expected boundary decision
        id: boundary
        env:
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          case "$SOURCE_EVENT:$SOURCE_BRANCH" in
            "push:$DEFAULT_BRANCH") decision=AUTHORIZED ;;
            pull_request:*) decision=DENIED ;;
            *) decision=FAIL_CLOSED ;;
          esac
          printf 'decision=%s\n' "$decision" >> "$GITHUB_OUTPUT"

      - name: Build guarded promotion receipt twice
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          EXPECT_DECISION: ${{ steps.boundary.outputs.decision }}
          API_URL: ${{ github.api_url }}
        run: |
          set +e
          codes=()
          for replay in a b; do
            go run ./cmd/guarded-promotion-witness \
              --repository "$REPOSITORY" \
              --current-head-sha "$HEAD_SHA" \
              --source-run-id "$SOURCE_RUN_ID" \
              --api-url "$API_URL" \
              --token "$GH_TOKEN" \
              --expect-decision "$EXPECT_DECISION" \
              --out "$RUNNER_TEMP/guarded-promotion-$replay.json"
            codes+=("$?")
          done
          set -e
          test "${codes[0]}" -eq "${codes[1]}"
          printf '%s\n' "${codes[0]}" > "$RUNNER_TEMP/guarded-promotion-exit-code.txt"

      - name: Verify deterministic replay
        run: |
          cmp "$RUNNER_TEMP/guarded-promotion-a.json" \
            "$RUNNER_TEMP/guarded-promotion-b.json"
          cmp "$RUNNER_TEMP/guarded-promotion-a.json.sha256" \
            "$RUNNER_TEMP/guarded-promotion-b.json.sha256"

      - name: Upload guarded promotion receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: guarded-promotion-${{ github.event.workflow_run.head_sha }}
          path: |
            ${{ runner.temp }}/guarded-promotion-*.json
            ${{ runner.temp }}/guarded-promotion-*.sha256
            ${{ runner.temp }}/guarded-promotion-exit-code.txt
          if-no-files-found: error
          retention-days: 30

  rollback-fixed-point-recovery:
    name: rollback-fixed-point-recovery
    needs: [guarded-promotion-receipt, transformation-effect]
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.head_branch == 'dev' || github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: go1.27.0
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
      - uses: actions/download-artifact@v7
        with:
          name: guarded-promotion-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/rollback/guard
      - uses: actions/download-artifact@v7
        with:
          name: transformation-effect-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/rollback/transformation
      - name: Bind fail-closed promotion to an exact fixed point
        run: |
          for suffix in a b; do
            go run ./cmd/language-readiness-witness/rollback-fixed-point \
              --root "$GITHUB_WORKSPACE" \
              --guard "$RUNNER_TEMP/rollback/guard/guarded-promotion-a.json" \
              --transformation "$RUNNER_TEMP/rollback/transformation/ledger.json" \
              --expected-sha "$HEAD_SHA" \
              --output "$RUNNER_TEMP/rollback-fixed-point-$suffix.json"
          done
          cmp "$RUNNER_TEMP/rollback-fixed-point-a.json" \
            "$RUNNER_TEMP/rollback-fixed-point-b.json"
          go run ./cmd/language-readiness-witness/rollback-fixed-point \
            --root "$GITHUB_WORKSPACE" \
            --guard "$RUNNER_TEMP/rollback/guard/guarded-promotion-a.json" \
            --transformation "$RUNNER_TEMP/rollback/transformation/ledger.json" \
            --expected-sha "$HEAD_SHA" \
            --output "$RUNNER_TEMP/rollback-fixed-point-a.json" \
            --check
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: rollback-fixed-point-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/rollback-fixed-point-a.json
          if-no-files-found: error
          retention-days: 30

  transformation-effect:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.head_branch == 'dev' || github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: go1.27.0
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      CI_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
      - name: Download exact meta artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: '*-${{ github.event.workflow_run.head_sha }}'
          path: ${{ runner.temp }}/meta-inputs
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Execute, verify, and replay sandbox effects
        shell: bash
        run: |
          set -euo pipefail
          inputs="$RUNNER_TEMP/meta-inputs"
          first="$RUNNER_TEMP/transformation-effect/first"
          replay="$RUNNER_TEMP/transformation-effect/replay"
          mkdir -p "$first" "$replay"
          common=(
            -root "$GITHUB_WORKSPACE"
            -metrics "$inputs/source-line-metrics-$HEAD_SHA/source-metrics.json"
            -plan "$inputs/self-improvement-generation-$HEAD_SHA/self-improvement-plan.json"
            -execution "$inputs/self-improvement-execution-$HEAD_SHA/self-improvement-execution.json"
            -receipts "$inputs/self-improvement-receipts-$HEAD_SHA/self-improvement-receipts.json"
            -provenance "$inputs/self-improvement-provenance-$HEAD_SHA/self-improvement-provenance.json"
            -expected-sha "$HEAD_SHA"
          )
          for target in "$first" "$replay"; do
            go run ./scripts/transformation-effect "${common[@]}" \
              -output "$target/ledger.json" \
              -generated-receipts "$target/receipts.json" \
              -executed-provenance "$target/provenance.json" \
              -patch "$target/patch.json"
          done
          for file in ledger.json receipts.json provenance.json patch.json; do
            cmp -s "$first/$file" "$replay/$file"
          done
          go run ./scripts/transformation-effect \
            -verify "$first/ledger.json" \
            -generated-receipts "$first/receipts.json" \
            -executed-provenance "$first/provenance.json" \
            -patch "$first/patch.json"
      - name: Upload exact-head transformation effects
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: transformation-effect-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/transformation-effect/first
          if-no-files-found: error
          retention-days: 30

  transformation-effect-focused:
    name: transformation-effect-focused
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: go1.27.0
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@v5
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go 1.27
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: false
      - name: Materialize exact logical workspace
        id: materialize
        uses: ./.github/actions/materialize
        with:
          expected-sha: ${{ env.HEAD_SHA }}
      - name: Capture and verify focused transformation evidence
        shell: bash
        env:
          STORAGE_ROOT: ${{ steps.materialize.outputs.storage-root }}
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/transformation-effect-focused"
          input="$root/input"
          first="$root/first"
          replay="$root/replay"
          mkdir -p "$input" "$first" "$replay"
          stage=initialize
          focused_error() {
            status=$?
            trap - ERR
            if [[ -s "$root/counterexamples.json" ]] && jq -e '.decision == "REFUTED" and .resolution == "EXACT"' "$root/counterexamples.json" >/dev/null 2>&1; then
              cp "$root/counterexamples.json" "$root/diagnostic.json"
            elif [[ -s "$root/verification.json" ]] && jq -e '.decision == "REFUTED" and .resolution == "EXACT"' "$root/verification.json" >/dev/null 2>&1; then
              cp "$root/verification.json" "$root/diagnostic.json"
            else
              jq -n --arg stage "$stage" --arg step "focused-transformation" --arg reason "FOCUSED_JOB_COMMAND_FAILED" --arg command "$BASH_COMMAND" --argjson exit_code "$status" --argjson line "${BASH_LINENO[0]:-0}" '{schema:"gooo/transformation-effect-focused-diagnostic/v1",decision:"UNKNOWN",resolution:"LOWER_RESOLUTION",stage:$stage,step:$step,reason:$reason,unknown_class:"UNCATALOGED_CAUSE",next_operation:"restore-transformation-evidence",blocked_by:[],command:$command,exit_code:$exit_code,line:$line}' > "$root/diagnostic.json"
            fi
            exit "$status"
          }
          trap focused_error ERR
          snapshot_repository() {
            git status --porcelain=v1 --untracked-files=all | LC_ALL=C sort
          }
          snapshot_repository > "$root/repository-before.txt"
          test ! -s "$root/repository-before.txt"
          before="$(cat "$root/repository-before.txt")"
          export METRICS_COMMIT_SHA="$HEAD_SHA"
          export METRICS_DIR="$input"
          stage=source-metrics
          go run ./scripts/line-metrics -root "$GITHUB_WORKSPACE" -storage-root "$STORAGE_ROOT" -json > "$input/source-metrics-raw.json"
          go run ./bootstrap/meta-binding-witness -root "$GITHUB_WORKSPACE" -metrics "$input/source-metrics-raw.json" -bound-metrics "$input/source-metrics.json" -report "$input/meta-binding-report.json" -check
          go run ./bootstrap/meta-actionability-witness -root "$GITHUB_WORKSPACE" -metrics "$input/source-metrics.json" -binding "$input/meta-binding-report.json" -report "$input/meta-actionability-report.json" -check
          base_sha="${BASE_SHA:-}"
          if [[ -z "$base_sha" ]]; then base_sha="$(git rev-parse "$HEAD_SHA^")"; fi
          stage=plan
          go run ./scripts/refactor-metrics -root "$GITHUB_WORKSPACE" -metrics "$input/source-metrics.json" -sha "$HEAD_SHA" -base-sha "$base_sha" -plan "$input/self-improvement-plan.json" -check
          jq -e '
            .decision == "PLAN" and (.selected | length) == 2 and
            (.selected | all(.[]; .subject_kind == .input_subject_kind and
              (.input_contract_source_digest | length) == 64 and
              (.input_contract_semantic_digest | length) == 64)) and
            (.refuted_indicator_ids | length) >= 1 and
            (.counterexamples | any(.[];
              .reason == "INPUT_SUBJECT_KIND_MISMATCH" and
              .source_indicator.subject_kind == "SOURCE_FRAGMENT" and
              .source_indicator.meta_operation == "extract-function"))
          ' "$input/self-improvement-plan.json"
          go run ./scripts/meta-execution -plan "$input/self-improvement-plan.json" -output "$input/self-improvement-execution.json"
          test -s "$input/meta-operation-observations.json"
          go run ./scripts/meta-receipts -plan "$input/self-improvement-plan.json" -output "$input/self-improvement-receipts.json"
          go run ./scripts/meta-provenance -plan "$input/self-improvement-plan.json" -execution "$input/self-improvement-execution.json" -receipts "$input/self-improvement-receipts.json" -output "$input/self-improvement-provenance.json"
          snapshot_repository > "$root/repository-after-inputs.txt"
          cmp -s "$root/repository-before.txt" "$root/repository-after-inputs.txt"
          stage=effect
          common=(
            -root "$GITHUB_WORKSPACE"
            -metrics "$input/source-metrics.json"
            -plan "$input/self-improvement-plan.json"
            -execution "$input/self-improvement-execution.json"
            -receipts "$input/self-improvement-receipts.json"
            -provenance "$input/self-improvement-provenance.json"
            -expected-sha "$HEAD_SHA"
          )
          for target in "$first" "$replay"; do
            start_ns="$(date +%s%N)"
            /usr/bin/time -f '%M' -o "$target/peak-rss-kib.txt" go run ./scripts/transformation-effect "${common[@]}" -output "$target/ledger.json" -generated-receipts "$target/receipts.json" -executed-provenance "$target/provenance.json" -patch "$target/patch.json"
            end_ns="$(date +%s%N)"
            elapsed_ms=$(( (end_ns - start_ns + 999999) / 1000000 ))
            if (( elapsed_ms < 1 )); then elapsed_ms=1; fi
            rss="$(tr -d '[:space:]' < "$target/peak-rss-kib.txt")"
            test "$rss" -gt 0
            jq -n --argjson wall_ms "$elapsed_ms" --argjson peak_rss_kib "$rss" '{wall_ms:$wall_ms,peak_rss_kib:$peak_rss_kib}' > "$target/runtime.json"
          done
          cmp -s "$first/ledger.json" "$replay/ledger.json"
          cmp -s "$first/receipts.json" "$replay/receipts.json"
          cmp -s "$first/provenance.json" "$replay/provenance.json"
          cmp -s "$first/patch.json" "$replay/patch.json"
          snapshot_repository > "$root/repository-before-verifiers.txt"
          repository_writes="$(wc -l < "$root/repository-before-verifiers.txt" | tr -d '[:space:]')"
          first_wall="$(jq -r '.wall_ms' "$first/runtime.json")"
          first_rss="$(jq -r '.peak_rss_kib' "$first/runtime.json")"
          replay_wall="$(jq -r '.wall_ms' "$replay/runtime.json")"
          replay_rss="$(jq -r '.peak_rss_kib' "$replay/runtime.json")"
          jq -n --argjson first_wall "$first_wall" --argjson first_rss "$first_rss" --argjson replay_wall "$replay_wall" --argjson replay_rss "$replay_rss" --argjson repository_writes "$repository_writes" '{first:{wall_ms:$first_wall,peak_rss_kib:$first_rss},replay:{wall_ms:$replay_wall,peak_rss_kib:$replay_rss},replay_equal:true,repository_writes:$repository_writes,local_test_executions:0,cross_project_required_gates:0}' > "$root/runtime.json"
          stage=independent-verifier
          go run ./scripts/transformation-effect-verify -plan "$input/self-improvement-plan.json" -execution "$input/self-improvement-execution.json" -ledger "$first/ledger.json" -receipts "$first/receipts.json" -provenance "$first/provenance.json" -patch "$first/patch.json" -runtime "$root/runtime.json" -expected-head "$HEAD_SHA" -output "$root/verification.json"
          go run ./scripts/transformation-effect-verify -plan "$input/self-improvement-plan.json" -execution "$input/self-improvement-execution.json" -ledger "$first/ledger.json" -receipts "$first/receipts.json" -provenance "$first/provenance.json" -patch "$first/patch.json" -runtime "$root/runtime.json" -expected-head "$HEAD_SHA" -counterexample all -output "$root/counterexamples.json"
          snapshot_repository > "$root/repository-after-verifiers.txt"
          final_repository_writes="$(wc -l < "$root/repository-after-verifiers.txt" | tr -d '[:space:]')"
          if [[ "$final_repository_writes" != "$repository_writes" ]]; then
            repository_writes="$final_repository_writes"
            jq --argjson repository_writes "$repository_writes" '.repository_writes = $repository_writes' "$root/runtime.json" > "$root/runtime.final.json"
            mv "$root/runtime.final.json" "$root/runtime.json"
            go run ./scripts/transformation-effect-verify -plan "$input/self-improvement-plan.json" -execution "$input/self-improvement-execution.json" -ledger "$first/ledger.json" -receipts "$first/receipts.json" -provenance "$first/provenance.json" -patch "$first/patch.json" -runtime "$root/runtime.json" -expected-head "$HEAD_SHA" -output "$root/verification.json"
            snapshot_repository > "$root/repository-after-final-verifier.txt"
            final_repository_writes="$(wc -l < "$root/repository-after-final-verifier.txt" | tr -d '[:space:]')"
            test "$final_repository_writes" = "$repository_writes"
          fi
          test "$repository_writes" -eq 0
          jq -e '.decision == "PASS" and .resolution == "EXACT" and .selected_plan_operations == 2 and .bound_executor_operations == 2 and .unbound_executor_operations == 0 and ((.receipt_count + .failure_count) == 2) and (.failure_count == 0 or .failure_count == 1) and .operation_executor_commands == 2 and .reused_commands == 0 and .reused_tests == 0 and .command_scope == "operation-receipt-executors" and .test_scope == "operation-receipt-verifiers" and .reused_evidence_records == 1 and .evidence_reuse_scope == "input-receipt-instance-evidence" and .repository_writes == 0 and .runtime.repository_writes == 0 and .promotion_authorized == false and .runtime.replay_equal == true' "$root/verification.json"
          jq -e --slurpfile plan "$input/self-improvement-plan.json" '
            (
              (.decision == "CONFORMANT" and .promotion_authorized == false and
               (.receipts | length) == 2 and (.failures | length) == 0 and (.unknowns | length) == 0) or
              (.decision == "REFUTED" and .promotion_authorized == false and
               (.receipts | length) == 1 and (.failures | length) == 1 and (.unknowns | length) == 5)
            ) and
            ($plan[0].selected | all(.[]; .subject_kind == .input_subject_kind)) and
            ($plan[0].refuted_indicator_ids | length) >= 1 and
            ($plan[0].counterexamples | any(.[]; .reason == "INPUT_SUBJECT_KIND_MISMATCH" and .source_indicator.subject_kind == "SOURCE_FRAGMENT"))
          ' "$input/self-improvement-receipts.json"
          jq -e '.decision == "PASS" and .resolution == "EXACT" and (.counterexamples | length) == 3 and (.counterexamples | all(.[]; .decision == "REFUTED" and .resolution == "EXACT" and .reason == "META_OPERATION_EXECUTOR_BINDING_MISMATCH")) and ([.counterexamples[] | select(.id == "executor-binding-stale")][0] | .expected == "scripts/source-splitter" and .observed == "stale-executor")' "$root/counterexamples.json"
          jq -r '"### Focused transformation effect\n- selected/bound/unbound: \(.selected_plan_operations)/\(.bound_executor_operations)/\(.unbound_executor_operations)\n- receipts/failures/dependent-unknowns: \(.receipt_count)/\(.failure_count)/\(.unknown_count)\n- operation executor commands/tests (scoped): \(.operation_executor_commands)/\(.operation_executor_tests) [\(.command_scope)/\(.test_scope)]\n- reused evidence records: \(.reused_evidence_records) [\(.evidence_reuse_scope)]\n- replay: \(.runtime.replay_equal)\n- observed repository writes/local tests/cross-project gates: \(.repository_writes)/\(.local_test_executions)/\(.cross_project_required_gates)\n- operation outcome: \(.operation_outcome)\n- promotion authorized: \(.promotion_authorized)"' "$root/verification.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload focused transformation evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: transformation-effect-focused-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/transformation-effect-focused
          if-no-files-found: error
          retention-days: 30

  language-syntax-scope-partition:
    name: language syntax scope partition
    if: >-
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        (github.event.workflow_run.head_branch == 'dev' || github.event.workflow_run.head_branch == 'main')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: go1.27.0
      HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
    steps:
      - name: Check out exact head
        uses: actions/checkout@v5
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Go 1.27
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
      - name: Build and observe language syntax scope partition
        id: observe
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          work_root="$RUNNER_TEMP/language-syntax-scope-partition-work"
          publish_root="$RUNNER_TEMP/language-syntax-scope-partition-publish"
          mkdir -p "$work_root" "$publish_root"
          stage="initialize"
          step="create-caller-owned-output"
          on_error() {
            local exit_code=$?
            local failed_command="$BASH_COMMAND"
            trap - ERR
            jq -n \
              --arg schema "gooo/language-syntax-scope-partition/v1" \
              --arg head "$HEAD_SHA" \
              --arg stage "$stage" \
              --arg step "$step" \
              --arg command "$failed_command" \
              --argjson exit_code "$exit_code" \
              '{schema: $schema, head_sha: $head, decision: "FAIL_CLOSED", resolution: "LOWER_RESOLUTION",
                reason: "SCOPE_PARTITION_OBSERVATION_UNAVAILABLE", failed_command: $command, exit_code: $exit_code,
                unknown: {stage: $stage, step: $step, reason: "SCOPE_PARTITION_OBSERVATION_UNAVAILABLE",
                  unknown_class: "DIRECT_MISSING", next_operation: "RESTORE_SCOPE_PARTITION_EVIDENCE", blocked_by: []},
                repository_writes: 0, branch_setting_writes: 0, local_test_executions: 0,
                cross_project_required_gates: 0, generation_authority: "CALLER_OWNED_TEMP_OUTPUT_ONLY"}' \
              > "$publish_root/scope-partition.json"
            printf 'scope partition observation failed: stage=%s step=%s command=%s exit=%s\n' \
              "$stage" "$step" "$failed_command" "$exit_code" >&2
            return "$exit_code"
          }
          trap on_error ERR
          concept_bin="$work_root/language-concept-artifact-witness"
          syntax_bin="$work_root/language-syntax-witness"
          concept_time="$work_root/concept-build.time"
          syntax_time="$work_root/syntax-build.time"
          stage="build"
          step="build-language-concept-artifact-witness"
          /usr/bin/time -f '%e %M' -o "$concept_time" \
            go build -o "$concept_bin" ./cmd/language-concept-artifact-witness
          stage="build"
          step="build-language-syntax-witness"
          /usr/bin/time -f '%e %M' -o "$syntax_time" \
            go build -o "$syntax_bin" ./cmd/language-syntax-witness
          concept_first="$work_root/language-concept-artifact/first"
          syntax_first="$work_root/language-syntax-roundtrip/first"
          syntax_replay="$work_root/language-syntax-roundtrip/replay"
          mkdir -p "$concept_first" "$syntax_first" "$syntax_replay"
          stage="execute"
          step="produce-language-concept-artifact"
          "$concept_bin" \
            --root "$GITHUB_WORKSPACE" \
            --output "$concept_first/artifact.json"
          syntax_registry="$GITHUB_WORKSPACE/examples/language-syntax-roundtrip/corpus.json"
          stage="execute"
          step="produce-language-syntax-first-and-replay"
          for target in "$syntax_first" "$syntax_replay"; do
            "$syntax_bin" \
              --root "$GITHUB_WORKSPACE" \
              --head "$HEAD_SHA" \
              --registry "$syntax_registry" \
              --concept-artifact "$concept_first/artifact.json" \
              --output "$target/artifact.json"
          done
          stage="replay"
          step="compare-language-syntax-first-and-replay"
          cmp -s "$syntax_first/artifact.json" "$syntax_replay/artifact.json"
          stage="validate"
          step="check-language-syntax-first-artifact"
          "$syntax_bin" \
            --root "$GITHUB_WORKSPACE" \
            --head "$HEAD_SHA" \
            --registry "$syntax_registry" \
            --concept-artifact "$concept_first/artifact.json" \
            --check "$syntax_first/artifact.json"
          first_digest="sha256:$(sha256sum "$syntax_first/artifact.json" | awk '{print $1}')"
          replay_digest="sha256:$(sha256sum "$syntax_replay/artifact.json" | awk '{print $1}')"
          concept_digest="sha256:$(sha256sum "$concept_first/artifact.json" | awk '{print $1}')"
          read -r concept_seconds concept_peak_rss_kib < "$concept_time"
          read -r syntax_seconds syntax_peak_rss_kib < "$syntax_time"
          concept_build_ms="$(awk -v seconds="$concept_seconds" 'BEGIN { printf "%d", seconds * 1000 }')"
          syntax_build_ms="$(awk -v seconds="$syntax_seconds" 'BEGIN { printf "%d", seconds * 1000 }')"
          stage="validate"
          step="validate-language-syntax-scope-partition"
          jq -e --slurpfile registry "$syntax_registry" '
            ($registry[0].cases | length) as $total |
            ([$registry[0].cases[] | select(.scope == "LANGUAGE_CAPABILITY")] | length) as $capability |
            ([$registry[0].cases[] | select(.scope == "GOVERNANCE_OBSERVATION")] | length) as $governance |
            .decision == "PASS" and .resolution == "EXACT" and
            .summary.satisfied == $total and .summary.total == $total and
            .summary.executed == $total and .summary.unresolved == 0 and
            .summary.capability_satisfied == $capability and .summary.capability_total == $capability and
            .summary.capability_executed == $capability and .summary.capability_unresolved == 0 and
            .summary.governance_satisfied == $governance and .summary.governance_total == $governance and
            .summary.governance_executed == $governance and .summary.governance_unresolved == 0' \
            "$syntax_first/artifact.json"
          stage="publish"
          step="assemble-scope-partition-receipt"
          jq --arg head "$HEAD_SHA" \
            --arg first_digest "$first_digest" \
            --arg replay_digest "$replay_digest" \
            --arg concept_digest "$concept_digest" \
            --argjson replay_equal true \
            --argjson concept_build_ms "$concept_build_ms" \
            --argjson concept_peak_rss_kib "$concept_peak_rss_kib" \
            --argjson syntax_build_ms "$syntax_build_ms" \
            --argjson syntax_peak_rss_kib "$syntax_peak_rss_kib" \
            '{schema: "gooo/language-syntax-scope-partition/v1", head_sha: $head,
              decision: "PASS", resolution: "EXACT", reason: "SCOPE_PARTITION_OBSERVED",
              producer_job: "language-syntax-scope-partition",
              source_artifact: "language-syntax-roundtrip/first/artifact.json",
              source_replay_artifact: "language-syntax-roundtrip/replay/artifact.json",
              source_concept_artifact: "language-concept-artifact/first/artifact.json",
              source_artifact_digest: $first_digest, source_replay_artifact_digest: $replay_digest,
              source_concept_artifact_digest: $concept_digest,
              source_report_digest: .report_digest, replay_equal: $replay_equal,
              reused_existing_artifact: false, generated_in_this_job: true,
              compile_executions: 2, test_executions: 0,
              build_observations: {
                concept_witness: {wall_ms: $concept_build_ms, peak_rss_kib: $concept_peak_rss_kib},
                syntax_witness: {wall_ms: $syntax_build_ms, peak_rss_kib: $syntax_peak_rss_kib}},
              repository_writes: 0, branch_setting_writes: 0, local_test_executions: 0,
              cross_project_required_gates: 0, generation_authority: "CALLER_OWNED_TEMP_OUTPUT_ONLY",
              output_artifact_files: 3,
              overall: {satisfied: .summary.satisfied, total: .summary.total, executed: .summary.executed, unresolved: .summary.unresolved},
              language_capability: {satisfied: .summary.capability_satisfied, total: .summary.capability_total, executed: .summary.capability_executed, unresolved: .summary.capability_unresolved},
              governance_observation: {satisfied: .summary.governance_satisfied, total: .summary.governance_total, executed: .summary.governance_executed, unresolved: .summary.governance_unresolved}}' \
            "$syntax_first/artifact.json" > "$publish_root/scope-partition.json"
          cp "$syntax_first/artifact.json" "$publish_root/language-syntax-roundtrip-first.json"
          cp "$syntax_replay/artifact.json" "$publish_root/language-syntax-roundtrip-replay.json"
          echo "### Language syntax scope partition" >> "$GITHUB_STEP_SUMMARY"
          jq -r '
            "- overall: \(.overall.satisfied)/\(.overall.total) satisfied, \(.overall.executed) executed, \(.overall.unresolved) unresolved",
            "- language capability: \(.language_capability.satisfied)/\(.language_capability.total) satisfied, \(.language_capability.executed) executed, \(.language_capability.unresolved) unresolved",
            "- governance observation: \(.governance_observation.satisfied)/\(.governance_observation.total) satisfied, \(.governance_observation.executed) executed, \(.governance_observation.unresolved) unresolved"
          ' "$publish_root/scope-partition.json" >> "$GITHUB_STEP_SUMMARY"
          echo "- first/replay: \`replay_equal=true\` (first \`$first_digest\`, replay \`$replay_digest\`)" >> "$GITHUB_STEP_SUMMARY"
          echo "- builds: \`2\`, tests: \`0\`; repository/branch writes: \`0/0\`; local tests/cross-project gates: \`0/0\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload language syntax scope partition evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: language-syntax-scope-partition-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/language-syntax-scope-partition-publish
          if-no-files-found: error
          retention-days: 30
      - name: Require language syntax scope partition
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          publish_root="$RUNNER_TEMP/language-syntax-scope-partition-publish"
          work_root="$RUNNER_TEMP/language-syntax-scope-partition-work"
          report="$publish_root/scope-partition.json"
          first="$publish_root/language-syntax-roundtrip-first.json"
          replay="$publish_root/language-syntax-roundtrip-replay.json"
          test -s "$report"
          test -s "$first"
          test -s "$replay"
          cmp -s "$first" "$replay"
          first_digest="sha256:$(sha256sum "$first" | awk '{print $1}')"
          replay_digest="sha256:$(sha256sum "$replay" | awk '{print $1}')"
          concept_digest="sha256:$(sha256sum "$work_root/language-concept-artifact/first/artifact.json" | awk '{print $1}')"
          report_digest="$(jq -er '.report_digest' "$first")"
          jq -e \
            --arg head "$HEAD_SHA" \
            --arg first_digest "$first_digest" \
            --arg replay_digest "$replay_digest" \
            --arg concept_digest "$concept_digest" \
            --arg report_digest "$report_digest" \
            --slurpfile registry "$GITHUB_WORKSPACE/examples/language-syntax-roundtrip/corpus.json" \
            '($registry[0].cases | length) as $total |
            ([$registry[0].cases[] | select(.scope == "LANGUAGE_CAPABILITY")] | length) as $capability |
            ([$registry[0].cases[] | select(.scope == "GOVERNANCE_OBSERVATION")] | length) as $governance |
            .decision == "PASS" and .resolution == "EXACT" and .reason == "SCOPE_PARTITION_OBSERVED" and
            .head_sha == $head and .replay_equal == true and
            .compile_executions == 2 and .test_executions == 0 and
            .output_artifact_files == 3 and
            .source_artifact_digest == $first_digest and
            .source_replay_artifact_digest == $replay_digest and
            .source_concept_artifact_digest == $concept_digest and
            .source_report_digest == $report_digest and
            .repository_writes == 0 and .branch_setting_writes == 0 and
            .local_test_executions == 0 and .cross_project_required_gates == 0 and
            .generation_authority == "CALLER_OWNED_TEMP_OUTPUT_ONLY" and
            .overall == {satisfied: $total, total: $total, executed: $total, unresolved: 0} and
            .language_capability == {satisfied: $capability, total: $capability, executed: $capability, unresolved: 0} and
            .governance_observation == {satisfied: $governance, total: $governance, executed: $governance, unresolved: 0}' \
            "$report"
  language-concept-artifact:
    needs: [cross-platform-release]
    outputs:
      predecessor-mode: ${{ steps.readiness-predecessor.outputs.mode }}
    if: >-
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        (github.event.workflow_run.head_branch == 'dev' || github.event.workflow_run.head_branch == 'main')
      )
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: go1.27.0
      HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
      REQUESTED_ROUTE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
      - name: Assert causal workflows use setup-go v7
        shell: bash
        run: |
          set -euo pipefail
          if grep -En '^[[:space:]]*(-[[:space:]]+)?uses:[[:space:]]+actions/setup-go@v[0-6]([[:space:]]|$)' .github/workflows/metric-counterfactual.yml .github/workflows/transformation-effect.yml; then
            echo 'FAIL_CLOSED: unsupported setup-go action version' >&2
            exit 1
          fi
          grep -Eq '^[[:space:]]*(-[[:space:]]+)?uses:[[:space:]]+actions/setup-go@v7([[:space:]]|$)' .github/workflows/metric-counterfactual.yml .github/workflows/transformation-effect.yml
      - name: Download exact platform release receipts
        uses: actions/download-artifact@v7
        with:
          pattern: toolchain-release-platform-*-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/toolchain-release-platforms
          merge-multiple: true
      - name: Select exact proposal predecessor
        id: proposal-predecessor
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          predecessor_sha="${{ github.event.pull_request.base.sha }}"
          if [[ -z "$predecessor_sha" ]]; then
            predecessor_sha="$(git rev-parse "$HEAD_SHA^")"
          fi
          is_known_proposal_failure_reason() {
            case "$1" in
              PROPOSAL_PREDECESSOR_NOT_FOUND|PROPOSAL_PREDECESSOR_EVIDENCE_UNKNOWN|\
              PROPOSAL_PREDECESSOR_AMBIGUOUS|PROPOSAL_SYNTHESIS_JOB_CARDINALITY|\
              PROPOSAL_RUN_PAGINATION_INCOMPLETE|PROPOSAL_JOB_PAGINATION_INCOMPLETE|\
              PROPOSAL_ARTIFACT_PAGINATION_INCOMPLETE|PROPOSAL_API_UNAVAILABLE|\
              PROPOSAL_API_PERMISSION_DENIED|PROPOSAL_RESPONSE_MALFORMED|\
              PROPOSAL_ARTIFACT_PAYLOAD_UNAVAILABLE|PROPOSAL_REDIRECT_ORIGIN_MISMATCH|\
              PROPOSAL_PREDECESSOR_ROUTE_UNKNOWN|PROPOSAL_PREDECESSOR_ROUTE_CONTRADICTION)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }
          for suffix in a b; do
            observation_args=(--observation-replay "$RUNNER_TEMP/language-readiness-proposal-observation.json")
            if [[ "$suffix" == "a" ]]; then
              observation_args=(--observation-capture "$RUNNER_TEMP/language-readiness-proposal-observation.json")
            fi
            go run ./cmd/language-readiness-witness/proposal-promotion \
              --root "$GITHUB_WORKSPACE" \
              --repository "$GITHUB_REPOSITORY" \
              --current-head "$HEAD_SHA" \
              --predecessor-sha "$predecessor_sha" \
              --route "$REQUESTED_ROUTE" \
              "${observation_args[@]}" \
              --output "$RUNNER_TEMP/language-readiness-proposal-promotion-$suffix.json"
          done
          cmp "$RUNNER_TEMP/language-readiness-proposal-promotion-a.json" \
            "$RUNNER_TEMP/language-readiness-proposal-promotion-b.json"
          go run ./cmd/language-readiness-witness/proposal-promotion \
            --root "$GITHUB_WORKSPACE" \
            --repository "$GITHUB_REPOSITORY" \
            --current-head "$HEAD_SHA" \
            --predecessor-sha "$predecessor_sha" \
            --route "$REQUESTED_ROUTE" \
            --observation-cache "$RUNNER_TEMP/language-readiness-proposal-observation.json" \
            --check "$RUNNER_TEMP/language-readiness-proposal-promotion-a.json"
          proposal_schema="$(jq -r '.schema' "$RUNNER_TEMP/language-readiness-proposal-promotion-a.json")"
          if [[ "$proposal_schema" == "gooo/autonomous-change-proposal-predecessor-resolution/v1" ]]; then
            proposal_reason="$(jq -r '.reason // empty' "$RUNNER_TEMP/language-readiness-proposal-promotion-a.json")"
            if ! is_known_proposal_failure_reason "$proposal_reason"; then
              echo "FAIL_CLOSED: unknown proposal predecessor failure reason: ${proposal_reason:-EMPTY}" >&2
              exit 1
            fi
            jq -e --arg repository "$GITHUB_REPOSITORY" --arg head "$HEAD_SHA" --arg predecessor "$predecessor_sha" --arg route "$REQUESTED_ROUTE" '
              .schema == "gooo/autonomous-change-proposal-predecessor-resolution/v1" and
              .repository == $repository and .current_head_sha == $head and .predecessor_sha == $predecessor and .requested_route == $route and
              .conformance == "PASS" and .decision == "FAIL_CLOSED" and
              .resolution == "LOWER_RESOLUTION" and
              .stage == "proposal-predecessor" and
              .step == "select-exact-predecessor" and
              .promotion_authority == false and .readiness_delta == null and
              ((.reason == "PROPOSAL_PREDECESSOR_ROUTE_CONTRADICTION" and .observation_decision == "REFUTED" and .observation_resolution == "EXACT" and .unknown == null) or
               (.reason != "PROPOSAL_PREDECESSOR_ROUTE_CONTRADICTION" and .observation_decision == "UNKNOWN" and .observation_resolution == "LOWER_RESOLUTION" and
                .unknown.stage == "proposal-predecessor" and .unknown.step == "select-exact-predecessor" and
                .unknown.reason == .reason and .unknown.unknown_class != "" and .unknown.next_operation != "" and .unknown.blocked_by != null)) and
              (.reason as $reason |
                ["PROPOSAL_PREDECESSOR_NOT_FOUND",
                "PROPOSAL_PREDECESSOR_EVIDENCE_UNKNOWN",
                "PROPOSAL_PREDECESSOR_AMBIGUOUS",
                "PROPOSAL_SYNTHESIS_JOB_CARDINALITY",
                "PROPOSAL_RUN_PAGINATION_INCOMPLETE",
                "PROPOSAL_JOB_PAGINATION_INCOMPLETE",
                "PROPOSAL_ARTIFACT_PAGINATION_INCOMPLETE",
                "PROPOSAL_API_UNAVAILABLE",
                "PROPOSAL_API_PERMISSION_DENIED",
                "PROPOSAL_RESPONSE_MALFORMED",
                "PROPOSAL_ARTIFACT_PAYLOAD_UNAVAILABLE",
                "PROPOSAL_REDIRECT_ORIGIN_MISMATCH",
                "PROPOSAL_PREDECESSOR_ROUTE_UNKNOWN",
                "PROPOSAL_PREDECESSOR_ROUTE_CONTRADICTION"] | index($reason)) != null
            ' "$RUNNER_TEMP/language-readiness-proposal-promotion-a.json"
            echo "mode=BLOCKED" >> "$GITHUB_OUTPUT"
            echo "conformance-exit-code=0" >> "$GITHUB_OUTPUT"
            jq -r '"### Proposal predecessor conformance\n- conformance: `\(.conformance)`\n- proposal availability/readiness decision: `\(.decision)`\n- resolution: `\(.resolution)`\n- coordinate: `\(.stage)/\(.step)`\n- reason: `\(.reason)`\n- promotion authority: `\(.promotion_authority)`\n- readiness delta: `\(.readiness_delta // "UNKNOWN")`\n- receipt reconstruction: `2/2`"' \
              "$RUNNER_TEMP/language-readiness-proposal-promotion-a.json" >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$proposal_schema" == "gooo/autonomous-change-proposal-promotion/v2" ]]; then
            jq -e --arg repository "$GITHUB_REPOSITORY" --arg head "$HEAD_SHA" --arg predecessor "$predecessor_sha" --arg route "$REQUESTED_ROUTE" '
              .schema == "gooo/autonomous-change-proposal-promotion/v2" and
              .repository == $repository and .current_head_sha == $head and .evidence_head_sha == $predecessor and
              .source.selection.requested_route == $route and .source.selection.head_branch == $route and
              .decision == "PASS" and .repository_mutation_authorized == false
            ' \
              "$RUNNER_TEMP/language-readiness-proposal-promotion-a.json"
            echo "mode=SELECTED" >> "$GITHUB_OUTPUT"
            echo "conformance-exit-code=0" >> "$GITHUB_OUTPUT"
          else
            echo "FAIL_CLOSED: malformed proposal predecessor receipt" >&2
            exit 1
          fi
      - name: Verify proposal observation evidence binding
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cache="$RUNNER_TEMP/language-readiness-proposal-observation.json"
          receipt="$RUNNER_TEMP/language-readiness-proposal-promotion-a.json"
          test -s "$cache"
          test -s "$receipt"
          predecessor_sha="${{ github.event.pull_request.base.sha }}"
          if [[ -z "$predecessor_sha" ]]; then
            predecessor_sha="$(git rev-parse "$HEAD_SHA^")"
          fi
          go run ./cmd/language-readiness-witness/proposal-promotion \
            --root "$GITHUB_WORKSPACE" \
            --repository "$GITHUB_REPOSITORY" \
            --current-head "$HEAD_SHA" \
            --predecessor-sha "$predecessor_sha" \
            --route "$REQUESTED_ROUTE" \
            --observation-cache "$cache" \
            --check "$receipt"
          cache_bytes="$(wc -c < "$cache" | tr -d '[:space:]')"
          cache_digest="sha256:$(sha256sum "$cache" | awk '{print $1}')"
          response_total="$(jq -r '.responses | length' "$cache")"
          response_consumed="$(jq -r '.observation_evidence.response_consumed' "$receipt")"
          jq -e --argjson responses "$response_total" '
            .schema == "gooo/language-readiness-api-observation/v1" and
            (.responses | type) == "array" and (.responses | length) == $responses and
            (.responses | length) > 0 and
            (has("decision") | not) and (has("selection") | not) and (has("promotion") | not)
          ' "$cache"
          jq -e --arg logical "language-readiness-proposal-observation.json" \
            --arg role "proposal-predecessor-raw-observation" \
            --argjson bytes "$cache_bytes" --arg digest "$cache_digest" \
            --argjson responses "$response_total" '
            .observation_evidence.schema == "gooo/language-readiness-api-observation/v1" and
            .observation_evidence.cache_path == $logical and
            .observation_evidence.cache_role == $role and
            .observation_evidence.cache_bytes == $bytes and
            .observation_evidence.cache_digest == $digest and
            .observation_evidence.response_total == $responses and
            .observation_evidence.response_consumed == $responses
          ' "$receipt"
          evidence_bundle="$RUNNER_TEMP/language-readiness-proposal-evidence"
          mkdir -p "$evidence_bundle"
          cp "$cache" "$evidence_bundle/language-readiness-proposal-observation.json"
          cp "$receipt" "$evidence_bundle/proposal-receipt.json"
          echo "### Proposal observation binding" >> "$GITHUB_STEP_SUMMARY"
          echo "- cache bytes: \`$cache_bytes\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- cache digest: \`$cache_digest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- raw response total: \`$response_total\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- responses consumed at record/next boundary: \`$response_consumed/$response_total\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- capture/replay reconstruction: \`2/2\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload proposal predecessor raw observation cache
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: language-readiness-proposal-observation-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/language-readiness-proposal-observation.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload proposal predecessor resolution receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: language-readiness-proposal-predecessor-receipt-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/language-readiness-proposal-promotion-a.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload bound proposal observation evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: language-readiness-proposal-evidence-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/language-readiness-proposal-evidence
          if-no-files-found: error
          retention-days: 14
      - name: Assert blocked proposal predecessor remains non-authorizing
        if: steps.proposal-predecessor.outcome == 'success' && steps.proposal-predecessor.outputs.mode == 'BLOCKED'
        run: |
          set -euo pipefail
          test "${{ steps.proposal-predecessor.outputs.conformance-exit-code }}" = "0"
          jq -e '
            .schema == "gooo/autonomous-change-proposal-predecessor-resolution/v1" and
            .conformance == "PASS" and .decision == "FAIL_CLOSED" and
            .resolution == "LOWER_RESOLUTION" and
            .stage == "proposal-predecessor" and .step == "select-exact-predecessor" and
            .promotion_authority == false and .readiness_delta == null and
            .selection.decision != "SELECTED"
          ' "$RUNNER_TEMP/language-readiness-proposal-promotion-a.json"
          echo "proposal predecessor BLOCKED conformance exited 0; proposal projection, promotion, and readiness authority are skipped"
      - name: Project v2 proposal evidence to the unchanged v1 guard contract
        if: steps.proposal-predecessor.outputs.mode == 'SELECTED'
        run: |
          predecessor_sha="${{ github.event.pull_request.base.sha }}"
          if [[ -z "$predecessor_sha" ]]; then
            predecessor_sha="$(git rev-parse "$HEAD_SHA^")"
          fi
          for suffix in a b; do
            go run ./cmd/language-readiness-witness/proposal-compat \
              --root "$GITHUB_WORKSPACE" \
              --input "$RUNNER_TEMP/language-readiness-proposal-promotion-a.json" \
              --expected-repository "$GITHUB_REPOSITORY" \
              --expected-sha "$HEAD_SHA" \
              --expected-predecessor-sha "$predecessor_sha" \
              --legacy "$RUNNER_TEMP/language-readiness-proposal-promotion-legacy-$suffix.json" \
              --receipt "$RUNNER_TEMP/language-readiness-proposal-compat-$suffix.json"
          done
          cmp "$RUNNER_TEMP/language-readiness-proposal-promotion-legacy-a.json" \
            "$RUNNER_TEMP/language-readiness-proposal-promotion-legacy-b.json"
          cmp "$RUNNER_TEMP/language-readiness-proposal-compat-a.json" \
            "$RUNNER_TEMP/language-readiness-proposal-compat-b.json"
          go run ./cmd/language-readiness-witness/proposal-compat \
            --root "$GITHUB_WORKSPACE" \
            --input "$RUNNER_TEMP/language-readiness-proposal-promotion-a.json" \
            --expected-repository "$GITHUB_REPOSITORY" \
            --expected-sha "$HEAD_SHA" \
            --expected-predecessor-sha "$predecessor_sha" \
            --legacy "$RUNNER_TEMP/language-readiness-proposal-promotion-legacy-a.json" \
            --receipt "$RUNNER_TEMP/language-readiness-proposal-compat-a.json" \
            --check
      - name: Upload merged autonomous change proposal promotion
        if: steps.proposal-predecessor.outputs.mode == 'SELECTED'
        uses: actions/upload-artifact@v6
        with:
          name: language-readiness-proposal-promotion-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/language-readiness-proposal-promotion-legacy-a.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload current v2 proposal evidence
        if: steps.proposal-predecessor.outputs.mode == 'SELECTED'
        uses: actions/upload-artifact@v6
        with:
          name: language-readiness-proposal-promotion-v2-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/language-readiness-proposal-promotion-a.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload proposal compatibility receipt
        if: steps.proposal-predecessor.outputs.mode == 'SELECTED'
        uses: actions/upload-artifact@v6
        with:
          name: language-readiness-proposal-compat-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/language-readiness-proposal-compat-a.json
          if-no-files-found: error
          retention-days: 30
      - name: Select exact readiness predecessor
        id: readiness-predecessor
        if: steps.proposal-predecessor.outputs.mode != 'BLOCKED'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mode=""
          status_a=1
          status_b=1
          replay_mismatch=0
          is_known_failure_reason() {
            case "$1" in
              ARTIFACT_PAYLOAD_UNAVAILABLE|\
              WORKFLOW_RUN_HTTP_FAILURE|WORKFLOW_RUN_PAGINATION_INCOMPLETE|\
              WORKFLOW_RUN_NEXT_LINK_REPEATED|WORKFLOW_RUN_PAGE_CAP_EXCEEDED|\
              WORKFLOW_RUN_LINK_MALFORMED|WORKFLOW_RUN_LINK_ORIGIN_MISMATCH|\
              WORKFLOW_RUN_REDIRECT_ORIGIN_MISMATCH|WORKFLOW_RUN_DUPLICATE_ID|\
              WORKFLOW_RUN_RESPONSE_MALFORMED|\
              ARTIFACT_HTTP_FAILURE|ARTIFACT_PAGINATION_INCOMPLETE|\
              ARTIFACT_NEXT_LINK_REPEATED|ARTIFACT_PAGE_CAP_EXCEEDED|\
              ARTIFACT_LINK_MALFORMED|ARTIFACT_LINK_ORIGIN_MISMATCH|\
              ARTIFACT_REDIRECT_ORIGIN_MISMATCH|ARTIFACT_DUPLICATE_ID|\
              ARTIFACT_RESPONSE_MALFORMED|\
              JOB_HTTP_FAILURE|JOB_PAGINATION_INCOMPLETE|\
              JOB_NEXT_LINK_REPEATED|JOB_PAGE_CAP_EXCEEDED|\
              JOB_LINK_MALFORMED|JOB_LINK_ORIGIN_MISMATCH|\
              JOB_REDIRECT_ORIGIN_MISMATCH|JOB_DUPLICATE_ID|\
              JOB_RESPONSE_MALFORMED)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }
          for suffix in a b; do
            baseline_dir="$RUNNER_TEMP/language-readiness-baseline-$suffix"
            mkdir -p "$baseline_dir"
            observation_args=(--observation-replay "$RUNNER_TEMP/language-readiness-predecessor-observation.json")
            if [[ "$suffix" == "a" ]]; then
              observation_args=(--observation-capture "$RUNNER_TEMP/language-readiness-predecessor-observation.json")
            fi
            set +e
            go run ./cmd/language-readiness-witness/predecessor-selection \
              --root "$GITHUB_WORKSPACE" \
              --repository "$GITHUB_REPOSITORY" \
              --current-head "$HEAD_SHA" \
              --predecessor-sha "${{ github.event.pull_request.base.sha }}" \
              --branch "dev" \
              --workflow "Transformation effect ledger" \
              --baseline "$baseline_dir/artifact.json" \
              --reference "$RUNNER_TEMP/language-readiness-baseline-reference-$suffix.json" \
              --binding-baseline "$RUNNER_TEMP/language-readiness-binding-baseline-$suffix.json" \
              --receipt "$RUNNER_TEMP/language-readiness-predecessor-selection-$suffix.json" \
              "${observation_args[@]}"
            selection_status=$?
            set -e
            effective_status="$selection_status"
            observed_mode="BLOCKED"
            if [[ "$selection_status" -eq 0 ]]; then
              observed_mode="RESOLVED"
            else
              receipt="$RUNNER_TEMP/language-readiness-predecessor-selection-$suffix.json"
              selection_reason="$(jq -r '.attempts[-1].selection.reason // empty' "$receipt" 2>/dev/null || true)"
              resolution_reason="$(jq -r '.reason // empty' "$receipt" 2>/dev/null || true)"
              if [[ "$selection_reason" == "READINESS_PREDECESSOR_NOT_FOUND" &&
                "$resolution_reason" == "READINESS_ANCESTOR_SEARCH_EXHAUSTED" ]]; then
                if jq -e '
                  .decision == "FAIL_CLOSED" and
                  .conformance == "PASS" and
                  .resolution == "LOWER_RESOLUTION" and
                  .reason == "READINESS_ANCESTOR_SEARCH_EXHAUSTED" and
                  .selected == null and
                  .summary.observed_attempts == .summary.search_limit and
                  .summary.missing_attempts == .summary.search_limit and
                  .summary.selected_ancestors == 0 and
                  (.attempts | length) == .summary.search_limit and
                  ([.attempts[] | .selection.reason] | all(. == "READINESS_PREDECESSOR_NOT_FOUND")) and
                  ([.attempts[].selection.pagination.complete] | all) and
                  ([.attempts[].selection.pagination.failure_reason] | all(. == null or . == ""))
                ' "$receipt"; then
                  set +e
                  go run ./cmd/language-readiness-witness/foundation-seed \
                    --root "$GITHUB_WORKSPACE" \
                    --input "$receipt" \
                    --expected-head "$HEAD_SHA" \
                    --output "$RUNNER_TEMP/language-readiness-foundation-seed-$suffix.json" \
                    --check
                  foundation_status=$?
                  set -e
                  if [[ "$foundation_status" -eq 0 ]]; then
                    effective_status=0
                    observed_mode="FOUNDATION"
                  else
                    effective_status="$foundation_status"
                    echo "foundation seed fail-closed: stage=readiness-foundation step=seed-foundation reason=FOUNDATION_EVIDENCE_UNKNOWN resolution=LOWER_RESOLUTION" >&2
                  fi
                else
                  effective_status=1
                  echo "malformed exhaustive predecessor receipt: stage=readiness-predecessor step=select-exact-predecessor reason=READINESS_ANCESTOR_SEARCH_EXHAUSTED resolution=LOWER_RESOLUTION" >&2
                fi
              elif is_known_failure_reason "$selection_reason" && jq -e \
                --arg head "$HEAD_SHA" --arg reason "$selection_reason" '
                  .current_head_sha == $head and
                  .decision == "FAIL_CLOSED" and
                  .conformance == "PASS" and
                  .resolution == "LOWER_RESOLUTION" and
                  .reason == "READINESS_ANCESTOR_EVIDENCE_BLOCKED" and
                  .blocking_selection_reason == $reason and
                  .summary.readiness_delta_claims == null and
                  ([.attempts[] | .selection.reason] | index($reason)) != null
                ' "$receipt"; then
                effective_status="$selection_status"
                observed_mode="BLOCKED"
                echo "predecessor selection fail-closed: stage=readiness-predecessor step=select-exact-predecessor reason=$selection_reason resolution=LOWER_RESOLUTION conformance=PASS" >&2
              else
                effective_status=1
                echo "malformed predecessor failure receipt: stage=readiness-predecessor step=select-exact-predecessor reason=${selection_reason:-UNKNOWN} resolution=LOWER_RESOLUTION" >&2
              fi
            fi
            if [[ -n "$mode" && "$mode" != "$observed_mode" ]]; then
              replay_mismatch=1
            fi
            mode="$observed_mode"
            if [[ "$suffix" == "a" ]]; then
              status_a="$effective_status"
            else
              status_b="$effective_status"
            fi
          done
          cmp "$RUNNER_TEMP/language-readiness-predecessor-selection-a.json" \
            "$RUNNER_TEMP/language-readiness-predecessor-selection-b.json"
          if [[ "$replay_mismatch" -ne 0 ]]; then
            echo "predecessor mode replay mismatch" >&2
            exit 1
          fi
          if [[ "$mode" == "BLOCKED" ]]; then
            blocked_reason="$(jq -r '.blocking_selection_reason // empty' "$RUNNER_TEMP/language-readiness-predecessor-selection-a.json")"
            if [[ -n "$blocked_reason" ]]; then
              jq -e --arg head "$HEAD_SHA" --arg reason "$blocked_reason" '
                .current_head_sha == $head and
                .decision == "FAIL_CLOSED" and
                .conformance == "PASS" and
                .resolution == "LOWER_RESOLUTION" and
                .reason == "READINESS_ANCESTOR_EVIDENCE_BLOCKED" and
                .blocking_selection_reason == $reason and
                .summary.readiness_delta_claims == null
              ' "$RUNNER_TEMP/language-readiness-predecessor-selection-a.json"
            else
              jq -e '
                .decision == "FAIL_CLOSED" and
                .conformance == "PASS" and
                .resolution == "LOWER_RESOLUTION" and
                .reason == "READINESS_ANCESTOR_SEARCH_EXHAUSTED" and
                .selected == null
              ' "$RUNNER_TEMP/language-readiness-predecessor-selection-a.json"
              if [[ -f "$RUNNER_TEMP/language-readiness-foundation-seed-a.json" &&
                -f "$RUNNER_TEMP/language-readiness-foundation-seed-b.json" ]]; then
                cmp "$RUNNER_TEMP/language-readiness-foundation-seed-a.json" \
                  "$RUNNER_TEMP/language-readiness-foundation-seed-b.json"
              fi
              blocked_reason="FOUNDATION_EVIDENCE_UNKNOWN"
            fi
            echo "### Readiness predecessor conformance" >> "$GITHUB_STEP_SUMMARY"
            echo "- conformance: \`PASS\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- readiness decision: \`FAIL_CLOSED\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- resolution: \`LOWER_RESOLUTION\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- reason: \`$blocked_reason\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- receipt reconstruction: \`2/2\`" >> "$GITHUB_STEP_SUMMARY"
            echo "conformance-exit-code=0" >> "$GITHUB_OUTPUT"
            echo "mode=BLOCKED" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$status_a" -ne 0 || "$status_b" -ne 0 ]]; then
            echo "predecessor replay failed: status_a=$status_a status_b=$status_b" >&2
            exit "$status_a"
          fi
          if [[ "$mode" == "RESOLVED" ]]; then
            for suffix in a b; do
              test -f "$RUNNER_TEMP/language-readiness-baseline-$suffix/artifact.json"
              test -f "$RUNNER_TEMP/language-readiness-baseline-reference-$suffix.json"
              test -f "$RUNNER_TEMP/language-readiness-binding-baseline-$suffix.json"
            done
            cmp "$RUNNER_TEMP/language-readiness-baseline-a/artifact.json" \
              "$RUNNER_TEMP/language-readiness-baseline-b/artifact.json"
            cmp "$RUNNER_TEMP/language-readiness-baseline-reference-a.json" \
              "$RUNNER_TEMP/language-readiness-baseline-reference-b.json"
            cmp "$RUNNER_TEMP/language-readiness-binding-baseline-a.json" \
              "$RUNNER_TEMP/language-readiness-binding-baseline-b.json"
          else
            for suffix in a b; do
              test -f "$RUNNER_TEMP/language-readiness-foundation-seed-$suffix.json"
              test -f "$RUNNER_TEMP/language-readiness-predecessor-selection-$suffix.json"
              test ! -e "$RUNNER_TEMP/language-readiness-baseline-$suffix/artifact.json"
              test ! -e "$RUNNER_TEMP/language-readiness-baseline-reference-$suffix.json"
              test ! -e "$RUNNER_TEMP/language-readiness-binding-baseline-$suffix.json"
            done
            cmp "$RUNNER_TEMP/language-readiness-foundation-seed-a.json" \
              "$RUNNER_TEMP/language-readiness-foundation-seed-b.json"
            test ! -e "$RUNNER_TEMP/language-readiness-baseline-a/artifact.json"
            test ! -e "$RUNNER_TEMP/language-readiness-baseline-reference-a.json"
            test ! -e "$RUNNER_TEMP/language-readiness-binding-baseline-a.json"
            jq -r '"### Readiness foundation seed\n- decision: `\(.decision)`\n- coordinates: `\(.summary.satisfied)/\(.summary.total)`\n- ancestry exhaustion: `\(.source.missing_attempts)/\(.source.search_limit)`\n- readiness delta claims: `\(.source.readiness_delta_claims)`\n- observed repository effects: `\(.source.repository_writes)`\n- authority: denied"' \
              "$RUNNER_TEMP/language-readiness-foundation-seed-a.json" >> "$GITHUB_STEP_SUMMARY"
            jq -r '"- predecessor evidence coordinate: `\(.attempts[-1].selection.reason // .reason)`"' \
              "$RUNNER_TEMP/language-readiness-predecessor-selection-a.json" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "conformance-exit-code=0" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - name: Assert blocked readiness remains non-authorizing
        if: steps.readiness-predecessor.outcome == 'success' && steps.readiness-predecessor.outputs.mode == 'BLOCKED'
        run: |
          set -euo pipefail
          test "${{ steps.readiness-predecessor.outputs.conformance-exit-code }}" = "0"
          jq -e '
            .conformance == "PASS" and
            .decision == "FAIL_CLOSED" and
            .resolution == "LOWER_RESOLUTION" and
            .summary.readiness_delta_claims == null
          ' "$RUNNER_TEMP/language-readiness-predecessor-selection-a.json"
          echo "### Blocked readiness is non-authorizing" >> "$GITHUB_STEP_SUMMARY"
          echo "- conformance step exit: \`0\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- readiness decision: \`FAIL_CLOSED\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- readiness resolution: \`LOWER_RESOLUTION\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload resolved exact-head readiness predecessor selection
        if: steps.readiness-predecessor.outcome == 'success' && steps.readiness-predecessor.outputs.mode == 'RESOLVED'
        uses: actions/upload-artifact@v6
        with:
          name: language-readiness-predecessor-selection-${{ env.HEAD_SHA }}
          path: |
            ${{ runner.temp }}/language-readiness-baseline-reference-a.json
            ${{ runner.temp }}/language-readiness-predecessor-selection-a.json
            ${{ runner.temp }}/language-readiness-baseline-a/artifact.json
            ${{ runner.temp }}/language-readiness-binding-baseline-a.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload foundation exact-head readiness predecessor selection
        if: steps.readiness-predecessor.outcome == 'success' && steps.readiness-predecessor.outputs.mode == 'FOUNDATION'
        uses: actions/upload-artifact@v6
        with:
          name: language-readiness-predecessor-selection-${{ env.HEAD_SHA }}
          path: |
            ${{ runner.temp }}/language-readiness-predecessor-selection-a.json
            ${{ runner.temp }}/language-readiness-foundation-seed-a.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload readiness predecessor failure receipt
        if: always() && steps.proposal-predecessor.outcome == 'success' && steps.proposal-predecessor.outputs.mode != 'BLOCKED'
        uses: actions/upload-artifact@v6
        with:
          name: language-readiness-predecessor-receipt-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/language-readiness-predecessor-selection-*.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload optional readiness predecessor diagnostics
        if: always() && steps.proposal-predecessor.outcome == 'success' && steps.proposal-predecessor.outputs.mode != 'BLOCKED'
        uses: actions/upload-artifact@v6
        with:
          name: language-readiness-predecessor-diagnostic-${{ env.HEAD_SHA }}
          path: |
            ${{ runner.temp }}/language-readiness-predecessor-selection-b.json
            ${{ runner.temp }}/language-readiness-foundation-seed-a.json
            ${{ runner.temp }}/language-readiness-foundation-seed-b.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Prove guarded promotion capability foundation
        if: steps.proposal-predecessor.outputs.mode != 'BLOCKED' && steps.readiness-predecessor.outputs.mode != 'BLOCKED'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          archive_args=()
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            foundation_artifact_id="$(
              go run ./cmd/language-readiness-witness/guarded-capability \
                --print-foundation-artifact-id
            )"
            [[ "$foundation_artifact_id" =~ ^[1-9][0-9]*$ ]]
            archive="$RUNNER_TEMP/guarded-capability-foundation.zip"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$foundation_artifact_id/zip" > "$archive"
            archive_args=(--foundation-archive "$archive")
          fi
          for suffix in a b; do
            go run ./cmd/language-readiness-witness/guarded-capability \
              --root "$GITHUB_WORKSPACE" \
              --current-head "$HEAD_SHA" \
              "${archive_args[@]}" \
              --output "$RUNNER_TEMP/language-readiness-guarded-capability-$suffix.json"
          done
          cmp "$RUNNER_TEMP/language-readiness-guarded-capability-a.json" \
            "$RUNNER_TEMP/language-readiness-guarded-capability-b.json"
          go run ./cmd/language-readiness-witness/guarded-capability \
            --root "$GITHUB_WORKSPACE" \
            --current-head "$HEAD_SHA" \
            "${archive_args[@]}" \
            --check "$RUNNER_TEMP/language-readiness-guarded-capability-a.json"
      - name: Upload guarded promotion capability
        if: steps.proposal-predecessor.outputs.mode != 'BLOCKED' && steps.readiness-predecessor.outputs.mode != 'BLOCKED'
        uses: actions/upload-artifact@v6
        with:
          name: language-readiness-guarded-capability-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/language-readiness-guarded-capability-a.json
          if-no-files-found: error
          retention-days: 30
      - name: Produce, replay, and consume exact-head concepts
        if: steps.proposal-predecessor.outputs.mode != 'BLOCKED' && steps.readiness-predecessor.outputs.mode != 'BLOCKED'
        env:
          PREDECESSOR_MODE: ${{ steps.readiness-predecessor.outputs.mode }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          first="$RUNNER_TEMP/language-concept-artifact/first"
          replay="$RUNNER_TEMP/language-concept-artifact/replay"
          mkdir -p "$first" "$replay"
          predecessor_sha="${PULL_REQUEST_BASE_SHA:-}"
          if [[ -z "$predecessor_sha" ]]; then
            predecessor_sha="$(git rev-parse "$HEAD_SHA^")"
          fi
          for target in "$first" "$replay"; do
            go run ./cmd/language-concept-artifact-witness \
              -root "$GITHUB_WORKSPACE" \
              -output "$target/artifact.json"
          done
          cmp -s "$first/artifact.json" "$replay/artifact.json"
          go run ./cmd/language-concept-artifact-witness \
            -root "$GITHUB_WORKSPACE" \
            -check "$first/artifact.json"
          (
            cd "$first"
            sha256sum artifact.json > artifact.json.sha256
          )
          release_first="$RUNNER_TEMP/toolchain-cross-platform-release/first"
          release_replay="$RUNNER_TEMP/toolchain-cross-platform-release/replay"
          release_corpus="$GITHUB_WORKSPACE/examples/toolchain-cross-platform-release/corpus.json"
          release_receipts="$RUNNER_TEMP/toolchain-release-platforms"
          mkdir -p "$release_first" "$release_replay"
          for target in "$release_first" "$release_replay"; do
            go run ./cmd/toolchain-release-witness \
              --root "$GITHUB_WORKSPACE" \
              --expected-head "$HEAD_SHA" \
              --concept "$first/artifact.json" \
              --corpus "$release_corpus" \
