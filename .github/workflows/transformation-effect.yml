name: Transformation effect ledger

on:
  pull_request:
    branches: [dev, main]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  guarded-promotion-receipt:
    name: guarded-promotion-receipt
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact CI subject
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Set up Go 1.27
        uses: actions/setup-go@v6
        with:
          go-version: 1.27.0
          cache: true

      - name: Select expected boundary decision
        id: boundary
        env:
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          case "$SOURCE_EVENT:$SOURCE_BRANCH" in
            "push:$DEFAULT_BRANCH") decision=AUTHORIZED ;;
            pull_request:*) decision=DENIED ;;
            *) decision=FAIL_CLOSED ;;
          esac
          printf 'decision=%s\n' "$decision" >> "$GITHUB_OUTPUT"

      - name: Build guarded promotion receipt twice
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          EXPECT_DECISION: ${{ steps.boundary.outputs.decision }}
          API_URL: ${{ github.api_url }}
        run: |
          set +e
          codes=()
          for replay in a b; do
            go run ./cmd/guarded-promotion-witness \
              --repository "$REPOSITORY" \
              --current-head-sha "$HEAD_SHA" \
              --source-run-id "$SOURCE_RUN_ID" \
              --api-url "$API_URL" \
              --token "$GH_TOKEN" \
              --expect-decision "$EXPECT_DECISION" \
              --out "$RUNNER_TEMP/guarded-promotion-$replay.json"
            codes+=("$?")
          done
          set -e
          test "${codes[0]}" -eq "${codes[1]}"
          printf '%s\n' "${codes[0]}" > "$RUNNER_TEMP/guarded-promotion-exit-code.txt"

      - name: Verify deterministic replay
        run: |
          cmp "$RUNNER_TEMP/guarded-promotion-a.json" \
            "$RUNNER_TEMP/guarded-promotion-b.json"
          cmp "$RUNNER_TEMP/guarded-promotion-a.json.sha256" \
            "$RUNNER_TEMP/guarded-promotion-b.json.sha256"

      - name: Upload guarded promotion receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: guarded-promotion-${{ github.event.workflow_run.head_sha }}
          path: |
            ${{ runner.temp }}/guarded-promotion-*.json
            ${{ runner.temp }}/guarded-promotion-*.sha256
            ${{ runner.temp }}/guarded-promotion-exit-code.txt
          if-no-files-found: error
          retention-days: 30

  rollback-fixed-point-recovery:
    name: rollback-fixed-point-recovery
    needs: [guarded-promotion-receipt, transformation-effect]
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.head_branch == 'dev' || github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: go1.27.0
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.0
      - uses: actions/download-artifact@v7
        with:
          name: guarded-promotion-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/rollback/guard
      - uses: actions/download-artifact@v7
        with:
          name: transformation-effect-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/rollback/transformation
      - name: Bind fail-closed promotion to an exact fixed point
        run: |
          for suffix in a b; do
            go run ./cmd/language-readiness-witness/rollback-fixed-point \
              --root "$GITHUB_WORKSPACE" \
              --guard "$RUNNER_TEMP/rollback/guard/guarded-promotion-a.json" \
              --transformation "$RUNNER_TEMP/rollback/transformation/ledger.json" \
              --expected-sha "$HEAD_SHA" \
              --output "$RUNNER_TEMP/rollback-fixed-point-$suffix.json"
          done
          cmp "$RUNNER_TEMP/rollback-fixed-point-a.json" \
            "$RUNNER_TEMP/rollback-fixed-point-b.json"
          go run ./cmd/language-readiness-witness/rollback-fixed-point \
            --root "$GITHUB_WORKSPACE" \
            --guard "$RUNNER_TEMP/rollback/guard/guarded-promotion-a.json" \
            --transformation "$RUNNER_TEMP/rollback/transformation/ledger.json" \
            --expected-sha "$HEAD_SHA" \
            --output "$RUNNER_TEMP/rollback-fixed-point-a.json" \
            --check
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: rollback-fixed-point-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/rollback-fixed-point-a.json
          if-no-files-found: error
          retention-days: 30

  transformation-effect:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.head_branch == 'dev' || github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: go1.27.0
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      CI_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.0
      - name: Download exact meta artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: '*-${{ github.event.workflow_run.head_sha }}'
          path: ${{ runner.temp }}/meta-inputs
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Execute, verify, and replay sandbox effects
        shell: bash
        run: |
          set -euo pipefail
          inputs="$RUNNER_TEMP/meta-inputs"
          first="$RUNNER_TEMP/transformation-effect/first"
          replay="$RUNNER_TEMP/transformation-effect/replay"
          mkdir -p "$first" "$replay"
          common=(
            -root "$GITHUB_WORKSPACE"
            -metrics "$inputs/source-line-metrics-$HEAD_SHA/source-metrics.json"
            -plan "$inputs/self-improvement-generation-$HEAD_SHA/self-improvement-plan.json"
            -execution "$inputs/self-improvement-execution-$HEAD_SHA/self-improvement-execution.json"
            -receipts "$inputs/self-improvement-receipts-$HEAD_SHA/self-improvement-receipts.json"
            -provenance "$inputs/self-improvement-provenance-$HEAD_SHA/self-improvement-provenance.json"
            -expected-sha "$HEAD_SHA"
          )
          for target in "$first" "$replay"; do
            go run ./scripts/transformation-effect "${common[@]}" \
              -output "$target/ledger.json" \
              -generated-receipts "$target/receipts.json" \
              -executed-provenance "$target/provenance.json" \
              -patch "$target/patch.json"
          done
          for file in ledger.json receipts.json provenance.json patch.json; do
            cmp -s "$first/$file" "$replay/$file"
          done
          go run ./scripts/transformation-effect \
            -verify "$first/ledger.json" \
            -generated-receipts "$first/receipts.json" \
            -executed-provenance "$first/provenance.json" \
            -patch "$first/patch.json"
      - name: Upload exact-head transformation effects
        uses: actions/upload-artifact@v6
        with:
          name: transformation-effect-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/transformation-effect/first
          if-no-files-found: error
          retention-days: 30

  language-concept-artifact:
    if: >-
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        (github.event.workflow_run.head_branch == 'dev' || github.event.workflow_run.head_branch == 'main')
      )
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: go1.27.0
      HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.0
      - name: Prove merged autonomous change proposal
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          predecessor_sha="${{ github.event.pull_request.base.sha }}"
          if [[ -z "$predecessor_sha" ]]; then
            predecessor_sha="$(git rev-parse "$HEAD_SHA^")"
          fi
          for suffix in a b; do
            go run ./cmd/language-readiness-witness/proposal-promotion \
              --root "$GITHUB_WORKSPACE" \
              --repository "$GITHUB_REPOSITORY" \
              --current-head "$HEAD_SHA" \
              --predecessor-sha "$predecessor_sha" \
              --output "$RUNNER_TEMP/language-readiness-proposal-promotion-$suffix.json"
          done
          cmp "$RUNNER_TEMP/language-readiness-proposal-promotion-a.json" \
            "$RUNNER_TEMP/language-readiness-proposal-promotion-b.json"
          go run ./cmd/language-readiness-witness/proposal-promotion \
            --root "$GITHUB_WORKSPACE" \
            --repository "$GITHUB_REPOSITORY" \
            --current-head "$HEAD_SHA" \
            --predecessor-sha "$predecessor_sha" \
            --check "$RUNNER_TEMP/language-readiness-proposal-promotion-a.json"
      - name: Project v2 proposal evidence to the unchanged v1 guard contract
        run: |
          for suffix in a b; do
            go run ./cmd/language-readiness-witness/proposal-compat \
              --root "$GITHUB_WORKSPACE" \
              --input "$RUNNER_TEMP/language-readiness-proposal-promotion-a.json" \
              --expected-sha "$HEAD_SHA" \
              --legacy "$RUNNER_TEMP/language-readiness-proposal-promotion-legacy-$suffix.json" \
              --receipt "$RUNNER_TEMP/language-readiness-proposal-compat-$suffix.json"
          done
          cmp "$RUNNER_TEMP/language-readiness-proposal-promotion-legacy-a.json" \
            "$RUNNER_TEMP/language-readiness-proposal-promotion-legacy-b.json"
          cmp "$RUNNER_TEMP/language-readiness-proposal-compat-a.json" \
            "$RUNNER_TEMP/language-readiness-proposal-compat-b.json"
          go run ./cmd/language-readiness-witness/proposal-compat \
            --root "$GITHUB_WORKSPACE" \
            --input "$RUNNER_TEMP/language-readiness-proposal-promotion-a.json" \
            --expected-sha "$HEAD_SHA" \
            --legacy "$RUNNER_TEMP/language-readiness-proposal-promotion-legacy-a.json" \
            --receipt "$RUNNER_TEMP/language-readiness-proposal-compat-a.json" \
            --check
      - name: Upload merged autonomous change proposal promotion
        uses: actions/upload-artifact@v6
        with:
          name: language-readiness-proposal-promotion-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/language-readiness-proposal-promotion-legacy-a.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload current v2 proposal evidence
        uses: actions/upload-artifact@v6
        with:
          name: language-readiness-proposal-promotion-v2-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/language-readiness-proposal-promotion-a.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload proposal compatibility receipt
        uses: actions/upload-artifact@v6
        with:
          name: language-readiness-proposal-compat-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/language-readiness-proposal-compat-a.json
          if-no-files-found: error
          retention-days: 30
      - name: Select exact readiness predecessor
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for suffix in a b; do
            baseline_dir="$RUNNER_TEMP/language-readiness-baseline-$suffix"
            mkdir -p "$baseline_dir"
            go run ./cmd/language-readiness-witness/predecessor-selection \
              --root "$GITHUB_WORKSPACE" \
              --repository "$GITHUB_REPOSITORY" \
              --current-head "$HEAD_SHA" \
              --predecessor-sha "${{ github.event.pull_request.base.sha }}" \
              --branch "dev" \
              --workflow "Transformation effect ledger" \
              --baseline "$baseline_dir/artifact.json" \
              --reference "$RUNNER_TEMP/language-readiness-baseline-reference-$suffix.json" \
              --binding-baseline "$RUNNER_TEMP/language-readiness-binding-baseline-$suffix.json" \
              --receipt "$RUNNER_TEMP/language-readiness-predecessor-selection-$suffix.json"
          done
          cmp "$RUNNER_TEMP/language-readiness-baseline-a/artifact.json" \
            "$RUNNER_TEMP/language-readiness-baseline-b/artifact.json"
          cmp "$RUNNER_TEMP/language-readiness-baseline-reference-a.json" \
            "$RUNNER_TEMP/language-readiness-baseline-reference-b.json"
          cmp "$RUNNER_TEMP/language-readiness-binding-baseline-a.json" \
            "$RUNNER_TEMP/language-readiness-binding-baseline-b.json"
          cmp "$RUNNER_TEMP/language-readiness-predecessor-selection-a.json" \
            "$RUNNER_TEMP/language-readiness-predecessor-selection-b.json"
      - name: Upload exact-head readiness predecessor selection
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: language-readiness-predecessor-selection-${{ env.HEAD_SHA }}
          path: |
            ${{ runner.temp }}/language-readiness-baseline-reference-a.json
            ${{ runner.temp }}/language-readiness-predecessor-selection-a.json
          if-no-files-found: error
          retention-days: 14
      - name: Prove guarded promotion capability foundation
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          FOUNDATION_ARTIFACT_ID: 9482381929
        shell: bash
        run: |
          set -euo pipefail
          archive_args=()
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            archive="$RUNNER_TEMP/guarded-capability-foundation.zip"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$FOUNDATION_ARTIFACT_ID/zip" > "$archive"
            archive_args=(--foundation-archive "$archive")
          fi
          for suffix in a b; do
            go run ./cmd/language-readiness-witness/guarded-capability \
              --root "$GITHUB_WORKSPACE" \
              --current-head "$HEAD_SHA" \
              "${archive_args[@]}" \
              --output "$RUNNER_TEMP/language-readiness-guarded-capability-$suffix.json"
          done
          cmp "$RUNNER_TEMP/language-readiness-guarded-capability-a.json" \
            "$RUNNER_TEMP/language-readiness-guarded-capability-b.json"
          go run ./cmd/language-readiness-witness/guarded-capability \
            --root "$GITHUB_WORKSPACE" \
            --current-head "$HEAD_SHA" \
            "${archive_args[@]}" \
            --check "$RUNNER_TEMP/language-readiness-guarded-capability-a.json"
      - name: Upload guarded promotion capability
        uses: actions/upload-artifact@v6
        with:
          name: language-readiness-guarded-capability-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/language-readiness-guarded-capability-a.json
          if-no-files-found: error
          retention-days: 30
      - name: Produce, replay, and consume exact-head concepts
        shell: bash
        run: |
          set -euo pipefail
          first="$RUNNER_TEMP/language-concept-artifact/first"
          replay="$RUNNER_TEMP/language-concept-artifact/replay"
          mkdir -p "$first" "$replay"
          for target in "$first" "$replay"; do
            go run ./cmd/language-concept-artifact-witness \
              -root "$GITHUB_WORKSPACE" \
              -output "$target/artifact.json"
          done
          cmp -s "$first/artifact.json" "$replay/artifact.json"
          go run ./cmd/language-concept-artifact-witness \
            -root "$GITHUB_WORKSPACE" \
            -check "$first/artifact.json"
          (
            cd "$first"
            sha256sum artifact.json > artifact.json.sha256
          )
          usecase_first="$RUNNER_TEMP/toolchain-executable-use-cases/first"
          usecase_replay="$RUNNER_TEMP/toolchain-executable-use-cases/replay"
          usecase_registry="$GITHUB_WORKSPACE/examples/toolchain-executable-use-cases/usecases.json"
          mkdir -p "$usecase_first" "$usecase_replay"
          for target in "$usecase_first" "$usecase_replay"; do
            go run ./cmd/toolchain-usecase-witness \
              --root "$GITHUB_WORKSPACE" \
              --head "$HEAD_SHA" \
              --registry "$usecase_registry" \
              --concept-artifact "$first/artifact.json" \
              --output "$target/artifact.json"
          done
          cmp -s "$usecase_first/artifact.json" "$usecase_replay/artifact.json"
          go run ./cmd/toolchain-usecase-witness \
            --root "$GITHUB_WORKSPACE" \
            --head "$HEAD_SHA" \
            --registry "$usecase_registry" \
            --concept-artifact "$first/artifact.json" \
            --check "$usecase_first/artifact.json"
          syntax_first="$RUNNER_TEMP/language-syntax-roundtrip/first"
          syntax_replay="$RUNNER_TEMP/language-syntax-roundtrip/replay"
          syntax_registry="$GITHUB_WORKSPACE/examples/language-syntax-roundtrip/corpus.json"
          mkdir -p "$syntax_first" "$syntax_replay"
          for target in "$syntax_first" "$syntax_replay"; do
            go run ./cmd/language-syntax-witness \
              --root "$GITHUB_WORKSPACE" \
              --head "$HEAD_SHA" \
              --registry "$syntax_registry" \
              --concept-artifact "$first/artifact.json" \
              --output "$target/artifact.json"
          done
          cmp -s "$syntax_first/artifact.json" "$syntax_replay/artifact.json"
          go run ./cmd/language-syntax-witness \
            --root "$GITHUB_WORKSPACE" \
            --head "$HEAD_SHA" \
            --registry "$syntax_registry" \
            --concept-artifact "$first/artifact.json" \
            --check "$syntax_first/artifact.json"
          semantic_first="$RUNNER_TEMP/language-semantic-model/first"
          semantic_replay="$RUNNER_TEMP/language-semantic-model/replay"
          semantic_registry="$GITHUB_WORKSPACE/examples/language-semantic-model/corpus.json"
          mkdir -p "$semantic_first" "$semantic_replay"
          for target in "$semantic_first" "$semantic_replay"; do
            go run ./cmd/language-semantic-witness \
              --root "$GITHUB_WORKSPACE" \
              --head "$HEAD_SHA" \
              --registry "$semantic_registry" \
              --syntax-artifact "$syntax_first/artifact.json" \
              --output "$target/artifact.json"
          done
          cmp -s "$semantic_first/artifact.json" "$semantic_replay/artifact.json"
          go run ./cmd/language-semantic-witness \
            --root "$GITHUB_WORKSPACE" \
            --head "$HEAD_SHA" \
            --registry "$semantic_registry" \
            --syntax-artifact "$syntax_first/artifact.json" \
            --check "$semantic_first/artifact.json"
          diagnostic_first="$RUNNER_TEMP/language-diagnostic-provenance/first"
          diagnostic_replay="$RUNNER_TEMP/language-diagnostic-provenance/replay"
          diagnostic_registry="$GITHUB_WORKSPACE/examples/language-diagnostic-provenance/corpus.json"
          mkdir -p "$diagnostic_first" "$diagnostic_replay"
          for target in "$diagnostic_first" "$diagnostic_replay"; do
            go run ./cmd/language-diagnostic-provenance-witness \
              --root "$GITHUB_WORKSPACE" \
              --expected-head "$HEAD_SHA" \
              --concept "$first/artifact.json" \
              --registry "$diagnostic_registry" \
              --output "$target/artifact.json" || {
                printf '%s\n' 'language-diagnostic-provenance artifact:' >&2
                cat "$target/artifact.json" >&2
                exit 1
              }
          done
          cmp -s "$diagnostic_first/artifact.json" "$diagnostic_replay/artifact.json"
          go run ./cmd/language-diagnostic-provenance-witness \
            --root "$GITHUB_WORKSPACE" \
            --expected-head "$HEAD_SHA" \
            --concept "$first/artifact.json" \
            --registry "$diagnostic_registry" \
            --check "$diagnostic_first/artifact.json"
          (
            cd "$diagnostic_first"
            sha256sum artifact.json > artifact.json.sha256
          )
          runtime_first="$RUNNER_TEMP/language-package-runtime/first"
          runtime_replay="$RUNNER_TEMP/language-package-runtime/replay"
          runtime_corpus="$GITHUB_WORKSPACE/examples/language-package-runtime/corpus.json"
          mkdir -p "$runtime_first" "$runtime_replay"
          for target in "$runtime_first" "$runtime_replay"; do
            go run ./cmd/language-package-runtime-witness \
              --root "$GITHUB_WORKSPACE" \
              --expected-head "$HEAD_SHA" \
              --concept "$first/artifact.json" \
              --corpus "$runtime_corpus" \
              --output "$target/artifact.json" || {
                printf '%s\n' 'language-package-runtime artifact:' >&2
                cat "$target/artifact.json" >&2
                exit 1
              }
          done
          cmp -s "$runtime_first/artifact.json" "$runtime_replay/artifact.json"
          go run ./cmd/language-package-runtime-witness \
            --root "$GITHUB_WORKSPACE" \
            --expected-head "$HEAD_SHA" \
            --concept "$first/artifact.json" \
            --corpus "$runtime_corpus" \
            --check "$runtime_first/artifact.json"
          (
            cd "$runtime_first"
            sha256sum artifact.json > artifact.json.sha256
          )
          cli_root="$RUNNER_TEMP/toolchain-cli"
          cli_binary="$cli_root/gooo"
          cli_first="$cli_root/first"
          cli_replay="$cli_root/replay"
          cli_corpus="$GITHUB_WORKSPACE/examples/toolchain-cli/corpus.json"
          mkdir -p "$cli_first" "$cli_replay"
          go build -trimpath -o "$cli_binary" ./cmd/gooo
          for target in "$cli_first" "$cli_replay"; do
            go run ./cmd/toolchain-cli-witness \
              --root "$GITHUB_WORKSPACE" \
              --executable "$cli_binary" \
              --expected-head "$HEAD_SHA" \
              --concept "$first/artifact.json" \
              --corpus "$cli_corpus" \
              --output "$target/artifact.json" || {
                printf '%s\n' 'toolchain-cli artifact:' >&2
                cat "$target/artifact.json" >&2
                exit 1
              }
          done
          cmp -s "$cli_first/artifact.json" "$cli_replay/artifact.json"
          go run ./cmd/toolchain-cli-witness \
            --root "$GITHUB_WORKSPACE" \
            --executable "$cli_binary" \
            --expected-head "$HEAD_SHA" \
            --concept "$first/artifact.json" \
            --corpus "$cli_corpus" \
            --check "$cli_first/artifact.json"
          (
            cd "$cli_first"
            sha256sum artifact.json > artifact.json.sha256
          )
          format_fix_root="$RUNNER_TEMP/toolchain-format-fix"
          format_fix_first="$format_fix_root/first"
          format_fix_replay="$format_fix_root/replay"
          format_fix_corpus="$GITHUB_WORKSPACE/examples/toolchain-format-fix/corpus.json"
          mkdir -p "$format_fix_first" "$format_fix_replay"
          for target in "$format_fix_first" "$format_fix_replay"; do
            go run ./cmd/toolchain-format-fix-witness \
              --root "$GITHUB_WORKSPACE" \
              --executable "$cli_binary" \
              --expected-head "$HEAD_SHA" \
              --concept "$first/artifact.json" \
              --corpus "$format_fix_corpus" \
              --output "$target/artifact.json" || {
                printf '%s\n' 'toolchain-format-fix artifact:' >&2
                cat "$target/artifact.json" >&2
                exit 1
              }
          done
          cmp -s "$format_fix_first/artifact.json" "$format_fix_replay/artifact.json"
          go run ./cmd/toolchain-format-fix-witness \
            --root "$GITHUB_WORKSPACE" \
            --executable "$cli_binary" \
            --expected-head "$HEAD_SHA" \
            --concept "$first/artifact.json" \
            --corpus "$format_fix_corpus" \
            --check "$format_fix_first/artifact.json"
          (
            cd "$format_fix_first"
            sha256sum artifact.json > artifact.json.sha256
          )
          readiness_first="$RUNNER_TEMP/language-readiness-artifact/first"
          readiness_replay="$RUNNER_TEMP/language-readiness-artifact/replay"
          mkdir -p "$readiness_first" "$readiness_replay"
          for target in "$readiness_first" "$readiness_replay"; do
            go run ./cmd/language-readiness-witness \
              -root "$GITHUB_WORKSPACE" \
              -input "$first/artifact.json" \
              -proposal-promotion "$RUNNER_TEMP/language-readiness-proposal-promotion-a.json" \
              -guarded-capability "$RUNNER_TEMP/language-readiness-guarded-capability-a.json" \
              -toolchain-use-cases "$usecase_first/artifact.json" \
              -language-syntax-roundtrip "$syntax_first/artifact.json" \
              -language-diagnostic-provenance "$diagnostic_first/artifact.json" \
              -language-package-runtime "$runtime_first/artifact.json" \
              -toolchain-cli "$cli_first/artifact.json" \
              -toolchain-format-fix "$format_fix_first/artifact.json" \
              -expected-sha "$HEAD_SHA" \
              -output "$target/artifact.json"
          done
          cmp -s "$readiness_first/artifact.json" "$readiness_replay/artifact.json"
          go run ./cmd/language-readiness-witness \
            -root "$GITHUB_WORKSPACE" \
            -input "$first/artifact.json" \
            -proposal-promotion "$RUNNER_TEMP/language-readiness-proposal-promotion-a.json" \
            -guarded-capability "$RUNNER_TEMP/language-readiness-guarded-capability-a.json" \
            -toolchain-use-cases "$usecase_first/artifact.json" \
            -language-syntax-roundtrip "$syntax_first/artifact.json" \
            -language-diagnostic-provenance "$diagnostic_first/artifact.json" \
            -language-package-runtime "$runtime_first/artifact.json" \
            -toolchain-cli "$cli_first/artifact.json" \
            -toolchain-format-fix "$format_fix_first/artifact.json" \
            -expected-sha "$HEAD_SHA" \
            -check "$readiness_first/artifact.json"
          (
            cd "$readiness_first"
            sha256sum artifact.json > artifact.json.sha256
          )
          diagnostic_binding_first="$RUNNER_TEMP/language-diagnostic-provenance-readiness-binding/first"
          diagnostic_binding_replay="$RUNNER_TEMP/language-diagnostic-provenance-readiness-binding/replay"
          mkdir -p "$diagnostic_binding_first" "$diagnostic_binding_replay"
          for target in "$diagnostic_binding_first" "$diagnostic_binding_replay"; do
            go run ./cmd/language-diagnostic-provenance-readiness-binding \
              --root "$GITHUB_WORKSPACE" \
              --expected-head "$HEAD_SHA" \
              --concept "$first/artifact.json" \
              --readiness "$readiness_first/artifact.json" \
              --provenance "$diagnostic_first/artifact.json" \
              --output "$target/artifact.json"
          done
          cmp -s "$diagnostic_binding_first/artifact.json" \
            "$diagnostic_binding_replay/artifact.json"
          go run ./cmd/language-diagnostic-provenance-readiness-binding \
            --root "$GITHUB_WORKSPACE" \
            --expected-head "$HEAD_SHA" \
            --concept "$first/artifact.json" \
            --readiness "$readiness_first/artifact.json" \
            --provenance "$diagnostic_first/artifact.json" \
            --check "$diagnostic_binding_first/artifact.json"
          (
            cd "$diagnostic_binding_first"
            sha256sum artifact.json > artifact.json.sha256
          )
          binding_first="$RUNNER_TEMP/language-semantic-readiness-binding/first"
          binding_replay="$RUNNER_TEMP/language-semantic-readiness-binding/replay"
          mkdir -p "$binding_first" "$binding_replay"
          for target in "$binding_first" "$binding_replay"; do
            go run ./cmd/language-semantic-readiness-binding \
              --root "$GITHUB_WORKSPACE" \
              --head "$HEAD_SHA" \
              --readiness "$readiness_first/artifact.json" \
              --concept "$first/artifact.json" \
              --semantic "$semantic_first/artifact.json" \
              --output "$target/artifact.json"
          done
          cmp -s "$binding_first/artifact.json" "$binding_replay/artifact.json"
          go run ./cmd/language-semantic-readiness-binding \
            --root "$GITHUB_WORKSPACE" \
            --head "$HEAD_SHA" \
            --readiness "$readiness_first/artifact.json" \
            --concept "$first/artifact.json" \
            --semantic "$semantic_first/artifact.json" \
            --check "$binding_first/artifact.json"
          (
            cd "$binding_first"
            sha256sum artifact.json > artifact.json.sha256
          )
          query_first="$RUNNER_TEMP/language-deterministic-query/first"
          query_replay="$RUNNER_TEMP/language-deterministic-query/replay"
          mkdir -p "$query_first" "$query_replay"
          for target in "$query_first" "$query_replay"; do
            go run ./cmd/language-deterministic-query-readiness-binding \
              --root "$GITHUB_WORKSPACE" \
              --expected-head "$HEAD_SHA" \
              --readiness "$readiness_first/artifact.json" \
              --concept "$first/artifact.json" \
              --query-output "$target/query/artifact.json" \
              --binding-output "$target/binding/artifact.json"
          done
          cmp -s "$query_first/query/artifact.json" "$query_replay/query/artifact.json"
          cmp -s "$query_first/binding/artifact.json" "$query_replay/binding/artifact.json"
          (
            cd "$query_first/query"
            sha256sum artifact.json > artifact.json.sha256
          )
          (
            cd "$query_first/binding"
            sha256sum artifact.json > artifact.json.sha256
          )
          interop_first="$RUNNER_TEMP/language-go-interoperation/first"
          interop_replay="$RUNNER_TEMP/language-go-interoperation/replay"
          mkdir -p "$interop_first" "$interop_replay"
          for target in "$interop_first" "$interop_replay"; do
            go run ./cmd/language-go-interoperation-readiness-binding \
              --root "$GITHUB_WORKSPACE" \
              --expected-head "$HEAD_SHA" \
              --readiness "$readiness_first/artifact.json" \
              --concept "$first/artifact.json" \
              --interop-output "$target/interop/artifact.json" \
              --binding-output "$target/binding/artifact.json" || {
                printf '%s\n' 'language-go-interoperation artifact:' >&2
                cat "$target/interop/artifact.json" >&2
                printf '%s\n' 'language-go-interoperation binding artifact:' >&2
                cat "$target/binding/artifact.json" >&2
                exit 1
              }
          done
          cmp -s "$interop_first/interop/artifact.json" "$interop_replay/interop/artifact.json"
          cmp -s "$interop_first/binding/artifact.json" "$interop_replay/binding/artifact.json"
          (
            cd "$interop_first/interop"
            sha256sum artifact.json > artifact.json.sha256
          )
          (
            cd "$interop_first/binding"
            sha256sum artifact.json > artifact.json.sha256
          )
          improvement_first="$RUNNER_TEMP/language-readiness-improvement/first"
          improvement_replay="$RUNNER_TEMP/language-readiness-improvement/replay"
          baseline="$RUNNER_TEMP/language-readiness-baseline-a/artifact.json"
          baseline_reference="$RUNNER_TEMP/language-readiness-baseline-reference-a.json"
          mkdir -p "$improvement_first" "$improvement_replay"
          for target in "$improvement_first" "$improvement_replay"; do
            go run ./cmd/language-readiness-witness/transition \
              -root "$GITHUB_WORKSPACE" \
              -before "$baseline" \
              -baseline-reference "$baseline_reference" \
              -after "$readiness_first/artifact.json" \
              -expected-sha "$HEAD_SHA" \
              -output "$target/artifact.json"
          done
          cmp -s "$improvement_first/artifact.json" "$improvement_replay/artifact.json"
          go run ./cmd/language-readiness-witness/transition \
            -root "$GITHUB_WORKSPACE" \
            -before "$baseline" \
            -baseline-reference "$baseline_reference" \
            -after "$readiness_first/artifact.json" \
            -expected-sha "$HEAD_SHA" \
            -check "$improvement_first/artifact.json"
          (
            cd "$improvement_first"
            sha256sum artifact.json > artifact.json.sha256
          )
      - name: Measure exact predecessor bindings
        run: |
          for suffix in a b; do
            go run ./cmd/language-readiness-witness/predecessor-binding \
              --root "$GITHUB_WORKSPACE" \
              --expected-sha "$HEAD_SHA" \
              --output "$RUNNER_TEMP/language-readiness-predecessor-binding-$suffix.json" \
              --check
          done
          cmp "$RUNNER_TEMP/language-readiness-predecessor-binding-a.json" \
            "$RUNNER_TEMP/language-readiness-predecessor-binding-b.json"
      - name: Prove exact predecessor binding transition
        run: |
          for suffix in a b; do
            go run ./cmd/language-readiness-witness/predecessor-binding/transition \
              --root "$GITHUB_WORKSPACE" \
              --before "$RUNNER_TEMP/language-readiness-binding-baseline-a.json" \
              --after "$RUNNER_TEMP/language-readiness-predecessor-binding-a.json" \
              --expected-sha "$HEAD_SHA" \
              --output "$RUNNER_TEMP/language-readiness-predecessor-binding-transition-$suffix.json"
          done
          cmp "$RUNNER_TEMP/language-readiness-predecessor-binding-transition-a.json" \
            "$RUNNER_TEMP/language-readiness-predecessor-binding-transition-b.json"
          go run ./cmd/language-readiness-witness/predecessor-binding/transition \
            --root "$GITHUB_WORKSPACE" \
            --before "$RUNNER_TEMP/language-readiness-binding-baseline-a.json" \
            --after "$RUNNER_TEMP/language-readiness-predecessor-binding-a.json" \
            --expected-sha "$HEAD_SHA" \
            --check "$RUNNER_TEMP/language-readiness-predecessor-binding-transition-a.json"
      - name: Upload exact-head predecessor binding transition
        uses: actions/upload-artifact@v6
        with:
          name: language-readiness-predecessor-binding-transition-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/language-readiness-predecessor-binding-transition-a.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload exact-head predecessor bindings
        uses: actions/upload-artifact@v6
        with:
          name: language-readiness-predecessor-binding-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/language-readiness-predecessor-binding-a.json*
          if-no-files-found: error
          retention-days: 14
      - name: Upload exact-head language concepts
        uses: actions/upload-artifact@v6
        with:
          name: language-concept-artifact-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/language-concept-artifact/first
