name: Artifact resolution experiment

on:
  pull_request:
    branches: [dev]
    paths:
      - "cmd/gooo/**"
      - "cmd/artifact-resolution-experiment/**"
      - "internal/packageruntime/artifactemit/**"
      - "internal/meta/artifactresolutionexperiment/**"
      - "examples/billing-package/**"
      - "scripts/artifact-resolution-experiment/**"
      - ".github/workflows/artifact-resolution-experiment.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: artifact-resolution-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  resolution:
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: local
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v7
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false
      - name: Set up exact Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          cache: true
      - name: Observe fixed reader resolutions
        run: bash scripts/artifact-resolution-experiment/main.sh
      - name: Upload resolution receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: artifact-resolution-experiment-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/artifact-resolution-experiment
          if-no-files-found: error
          retention-days: 30
