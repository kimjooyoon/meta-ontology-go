name: External ecosystem execution

on:
  pull_request:
    branches: [dev]
    paths:
      - "internal/meta/externalecosystemexecution/**"
      - "cmd/external-ecosystem-execution-witness/**"
      - "examples/external-ecosystem-execution/**"
      - "internal/verify/scope_external_ecosystem_execution.go"
      - ".github/workflows/external-ecosystem-execution.yml"
  push:
    branches: [dev]
    paths:
      - "internal/meta/externalecosystemexecution/**"
      - "cmd/external-ecosystem-execution-witness/**"
      - "examples/external-ecosystem-execution/**"
      - "internal/verify/scope_external_ecosystem_execution.go"
      - ".github/workflows/external-ecosystem-execution.yml"

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
      GOWORK: "off"
      GOFLAGS: -mod=readonly
    steps:
      - name: Checkout Gooo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: gooo

      - name: Checkout pinned gomacro
        uses: actions/checkout@v4
        with:
          repository: cosmos72/gomacro
          ref: cf0d4bf32da393dbda97e3572f216731013ffa55
          fetch-depth: 1
          path: gomacro

      - name: Set up exact Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.0
          cache: false

      - name: Allocate isolated caches
        run: |
          printf 'GOCACHE=%s\n' "$RUNNER_TEMP/go-build" >> "$GITHUB_ENV"
          printf 'GOMODCACHE=%s\n' "$RUNNER_TEMP/go-mod" >> "$GITHUB_ENV"

      - name: Conform with Go 1.27 tools
        working-directory: gooo
        run: |
          test -z "$(git status --porcelain --untracked-files=all)"
          go fix ./internal/meta/externalecosystemexecution ./cmd/external-ecosystem-execution-witness
          find internal/meta/externalecosystemexecution cmd/external-ecosystem-execution-witness -name '*.go' -type f -print0 | xargs -0 gofmt -w
          git diff --binary > "$RUNNER_TEMP/go-1.27-tools.patch"
          if test -s "$RUNNER_TEMP/go-1.27-tools.patch"; then
            git diff --stat
            exit 1
          fi

      - name: Upload Go 1.27 correction
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: go-1.27-tool-correction-${{ github.run_id }}
          path: ${{ runner.temp }}/go-1.27-tools.patch
          if-no-files-found: ignore
          retention-days: 7

      - name: Run fixed conformance tests
        working-directory: gooo
        run: |
          go test -count=1 ./internal/meta/externalecosystemexecution ./cmd/external-ecosystem-execution-witness
          go test -count=1 ./internal/verify

      - name: Observe twice and replay
        working-directory: gooo
        run: |
          result="$RUNNER_TEMP/external-ecosystem-execution"
          mkdir -p "$result"
          go run ./cmd/external-ecosystem-execution-witness \
            --mode observe \
            --source-root "$GITHUB_WORKSPACE/gooo" \
            --external-root "$GITHUB_WORKSPACE/gomacro" \
            --observation "$result/observation.json" \
            --report "$result/report.json" \
            --suite "$result/suite.json"
          go run ./cmd/external-ecosystem-execution-witness \
            --mode replay \
            --observation "$result/observation.json" \
            --report "$result/replay-report.json" \
            --suite "$result/replay-suite.json"
          cmp "$result/report.json" "$result/replay-report.json"
          cmp "$result/suite.json" "$result/replay-suite.json"

      - name: Assert exact metrics
        run: |
          result="$RUNNER_TEMP/external-ecosystem-execution"
          jq -e '.decision == "EXECUTION_CONFIRMED" and .resolution == "EXACT"' "$result/report.json"
          jq -e '.completed == 8 and .total == 8 and .basis_points == 10000' "$result/report.json"
          jq -e '.unknown_indicators == 0 and .external_executions == 2' "$result/report.json"
          jq -e '.repository_writes == 0 and .official_mutation_count == 0 and .promotion_count == 0' "$result/report.json"
          jq -e '(.indicators | length) == 8 and ([.indicators[].status] | all(. == "SATISFIED"))' "$result/report.json"
          jq -e '(.proofs | length) == 3 and ([.proofs[].status] | all(. == "SATISFIED"))' "$result/report.json"
          jq -e '.passed == 10 and .total == 10 and .unresolved == 0' "$result/suite.json"
          jq -e '.unknown_expected == 3 and .invariant_expected == 6' "$result/suite.json"
          jq -e '.reference.binding_exact == true and (.runs | length) == 2' "$result/observation.json"
          jq -e '([.runs[].passed] | all(. == true)) and .official_mutation_count == 0 and .promotion_count == 0' "$result/observation.json"

      - name: Seal evidence
        run: |
          result="$RUNNER_TEMP/external-ecosystem-execution"
          cd "$result"
          sha256sum observation.json report.json suite.json replay-report.json replay-suite.json > SHA256SUMS

      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-ecosystem-execution-${{ github.run_id }}
          path: ${{ runner.temp }}/external-ecosystem-execution
          if-no-files-found: error
          retention-days: 30
