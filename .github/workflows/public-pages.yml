name: Public Pages presentation

on:
  push:
    branches: [dev]
    paths:
      - 'site/index.html'
      - '.github/workflows/public-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/dev'
    name: Stage public Pages artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out exact dev commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Stage explicit public file allowlist
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          source="$GITHUB_WORKSPACE/site/index.html"
          stage="$RUNNER_TEMP/public-pages"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -f "$source"
          install -d "$stage"
          install -m 0644 "$source" "$stage/index.html"
          file_count="$(find "$stage" -maxdepth 1 -type f -name 'index.html' -print | wc -l | tr -d '[:space:]')"
          bytes="$(wc -c < "$stage/index.html" | tr -d '[:space:]')"
          test "$file_count" = "1"
          test "$bytes" -gt 0
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            echo "### Public Pages presentation"
            echo "- source commit: `$EXPECTED_SHA`"
            echo "- published files: `$file_count`"
            echo "- published bytes: `$bytes`"
            echo "- native run: $run_url"
            echo "- exact snapshot: no; moving dev/workflow/release links are navigation only"
            echo "- execution: static staging only; Go/compiler/test/metric/release operations: 0"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload explicit Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ runner.temp }}/public-pages
          retention-days: 1

  deploy:
    if: github.ref == 'refs/heads/dev'
    name: Deploy public Pages artifact
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
