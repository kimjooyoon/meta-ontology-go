name: Causal CI selection

on:
  pull_request:
    branches: [dev]
    paths:
      - .github/agent-scope-table.md
      - .github/ci-governance.json
      - .github/workflows/causal-ci-selection.yml
      - docs/causal-ci-selection.md
      - examples/causal-ci-selection/**
      - internal/meta/causalci/**
      - internal/verify/scope_luna_meta_09.go
      - scripts/causal-ci-selection/**
  push:
    branches: [dev]
    paths:
      - .github/agent-scope-table.md
      - .github/ci-governance.json
      - .github/workflows/causal-ci-selection.yml
      - docs/causal-ci-selection.md
      - examples/causal-ci-selection/**
      - internal/meta/causalci/**
      - internal/verify/scope_luna_meta_09.go
      - scripts/causal-ci-selection/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  causal-selection:
    name: Causal CI selection receipt
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      SOURCE_PATH: examples/causal-ci-selection/main.gooo
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.0
          cache: false
      - name: Bind Go 1.27 and validate the real Gooo source
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = "go1.27.0"
          go run ./cmd/gooo check "$SOURCE_PATH"
      - name: Compile the producer and independent consumer in CI
        run: |
          set -euo pipefail
          go test ./internal/meta/causalci ./internal/meta/causalci/consumer
      - name: Observe the PR diff before the isolated plan operation
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/causal-ci-selection"
          git status --porcelain=v1 > "$RUNNER_TEMP/causal-ci-selection/status-before.txt"
          cp "$RUNNER_TEMP/causal-ci-selection/status-before.txt" "$RUNNER_TEMP/causal-ci-selection/status-before-observe.txt"
          go run ./scripts/causal-ci-selection \
            -mode observe -base-sha "$BASE_SHA" -head-sha "$HEAD_SHA" -source "$SOURCE_PATH" \
            -before-status "$RUNNER_TEMP/causal-ci-selection/status-before.txt" \
            -after-status "$RUNNER_TEMP/causal-ci-selection/status-before-observe.txt" \
            -prior-claims examples/causal-ci-selection/prior-claims.json \
            -output "$RUNNER_TEMP/causal-ci-selection/observation-provisional.json"
      - name: Produce the plan and capture the after-isolation observation
        run: |
          set -euo pipefail
          go run ./scripts/causal-ci-selection \
            -mode produce -input "$RUNNER_TEMP/causal-ci-selection/observation-provisional.json" \
            -source "$SOURCE_PATH" -output "$RUNNER_TEMP/causal-ci-selection/receipt-provisional.json" -check
          git status --porcelain=v1 > "$RUNNER_TEMP/causal-ci-selection/status-after.txt"
          go run ./scripts/causal-ci-selection \
            -mode observe -base-sha "$BASE_SHA" -head-sha "$HEAD_SHA" -source "$SOURCE_PATH" \
            -before-status "$RUNNER_TEMP/causal-ci-selection/status-before.txt" \
            -after-status "$RUNNER_TEMP/causal-ci-selection/status-after.txt" \
            -prior-claims examples/causal-ci-selection/prior-claims.json \
            -output "$RUNNER_TEMP/causal-ci-selection/observation.json"
          go run ./scripts/causal-ci-selection \
            -mode produce -input "$RUNNER_TEMP/causal-ci-selection/observation.json" \
            -source "$SOURCE_PATH" -output "$RUNNER_TEMP/causal-ci-selection/receipt.json" -check
      - name: Replay the receipt with the independent consumer
        run: |
          set -euo pipefail
          go run ./scripts/causal-ci-selection \
            -mode verify -input "$RUNNER_TEMP/causal-ci-selection/observation.json" \
            -source "$SOURCE_PATH" -receipt "$RUNNER_TEMP/causal-ci-selection/receipt.json"
      - name: Run semantic and nonsemantic intervention artifacts
        run: |
          set -euo pipefail
          go run ./scripts/causal-ci-selection \
            -mode interventions -input "$RUNNER_TEMP/causal-ci-selection/observation.json" \
            -source "$SOURCE_PATH" \
            -semantic-source examples/causal-ci-selection/semantic-intervention.gooo \
            -nonsemantic-source examples/causal-ci-selection/nonsemantic-intervention.gooo \
            -contradiction-source examples/causal-ci-selection/contradiction-intervention.gooo \
            -output "$RUNNER_TEMP/causal-ci-selection/interventions.json" -check
      - name: Assert raw observation, dynamic changed-file counts, and causal contracts
        shell: bash
        run: |
          set -euo pipefail
          observation="$RUNNER_TEMP/causal-ci-selection/observation.json"
          receipt="$RUNNER_TEMP/causal-ci-selection/receipt.json"
          interventions="$RUNNER_TEMP/causal-ci-selection/interventions.json"
          test "$(jq -r 'has("decision") or has("known") or has("selected_checks") or has("reason")' "$observation")" = "false"
          changed_count="$(jq '.changed_files | length' "$observation")"
          test "$changed_count" -gt 0
          jq -e --arg source "$SOURCE_PATH" --argjson changed "$changed_count" '
            .schema == "gooo/causal-ci-selection-receipt/v2" and
            .scope == "READ_ONLY_CAUSAL_SELECTION" and
            .execution_mode == "PLAN_ONLY" and
            .conformance.decision == "PASS" and
            .source.parsed_digest != "" and .source.semantic_digest != "" and
            .metrics.changed_file_numerator == $changed and
            .metrics.changed_file_denominator == $changed and
            .metrics.subject_total == $changed and
            .metrics.full_suite_check_denominator == 6 and
            .metrics.source_reconstruction_numerator == 1 and
            .metrics.source_reconstruction_denominator == 1 and
            .operation.repository_writes == 0 and
            .operation.read_only == true and .operation.mutation_authority == false and
            .independent_verifier.mode == "INDEPENDENT_RECONSTRUCTION" and
            ([.indicators[].satisfied] | all) and
            ([.subjects[] | select(.path == $source)][0].resolution == "SELECTED") and
            ([.subjects[] | select(.path == $source)][0].selected_checks[0].check_id == "go-test") and
            (.metrics.unknown_subject_total >= 1) and
            ([.claim_transitions[] | select(.subject_path == $source)][0].after == "DISCHARGED") and
            ([.subjects[] | select(.resolution == "UNKNOWN")][0].coordinate == {stage:"CAUSAL_SELECTION",step:"descend-full-suite",reason:"SOURCE_NOT_BOUND_TO_POLICY"}) and
            ([.subjects[] | select(.resolution == "UNKNOWN")][0].unknown_causes[0].coordinate == {stage:"CAUSAL_SELECTION",step:"observe-subject",reason:"SOURCE_NOT_BOUND_TO_POLICY"}) and
            ([.subjects[] | select(.resolution == "UNKNOWN") | .selected_checks | length] | all(. == 6))
          ' "$receipt"
          jq -e '
            .schema == "gooo/causal-ci-selection-intervention/v1" and
            .source_reconstruction_numerator == 4 and .source_reconstruction_denominator == 4 and
            .base.source.raw_digest != .semantic.source.raw_digest and
            .base.source.semantic_digest != .semantic.source.semantic_digest and
            .base.source.parsed_digest != .semantic.source.parsed_digest and
            .base.plan_digest != .semantic.plan_digest and
            .base.source.raw_digest != .nonsemantic.source.raw_digest and
            .base.source.parsed_digest == .nonsemantic.source.parsed_digest and
            .base.source.semantic_digest == .nonsemantic.source.semantic_digest and
            .base.plan_digest == .nonsemantic.plan_digest and
            .contradiction.conformance.decision == "FAIL_CLOSED" and
            ([.contradiction.claim_transitions[].after] | any(. == "REFUTED"))
          ' "$interventions"
          consumer_imports="$(rg -n 'internal/meta/causalci"' internal/meta/causalci/consumer --glob '*.go' || true)"
          test -z "$consumer_imports"
          jq -n '{schema:"gooo/causal-ci-selection-import-audit/v1", producer_import_numerator:0, producer_import_denominator:1, source:"CI static import audit"}' > "$RUNNER_TEMP/causal-ci-selection/producer-import-audit.json"
          {
            echo '### Causal CI selection'
            echo "- changed-file observation: ${changed_count}/${changed_count}"
            echo '- source reconstruction: `1/1` (base receipt), interventions `4/4`'
            echo '- fixed full-suite denominator: `6` checks'
            echo '- subject resolutions: selected / unknown / fail-closed are computed from the raw PR diff'
            echo '- source subject: `SELECTED`, `go-test`; unknown subjects descend to `6/6`'
            echo '- claim transition: source subject `OPEN -> DISCHARGED`; unknown subjects preserve `OPEN` at lower resolution'
            echo '- semantic intervention: raw/parsed/semantic/plan digests change'
            echo '- nonsemantic intervention: raw digest changes; parsed/semantic/plan digests are preserved'
            echo '- contradiction intervention: `FAIL_CLOSED`, `OPEN -> REFUTED`'
            echo '- producer imports in independent consumer: `0/1`'
            echo '- execution claim: `PLAN_ONLY`; repository writes / mutation authority: `0 / false`'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload raw observation, plan receipt, and intervention report
        uses: actions/upload-artifact@v4
        with:
          name: causal-ci-selection-${{ env.HEAD_SHA }}
          path: |
            ${{ runner.temp }}/causal-ci-selection/observation.json
            ${{ runner.temp }}/causal-ci-selection/receipt.json
            ${{ runner.temp }}/causal-ci-selection/interventions.json
            ${{ runner.temp }}/causal-ci-selection/producer-import-audit.json
          if-no-files-found: error
          retention-days: 14
