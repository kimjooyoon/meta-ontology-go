name: ADK Go bridge

on:
  workflow_dispatch:
  pull_request:
    branches: [dev]
    paths:
      - integrations/adk-go/**
      - cmd/gooo/**
      - internal/**
      - go.mod
      - go.sum
      - .github/workflows/adk-go-bridge.yml
  push:
    branches: [dev, main]
    paths:
      - integrations/adk-go/**
      - cmd/gooo/**
      - internal/**
      - go.mod
      - go.sum
      - .github/workflows/adk-go-bridge.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: integrations/adk-go/go.mod
          cache-dependency-path: integrations/adk-go/go.sum
      - name: Build current Gooo CLI for bridge parity
        run: go build -o "$RUNNER_TEMP/gooo" ./cmd/gooo
      - name: Check optional ADK bridge
        working-directory: integrations/adk-go
        env:
          GOOO_ADK_TEST_BINARY: ${{ runner.temp }}/gooo
        run: |
          go test ./...
          go vet ./...
      - name: Observe ADK boundary benchmarks
        if: github.event_name == 'workflow_dispatch'
        working-directory: integrations/adk-go
        run: |
          go version > "$RUNNER_TEMP/adk-bench.txt"
          go test -run '^$' -bench '^Benchmark(Bridge|Direct)' -benchmem -count=1 ./... >> "$RUNNER_TEMP/adk-bench.txt"
      - name: Preserve raw benchmark output
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: adk-boundary-bench-${{ github.sha }}
          path: ${{ runner.temp }}/adk-bench.txt
