name: Self-improvement contract

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    name: Self-improvement contract
    runs-on: ubuntu-latest
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          cache: false

      - name: Require exact Go toolchain
        run: test "$(go env GOVERSION)" = "go1.27.0"

      - name: Compile and replay the Gooo meta-contract
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/self-improvement-contract"
          mkdir -p "$output"
          for pass in first second; do
            go run ./scripts/self-improvement-contract \
              -contract examples/self-improvement/main.gooo \
              -commit "$HEAD_SHA" \
              -output "$output/$pass.json"
          done
          cmp "$output/first.json" "$output/second.json"
          test "$(jq -r .status "$output/first.json")" = PASS

      - name: Upload exact-head self-improvement contract
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: self-improvement-contract-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/self-improvement-contract/first.json
          if-no-files-found: error

  assurance:
    name: Language assurance kernel
    runs-on: ubuntu-latest
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          cache: false

      - name: Require exact Go toolchain
        run: test "$(go env GOVERSION)" = "go1.27.0"

      - name: Require Go 1.27 fixes to be already applied
        run: go fix -diff ./internal/meta/languageassurance ./cmd/language-assurance-witness ./cmd/language-assurance-witness/reconstructor

      - name: Run assurance regressions
        run: go test ./internal/meta/languageassurance ./cmd/language-assurance-witness ./cmd/language-assurance-witness/reconstructor

      - name: Require evaluator-independent reconstruction imports
        shell: bash
        run: |
          set -euo pipefail
          if go list -deps ./cmd/language-assurance-witness/reconstructor | grep -Fxq 'github.com/kimjooyoon/meta-ontology-go/internal/meta/languageassurance'; then
            echo 'raw reconstructor imports the subject evaluator' >&2
            exit 1
          fi

      - name: Execute and replay six assurance use cases
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/language-assurance"
          mkdir -p "$output/first/raw" "$output/first/receipts" "$output/replay/receipts" "$output/runtime"
          declare -A expected=(
            [independent]=ALLOW_LIMITED
            [self-minting]=BLOCK
            [role-conflict]=BLOCK
            [unknown-laundering]=FAIL_CLOSED
                      [snapshot-mismatch]=BLOCK
                      [raw-reconstruction-mismatch]=BLOCK
                    )
                    for fixture in independent self-minting role-conflict unknown-laundering snapshot-mismatch raw-reconstruction-mismatch; do
            jq --arg sha "$HEAD_SHA" --arg fixture "$fixture" '
              .snapshot_bindings = [
                {"evidence_id":"authority_routes","subject_sha":$sha},
                {"evidence_id":"role_bindings","subject_sha":$sha},
                {"evidence_id":"decision_transitions","subject_sha":$sha}
              ] |
              if $fixture == "snapshot-mismatch" then
                .snapshot_bindings[2].subject_sha = "0000000000000000000000000000000000000000"
              else . end
                      ' "examples/language-assurance-kernel/$fixture.json" > "$output/first/raw/$fixture.json"
                      for pass in first replay; do
                        go run ./cmd/language-assurance-witness/reconstructor \
                          -root "$GITHUB_WORKSPACE" \
                          -subject-sha "$HEAD_SHA" \
                          -input "$output/first/raw/$fixture.json" \
                          -output "$output/$pass/receipts/$fixture.json"
                      done
                      cmp "$output/first/receipts/$fixture.json" "$output/replay/receipts/$fixture.json"
                      jq --slurpfile receipt "$output/first/receipts/$fixture.json" --arg fixture "$fixture" '
                        .raw_reconstructions = [$receipt[0]] |
                        if $fixture == "raw-reconstruction-mismatch" then
                          .raw_reconstructions[0].observation.candidate_decision = "BLOCK"
                        else . end
                      ' "$output/first/raw/$fixture.json" > "$output/runtime/$fixture.json"
                      for pass in first replay; do
              go run ./cmd/language-assurance-witness \
                -root "$GITHUB_WORKSPACE" \
                -subject-sha "$HEAD_SHA" \
                -input "$output/runtime/$fixture.json" \
                -output "$output/$pass/$fixture.json" \
                -expect-candidate "${expected[$fixture]}"
            done
            cmp "$output/first/$fixture.json" "$output/replay/$fixture.json"
          done
          jq -e '
            .assurance_decision == "PARTIAL" and
            .candidate_decision == "ALLOW_LIMITED" and
            .summary.denominator_total == 12 and
                      .summary.operating == 6 and
                      .summary.not_implemented == 6 and
                      .summary.implementation_coverage_bps == 5000 and
            .summary.snapshot_bindings_observed == 3 and
            .summary.snapshot_bindings_required == 3 and
            .summary.exact_snapshot_binding_bps == 10000 and
                      .summary.snapshot_mismatch_paths == 0 and
                      .summary.raw_reconstructions_observed == 1 and
                      .summary.raw_reconstructions_required == 1 and
                      .summary.raw_reconstruction_bps == 10000 and
                      .summary.raw_reconstruction_mismatch_paths == 0 and
            .summary.self_minting_paths == 0 and
            .summary.role_conflict_paths == 0 and
            .summary.unknown_laundering_paths == 0 and
            ([.indicators[] | select(.class == "OUTCOME")] | length) == 1 and
                      ([.indicators[] | select(.class == "DRIVER")] | length) == 3 and
            ([.indicators[] | select(.class == "GUARDRAIL")] | length) == 4
          ' "$output/first/independent.json"
          jq -e '.candidate_decision == "BLOCK" and .summary.self_minting_paths == 1' "$output/first/self-minting.json"
          jq -e '.candidate_decision == "BLOCK" and .summary.role_conflict_paths == 1' "$output/first/role-conflict.json"
          jq -e '
            .candidate_decision == "FAIL_CLOSED" and
            .candidate_reason == "ASSURANCE_TOP_DECISION_UNKNOWN" and
            .summary.unknown_laundering_paths == 1 and
            .summary.unknown_top_decisions == 1
          ' "$output/first/unknown-laundering.json"
          jq -e '
            .candidate_decision == "BLOCK" and
            .candidate_reason == "ASSURANCE_SNAPSHOT_BINDING_MISMATCH" and
            .candidate_resolution == "EXACT" and
            .summary.exact_snapshot_binding_bps == 6666 and
            .summary.snapshot_mismatch_paths == 1
                    ' "$output/first/snapshot-mismatch.json"
                    jq -e '
                      .candidate_decision == "BLOCK" and
                      .candidate_reason == "ASSURANCE_RAW_RECONSTRUCTION_MISMATCH" and
                      .candidate_resolution == "EXACT" and
                      .summary.raw_reconstruction_bps == 0 and
                      .summary.raw_reconstruction_mismatch_paths == 1
                    ' "$output/first/raw-reconstruction-mismatch.json"
                    (cd "$output/first" && find . -type f -name '*.json' -print0 | sort -z | xargs -0 sha256sum > manifest.sha256)

      - name: Upload exact-head language assurance reports
        uses: actions/upload-artifact@v6
        with:
          name: language-assurance-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/language-assurance/first
          if-no-files-found: error
          retention-days: 30

  source-authority-shadow:
    name: Source authority shadow
    runs-on: ubuntu-latest
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          cache: false

      - name: Require exact Go toolchain
        run: test "$(go env GOVERSION)" = "go1.27.0"

      - name: Require Go 1.27 fixes to be already applied
        run: go fix -diff ./internal/meta/languageassurance/sourceauthorityeval ./internal/meta/languageassurance/sourceauthorityshadow ./cmd/source-authority-shadow-witness

      - name: Run source authority shadow regressions
        run: go test ./internal/meta/languageassurance/sourceauthorityeval ./internal/meta/languageassurance/sourceauthorityshadow ./cmd/source-authority-shadow-witness

      - name: Bind exact-head pinned source input
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/source-authority-shadow"
          mkdir -p "$output"
          jq --arg sha "$HEAD_SHA" '.subject_sha = $sha' \
            examples/language-assurance-kernel/source-authority-shadow.json > "$output/input.json"

      - name: Execute and replay source authority shadow
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/source-authority-shadow"
          for pass in first replay; do
            go run ./cmd/source-authority-shadow-witness \
              -root "$GITHUB_WORKSPACE" \
              -input "$output/input.json" \
              -output "$output/$pass.json" \
              -expected-sha "$HEAD_SHA" \
              -check
          done
          cmp "$output/first.json" "$output/replay.json"
          jq -e --arg sha "$HEAD_SHA" '
            .schema == "gooo/source-backed-authority-shadow-receipt/v1" and
            .mode == "SHADOW" and .expected_sha == $sha and .subject_sha == $sha and
            .observation == "SATISFIED" and .resolution == "EXACT" and
            .enforcement == "ALLOW" and .gate_effect == "NO_EFFECT" and
            .promotion_credit_bps == 0 and .repository_writes == 0 and
            .evaluation.summary.accepted_facts == 1 and
            .evaluation.summary.backed_facts == 1 and
            .evaluation.summary.coverage_bps == 10000 and
            (.evaluation.receipts | length) == 1 and
            ([.indicators[] | select(.class == "OUTCOME")] | length) == 1 and
            ([.indicators[] | select(.class == "DRIVER")] | length) == 2 and
            ([.indicators[] | select(.class == "GUARDRAIL")] | length) == 3
          ' "$output/first.json"
          (cd "$output" && sha256sum input.json first.json > manifest.sha256)

      - name: Upload exact-head source authority shadow receipt
        uses: actions/upload-artifact@v6
        with:
          name: source-authority-shadow-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/source-authority-shadow
          if-no-files-found: error
          retention-days: 30

  write-set-exactness:
    name: Write-set exactness
    runs-on: ubuntu-latest
    env:
      EXACT_SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
      - name: Check generated assurance bindings
        run: go run ./cmd/language-assurance-witness/assurance-generator --check
      - name: Produce exact, changed, and mismatch receipts
        shell: bash
        run: |
          set -euo pipefail
          receipt_dir="${RUNNER_TEMP}/write-set-receipts"
          sandbox="${RUNNER_TEMP}/write-set-sandbox"
          mkdir -p "${receipt_dir}" "${sandbox}"
          denominator='sha256:e5b266ceeaeb0757a40096fb661982a263370b1e08945dfedbe34f96eb237a02'
          go run ./cmd/language-assurance-witness/write-set-observer snapshot --root internal/meta/languageassurance --output "${receipt_dir}/kernel-before.json"
          go test ./internal/meta/languageassurance
          go run ./cmd/language-assurance-witness/write-set-observer snapshot --root internal/meta/languageassurance --output "${receipt_dir}/kernel-after.json"
          go run ./cmd/language-assurance-witness/write-set-observer compare --before "${receipt_dir}/kernel-before.json" --after "${receipt_dir}/kernel-after.json" --output "${receipt_dir}/kernel-exact.json" --expect PASS --subject-sha "${EXACT_SUBJECT_SHA}" --denominator-digest "${denominator}"
          printf 'before\n' > "${sandbox}/value.txt"
          go run ./cmd/language-assurance-witness/write-set-observer snapshot --root "${sandbox}" --output "${receipt_dir}/sandbox-before.json"
          printf 'after\n' > "${sandbox}/value.txt"
          go run ./cmd/language-assurance-witness/write-set-observer snapshot --root "${sandbox}" --output "${receipt_dir}/sandbox-after.json"
          go run ./cmd/language-assurance-witness/write-set-observer compare --before "${receipt_dir}/sandbox-before.json" --after "${receipt_dir}/sandbox-after.json" --declared value.txt --output "${receipt_dir}/declared-exact.json" --expect PASS --subject-sha "${EXACT_SUBJECT_SHA}" --denominator-digest "${denominator}"
          go run ./cmd/language-assurance-witness/write-set-observer compare --before "${receipt_dir}/sandbox-before.json" --after "${receipt_dir}/sandbox-after.json" --output "${receipt_dir}/undeclared-mismatch.json" --expect BLOCK --subject-sha "${EXACT_SUBJECT_SHA}" --denominator-digest "${denominator}"
      - name: Upload write-set receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: write-set-exactness-${{ env.EXACT_SUBJECT_SHA }}
          path: ${{ runner.temp }}/write-set-receipts
          if-no-files-found: error

  source-authority-upstream:
    name: Source authority upstream
    runs-on: ubuntu-latest
    env:
      EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out the exact source identity
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ env.EXACT_SHA }}

      - name: Install Go 1.27
        uses: actions/setup-go@v6
        with:
          go-version: 1.27.0
          cache: false

      - name: Materialize and activate the logical workspace
        id: materialize
        uses: ./.github/actions/materialize
        with:
          expected-sha: ${{ env.EXACT_SHA }}

      - name: Check Go 1.27 fixes
        run: |
          fix_diff="$(go fix -diff ./internal/meta/languageassurance/sourceauthorityupstream ./cmd/source-authority-upstream-witness)"
          test -z "$fix_diff" || { printf '%s\n' "$fix_diff"; exit 1; }

      - name: Test upstream producer
        run: go test ./internal/meta/languageassurance/sourceauthorityupstream ./cmd/source-authority-upstream-witness

      - name: Observe immutable upstream twice
        run: |
          mkdir -p "$RUNNER_TEMP/source-authority-upstream"
          go run ./cmd/source-authority-upstream-witness \
            --expected-sha "$EXACT_SHA" \
            --output-dir "$RUNNER_TEMP/source-authority-upstream/first"
          go run ./cmd/source-authority-upstream-witness \
            --expected-sha "$EXACT_SHA" \
            --output-dir "$RUNNER_TEMP/source-authority-upstream/replay"
          cmp "$RUNNER_TEMP/source-authority-upstream/first/manifest.sha256" \
            "$RUNNER_TEMP/source-authority-upstream/replay/manifest.sha256"

      - name: Verify fixed upstream denominator
        run: |
          suite="$RUNNER_TEMP/source-authority-upstream/first/suite.json"
          jq -e --arg sha "$EXACT_SHA" '
            .schema == "gooo/upstream-source-conformance/v1" and
            .subject_sha == $sha and
            .denominator_id == "gooo/upstream-source-conformance-denominator/v1" and
            .decision == "PASS" and .resolution == "EXACT" and
            .summary.cases_total == 3 and .summary.cases_passed == 3 and
            .summary.exact_allow == 1 and .summary.fail_closed == 2 and
            .summary.coverage_bps == 10000 and
            .repository_writes == 0 and .promotion_credit_bps == 0
          ' "$suite"
          jq -e '
            .observation == "SATISFIED" and .resolution == "EXACT" and .enforcement == "ALLOW" and
            .snapshot.digest == "sha256:29362aa311de0f24c66f41cc65a8b6ffd996baf37e048b5a72db63172aae5bf2" and
            .snapshot.bytes == 77 and
            ([.indicators[] | select(.class == "OUTCOME")] | length) == 1 and
            ([.indicators[] | select(.class == "DRIVER")] | length) == 2 and
            ([.indicators[] | select(.class == "GUARDRAIL")] | length) == 3 and
            ([.indicators[] | select(.satisfied == true)] | length) == 6
          ' "$RUNNER_TEMP/source-authority-upstream/first/exact.json"
          jq -e '.observation == "UNKNOWN" and .resolution == "INVARIANT_ONLY" and .enforcement == "BLOCK" and .reason == "SOURCE_DIGEST_MISMATCH"' \
            "$RUNNER_TEMP/source-authority-upstream/first/digest-mismatch.json"
          jq -e '.observation == "UNKNOWN" and .resolution == "INVARIANT_ONLY" and .enforcement == "BLOCK" and .reason == "AUTHORITY_SCOPE_MISMATCH" and .snapshot == null' \
            "$RUNNER_TEMP/source-authority-upstream/first/authority-mismatch.json"

      - name: Upload exact upstream receipts
        uses: actions/upload-artifact@v6
        with:
          name: source-authority-upstream-${{ env.EXACT_SHA }}
          path: ${{ runner.temp }}/source-authority-upstream
          if-no-files-found: error
          retention-days: 14
