          jq -e '.decision == "FAIL_CLOSED" and .resolution == "INVARIANT_ONLY" and .reason == "CHANGED_SURFACE_RECEIPT_ACTIVATION_CAPSULE_DIGEST_MISMATCH" and .transition_applied == 0 and .repository_writes == 0' "$out/digest-mismatch.json"
          jq -e '([.indicators[] | select(.class == "OUTCOME")] | length) == 1 and ([.indicators[] | select(.class == "DRIVER")] | length) == 2 and ([.indicators[] | select(.class == "GUARDRAIL")] | length) == 3 and ([.indicators[] | select(.proof_choice == "FOUNDATION")] | length) == 3 and ([.indicators[] | select(.proof_choice == "COHERENCE")] | length) == 2 and ([.indicators[] | select(.proof_choice == "REGRESSION")] | length) == 1 and ([.indicators[] | select(.satisfied == true)] | length) == 6' "$out/exact.json"
          jq -e '.summary.denominator_total == 12 and .summary.operating == 12 and .summary.not_implemented == 0 and .summary.implementation_coverage_bps == 10000 and ([.obligations[] | select(.metric_id == "gooo.metric.semantic.changed-surface-receipt-totality.v1" and .status == "OPERATING" and .resolution == "EXACT" and .meta_operation == "totalize-changed-surface-receipts")] | length) == 1' "$RUNNER_TEMP/language-assurance/independent.json"
          sha256sum "$out/exact.json" "$out/unavailable.json" "$out/digest-mismatch.json" > "$out/manifest.sha256"
      - name: Upload changed surface receipt activation receipts
        uses: actions/upload-artifact@v6
        with:
          name: changed-surface-receipt-activation-${{ env.SUBJECT_SHA }}
          path: ${{ runner.temp }}/changed-surface-receipt-activation
          if-no-files-found: error

  rollback-integrity-shadow:
    name: Rollback integrity shadow
    needs: [assurance]
    if: ${{ always() && needs.assurance.result == 'success' }}
    runs-on: ubuntu-24.04
    env:
      SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Download current official assurance
        uses: actions/download-artifact@v6
        with:
          name: language-assurance-${{ env.SUBJECT_SHA }}
          path: ${{ runner.temp }}/rollback-integrity/assurance
      - name: Require Go 1.27 fixes and rollback shadow regressions
        shell: bash
        run: |
          set -euo pipefail
          go fix ./internal/meta/languageassurance/rollbackintegrityshadow ./cmd/rollback-integrity-shadow-witness
          test -z "$(git status --porcelain)"
          test -z "$(gofmt -l internal/meta/languageassurance/rollbackintegrityshadow cmd/rollback-integrity-shadow-witness)"
          go test ./internal/meta/languageassurance/rollbackintegrityshadow ./cmd/rollback-integrity-shadow-witness
      - name: Interpret existing rollback meta reports
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/rollback-integrity/shadow"
          assurance="$RUNNER_TEMP/rollback-integrity/assurance/independent.json"
          baseline="internal/meta/languageassurance/rollbackintegrityshadow/evidence/assurance.json"
          mkdir -p "$out"
          jq -e --arg subject "$SUBJECT_SHA" '.subject_sha == $subject and .summary.denominator_total == 12 and .summary.operating == 12 and .summary.not_implemented == 0 and .summary.implementation_coverage_bps == 10000 and ([.obligations[] | select(.metric_id == "gooo.metric.operation.rollback-integrity.v1" and .status == "OPERATING" and .resolution == "EXACT" and .meta_operation == "verify-rollback-integrity")] | length) == 1' "$assurance"
          for suffix in a b; do
            go run ./cmd/rollback-integrity-shadow-witness -assurance "$baseline" -output "$out/exact-$suffix.json"
          done
          cmp "$out/exact-a.json" "$out/exact-b.json"
          go run ./cmd/rollback-integrity-shadow-witness -unavailable -output "$out/unavailable.json"
          jq '.summary.operating = 8' "$baseline" > "$out/assurance-mismatch.json"
          go run ./cmd/rollback-integrity-shadow-witness -assurance "$out/assurance-mismatch.json" -output "$out/digest-mismatch.json"
          jq -e '.decision == "SHADOW_PASS" and .resolution == "EXACT" and .enforcement_effect == "NO_EFFECT" and .summary.denominator_total == 12 and .summary.before_operating == 9 and .summary.projected_operating == 10 and .summary.before_coverage_bps == 7500 and .summary.projected_coverage_bps == 8333 and .summary.cases_total == 7 and .summary.cases_passed == 7 and .summary.case_coverage_bps == 10000 and .summary.meta_reports_valid == 7 and .summary.coordinates_total == 70 and .summary.terminal_cases == 2 and .summary.unknown_decision_cases == 1 and .summary.known_reject_cases == 4 and .repository_writes == 0 and .promotion_applied == 0' "$out/exact-a.json"
          jq -e '([.indicators[] | select(.class == "OUTCOME")] | length) == 1 and ([.indicators[] | select(.class == "DRIVER")] | length) == 2 and ([.indicators[] | select(.class == "GUARDRAIL")] | length) == 3 and ([.indicators[] | select(.proof_choice == "FOUNDATION")] | length) == 3 and ([.indicators[] | select(.proof_choice == "COHERENCE")] | length) == 2 and ([.indicators[] | select(.proof_choice == "REGRESSION")] | length) == 1 and ([.indicators[] | select(.satisfied == true)] | length) == 6' "$out/exact-a.json"
          jq -e '([.cases[] | select(.name == "unknown-guard-decision" and .actual_decision == "FAIL_CLOSED" and .actual_resolution == "LOWER_RESOLUTION" and .passed == true)] | length) == 1' "$out/exact-a.json"
          jq -e '.decision == "FAIL_CLOSED" and .resolution == "LOWER_RESOLUTION" and .reason == "ROLLBACK_INTEGRITY_ASSURANCE_UNAVAILABLE" and .summary.projected_operating == 9 and .repository_writes == 0 and .promotion_applied == 0' "$out/unavailable.json"
          jq -e '.decision == "FAIL_CLOSED" and .resolution == "INVARIANT_ONLY" and .reason == "ROLLBACK_INTEGRITY_ASSURANCE_DIGEST_MISMATCH" and .summary.projected_operating == 9 and .repository_writes == 0 and .promotion_applied == 0' "$out/digest-mismatch.json"
          sha256sum "$out/exact-a.json" "$out/unavailable.json" "$out/digest-mismatch.json" > "$out/manifest.sha256"
      - name: Upload rollback integrity shadow receipts
        uses: actions/upload-artifact@v6
        with:
          name: rollback-integrity-shadow-${{ env.SUBJECT_SHA }}
          path: ${{ runner.temp }}/rollback-integrity/shadow
          if-no-files-found: error
          retention-days: 30
