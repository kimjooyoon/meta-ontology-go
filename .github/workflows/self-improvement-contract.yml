          go run ./cmd/source-authority-promotion-witness --assurance "$assurance" --upstream "$upstream" --subject-sha "$SUBJECT_SHA" --out "$out/replay/block.json"
          cmp "$out/block.json" "$out/replay/block.json"
          jq -e '.decision == "BLOCK" and .resolution == "INVARIANT_ONLY" and .reason == "SOURCE_AUTHORITY_BASELINE_NOT_NOT_IMPLEMENTED" and .summary.denominator_total == 12 and .summary.before_operating == 12 and .summary.after_operating == 12 and .summary.before_coverage_bps == 10000 and .summary.after_coverage_bps == 10000 and .repository_writes == 0 and .promotion_applied == 0' "$out/block.json"
          sha256sum "$out/block.json" > "$out/manifest.sha256"
