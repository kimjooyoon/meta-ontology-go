name: Self-improvement contract

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    name: Self-improvement contract
    runs-on: ubuntu-latest
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          cache: false

      - name: Require exact Go toolchain
        run: test "$(go env GOVERSION)" = "go1.27.0"

      - name: Compile and replay the Gooo meta-contract
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/self-improvement-contract"
          mkdir -p "$output"
          for pass in first second; do
            go run ./scripts/self-improvement-contract \
              -contract examples/self-improvement/main.gooo \
              -commit "$HEAD_SHA" \
              -output "$output/$pass.json"
          done
          cmp "$output/first.json" "$output/second.json"
          test "$(jq -r .status "$output/first.json")" = PASS

      - name: Upload exact-head self-improvement contract
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: self-improvement-contract-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/self-improvement-contract/first.json
          if-no-files-found: error

  assurance:
    name: Language assurance kernel
    runs-on: ubuntu-latest
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          cache: false

      - name: Require exact Go toolchain
        run: test "$(go env GOVERSION)" = "go1.27.0"

      - name: Require Go 1.27 fixes to be already applied
        run: go fix -diff ./internal/meta/languageassurance ./cmd/language-assurance-witness ./cmd/language-assurance-witness/reconstructor

      - name: Run assurance regressions
        run: go test ./internal/meta/languageassurance ./cmd/language-assurance-witness ./cmd/language-assurance-witness/reconstructor

      - name: Require evaluator-independent reconstruction imports
        shell: bash
        run: |
          set -euo pipefail
          if go list -deps ./cmd/language-assurance-witness/reconstructor | grep -Fxq 'github.com/kimjooyoon/meta-ontology-go/internal/meta/languageassurance'; then
            echo 'raw reconstructor imports the subject evaluator' >&2
            exit 1
          fi

      - name: Execute and replay six assurance use cases
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/language-assurance"
          mkdir -p "$output/first/raw" "$output/first/receipts" "$output/replay/receipts" "$output/runtime"
          declare -A expected=(
            [independent]=ALLOW_LIMITED
            [self-minting]=BLOCK
            [role-conflict]=BLOCK
            [unknown-laundering]=FAIL_CLOSED
                      [snapshot-mismatch]=BLOCK
                      [raw-reconstruction-mismatch]=BLOCK
                    )
                    for fixture in independent self-minting role-conflict unknown-laundering snapshot-mismatch raw-reconstruction-mismatch; do
            jq --arg sha "$HEAD_SHA" --arg fixture "$fixture" '
              .snapshot_bindings = [
                {"evidence_id":"authority_routes","subject_sha":$sha},
                {"evidence_id":"role_bindings","subject_sha":$sha},
                {"evidence_id":"decision_transitions","subject_sha":$sha}
              ] |
              if $fixture == "snapshot-mismatch" then
                .snapshot_bindings[2].subject_sha = "0000000000000000000000000000000000000000"
              else . end
                      ' "examples/language-assurance-kernel/$fixture.json" > "$output/first/raw/$fixture.json"
                      for pass in first replay; do
                        go run ./cmd/language-assurance-witness/reconstructor \
                          -root "$GITHUB_WORKSPACE" \
                          -subject-sha "$HEAD_SHA" \
                          -input "$output/first/raw/$fixture.json" \
                          -output "$output/$pass/receipts/$fixture.json"
                      done
                      cmp "$output/first/receipts/$fixture.json" "$output/replay/receipts/$fixture.json"
                      jq --slurpfile receipt "$output/first/receipts/$fixture.json" --arg fixture "$fixture" '
                        .raw_reconstructions = [$receipt[0]] |
                        if $fixture == "raw-reconstruction-mismatch" then
                          .raw_reconstructions[0].observation.candidate_decision = "BLOCK"
                        else . end
                      ' "$output/first/raw/$fixture.json" > "$output/runtime/$fixture.json"
                      for pass in first replay; do
              go run ./cmd/language-assurance-witness \
                -root "$GITHUB_WORKSPACE" \
                -subject-sha "$HEAD_SHA" \
                -input "$output/runtime/$fixture.json" \
                -output "$output/$pass/$fixture.json" \
                -expect-candidate "${expected[$fixture]}"
            done
            cmp "$output/first/$fixture.json" "$output/replay/$fixture.json"
          done
          jq -e '
            .assurance_decision == "PARTIAL" and
            .candidate_decision == "ALLOW_LIMITED" and
            .summary.denominator_total == 12 and
                      .summary.operating == 12 and
                      .summary.not_implemented == 0 and
                      .summary.implementation_coverage_bps == 10000 and
            .summary.snapshot_bindings_observed == 3 and
            .summary.snapshot_bindings_required == 3 and
            .summary.exact_snapshot_binding_bps == 10000 and
                      .summary.snapshot_mismatch_paths == 0 and
                      .summary.raw_reconstructions_observed == 1 and
                      .summary.raw_reconstructions_required == 1 and
                      .summary.raw_reconstruction_bps == 10000 and
                      .summary.raw_reconstruction_mismatch_paths == 0 and
            .summary.self_minting_paths == 0 and
            .summary.role_conflict_paths == 0 and
            .summary.unknown_laundering_paths == 0 and
            ([.indicators[] | select(.class == "OUTCOME")] | length) == 1 and
                      ([.indicators[] | select(.class == "DRIVER")] | length) == 3 and
            ([.indicators[] | select(.class == "GUARDRAIL")] | length) == 4
          ' "$output/first/independent.json"
          jq -e '.candidate_decision == "BLOCK" and .summary.self_minting_paths == 1' "$output/first/self-minting.json"
          jq -e '.candidate_decision == "BLOCK" and .summary.role_conflict_paths == 1' "$output/first/role-conflict.json"
          jq -e '
            .candidate_decision == "FAIL_CLOSED" and
            .candidate_reason == "ASSURANCE_TOP_DECISION_UNKNOWN" and
            .summary.unknown_laundering_paths == 1 and
            .summary.unknown_top_decisions == 1
          ' "$output/first/unknown-laundering.json"
          jq -e '
            .candidate_decision == "BLOCK" and
            .candidate_reason == "ASSURANCE_SNAPSHOT_BINDING_MISMATCH" and
            .candidate_resolution == "EXACT" and
            .summary.exact_snapshot_binding_bps == 6666 and
            .summary.snapshot_mismatch_paths == 1
                    ' "$output/first/snapshot-mismatch.json"
                    jq -e '
                      .candidate_decision == "BLOCK" and
                      .candidate_reason == "ASSURANCE_RAW_RECONSTRUCTION_MISMATCH" and
                      .candidate_resolution == "EXACT" and
                      .summary.raw_reconstruction_bps == 0 and
                      .summary.raw_reconstruction_mismatch_paths == 1
                    ' "$output/first/raw-reconstruction-mismatch.json"
                    (cd "$output/first" && find . -type f -name '*.json' -print0 | sort -z | xargs -0 sha256sum > manifest.sha256)

      - name: Upload exact-head language assurance reports
        uses: actions/upload-artifact@v6
        with:
          name: language-assurance-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/language-assurance/first
          if-no-files-found: error
          retention-days: 30

  vertical-slice-closure-activation:
    name: Vertical slice closure activation
    needs:
      - assurance
    runs-on: ubuntu-latest
    env:
      SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PREDECESSOR_SHA: 3920551d8db1226810832f6f924783b2fddf4ccd
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.0
          cache: false
      - name: Materialize exact logical workspace
        uses: ./.github/actions/materialize
        with:
          expected-sha: ${{ env.SUBJECT_SHA }}
      - name: Download operating assurance report
        uses: actions/download-artifact@v6
        with:
          name: language-assurance-${{ env.SUBJECT_SHA }}
          path: ${{ runner.temp }}/language-assurance
      - name: Require Go 1.27 fixes and activation regressions
        shell: bash
        run: |
          set -euo pipefail
          go fix -diff ./internal/meta/languageassurance/verticalsliceclosureactivation ./cmd/vertical-slice-closure-activation-witness > "$RUNNER_TEMP/vertical-slice-closure-activation-fix.diff"
          if test -s "$RUNNER_TEMP/vertical-slice-closure-activation-fix.diff"; then
            cat "$RUNNER_TEMP/vertical-slice-closure-activation-fix.diff"
            exit 1
          fi
          go test ./internal/meta/languageassurance/verticalsliceclosureactivation ./cmd/vertical-slice-closure-activation-witness
      - name: Apply the exact eligible transition
        shell: bash
        run: |
          set -euo pipefail
          evidence="internal/meta/languageassurance/verticalsliceclosureactivation/evidence"
          out="$RUNNER_TEMP/vertical-slice-closure-activation"
          mkdir -p "$out"
          cp "$evidence/assurance.json" "$out/assurance-mismatch.json"
          printf '\n' >> "$out/assurance-mismatch.json"
          : > "$out/assurance-unavailable.json"
          jq '.decision = "UNKNOWN" | .resolution = "UNKNOWN"' "$evidence/eligibility.json" > "$out/eligibility-unknown-input.json"
          for pass in exact replay; do
            go run ./cmd/vertical-slice-closure-activation-witness --assurance "$evidence/assurance.json" --eligibility "$evidence/eligibility.json" --subject-sha "$SUBJECT_SHA" --out "$out/$pass.json"
          done
          cmp "$out/exact.json" "$out/replay.json"
          go run ./cmd/vertical-slice-closure-activation-witness --assurance "$out/assurance-unavailable.json" --eligibility "$evidence/eligibility.json" --subject-sha "$SUBJECT_SHA" --out "$out/unavailable.json"
          go run ./cmd/vertical-slice-closure-activation-witness --assurance "$out/assurance-mismatch.json" --eligibility "$evidence/eligibility.json" --subject-sha "$SUBJECT_SHA" --out "$out/digest-mismatch.json"
          go run ./cmd/vertical-slice-closure-activation-witness --assurance "$evidence/assurance.json" --eligibility "$out/eligibility-unknown-input.json" --subject-sha "$SUBJECT_SHA" --out "$out/eligibility-unknown.json"
          jq -e '.decision == "APPLIED" and .resolution == "EXACT" and .reason == "VERTICAL_SLICE_CLOSURE_ACTIVATED" and .summary.denominator_total == 12 and .summary.before_operating == 10 and .summary.after_operating == 11 and .summary.before_coverage_bps == 8333 and .summary.after_coverage_bps == 9166 and .summary.capsules_total == 2 and .summary.capsules_exact == 2 and .summary.capsule_coverage_bps == 10000 and .summary.predecessor_semantics_bps == 10000 and .summary.boundaries_satisfied == 6 and .summary.links_satisfied == 12 and .summary.eligibility_indicators_satisfied == 8 and .summary.meta_operations_observed == 6 and .repository_writes == 0 and .transition_applied == 1' "$out/exact.json"
          jq -e '.decision == "FAIL_CLOSED" and .resolution == "UNKNOWN" and .reason == "VERTICAL_SLICE_ACTIVATION_EVIDENCE_UNAVAILABLE" and .transition_applied == 0 and .repository_writes == 0' "$out/unavailable.json"
          jq -e '.decision == "FAIL_CLOSED" and .resolution == "INVARIANT_ONLY" and .reason == "VERTICAL_SLICE_ACTIVATION_CAPSULE_DIGEST_MISMATCH" and .transition_applied == 0 and .repository_writes == 0' "$out/digest-mismatch.json"
          jq -e '.decision == "FAIL_CLOSED" and .resolution == "UNKNOWN" and .reason == "VERTICAL_SLICE_ACTIVATION_ELIGIBILITY_UNKNOWN" and .transition_applied == 0 and .repository_writes == 0' "$out/eligibility-unknown.json"
          jq -e '([.indicators[] | select(.class == "OUTCOME")] | length) == 1 and ([.indicators[] | select(.class == "DRIVER")] | length) == 2 and ([.indicators[] | select(.class == "GUARDRAIL")] | length) == 3 and ([.indicators[] | select(.proof_choice == "FOUNDATION")] | length) == 3 and ([.indicators[] | select(.proof_choice == "COHERENCE")] | length) == 2 and ([.indicators[] | select(.proof_choice == "REGRESSION")] | length) == 1 and ([.indicators[] | select(.satisfied == true)] | length) == 6' "$out/exact.json"
          jq -e '.summary.denominator_total == 12 and .summary.operating == 12 and .summary.not_implemented == 0 and .summary.implementation_coverage_bps == 10000 and ([.obligations[] | select(.metric_id == "gooo.metric.capability.vertical-slice-closure.v1" and .status == "OPERATING" and .resolution == "EXACT" and .meta_operation == "close-vertical-slice")] | length) == 1' "$RUNNER_TEMP/language-assurance/independent.json"
          sha256sum "$out/exact.json" "$out/replay.json" "$out/unavailable.json" "$out/digest-mismatch.json" "$out/eligibility-unknown.json" > "$out/manifest.sha256"
      - name: Upload vertical slice closure activation receipts
        uses: actions/upload-artifact@v6
        with:
          name: vertical-slice-closure-activation-${{ env.SUBJECT_SHA }}
          path: ${{ runner.temp }}/vertical-slice-closure-activation
          if-no-files-found: error
          retention-days: 30

  external-conformance-activation:
    name: External conformance activation
    needs:
      - assurance
    runs-on: ubuntu-latest
    env:
      SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PREDECESSOR_SHA: 2104e3fcede21572951c266cd7b61fd38f386aef
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.0
          cache: false
      - name: Materialize exact logical workspace
        uses: ./.github/actions/materialize
        with:
          expected-sha: ${{ env.SUBJECT_SHA }}
      - name: Download activated assurance report
        uses: actions/download-artifact@v6
        with:
          name: language-assurance-${{ env.SUBJECT_SHA }}
          path: ${{ runner.temp }}/language-assurance
      - name: Require Go 1.27 fixes and activation regressions
        shell: bash
        run: |
          set -euo pipefail
          go fix -diff ./internal/meta/languageassurance/externalconformanceactivation ./cmd/external-conformance-activation-witness > "$RUNNER_TEMP/external-conformance-activation-fix.diff"
          if test -s "$RUNNER_TEMP/external-conformance-activation-fix.diff"; then
            cat "$RUNNER_TEMP/external-conformance-activation-fix.diff"
            exit 1
          fi
          go test ./internal/meta/languageassurance/externalconformanceactivation ./cmd/external-conformance-activation-witness
      - name: Apply only the exact merged eligibility transition
        shell: bash
        run: |
          set -euo pipefail
          evidence="internal/meta/languageassurance/externalconformanceactivation/evidence"
          out="$RUNNER_TEMP/external-conformance-activation"
          mkdir -p "$out"
          : > "$out/assurance-unavailable.json"
          cp "$evidence/merge.json" "$out/merge-mismatch.json"
          printf '\n' >> "$out/merge-mismatch.json"
          jq '.decision = "UNKNOWN" | .resolution = "UNKNOWN"' "$evidence/eligibility.json" > "$out/eligibility-unknown-input.json"
          jq '.decision = "FIXED_POINT" | .resolution = "EXACT"' "$evidence/eligibility.json" > "$out/eligibility-fixed-point-input.json"
          jq '.decision = "SURPRISE" | .resolution = "EXACT"' "$evidence/eligibility.json" > "$out/eligibility-unrecognized-input.json"
          jq '.candidate_decision = "UNKNOWN" | .candidate_resolution = "UNKNOWN"' "$evidence/assurance.json" > "$out/assurance-unknown-input.json"
          jq '.state = "UNKNOWN"' "$evidence/merge.json" > "$out/merge-unknown-input.json"
          witness="go run ./cmd/external-conformance-activation-witness"
          for pass in exact replay; do
            $witness --assurance "$evidence/assurance.json" --eligibility "$evidence/eligibility.json" --merge "$evidence/merge.json" --subject-sha "$SUBJECT_SHA" --out "$out/$pass.json"
          done
          cmp "$out/exact.json" "$out/replay.json"
          $witness --assurance "$out/assurance-unavailable.json" --eligibility "$evidence/eligibility.json" --merge "$evidence/merge.json" --subject-sha "$SUBJECT_SHA" --out "$out/unavailable.json"
          $witness --assurance "$evidence/assurance.json" --eligibility "$evidence/eligibility.json" --merge "$out/merge-mismatch.json" --subject-sha "$SUBJECT_SHA" --out "$out/digest-mismatch.json"
          for decision in unknown fixed-point unrecognized; do
            $witness --assurance "$evidence/assurance.json" --eligibility "$out/eligibility-$decision-input.json" --merge "$evidence/merge.json" --subject-sha "$SUBJECT_SHA" --out "$out/eligibility-$decision.json"
          done
          $witness --assurance "$out/assurance-unknown-input.json" --eligibility "$evidence/eligibility.json" --merge "$evidence/merge.json" --subject-sha "$SUBJECT_SHA" --out "$out/assurance-unknown.json"
          $witness --assurance "$evidence/assurance.json" --eligibility "$evidence/eligibility.json" --merge "$out/merge-unknown-input.json" --subject-sha "$SUBJECT_SHA" --out "$out/merge-unknown.json"
          jq -e '.decision == "APPLIED" and .resolution == "EXACT" and .reason == "EXTERNAL_CONFORMANCE_ASSURANCE_ACTIVATED" and .summary.denominator_total == 12 and .summary.before_operating == 11 and .summary.after_operating == 12 and .summary.before_coverage_bps == 9166 and .summary.after_coverage_bps == 10000 and .summary.capsules_total == 3 and .summary.capsules_exact == 3 and .summary.capsule_coverage_bps == 10000 and .summary.predecessor_semantics_bps == 10000 and .summary.eligibility_indicators_satisfied == 18 and .summary.parent_completed == 6 and .summary.parent_total == 8 and .summary.parent_known_failures == 2 and .summary.selected_completed == 10 and .summary.selected_total == 10 and .summary.external_executions == 4 and .repository_writes == 0 and .transition_applied == 1' "$out/exact.json"
          jq -e '([.indicators[] | select(.class == "OUTCOME")] | length) == 2 and ([.indicators[] | select(.class == "DRIVER")] | length) == 4 and ([.indicators[] | select(.class == "GUARDRAIL")] | length) == 4 and ([.indicators[] | select(.proof_choice == "FOUNDATION")] | length) == 4 and ([.indicators[] | select(.proof_choice == "COHERENCE")] | length) == 2 and ([.indicators[] | select(.proof_choice == "REGRESSION")] | length) == 4 and ([.indicators[] | select(.satisfied == true)] | length) == 10' "$out/exact.json"
          for receipt in unavailable eligibility-unknown eligibility-fixed-point eligibility-unrecognized assurance-unknown merge-unknown; do
            jq -e '.decision == "FAIL_CLOSED" and .resolution == "UNKNOWN" and .transition_applied == 0 and .repository_writes == 0' "$out/$receipt.json"
          done
          jq -e '.decision == "FAIL_CLOSED" and .resolution == "INVARIANT_ONLY" and .transition_applied == 0 and .repository_writes == 0' "$out/digest-mismatch.json"
          jq -e '.summary.denominator_total == 12 and .summary.operating == 12 and .summary.not_implemented == 0 and .summary.implementation_coverage_bps == 10000 and ([.obligations[] | select(.metric_id == "gooo.metric.ecosystem.external-conformance.v1" and .status == "OPERATING" and .resolution == "EXACT" and .meta_operation == "verify-external-conformance")] | length) == 1' "$RUNNER_TEMP/language-assurance/independent.json"
          sha256sum "$out"/*.json > "$out/manifest.sha256"
      - name: Upload external conformance activation receipts
        uses: actions/upload-artifact@v6
        with:
          name: external-conformance-activation-${{ env.SUBJECT_SHA }}
          path: ${{ runner.temp }}/external-conformance-activation
          if-no-files-found: error
          retention-days: 30

  source-authority-shadow:
    name: Source authority shadow
    runs-on: ubuntu-latest
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          cache: false

      - name: Require exact Go toolchain
        run: test "$(go env GOVERSION)" = "go1.27.0"

      - name: Require Go 1.27 fixes to be already applied
        run: go fix -diff ./internal/meta/languageassurance/sourceauthorityeval ./internal/meta/languageassurance/sourceauthorityshadow ./cmd/source-authority-shadow-witness

      - name: Run source authority shadow regressions
        run: go test ./internal/meta/languageassurance/sourceauthorityeval ./internal/meta/languageassurance/sourceauthorityshadow ./cmd/source-authority-shadow-witness

      - name: Bind exact-head pinned source input
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/source-authority-shadow"
          mkdir -p "$output"
          jq --arg sha "$HEAD_SHA" '.subject_sha = $sha' \
            examples/language-assurance-kernel/source-authority-shadow.json > "$output/input.json"

      - name: Execute and replay source authority shadow
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/source-authority-shadow"
          for pass in first replay; do
            go run ./cmd/source-authority-shadow-witness \
              -root "$GITHUB_WORKSPACE" \
              -input "$output/input.json" \
              -output "$output/$pass.json" \
              -expected-sha "$HEAD_SHA" \
              -check
          done
          cmp "$output/first.json" "$output/replay.json"
          jq -e --arg sha "$HEAD_SHA" '
            .schema == "gooo/source-backed-authority-shadow-receipt/v1" and
            .mode == "SHADOW" and .expected_sha == $sha and .subject_sha == $sha and
            .observation == "SATISFIED" and .resolution == "EXACT" and
            .enforcement == "ALLOW" and .gate_effect == "NO_EFFECT" and
            .promotion_credit_bps == 0 and .repository_writes == 0 and
            .evaluation.summary.accepted_facts == 1 and
            .evaluation.summary.backed_facts == 1 and
            .evaluation.summary.coverage_bps == 10000 and
            (.evaluation.receipts | length) == 1 and
            ([.indicators[] | select(.class == "OUTCOME")] | length) == 1 and
            ([.indicators[] | select(.class == "DRIVER")] | length) == 2 and
            ([.indicators[] | select(.class == "GUARDRAIL")] | length) == 3
          ' "$output/first.json"
          (cd "$output" && sha256sum input.json first.json > manifest.sha256)

      - name: Upload exact-head source authority shadow receipt
        uses: actions/upload-artifact@v6
        with:
          name: source-authority-shadow-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/source-authority-shadow
          if-no-files-found: error
          retention-days: 30

  write-set-exactness:
    name: Write-set exactness
    runs-on: ubuntu-latest
    env:
      EXACT_SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
      - name: Check generated assurance bindings
        run: go run ./cmd/language-assurance-witness/assurance-generator --check
      - name: Produce exact, changed, and mismatch receipts
        shell: bash
        run: |
          set -euo pipefail
          receipt_dir="${RUNNER_TEMP}/write-set-receipts"
          sandbox="${RUNNER_TEMP}/write-set-sandbox"
          mkdir -p "${receipt_dir}" "${sandbox}"
          denominator='sha256:e5b266ceeaeb0757a40096fb661982a263370b1e08945dfedbe34f96eb237a02'
          go run ./cmd/language-assurance-witness/write-set-observer snapshot --root internal/meta/languageassurance --output "${receipt_dir}/kernel-before.json"
          go test ./internal/meta/languageassurance
          go run ./cmd/language-assurance-witness/write-set-observer snapshot --root internal/meta/languageassurance --output "${receipt_dir}/kernel-after.json"
          go run ./cmd/language-assurance-witness/write-set-observer compare --before "${receipt_dir}/kernel-before.json" --after "${receipt_dir}/kernel-after.json" --output "${receipt_dir}/kernel-exact.json" --expect PASS --subject-sha "${EXACT_SUBJECT_SHA}" --denominator-digest "${denominator}"
          printf 'before\n' > "${sandbox}/value.txt"
          go run ./cmd/language-assurance-witness/write-set-observer snapshot --root "${sandbox}" --output "${receipt_dir}/sandbox-before.json"
          printf 'after\n' > "${sandbox}/value.txt"
          go run ./cmd/language-assurance-witness/write-set-observer snapshot --root "${sandbox}" --output "${receipt_dir}/sandbox-after.json"
          go run ./cmd/language-assurance-witness/write-set-observer compare --before "${receipt_dir}/sandbox-before.json" --after "${receipt_dir}/sandbox-after.json" --declared value.txt --output "${receipt_dir}/declared-exact.json" --expect PASS --subject-sha "${EXACT_SUBJECT_SHA}" --denominator-digest "${denominator}"
          go run ./cmd/language-assurance-witness/write-set-observer compare --before "${receipt_dir}/sandbox-before.json" --after "${receipt_dir}/sandbox-after.json" --output "${receipt_dir}/undeclared-mismatch.json" --expect BLOCK --subject-sha "${EXACT_SUBJECT_SHA}" --denominator-digest "${denominator}"
      - name: Upload write-set receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
