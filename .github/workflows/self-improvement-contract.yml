          go run ./cmd/source-authority-activation-witness --assurance "$out/assurance-mismatch.json" --upstream "$evidence/upstream.json" --eligibility "$evidence/eligibility.json" --subject-sha "$SUBJECT_SHA" --out "$out/digest-mismatch.json"
          jq -e '.decision == "APPLIED" and .resolution == "EXACT" and .reason == "SOURCE_AUTHORITY_ACTIVATED" and .summary.denominator_total == 12 and .summary.before_operating == 6 and .summary.after_operating == 7 and .summary.before_coverage_bps == 5000 and .summary.after_coverage_bps == 5833 and .summary.capsules_total == 3 and .summary.capsules_exact == 3 and .summary.capsule_coverage_bps == 10000 and .repository_writes == 0 and .transition_applied == 1 and ([.artifacts[] | select(.exact == true)] | length) == 3' "$out/exact.json"
          jq -e '.decision == "FAIL_CLOSED" and .resolution == "UNKNOWN" and .reason == "ACTIVATION_EVIDENCE_UNAVAILABLE" and .transition_applied == 0 and .repository_writes == 0' "$out/unavailable.json"
