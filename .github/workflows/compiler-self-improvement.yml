name: Compiler self-improvement

on:
  pull_request:
    branches: [dev]
    paths:
      - 'cmd/gooo/**'
      - 'examples/billing/**'
      - 'examples/compiler-self-improvement/**'
      - 'internal/generator/**'
      - 'scripts/compiler-self-improvement/**'
      - 'go.mod'
      - 'go.sum'
  push:
    branches: [dev, main]
    paths:
      - 'cmd/gooo/**'
      - 'examples/billing/**'
      - 'examples/compiler-self-improvement/**'
      - 'internal/generator/**'
      - 'scripts/compiler-self-improvement/**'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

jobs:
  compiler-self-improvement:
    name: Compiler self-improvement evidence
    runs-on: ubuntu-latest
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly

    steps:
      - name: Check out the exact subject
        uses: actions/checkout@v5
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install the exact toolchain
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          cache: false

      - name: Require exact Go toolchain and clean source worktree
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = "go1.27.0"
          test -n "$BASE_SHA"
          test "$(git status --porcelain)" = ""

      - name: Materialize the .gooo semantic authority and generated candidate
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/compiler-self-improvement"
          mkdir -p "$work"
          go run ./cmd/gooo check --semantic examples/compiler-self-improvement/main.gooo
          go run ./cmd/gooo graph dump examples/compiler-self-improvement/main.gooo > "$work/authority.graph.json"
          jq -e '.schema_version == "gooo-graph/v1" and (.nodes | map(select(.kind == "Activity")) | length) == 6' "$work/authority.graph.json" >/dev/null
          git show "$BASE_SHA:internal/generator/normalize_part01.go" > "$work/baseline-normalize.go"
          go run ./scripts/compiler-self-improvement \
            -mode candidate \
            -program examples/compiler-self-improvement/main.gooo \
            -graph "$work/authority.graph.json" \
            -baseline "$work/baseline-normalize.go" \
            -candidate "$work/candidate-normalize.go" \
            -evidence "$work/candidate-evidence.json"
          cmp -s "$work/candidate-normalize.go" internal/generator/normalize_part01.go
          test -z "$(gofmt -d "$work/candidate-normalize.go")"
          diff -u "$work/baseline-normalize.go" "$work/candidate-normalize.go" > "$work/candidate.patch" || test $? -eq 1
          test "$(git status --porcelain)" = ""

      - name: Execute identical baseline and candidate measurements
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/compiler-self-improvement"
          fixture="examples/billing/main.gooo"
          baseline_root="$work/baseline-worktree"
          candidate_root="$GITHUB_WORKSPACE"
          mkdir -p "$work/measurements" "$work/baseline" "$work/candidate"
          git worktree add --detach "$baseline_root" "$BASE_SHA" >/dev/null
          trap 'git worktree remove --force "$baseline_root" >/dev/null 2>&1 || true' EXIT

          source_digest="sha256:$(sha256sum "$fixture" | awk '{print $1}')"
          toolchain_digest="sha256:$(printf '%s\n' "$(go env GOVERSION)" "$(go env GOOS)" "$(go env GOARCH)" | sha256sum | awk '{print $1}')"
          cache_state="cold-per-measurement;setup-go-cache=false;GOCACHE-isolated;GOMODCACHE-shared-read-only"
          gomodcache="$(go env GOMODCACHE)"

          measure_command() {
            local root="$1"
            local cache="$2"
            local label="$3"
            shift 3
            local sample="$work/measurements/$label"
            local start_ns
            local finish_ns
            local wall_ns
            local wall_ms
            local peak_rss_kib
            mkdir -p "$sample" "$cache"
            start_ns="$(date +%s%N)"
            (cd "$root" && /usr/bin/time -f '%M' -o "$sample/rss" env LANG=C LC_ALL=C TZ=UTC NO_COLOR=1 GOCACHE="$cache" GOMODCACHE="$gomodcache" GOTOOLCHAIN=local GOFLAGS=-mod=readonly "$@") > "$sample/stdout" 2> "$sample/stderr"
            finish_ns="$(date +%s%N)"
            wall_ns=$((finish_ns - start_ns))
            wall_ms=$(( (wall_ns + 999999) / 1000000 ))
            peak_rss_kib="$(tr -d '[:space:]' < "$sample/rss")"
            jq -cn --argjson wall_ms "$wall_ms" --argjson peak_rss_kib "$peak_rss_kib" \
              '{wall_ms:$wall_ms,peak_rss_kib:$peak_rss_kib}'
          }

          run_side() {
            local side="$1"
            local root="$2"
            local first="$work/$side/generate-first"
            local replay="$work/$side/generate-replay"
            local generation
            local build
            local test
            local executed
            mkdir -p "$first" "$replay"
            generation="$(measure_command "$root" "$work/cache-$side-generation" "$side-generation" go run ./cmd/gooo generate "$fixture" --out "$first")"
            measure_command "$root" "$work/cache-$side-replay" "$side-replay" go run ./cmd/gooo generate "$fixture" --out "$replay" >/dev/null
            build="$(measure_command "$root" "$work/cache-$side-build" "$side-build" go test ./internal/generator -run '^$' -count=1)"
            test="$(measure_command "$root" "$work/cache-$side-test" "$side-test" go test ./internal/generator -run '^TestGenerateIsDeterministicAndFormatted$' -count=1 -json)"
            executed="$(jq -s '[.[] | select(.Action == "pass" and .Test != null)] | length' "$work/measurements/$side-test/stdout")"
            jq -n --argjson generation "$generation" --argjson build "$build" --argjson test "$test" --argjson executed "$executed" \
              '{generation:$generation,build:$build,test:$test,executed_tests:$executed,reused_tests:0}' > "$work/$side/measurements.json"
          }

          run_side baseline "$baseline_root"
          run_side candidate "$candidate_root"

          behavior_equal=true
          if ! cmp -s "$work/baseline/generate-first/semantic.gooo.go" "$work/candidate/generate-first/semantic.gooo.go"; then
            behavior_equal=false
          fi
          deterministic_equal=true
          if ! cmp -s "$work/baseline/generate-first/semantic.gooo.go" "$work/baseline/generate-replay/semantic.gooo.go"; then
            deterministic_equal=false
          fi
          if ! cmp -s "$work/candidate/generate-first/semantic.gooo.go" "$work/candidate/generate-replay/semantic.gooo.go"; then
            deterministic_equal=false
          fi

          baseline_primary="$(jq -r '.baseline_collection_copy_passes' "$work/candidate-evidence.json")"
          candidate_primary="$(jq -r '.candidate_collection_copy_passes' "$work/candidate-evidence.json")"
          baseline_metrics="$(jq -n --argjson p "$baseline_primary" --slurpfile m "$work/baseline/measurements.json" '{normalization_collection_copy_passes:$p,wall_ms:$m[0].generation.wall_ms,peak_rss_kib:$m[0].generation.peak_rss_kib,build_ms:$m[0].build.wall_ms,test_ms:$m[0].test.wall_ms,executed_tests:$m[0].executed_tests,reused_tests:$m[0].reused_tests}')"
          candidate_metrics="$(jq -n --argjson p "$candidate_primary" --slurpfile m "$work/candidate/measurements.json" '{normalization_collection_copy_passes:$p,wall_ms:$m[0].generation.wall_ms,peak_rss_kib:$m[0].generation.peak_rss_kib,build_ms:$m[0].build.wall_ms,test_ms:$m[0].test.wall_ms,executed_tests:$m[0].executed_tests,reused_tests:$m[0].reused_tests}')"
          memory_guardrail="$(jq -n --argjson b "$baseline_metrics" --argjson c "$candidate_metrics" '($b.peak_rss_kib > 0 and $c.peak_rss_kib > 0 and $b.peak_rss_kib <= 1048576 and $c.peak_rss_kib <= 1048576)')"
          time_guardrail="$(jq -n --argjson b "$baseline_metrics" --argjson c "$candidate_metrics" '($b.wall_ms > 0 and $c.wall_ms > 0 and $b.wall_ms <= 120000 and $c.wall_ms <= 120000 and $b.build_ms > 0 and $c.build_ms > 0 and $b.test_ms > 0 and $c.test_ms > 0)')"

          jq -n \
            --arg scenario_id NORMAL \
            --arg source_digest "$source_digest" \
            --arg toolchain_digest "$toolchain_digest" \
            --arg cache_state "$cache_state" \
            --arg primary_metric normalization_collection_copy_passes \
            --arg authority_program generator.normalizeIR:fold-copy-with-empty-normalization/v1 \
            --arg graph_hash "$(jq -r .graph_hash "$work/authority.graph.json")" \
            --argjson before "$baseline_metrics" \
            --argjson after "$candidate_metrics" \
            --argjson behavior_equal "$behavior_equal" \
            --argjson deterministic_equal "$deterministic_equal" \
            --argjson memory_guardrail "$memory_guardrail" \
            --argjson time_guardrail "$time_guardrail" \
            '{scenario_id:$scenario_id,source_digest:$source_digest,toolchain_digest:$toolchain_digest,cache_state:$cache_state,primary_metric:$primary_metric,before_context:{scenario_id:$scenario_id,source_digest:$source_digest,toolchain_digest:$toolchain_digest,cache_state:$cache_state,metric:$primary_metric},after_context:{scenario_id:$scenario_id,source_digest:$source_digest,toolchain_digest:$toolchain_digest,cache_state:$cache_state,metric:$primary_metric},before:$before,after:$after,semantic_guard:{behavior_equal:$behavior_equal,deterministic_equal:$deterministic_equal,memory_guardrail:$memory_guardrail,time_guardrail:$time_guardrail,ci_passed:true},repository_writes:0,local_test_executions:0,ci_passed:true,authority_program:$authority_program,graph_hash:$graph_hash}' > "$work/normal.json"
          test "$(git status --porcelain)" = ""

      - name: Resolve the fixed decision scenarios and verify the evidence contract
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/compiler-self-improvement"
          go run ./scripts/compiler-self-improvement \
            -mode decide \
            -program examples/compiler-self-improvement/main.gooo \
            -graph "$work/authority.graph.json" \
            -normal "$work/normal.json" \
            -candidate-evidence "$work/candidate-evidence.json" \
            -output "$work/report.json"
          go run ./scripts/compiler-self-improvement \
            -mode decide \
            -program examples/compiler-self-improvement/main.gooo \
            -graph "$work/authority.graph.json" \
            -normal "$work/normal.json" \
            -candidate-evidence "$work/candidate-evidence.json" \
            -output "$work/report-replay.json"
          cmp -s "$work/report.json" "$work/report-replay.json"
          jq '{candidate_decision,scenario_suite_decision,counts,scenarios:[.scenarios[]|{id,decision,reason,before,after,semantic_guard}]}' "$work/report.json"
          jq -e '.candidate_decision == "CLOSED" and .scenario_suite_decision == "REFUTED" and .scenario_denominator == 3 and .counts == {CLOSED:1,UNKNOWN:1,REFUTED:1} and .primary_metric == "normalization_collection_copy_passes" and .repository_writes == 0 and .local_test_executions == 0 and (has("score") | not) and (has("aggregate") | not)' "$work/report.json" >/dev/null
          jq -e '.scenarios[] | select(.id == "NORMAL") | .decision == "CLOSED" and .before.normalization_collection_copy_passes == 2 and .after.normalization_collection_copy_passes == 1 and .semantic_guard.behavior_equal and .semantic_guard.deterministic_equal and .semantic_guard.memory_guardrail and .semantic_guard.time_guardrail and .semantic_guard.ci_passed' "$work/report.json" >/dev/null
          jq -e '.scenarios[] | select(.id == "UNKNOWN") | .decision == "UNKNOWN" and (.unknown | keys | sort) == ["blocked_by","next_operation","reason","stage","step","unknown_class"] and .unknown.stage == "COHERENCE" and .unknown.step == "COMPARE_EXACT_PAIR" and .unknown.reason == "MISSING_EXACT_INTEGER_PAIR" and .unknown.unknown_class == "INCOMPLETE_EVIDENCE" and .unknown.next_operation == "CAPTURE_EXACT_BEFORE_AFTER" and .unknown.blocked_by == ["before_after_pair"]' "$work/report.json" >/dev/null
          jq -e '.scenarios[] | select(.id == "REFUTED") | .decision == "REFUTED" and (.semantic_guard.memory_guardrail | not) and .reason == "SEMANTIC_OR_GUARDRAIL_NON_REGRESSION_FAILED"' "$work/report.json" >/dev/null

      - name: Write the post-adoption receipt in caller-owned output
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/compiler-self-improvement"
          artifact="$work/artifact"
          mkdir -p "$artifact"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            lifecycle="POST_ADOPTION"
          else
            lifecycle="PRE_ADOPTION"
          fi
          report_digest="sha256:$(sha256sum "$work/report.json" | awk '{print $1}')"
          candidate_digest="$(jq -r '.candidate_source_digest' "$work/candidate-evidence.json")"
          graph_hash="$(jq -r '.graph_hash' "$work/authority.graph.json")"
          jq -S -n \
            --arg schema gooo/compiler-self-improvement-receipt/v1 \
            --arg lifecycle "$lifecycle" \
            --arg subject_sha "$HEAD_SHA" \
            --arg base_sha "$BASE_SHA" \
            --arg authority_program examples/compiler-self-improvement/main.gooo \
            --arg generated_code_path "$work/candidate-normalize.go" \
            --arg adopted_target_path internal/generator/normalize_part01.go \
            --arg candidate_digest "$candidate_digest" \
            --arg graph_hash "$graph_hash" \
            --arg report_digest "$report_digest" \
            --argjson repository_writes 0 \
            --argjson local_test_executions 0 \
            --argjson before_after '{"normalization_collection_copy_passes":{"before":2,"after":1}}' \
            '{schema:$schema,lifecycle:$lifecycle,subject_sha:$subject_sha,base_sha:$base_sha,authority_program:$authority_program,generated_code_path:$generated_code_path,adopted_target_path:$adopted_target_path,candidate_digest:$candidate_digest,graph_hash:$graph_hash,report_digest:$report_digest,before_after:$before_after,repository_writes:$repository_writes,local_test_executions:$local_test_executions}' > "$work/receipt-payload.json"
          receipt_payload_digest="sha256:$(sha256sum "$work/receipt-payload.json" | awk '{print $1}')"
          jq --arg digest "$receipt_payload_digest" '. + {receipt_payload_digest:$digest}' "$work/receipt-payload.json" > "$work/post-adoption-receipt.json"
          test "$(git status --porcelain)" = ""
          cp "$work/authority.graph.json" "$artifact/authority.graph.json"
          cp "$work/candidate-evidence.json" "$artifact/candidate-evidence.json"
          cp "$work/candidate-normalize.go" "$artifact/generated-candidate-normalize.go"
          cp "$work/candidate.patch" "$artifact/generated-candidate.patch"
          cp "$work/normal.json" "$artifact/normal-observation.json"
          cp "$work/report.json" "$artifact/decision-report.json"
          cp "$work/post-adoption-receipt.json" "$artifact/post-adoption-receipt.json"
          cp "$work/baseline/measurements.json" "$artifact/baseline-measurements.json"
          cp "$work/candidate/measurements.json" "$artifact/candidate-measurements.json"
          cp "$work/baseline/generate-first/semantic.gooo.go" "$artifact/baseline-generated-semantic.gooo.go"
          cp "$work/candidate/generate-first/semantic.gooo.go" "$artifact/candidate-generated-semantic.gooo.go"
          {
            echo "### Compiler self-improvement"
            jq -r '"- lifecycle: \(.lifecycle // "see receipt")"' "$work/post-adoption-receipt.json"
            jq -r '"- candidate decision: \(.candidate_decision); fixed scenarios: \(.counts.NORMAL // 0) NORMAL, \(.counts.UNKNOWN // 0) UNKNOWN, \(.counts.REFUTED // 0) REFUTED"' "$work/report.json"
            jq -r '"- exact primary count: \(.scenarios[] | select(.id=="NORMAL") | .before.normalization_collection_copy_passes) -> \(.after.normalization_collection_copy_passes)"' "$work/report.json"
            jq -r '"- graph: \(.graph_hash); report: \(.report_digest)"' "$work/post-adoption-receipt.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload caller-owned compiler evidence
        uses: actions/upload-artifact@v6
        with:
          name: compiler-self-improvement-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/compiler-self-improvement/artifact
          if-no-files-found: error
          retention-days: 30
