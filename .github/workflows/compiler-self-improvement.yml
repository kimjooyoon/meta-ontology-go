name: Compiler self-improvement

on:
  pull_request:
    branches: [dev]
    paths:
      - 'cmd/gooo/**'
      - 'examples/billing/**'
      - 'examples/compiler-self-improvement/**'
      - 'internal/generator/**'
      - 'internal/lsp/**'
      - 'internal/meta/generation/**'
      - 'scripts/compiler-self-improvement/**'
      - 'go.mod'
      - 'go.sum'
  push:
    branches: [dev, main]
    paths:
      - 'cmd/gooo/**'
      - 'examples/billing/**'
      - 'examples/compiler-self-improvement/**'
      - 'internal/generator/**'
      - 'internal/lsp/**'
      - 'internal/meta/generation/**'
      - 'scripts/compiler-self-improvement/**'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

jobs:
  compiler-self-improvement:
    name: Compiler self-improvement evidence
    runs-on: ubuntu-latest
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly

    steps:
      - name: Check out the exact subject
        uses: actions/checkout@v5
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install the exact toolchain
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          cache: false

      - name: Require exact toolchain and clean source worktree
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = "go1.27.0"
          test -n "$BASE_SHA"
          test "$(git status --porcelain)" = ""

      - name: Generate the envelope IR, operation artifacts, and candidate
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/compiler-self-improvement"
          mkdir -p "$work"
          program=examples/compiler-self-improvement/operation-envelope.gooo
          go run ./cmd/gooo check --semantic "$program"
          go run ./cmd/gooo graph dump "$program" > "$work/authority.graph.json"
          jq -e '.schema_version == "gooo-graph/v1" and (.nodes | map(select(.kind == "Activity")) | length) == 8' "$work/authority.graph.json" >/dev/null
          git show "$BASE_SHA:internal/lsp/features_part03.go" > "$work/baseline-lsp-refresh.go"
          go run ./scripts/compiler-self-improvement \
            -mode candidate \
            -program "$program" \
            -graph "$work/authority.graph.json" \
            -baseline "$work/baseline-lsp-refresh.go" \
            -candidate "$work/candidate-lsp-refresh.go" \
            -evidence "$work/candidate-evidence.json" \
            -envelope-dir "$work/operation-envelope"
          cmp -s "$work/candidate-lsp-refresh.go" internal/lsp/features_part03.go
          test -z "$(gofmt -d "$work/candidate-lsp-refresh.go")"
          diff -u "$work/baseline-lsp-refresh.go" "$work/candidate-lsp-refresh.go" > "$work/candidate.patch" || test $? -eq 1
          test "$(find "$work/operation-envelope" -mindepth 2 -maxdepth 2 -type f | wc -l | tr -d ' ')" -eq 36
          test "$(git status --porcelain)" = ""

      - name: Execute identical baseline and candidate measurements
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/compiler-self-improvement"
          program=examples/compiler-self-improvement/operation-envelope.gooo
          fixture=examples/billing/main.gooo
          baseline_root="$work/baseline-worktree"
          candidate_root="$GITHUB_WORKSPACE"
          mkdir -p "$work/measurements" "$work/baseline" "$work/candidate"
          git worktree add --detach "$baseline_root" "$BASE_SHA" >/dev/null
          trap 'git worktree remove --force "$baseline_root" >/dev/null 2>&1 || true' EXIT

          source_digest="sha256:$(sha256sum "$fixture" | awk '{print $1}')"
          profile_digest="sha256:$(printf '%s' 'DEFERRED|1|gooo.entityfields.go-projection.v1|7e93032618d1250cd4ff480eb7b5d6832f79bfc6921e6b9eea104151db965ec0' | sha256sum | awk '{print $1}')"
          contract_digest="sha256:$(sha256sum "$program" | awk '{print $1}')"
          toolchain_digest="sha256:$(printf '%s\n' "$(go env GOVERSION)" "$(go env GOOS)" "$(go env GOARCH)" | sha256sum | awk '{print $1}')"
          cache_state="cold-per-measurement;setup-go-cache=false;GOCACHE-isolated;GOMODCACHE-shared-read-only"
          gomodcache="$(go env GOMODCACHE)"
          benchmark_name="BenchmarkRefreshExactInput"
          benchmark_harness="internal/lsp/server_part01_test.go"

          measure_command() {
            local root="$1"
            local cache="$2"
            local label="$3"
            shift 3
            local sample="$work/measurements/$label"
            local start_ns
            local finish_ns
            local wall_ns
            local wall_ms
            local peak_rss_kib
            mkdir -p "$sample" "$cache"
            start_ns="$(date +%s%N)"
            (cd "$root" && /usr/bin/time -f '%M' -o "$sample/rss" env LANG=C LC_ALL=C TZ=UTC NO_COLOR=1 GOCACHE="$cache" GOMODCACHE="$gomodcache" GOTOOLCHAIN=local GOFLAGS=-mod=readonly "$@") > "$sample/stdout" 2> "$sample/stderr"
            finish_ns="$(date +%s%N)"
            wall_ns=$((finish_ns - start_ns))
            wall_ms=$(( (wall_ns + 999999) / 1000000 ))
            peak_rss_kib="$(tr -d '[:space:]' < "$sample/rss")"
            jq -cn --argjson wall_ms "$wall_ms" --argjson peak_rss_kib "$peak_rss_kib" \
              '{wall_ms:$wall_ms,peak_rss_kib:$peak_rss_kib}'
          }

          run_side() {
            local side="$1"
            local root="$2"
            local first="$work/$side/output-first"
            local replay="$work/$side/output-replay"
            local generation
            local build
            local test
            local benchmark
            local executed
            local primary_count
            local allocation_count
            local allocation_bytes
            local go_lines
            local gooo_lines
            mkdir -p "$first" "$replay"
            if [ "$side" = baseline ]; then
              cp "$candidate_root/$benchmark_harness" "$root/$benchmark_harness"
            fi
            generation="$(measure_command "$root" "$work/cache-$side-generation" "$side-generation" go run ./cmd/gooo generate "$fixture" --out "$first")"
            measure_command "$root" "$work/cache-$side-replay" "$side-replay" go run ./cmd/gooo generate "$fixture" --out "$replay" >/dev/null
            build="$(measure_command "$root" "$work/cache-$side-build" "$side-build" go test ./internal/lsp -run '^$' -count=1)"
            test="$(measure_command "$root" "$work/cache-$side-test" "$side-test" go test ./internal/lsp -run '^TestServerLifecycleDiagnosticsAndFeatures$' -count=1 -json)"
            benchmark="$(measure_command "$root" "$work/cache-$side-benchmark" "$side-benchmark" go test ./internal/lsp -run '^$' -bench "^${benchmark_name}$" -benchmem -count=1)"
            executed="$(jq -s '[.[] | select(.Action == "pass" and .Test != null)] | length' "$work/measurements/$side-test/stdout")"
            primary_count="$(awk -v name="$benchmark_name" '$1 ~ "^" name {for (i = 1; i <= NF; i++) if ($i == "parse-calls/op") {printf "%.0f\n", $(i - 1); exit}}' "$work/measurements/$side-benchmark/stdout")"
            allocation_count="$(awk -v name="$benchmark_name" '$1 ~ "^" name {for (i = 1; i <= NF; i++) if ($i == "allocs/op") {print $(i - 1); exit}}' "$work/measurements/$side-benchmark/stdout")"
            allocation_bytes="$(awk -v name="$benchmark_name" '$1 ~ "^" name {for (i = 1; i <= NF; i++) if ($i == "B/op") {print $(i - 1); exit}}' "$work/measurements/$side-benchmark/stdout")"
            go_lines="$(wc -l < "$root/internal/lsp/features_part03.go" | tr -d ' ')"
            gooo_lines="$(wc -l < "$candidate_root/$program" | tr -d ' ')"
            test -n "$primary_count"
            test -n "$allocation_count"
            test -n "$allocation_bytes"
            jq -n \
              --argjson generation "$generation" \
              --argjson build "$build" \
              --argjson test "$test" \
              --argjson executed "$executed" \
              --argjson primary_count "$primary_count" \
              --argjson benchmark "$benchmark" \
              --argjson allocation_count "$allocation_count" \
              --argjson allocation_bytes "$allocation_bytes" \
              --argjson go_lines "$go_lines" \
              --argjson gooo_lines "$gooo_lines" \
              '{generation:$generation,benchmark:$benchmark,build:$build,test:$test,executed_tests:$executed,reused_tests:0,primary_operation_count:$primary_count,allocation_count:$allocation_count,allocation_bytes:$allocation_bytes,go_lines:$go_lines,gooo_lines:$gooo_lines}' > "$work/$side/measurements.json"
            if [ "$side" = baseline ]; then
              git show "$BASE_SHA:$benchmark_harness" > "$root/$benchmark_harness"
            fi
          }

          run_side baseline "$baseline_root"
          run_side candidate "$candidate_root"

          behavior_equal=true
          if ! cmp -s "$work/baseline/output-first/semantic.gooo.go" "$work/candidate/output-first/semantic.gooo.go"; then
            behavior_equal=false
          fi
          deterministic_equal=true
          if ! cmp -s "$work/baseline/output-first/semantic.gooo.go" "$work/baseline/output-replay/semantic.gooo.go"; then
            deterministic_equal=false
          fi
          if ! cmp -s "$work/candidate/output-first/semantic.gooo.go" "$work/candidate/output-replay/semantic.gooo.go"; then
            deterministic_equal=false
          fi

          evidence_baseline_primary="$(jq -r '.baseline_primary_operation_count' "$work/candidate-evidence.json")"
          evidence_candidate_primary="$(jq -r '.candidate_primary_operation_count' "$work/candidate-evidence.json")"
          baseline_primary="$(jq -r '.primary_operation_count' "$work/baseline/measurements.json")"
          candidate_primary="$(jq -r '.primary_operation_count' "$work/candidate/measurements.json")"
          test "$baseline_primary" = "$evidence_baseline_primary"
          test "$candidate_primary" = "$evidence_candidate_primary"
          baseline_transformation="$(jq -r '.baseline_transformation_count' "$work/candidate-evidence.json")"
          candidate_transformation="$(jq -r '.candidate_transformation_count' "$work/candidate-evidence.json")"
          baseline_metrics="$(jq -n --argjson p "$baseline_primary" --argjson transformation "$baseline_transformation" --slurpfile m "$work/baseline/measurements.json" '{transformation_count:$transformation,primary_operation_count:$p,allocation_count:$m[0].allocation_count,allocation_bytes:$m[0].allocation_bytes,wall_ms:$m[0].benchmark.wall_ms,peak_rss_kib:$m[0].benchmark.peak_rss_kib,build_ms:$m[0].build.wall_ms,test_ms:$m[0].test.wall_ms,executed_tests:$m[0].executed_tests,reused_tests:$m[0].reused_tests,input_descendant_dirs:0,input_regular_files:1,input_go_physical_lines:$m[0].go_lines,input_gooo_physical_lines:$m[0].gooo_lines,output_artifact_files:6}')"
          candidate_metrics="$(jq -n --argjson p "$candidate_primary" --argjson transformation "$candidate_transformation" --slurpfile m "$work/candidate/measurements.json" '{transformation_count:$transformation,primary_operation_count:$p,allocation_count:$m[0].allocation_count,allocation_bytes:$m[0].allocation_bytes,wall_ms:$m[0].benchmark.wall_ms,peak_rss_kib:$m[0].benchmark.peak_rss_kib,build_ms:$m[0].build.wall_ms,test_ms:$m[0].test.wall_ms,executed_tests:$m[0].executed_tests,reused_tests:$m[0].reused_tests,input_descendant_dirs:0,input_regular_files:1,input_go_physical_lines:$m[0].go_lines,input_gooo_physical_lines:$m[0].gooo_lines,output_artifact_files:6}')"
          memory_guardrail="$(jq -n --argjson b "$baseline_metrics" --argjson c "$candidate_metrics" '($b.peak_rss_kib > 0 and $c.peak_rss_kib > 0 and $b.peak_rss_kib <= 1048576 and $c.peak_rss_kib <= 1048576)')"
          time_guardrail="$(jq -n --argjson b "$baseline_metrics" --argjson c "$candidate_metrics" '($b.wall_ms > 0 and $c.wall_ms > 0 and $b.wall_ms <= 120000 and $c.wall_ms <= 120000 and $b.build_ms > 0 and $c.build_ms > 0 and $b.test_ms > 0 and $c.test_ms > 0)')"

          jq -n \
            --arg scenario_id NORMAL \
            --arg source_digest "$source_digest" \
            --arg profile_digest "$profile_digest" \
            --arg contract_digest "$contract_digest" \
            --arg toolchain_digest "$toolchain_digest" \
            --arg cache_state "$cache_state" \
            --arg primary_metric lsp_refresh_parse_calls \
            --arg authority_program lsp.refresh:reuse-exact-document-cache/v1 \
            --arg graph_hash "$(jq -r .graph_hash "$work/authority.graph.json")" \
            --argjson before "$baseline_metrics" \
            --argjson after "$candidate_metrics" \
            --argjson behavior_equal "$behavior_equal" \
            --argjson deterministic_equal "$deterministic_equal" \
            --argjson memory_guardrail "$memory_guardrail" \
            --argjson time_guardrail "$time_guardrail" \
            '{scenario_id:$scenario_id,source_digest:$source_digest,profile_digest:$profile_digest,contract_digest:$contract_digest,toolchain_digest:$toolchain_digest,cache_state:$cache_state,primary_metric:$primary_metric,before_context:{scenario_id:$scenario_id,source_digest:$source_digest,profile_digest:$profile_digest,contract_digest:$contract_digest,toolchain_digest:$toolchain_digest,cache_state:$cache_state,metric:$primary_metric},after_context:{scenario_id:$scenario_id,source_digest:$source_digest,profile_digest:$profile_digest,contract_digest:$contract_digest,toolchain_digest:$toolchain_digest,cache_state:$cache_state,metric:$primary_metric},before:$before,after:$after,semantic_guard:{behavior_equal:$behavior_equal,deterministic_equal:$deterministic_equal,memory_guardrail:$memory_guardrail,time_guardrail:$time_guardrail,ci_passed:true},repository_writes:0,local_test_executions:0,ci_passed:true,authority_program:$authority_program,graph_hash:$graph_hash}' > "$work/normal.json"
          test "$(git status --porcelain)" = ""

      - name: Independently recompute operation and compiler decisions
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/compiler-self-improvement"
          program=examples/compiler-self-improvement/operation-envelope.gooo
          go run ./scripts/compiler-self-improvement \
            -mode decide \
            -program "$program" \
            -graph "$work/authority.graph.json" \
            -normal "$work/normal.json" \
            -candidate-evidence "$work/candidate-evidence.json" \
            -envelope-dir "$work/operation-envelope" \
            -output "$work/report.json"
          go run ./scripts/compiler-self-improvement \
            -mode decide \
            -program "$program" \
            -graph "$work/authority.graph.json" \
            -normal "$work/normal.json" \
            -candidate-evidence "$work/candidate-evidence.json" \
            -envelope-dir "$work/operation-envelope" \
            -output "$work/report-replay.json"
          cmp -s "$work/report.json" "$work/report-replay.json"
          jq '{candidate_decision,scenario_suite_decision,envelope_suite_decision,counts,envelope_counts,scenarios:[.scenarios[]|{id,decision,reason,before,after,semantic_guard}]}' "$work/report.json"
          jq -e '.candidate_decision == "CLOSED" and .scenario_suite_decision == "REFUTED" and .envelope_suite_decision == "REFUTED" and .scenario_denominator == 3 and .envelope_scenario_denominator == 6 and .counts == {CLOSED:1,UNKNOWN:1,REFUTED:1} and .envelope_counts == {CLOSED:2,UNKNOWN:2,REFUTED:2} and .primary_metric == "lsp_refresh_parse_calls" and .repository_writes == 0 and .local_test_executions == 0 and (has("score") | not) and (has("aggregate") | not)' "$work/report.json" >/dev/null
          jq -e '.scenarios[] | select(.id == "NORMAL") | .decision == "CLOSED" and ((.before.primary_operation_count == 1 and .after.primary_operation_count == 0) or (.before.primary_operation_count == 0 and .after.primary_operation_count == 0)) and .before.wall_ms > 0 and .after.wall_ms > 0 and .before.peak_rss_kib > 0 and .after.peak_rss_kib > 0 and .before.allocation_count >= 0 and .after.allocation_count >= 0 and .semantic_guard.behavior_equal and .semantic_guard.deterministic_equal and .semantic_guard.memory_guardrail and .semantic_guard.time_guardrail and .semantic_guard.ci_passed' "$work/report.json" >/dev/null
          jq -e '.scenarios[] | select(.id == "UNKNOWN") | .decision == "UNKNOWN" and (.unknown | keys | sort) == ["blocked_by","next_operation","reason","stage","step","unknown_class"] and .unknown.stage == "COHERENCE" and .unknown.step == "COMPARE_EXACT_PAIR" and .unknown.reason == "MISSING_EXACT_INTEGER_PAIR" and .unknown.unknown_class == "INCOMPLETE_EVIDENCE" and .unknown.next_operation == "CAPTURE_EXACT_BEFORE_AFTER" and .unknown.blocked_by == ["before_after_pair"]' "$work/report.json" >/dev/null
          jq -e '.scenarios[] | select(.id == "REFUTED") | .decision == "REFUTED" and (.semantic_guard.memory_guardrail | not) and .reason == "SEMANTIC_OR_GUARDRAIL_NON_REGRESSION_FAILED"' "$work/report.json" >/dev/null

      - name: Write the caller-owned adoption receipt
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/compiler-self-improvement"
          artifact="$work/artifact"
          mkdir -p "$artifact"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then lifecycle=POST_ADOPTION; else lifecycle=PRE_ADOPTION; fi
          report_digest="sha256:$(sha256sum "$work/report.json" | awk '{print $1}')"
          candidate_digest="$(jq -r '.candidate_source_digest' "$work/candidate-evidence.json")"
          graph_hash="$(jq -r '.graph_hash' "$work/authority.graph.json")"
          before="$(jq -c '.scenarios[] | select(.id == "NORMAL") | .before' "$work/report.json")"
          after="$(jq -c '.scenarios[] | select(.id == "NORMAL") | .after' "$work/report.json")"
          jq -S -n \
            --arg schema gooo/compiler-self-improvement-receipt/v2 \
            --arg lifecycle "$lifecycle" \
            --arg subject_sha "$HEAD_SHA" \
            --arg base_sha "$BASE_SHA" \
            --arg authority_program examples/compiler-self-improvement/operation-envelope.gooo \
            --arg target internal/lsp/features_part03.go \
            --arg candidate_digest "$candidate_digest" \
            --arg graph_hash "$graph_hash" \
            --arg report_digest "$report_digest" \
            --argjson before "$before" \
            --argjson after "$after" \
            --argjson repository_writes 0 \
            --argjson local_test_executions 0 \
            '{schema:$schema,lifecycle:$lifecycle,subject_sha:$subject_sha,base_sha:$base_sha,authority_program:$authority_program,target:$target,candidate_digest:$candidate_digest,graph_hash:$graph_hash,report_digest:$report_digest,before:$before,after:$after,repository_writes:$repository_writes,local_test_executions:$local_test_executions}' > "$work/receipt-payload.json"
          receipt_payload_digest="sha256:$(sha256sum "$work/receipt-payload.json" | awk '{print $1}')"
          jq --arg digest "$receipt_payload_digest" '. + {receipt_payload_digest:$digest}' "$work/receipt-payload.json" > "$work/post-adoption-receipt.json"
          test "$(git status --porcelain)" = ""
          cp "$work/authority.graph.json" "$artifact/authority.graph.json"
          cp "$work/candidate-evidence.json" "$artifact/candidate-evidence.json"
          cp "$work/candidate-lsp-refresh.go" "$artifact/generated-candidate-lsp-refresh.go"
          cp "$work/candidate.patch" "$artifact/generated-candidate.patch"
          cp "$work/normal.json" "$artifact/normal-observation.json"
          cp "$work/report.json" "$artifact/decision-report.json"
          cp "$work/post-adoption-receipt.json" "$artifact/post-adoption-receipt.json"
          cp "$work/baseline/measurements.json" "$artifact/baseline-measurements.json"
          cp "$work/candidate/measurements.json" "$artifact/candidate-measurements.json"
          cp -R "$work/operation-envelope" "$artifact/operation-envelope"
          {
            echo "### Compiler self-improvement"
            jq -r '"- lifecycle: \(.lifecycle)"' "$work/post-adoption-receipt.json"
            jq -r '"- candidate decision: \(.candidate_decision); envelope: \(.envelope_suite_decision); counts: \(.envelope_counts.CLOSED)/\(.envelope_counts.UNKNOWN)/\(.envelope_counts.REFUTED)"' "$work/report.json"
            jq -r '"- exact unchanged-refresh parse-call count: \(.scenarios[] | select(.id=="NORMAL") | .before.primary_operation_count) -> \(.after.primary_operation_count)"' "$work/report.json"
            jq -r '"- report digest: \(.report_digest)"' "$work/post-adoption-receipt.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact-head compiler evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compiler-self-improvement-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/compiler-self-improvement
          if-no-files-found: error
          retention-days: 30
