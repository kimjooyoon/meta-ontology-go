name: Cache inventory

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/cache-inventory.yml
      - scripts/ci-tooling/cache-inventory.sh
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/cache-inventory.yml
      - scripts/ci-tooling/cache-inventory.sh
  schedule:
    - cron: '31 4 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: ci-tooling-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.run_attempt > 1 && format('replay-{0}', github.run_id) || 'head' }}
  cancel-in-progress: true

jobs:
  cache-inventory:
    name: cache inventory
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      CACHE_INVENTORY_OUTPUT_DIR: ci-tooling-output/cache-inventory
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Inventory caches without mutation
        run: bash scripts/ci-tooling/cache-inventory.sh
        env:
          OBSERVE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          OBSERVE_RUN_ID: ${{ github.run_id }}
          OBSERVE_RUN_ATTEMPT: ${{ github.run_attempt }}
          OBSERVE_SCOPE: repository Actions caches; no deletions

      - name: Upload cache inventory evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cache-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-tooling-output/cache-inventory
          if-no-files-found: error
