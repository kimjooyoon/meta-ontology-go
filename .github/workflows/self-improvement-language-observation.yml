name: Self-improvement language observation

on:
  pull_request:
    branches: [dev]
  workflow_run:
    workflows: ["Language example experiment"]
    types: [completed]

permissions:
  actions: read
  attestations: write
  contents: read
  id-token: write

jobs:
  observation:
    name: Bind read-only language observation
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      SUBJECT_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
      HEAD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
      TOOLING_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      SOURCE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || github.run_id }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TOOLING_SHA }}
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          cache: false

      - name: Compile transport metaprogram from workflow authority
        shell: bash
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/transport-tool"
          mkdir -p "$tool"
          go build -o "$tool/self-improvement-transport" ./scripts/self-improvement-transport
          cp examples/self-improvement/transport.gooo "$tool/transport.gooo"

      - name: Checkout producer-declared logical subject
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SUBJECT_SHA }}
          persist-credentials: false

      - name: Download exact language experiment
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v8
        with:
          name: language-example-experiment-${{ env.SUBJECT_SHA }}
          path: ${{ runner.temp }}/observation/input
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Reproduce exact language experiment for PR
        if: github.event_name == 'pull_request'
        shell: bash
        run: bash scripts/language-example-experiment/main.sh

      - name: Compile Gooo observation contract and replay input
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            input="$RUNNER_TEMP/observation/input"
          else
            input="$RUNNER_TEMP/language-example-experiment"
          fi
          output="$RUNNER_TEMP/observation/output"
          mkdir -p "$output"
          go run ./scripts/self-improvement-contract \
            -contract examples/self-improvement/main.gooo \
            -commit "$SUBJECT_SHA" -output "$output/contract.json" -check
          for pass in first second; do
            go run ./scripts/self-improvement-observation \
              -head-sha "$SUBJECT_SHA" -source-run-id "$SOURCE_RUN_ID" \
              -report "$input/report.json" \
              -counterexamples "$input/counterexamples.json" \
              -contract "$output/contract.json" \
              -output "$output/$pass.json" -check
          done
          cmp "$output/first.json" "$output/second.json"

      - name: Bind producer-declared subject to transport contract
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/observation/output"
          artifact="$RUNNER_TEMP/observation/artifact"
          mkdir -p "$artifact"
          "$RUNNER_TEMP/transport-tool/self-improvement-transport" \
            -mode produce \
            -contract "$RUNNER_TEMP/transport-tool/transport.gooo" \
            -repository "$GITHUB_REPOSITORY" \
            -subject-sha "$SUBJECT_SHA" \
            -checkout-sha "$(git rev-parse HEAD)" \
            -workflow-ref "$GITHUB_WORKFLOW_REF" \
            -workflow-sha "$GITHUB_WORKFLOW_SHA" \
            -run-id "$GITHUB_RUN_ID" -run-attempt "$GITHUB_RUN_ATTEMPT" \
            -job observation -artifact-name self-improvement-language-observation \
            -observation "$output/first.json" \
            -output "$output/producer.json" -check
          cp "$output/first.json" "$artifact/first.json"
          cp "$output/producer.json" "$artifact/producer.json"

      - name: Upload exact-head read-only observation
        if: always()
        id: upload-observation
        uses: actions/upload-artifact@v6
        with:
          name: self-improvement-language-observation
          path: ${{ runner.temp }}/observation/artifact
          if-no-files-found: error
          retention-days: 14

      - name: Attest exact-head observation artifact
        if: success()
        id: attest-observation
        uses: actions/attest@v4
        with:
          subject-name: self-improvement-language-observation
          subject-digest: sha256:${{ steps.upload-observation.outputs.artifact-digest }}
