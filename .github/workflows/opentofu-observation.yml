name: OpenTofu released-CLI observation

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: opentofu-observation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  observe:
    name: OpenTofu released-CLI observation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GOTOOLCHAIN: go1.27.0
      GOWORK: "off"
      GOFLAGS: -mod=readonly
      TF_IN_AUTOMATION: "1"
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go 1.27 observer
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: false
      - name: Observe released OpenTofu CLI
        shell: bash
        run: bash scripts/opentofu-observation/main.sh
      - name: Upload OpenTofu observation artifact
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: opentofu-observation-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/opentofu-observation
          if-no-files-found: error
          retention-days: 30
