name: Self-improvement candidate execution contract

on:
  pull_request:
    branches: [dev]
    paths:
      - '.github/agent-scope-table.md'
      - '.github/ci-governance.json'
      - '.github/workflows/self-improvement-execution-contract.yml'
      - 'examples/language-syntax-roundtrip/corpus.json'
      - 'examples/self-improvement-execution-contract/**'
      - 'internal/meta/languagereadiness/languagesyntax/conformance/evaluate_test.go'
      - 'internal/meta/languagereadiness/languagesyntax/model.go'
      - 'internal/meta/languagereadiness/languagesyntax/registry.go'
      - 'internal/meta/selfimprovementexecutioncontract/**'
      - 'internal/verify/scope_gooo_self_improvement_execution_contract_v25.go'
      - 'scripts/self-improvement-execution-contract/**'
      - 'go.mod'
      - 'go.sum'
  push:
    branches: [dev]
    paths:
      - '.github/agent-scope-table.md'
      - '.github/ci-governance.json'
      - '.github/workflows/self-improvement-execution-contract.yml'
      - 'examples/language-syntax-roundtrip/corpus.json'
      - 'examples/self-improvement-execution-contract/**'
      - 'internal/meta/languagereadiness/languagesyntax/conformance/evaluate_test.go'
      - 'internal/meta/languagereadiness/languagesyntax/model.go'
      - 'internal/meta/languagereadiness/languagesyntax/registry.go'
      - 'internal/meta/selfimprovementexecutioncontract/**'
      - 'internal/verify/scope_gooo_self_improvement_execution_contract_v25.go'
      - 'scripts/self-improvement-execution-contract/**'
      - 'go.mod'
      - 'go.sum'
  workflow_run:
    workflows: ["Self-improvement candidate authorization bridge"]
    types: [completed]
    branches: [dev]

permissions:
  actions: read
  contents: read

jobs:
  execution-contract:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      SUBJECT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      SOURCE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly

    steps:
      - name: Check out the exact subject
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Go 1.27
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          cache: false

      - name: Bind the exact subject and toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = "go1.27.0"
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          test "$(git status --porcelain)" = ""

      - name: Emit and replay the nine v25 canonical contract cases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/self-improvement-execution-contract"
          go run ./scripts/self-improvement-execution-contract \
            -mode cases \
            -contract examples/self-improvement-execution-contract/contract.gooo \
            -output "$RUNNER_TEMP/self-improvement-execution-contract/canonical-cases.json" \
            -check
          jq -e '
            .schema == "gooo/self-improvement-execution-contract-cases/v1" and
            .case_denominator == 9 and
            .counts == {CLOSED:3,UNKNOWN:3,REFUTED:3} and
            .closed_cases == 3 and .unknown_cases == 3 and .refuted_cases == 3 and
            .replay_equal and
            .bound_fields == 12 and .missing_fields == 0 and .contradictory_fields == 0 and
            .structural_candidate_to_operation_edges_before == 0 and
            .structural_candidate_to_operation_edges_after == 1 and
            .live_execution_count == 0 and .canonical_execution_count == 0 and
            .execution_grants == 0 and .repository_writes == 0 and
            .local_test_executions == 0 and .fallback_accepted == 0 and
            .independent_replay_comparisons == 1 and
            .artifact_files == 9 and .artifact_types == 3 and
            .performance_improvement == "UNKNOWN" and
            ([.cases[] | select(.pass == false)] | length) == 0' \
            "$RUNNER_TEMP/self-improvement-execution-contract/canonical-cases.json" >/dev/null

      - name: Download the v24 authorization request when available
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          run-id: ${{ env.SOURCE_RUN_ID }}
          name: self-improvement-candidate-authorization-${{ env.SUBJECT_SHA }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/self-improvement-execution-contract/v24

      - name: Emit live pre-execution contract without granting execution
        shell: bash
        run: |
          set -euo pipefail
          request=""
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            request="$(find "$RUNNER_TEMP/self-improvement-execution-contract/v24" -type f -name request.json -print -quit 2>/dev/null || true)"
          fi
          if [ -n "$request" ]; then
            go run ./scripts/self-improvement-execution-contract \
              -mode live \
              -contract examples/self-improvement-execution-contract/contract.gooo \
              -request "$request" \
              -output "$RUNNER_TEMP/self-improvement-execution-contract/live-contract.json" \
              -check
          else
            go run ./scripts/self-improvement-execution-contract \
              -mode live \
              -contract examples/self-improvement-execution-contract/contract.gooo \
              -output "$RUNNER_TEMP/self-improvement-execution-contract/live-contract.json" \
              -check
          fi
          jq -e '
            .schema == "gooo/self-improvement-execution-contract/v1" and
            .execution_authorized == false and .execution_grant_required and
            .execution_grant_blocked_by == "separate_execution_grant" and
            .max_executions == 1 and .repository_writes_allowed == false and
            .output_evidence_deferred and .runtime_result_deferred and
            .verification.verified and .verification.independent_replay_comparisons == 1 and
            ((.decision == "CLOSED" and .resolution == "DECLARED") or
             (.decision == "UNKNOWN" and (.unknown | type) == "object" and
              ((.unknown | keys | sort) == ["blocked_by","next_operation","reason","stage","step","unknown_class"])))' \
            "$RUNNER_TEMP/self-improvement-execution-contract/live-contract.json" >/dev/null
          jq -r '"live contract: \(.decision)/\(.resolution)/\(.reason), execution_authorized=\(.execution_authorized), grant_required=\(.execution_grant_required), writes=\(.metrics.repository_writes), local_tests=\(.metrics.local_test_executions)"' \
            "$RUNNER_TEMP/self-improvement-execution-contract/live-contract.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload v25 contract evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: self-improvement-execution-contract-${{ env.SUBJECT_SHA }}
          path: ${{ runner.temp }}/self-improvement-execution-contract/*.json
          if-no-files-found: error
          retention-days: 14
