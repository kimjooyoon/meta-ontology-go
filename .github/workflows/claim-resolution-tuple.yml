name: Claim resolution tuple

on:
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/claim-resolution-tuple.yml
      - cmd/gooo/**
      - docs/language/claim-resolution-tuple.md
      - examples/claim-resolution-tuple/**
      - internal/claimresolution/**
  push:
    branches: [dev]
    paths:
      - .github/workflows/claim-resolution-tuple.yml
      - cmd/gooo/**
      - docs/language/claim-resolution-tuple.md
      - examples/claim-resolution-tuple/**
      - internal/claimresolution/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.HEAD_SHA }}

      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.x
          check-latest: true

      - name: Verify immutable cross-consumer need
        shell: bash
        run: |
          set -euo pipefail
          lock=examples/claim-resolution-tuple/need-lock.json
          repository=$(jq -r .repository "$lock")
          tag=$(jq -r .tag "$lock")
          tag_object=$(jq -r .tag_object_sha "$lock")
          target=$(jq -r .target_commit_sha "$lock")
          asset_id=$(jq -r .asset.id "$lock")
          asset_name=$(jq -r .asset.name "$lock")
          digest=$(jq -r .asset.sha256 "$lock")
          ref=$(gh api "repos/$repository/git/ref/tags/$tag")
          jq -e --arg sha "$tag_object" '.object.type=="tag" and .object.sha==$sha' <<<"$ref" >/dev/null
          gh api "repos/$repository/git/tags/$tag_object" | jq -e --arg sha "$target" '.object.type=="commit" and .object.sha==$sha' >/dev/null
          release="$RUNNER_TEMP/need-release.json"
          gh api "repos/$repository/releases/tags/$tag" > "$release"
          test "$(jq -r --arg name "$asset_name" '.assets[]|select(.name==$name)|.id' "$release")" = "$asset_id"
          gh api -H 'Accept: application/octet-stream' "repos/$repository/releases/assets/$asset_id" > "$RUNNER_TEMP/primitive-need.json"
          printf '%s  %s\n' "$digest" "$RUNNER_TEMP/primitive-need.json" | sha256sum -c -
          jq -e '.decision=="CROSS_CONSUMER_PRIMITIVE_NEED_OBSERVED" and .summary.closed==12 and .summary.consumer_releases==3 and .summary.common_envelopes==3 and .summary.claim_states==3 and .summary.unknown_producers==2 and .summary.typed_unknown_roles==2 and .summary.compatibility_gaps==1 and .summary.direct_mappings==0 and .candidate.id=="gooo.primitive.claim-resolution-tuple.v1" and .candidate.implementation_status=="NOT_SELECTED" and .claim.next_operation=="DEFINE_MINIMAL_CLAIM_RESOLUTION_CORE_CONTRACT"' "$RUNNER_TEMP/primitive-need.json" >/dev/null

      - name: Go 1.27 tool and source conformance
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(go env GOVERSION)" == go1.27.* ]]
          go fix ./internal/claimresolution ./cmd/gooo
          gofmt -w \
            cmd/gooo/main_part01.go \
            cmd/gooo/usage.go \
            cmd/gooo/claim_resolution_options.go \
            cmd/gooo/claim_resolution_run.go \
            internal/claimresolution/model.go \
            internal/claimresolution/parse.go \
            internal/claimresolution/resolve.go \
            internal/claimresolution/resolve_test.go \
            internal/verify/scope_claim_resolution_tuple.go
          git diff --exit-code
          go vet ./internal/claimresolution ./cmd/gooo
          go test ./internal/claimresolution ./cmd/gooo -run ClaimResolution
          go build -o "$RUNNER_TEMP/gooo" ./cmd/gooo
          "$RUNNER_TEMP/gooo" check --json examples/claim-resolution-tuple/main.gooo > "$RUNNER_TEMP/source-check.json"
          jq -e '.status=="ok"' "$RUNNER_TEMP/source-check.json" >/dev/null

      - name: Resolve valid states and fail closed counterexamples
        shell: bash
        run: |
          set -euo pipefail
          gooo="$RUNNER_TEMP/gooo"
          source=examples/claim-resolution-tuple/main.gooo
          output="$RUNNER_TEMP/claim-resolution"
          mkdir -p "$output"
          valid=(ClosedClaim UnknownDirectClaim UnknownContextClaim RefutedClaim)
          invalid=(InvalidUnknownClaim InvalidStateClaim)
          for pass in first second; do
            for activity in "${valid[@]}"; do
              "$gooo" claim resolve "$source" --activity "$activity" --json > "$output/$activity-$pass.json"
            done
            for activity in "${invalid[@]}"; do
              if "$gooo" claim resolve "$source" --activity "$activity" --json > "$output/$activity-$pass.json"; then
                echo "$activity unexpectedly resolved" >&2
                exit 1
              fi
            done
          done
          for activity in "${valid[@]}" "${invalid[@]}"; do
            cmp -s "$output/$activity-first.json" "$output/$activity-second.json"
          done
          jq -e '.decision=="CLAIM_RESOLUTION_OBSERVED" and .claim=={state:"CLOSED",stage:null,step:null,reason:"CLAIM_EVIDENCE_CLOSED",unknown_class:null,next_operation:"NONE"} and .summary.fields_observed==6 and .summary.fields_total==6' "$output/ClosedClaim-first.json" >/dev/null
          jq -e '.decision=="CLAIM_RESOLUTION_OBSERVED" and .claim.state=="UNKNOWN" and .claim.stage=="SOURCE" and .claim.step=="OBSERVE_INPUT" and .claim.unknown_class=="DIRECT_MISSING" and .claim.next_operation=="PROVIDE_INPUT"' "$output/UnknownDirectClaim-first.json" >/dev/null
          jq -e '.decision=="CLAIM_RESOLUTION_OBSERVED" and .claim.state=="UNKNOWN" and .claim.unknown_class=="CONTEXT_MISSING" and .claim.next_operation=="PROVIDE_CONTEXT"' "$output/UnknownContextClaim-first.json" >/dev/null
          jq -e '.decision=="CLAIM_RESOLUTION_OBSERVED" and .claim.state=="REFUTED" and .claim.unknown_class==null and .claim.next_operation=="RESTORE_EXPECTED_INPUT"' "$output/RefutedClaim-first.json" >/dev/null
          jq -e '.decision=="FAIL_CLOSED" and .claim.state=="REFUTED" and .claim.reason=="UNKNOWN_TUPLE_INCOMPLETE" and .claim.next_operation=="PROVIDE_COMPLETE_UNKNOWN_TUPLE"' "$output/InvalidUnknownClaim-first.json" >/dev/null
          jq -e '.decision=="FAIL_CLOSED" and .claim.state=="REFUTED" and .claim.reason=="CLAIM_STATE_UNKNOWN" and .claim.next_operation=="RESTORE_CLOSED_UNKNOWN_OR_REFUTED_STATE"' "$output/InvalidStateClaim-first.json" >/dev/null
          jq -s -e --arg candidate "gooo.primitive.claim-resolution-tuple.v1" 'all(.[]; . as $report | .candidate_id==$candidate and .subject.binding=="GOOO_ACTIVITY_VALUE_PROGRAM" and (.indicators|all(.activity==$report.subject.activity)))' "$output/ClosedClaim-first.json" "$output/UnknownDirectClaim-first.json" "$output/UnknownContextClaim-first.json" "$output/RefutedClaim-first.json" >/dev/null

          start_ns=$(date +%s%N)
          /usr/bin/time -f '%M' -o "$RUNNER_TEMP/claim-resolution-rss" "$gooo" claim resolve "$source" --activity UnknownDirectClaim --json > /dev/null
          end_ns=$(date +%s%N)
          wall_ms=$(( (end_ns-start_ns)/1000000 ))
          test -z "$(git status --porcelain=v1)"
          jq -S -n --arg subject_sha "$HEAD_SHA" --arg go_version "$(go env GOVERSION)" --argjson peak_rss_kib "$(cat "$RUNNER_TEMP/claim-resolution-rss")" --argjson wall_ms "$wall_ms" '{schema:"gooo/claim-resolution/runtime/v1",subject_sha:$subject_sha,go_version:$go_version,cases:{valid:{observed:4,total:4},invalid:{refuted:2,total:2},replays:{equal:6,total:6}},resolver:{peak_rss_kib:$peak_rss_kib,wall_ms:$wall_ms},repository_writes:0,local_tests_run:0,cross_project_required_gates:0}' > "$output/runtime.json"
          {
            echo '## Claim resolution tuple'
            echo '- immutable consumer need: 12/12 CLOSED'
            echo '- base fields: 6/6'
            echo '- states: 3/3'
            echo '- valid cases: 4/4'
            echo '- fail-closed counterexamples: 2/2'
            echo '- deterministic replays: 6/6'
            jq -r '"- resolver: \(.resolver.peak_rss_kib) KiB / \(.resolver.wall_ms) ms","- Go: \(.go_version)","- repository writes: \(.repository_writes)","- local tests: \(.local_tests_run)"' "$output/runtime.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload claim resolution receipts
        uses: actions/upload-artifact@v6
        with:
          name: claim-resolution-tuple-${{ env.HEAD_SHA }}
          path: |
            ${{ runner.temp }}/primitive-need.json
            ${{ runner.temp }}/source-check.json
            ${{ runner.temp }}/claim-resolution/*-first.json
            ${{ runner.temp }}/claim-resolution/runtime.json
          if-no-files-found: error
          retention-days: 14
