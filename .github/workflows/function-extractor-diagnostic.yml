name: Function extractor diagnostic

on:
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/function-extractor-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: function-extractor-diagnostic-${{ github.ref }}
  cancel-in-progress: false

env:
  SUBJECT_SHA: e86c8183a6afde47cee848fb567ece317345dd23
  SOURCE_RUN_ID: '33969275768'
  SOURCE_ARTIFACT_ID: '9970866969'
  SOURCE_ARTIFACT_NAME: transformation-effect-focused-e86c8183a6afde47cee848fb567ece317345dd23
  SOURCE_ARTIFACT_DIGEST: sha256:424339c5ed6e20b37cf67612775cd291ed086156c41d880c4708718d70dd3d99
  MAX_CAPTURE_BYTES: '262144'
  HELPER_TIMEOUT_SECONDS: '45'
  META_EXECUTION_TIMEOUT_SECONDS: '180'

jobs:
  diagnose:
    name: Diagnose function extractor process boundary
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source subject
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go 1.27
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: false

      - name: Materialize exact logical workspace
        id: materialize
        uses: ./.github/actions/materialize
        with:
          expected-sha: ${{ env.SUBJECT_SHA }}

      - name: Resolve exact source artifact and derive helper inputs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/function-extractor-diagnostic"
          source_input="$root/source-input"
          derived_input="$root/derived-extractor-inputs"
          mkdir -p "$source_input" "$derived_input"
          printf '%s\n' "$GITHUB_SHA" > "$root/workflow-implementation-sha.txt"
          printf '%s\n' "$SUBJECT_SHA" > "$root/source-subject-sha.txt"

          repository="$GITHUB_REPOSITORY"
          metadata="$root/source-artifact-metadata.json"
          gh api "repos/$repository/actions/artifacts/$SOURCE_ARTIFACT_ID" > "$metadata"
          jq -e \
            --arg name "$SOURCE_ARTIFACT_NAME" \
            --arg digest "$SOURCE_ARTIFACT_DIGEST" \
            --arg sha "$SUBJECT_SHA" \
            --argjson artifact_id "$SOURCE_ARTIFACT_ID" \
            --argjson run_id "$SOURCE_RUN_ID" \
            '.id == $artifact_id and
             .name == $name and
             .expired == false and
             .digest == $digest and
             .workflow_run.id == $run_id and
             .workflow_run.head_sha == $sha' \
            "$metadata" >/dev/null

          archive="$root/source-artifact.zip"
          gh api -H 'Accept: application/octet-stream' \
            "repos/$repository/actions/artifacts/$SOURCE_ARTIFACT_ID/zip" > "$archive"
          printf '%s  %s\n' "$SOURCE_ARTIFACT_DIGEST" "$archive" | sha256sum --check --strict -

          archive_list="$root/source-artifact-members.txt"
          unzip -Z1 "$archive" | sed '/\/$/d' | LC_ALL=C sort > "$archive_list"
          mapfile -t members < "$archive_list"
          test "${#members[@]}" -eq 7
          test "$(LC_ALL=C sort -u "$archive_list" | wc -l | tr -d '[:space:]')" -eq 7
          for member in "${members[@]}"; do
            case "$member" in
              input/meta-actionability-report.json|\
              input/meta-binding-report.json|\
              input/self-improvement-execution.json|\
              input/self-improvement-plan.json|\
              input/source-metrics-raw.json|\
              input/source-metrics.json|repository-before.txt)
                ;;
              *)
                echo "unexpected source artifact member: $member" >&2
                exit 1
                ;;
            esac
          done

          for file_name in \
            meta-actionability-report.json \
            meta-binding-report.json \
            self-improvement-execution.json \
            self-improvement-plan.json \
            source-metrics-raw.json \
            source-metrics.json; do
            unzip -p "$archive" "input/$file_name" > "$source_input/$file_name"
            test -s "$source_input/$file_name"
            jq -e 'type == "object"' "$source_input/$file_name" >/dev/null
          done

          unzip -p "$archive" repository-before.txt > "$root/source-repository-before.txt"
          test ! -s "$root/source-repository-before.txt"
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"

          plan_file="$source_input/self-improvement-plan.json"
          jq -e \
            --arg sha "$SUBJECT_SHA" \
            '.decision == "PLAN" and .source_sha == $sha and
             ([.selected[] | select(.meta_operation == "extract-function")] | length) == 1' \
            "$plan_file" >/dev/null
          action_indicator_id="$(jq -r '.selected[] | select(.meta_operation == "extract-function") | .indicator_id' "$plan_file")"
          action_subject="$(jq -r '.selected[] | select(.meta_operation == "extract-function") | .subject' "$plan_file")"
          action_executor="$(jq -r '.selected[] | select(.meta_operation == "extract-function") | .executor' "$plan_file")"
          test "$action_executor" = 'bootstrap/function-extractor'
          [[ "$action_subject" == *:*:* ]]
          subject_path="${action_subject%%:*}"
          subject_tail="${action_subject#*:}"
          subject_name="${subject_tail##*:}"
          test -n "$subject_path"
          test -n "$subject_name"
          subject_file="$GITHUB_WORKSPACE/$subject_path"
          test -f "$subject_file"
          physical_lines="$(awk 'END {print NR}' "$subject_file")"
          test "$physical_lines" -ge 0

          jq -n \
            --arg schema 'gooo.logical-split-plan.v1' \
            --arg sha "$SUBJECT_SHA" \
            --arg logical "$subject_path" \
            --argjson lines "$physical_lines" \
            '{schema:$schema,source_sha:$sha,subjects:[{logical:$logical,lines:$lines,reason:"fixed-declaration-capacity"}]}' \
            > "$derived_input/meta-execution-function-plan.json"
          jq -n \
            --arg schema 'gooo.line-density-rewrite.v1' \
            --arg sha "$SUBJECT_SHA" \
            --arg logical "$subject_path" \
            '{schema:$schema,source_sha:$sha,subjects:[{logical:$logical,status:"blocked"}]}' \
            > "$derived_input/meta-execution-function-density.json"
          plan_digest="sha256:$(sha256sum "$plan_file" | awk '{print $1}')"
          jq -n \
            --arg schema 'gooo/function-extractor-diagnostic-input/v1' \
            --arg source_sha "$SUBJECT_SHA" \
            --arg source_run_id "$SOURCE_RUN_ID" \
            --arg source_artifact_id "$SOURCE_ARTIFACT_ID" \
            --arg source_artifact_digest "$SOURCE_ARTIFACT_DIGEST" \
            --arg plan_digest "$plan_digest" \
            --arg action_indicator_id "$action_indicator_id" \
            --arg action_subject "$action_subject" \
            --arg action_executor "$action_executor" \
            --arg subject_path "$subject_path" \
            --arg subject_name "$subject_name" \
            --arg input_contract_source_digest "$(jq -r '.selected[] | select(.meta_operation == "extract-function") | .input_contract_source_digest' "$plan_file")" \
            --arg input_contract_semantic_digest "$(jq -r '.selected[] | select(.meta_operation == "extract-function") | .input_contract_semantic_digest' "$plan_file")" \
            --argjson physical_lines "$physical_lines" \
            '{schema:$schema,diagnostic_only:true,source_sha:$source_sha,source_run_id:$source_run_id,source_artifact_id:$source_artifact_id,source_artifact_digest:$source_artifact_digest,plan_digest:$plan_digest,action_indicator_id:$action_indicator_id,action_subject:$action_subject,action_executor:$action_executor,input_contract_source_digest:$input_contract_source_digest,input_contract_semantic_digest:$input_contract_semantic_digest,subject_path:$subject_path,subject_name:$subject_name,physical_lines:$physical_lines}' \
            > "$root/source-binding.json"

      - name: Run diagnostic-only helper sampling
        shell: bash
        env:
          STORAGE_ROOT: ${{ steps.materialize.outputs.storage-root }}
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/function-extractor-diagnostic"
          source_input="$root/source-input"
          capture_root="$root/helper-captures"
          shim_dir="$root/shim"
          meta_dir="$root/meta-execution"
          execution_input="$root/execution-input"
          mkdir -p "$capture_root" "$shim_dir" "$meta_dir" "$execution_input"
          cp "$source_input/self-improvement-plan.json" "$execution_input/self-improvement-plan.json"
          cp "$source_input/source-metrics.json" "$execution_input/source-metrics.json"
          real_go="$(command -v go)"
          printf '%s\n' "$real_go" > "$root/real-go-path.txt"

          cat > "$shim_dir/go" <<'SHIM'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          export LC_ALL=C

          args=("$@")
          if (( ${#args[@]} < 2 )) || [[ "${args[0]}" != "run" || "${args[1]}" != "./bootstrap/function-extractor" ]]; then
            exec "$DIAGNOSTIC_REAL_GO" "${args[@]}"
          fi

          capture_root="$DIAGNOSTIC_CAPTURE_ROOT"
          mkdir -p "$capture_root"
          sequence_file="$capture_root/sequence.txt"
          sequence_lock="$capture_root/sequence.lock"
          exec 9>"$sequence_lock"
          flock 9
          previous_sequence=0
          if [[ -s "$sequence_file" ]]; then
            read -r previous_sequence < "$sequence_file"
          fi
          attempt_sequence=$((previous_sequence + 1))
          printf '%d\n' "$attempt_sequence" > "$sequence_file"
          flock -u 9
          exec 9>&-
          attempt_dir="$capture_root/attempt-$(printf '%03d' "$attempt_sequence")"
          mkdir -p "$attempt_dir"

          capture_stream() {
            local source_fifo="$1"
            local capture_file="$2"
            local bytes_file="$3"
            local truncated_file="$4"
            local total_bytes=0
            local captured_bytes=0
            local read_code=0
            local chunk=''
            local chunk_bytes=0
            local remaining=0
            local was_truncated=false
            : > "$capture_file"
            exec 3< "$source_fifo"
            while :; do
              chunk=''
              if IFS= read -r -N 4096 chunk <&3; then
                read_code=0
              else
                read_code=$?
              fi
              if [[ -n "$chunk" ]]; then
                printf '%s' "$chunk"
                chunk_bytes=${#chunk}
                total_bytes=$((total_bytes + chunk_bytes))
                if (( captured_bytes < DIAGNOSTIC_MAX_CAPTURE_BYTES )); then
                  remaining=$((DIAGNOSTIC_MAX_CAPTURE_BYTES - captured_bytes))
                  if (( chunk_bytes <= remaining )); then
                    printf '%s' "$chunk" >> "$capture_file"
                    captured_bytes=$((captured_bytes + chunk_bytes))
                  else
                    printf '%s' "${chunk:0:remaining}" >> "$capture_file"
                    captured_bytes=$DIAGNOSTIC_MAX_CAPTURE_BYTES
                  fi
                fi
                if (( total_bytes > DIAGNOSTIC_MAX_CAPTURE_BYTES )); then
                  was_truncated=true
                fi
              fi
              if (( read_code != 0 )); then
                break
              fi
            done
            exec 3<&-
            printf '%d\n' "$total_bytes" > "$bytes_file"
            printf '%s\n' "$was_truncated" > "$truncated_file"
          }

          stdout_fifo="$attempt_dir/stdout.pipe"
          stderr_fifo="$attempt_dir/stderr.pipe"
          mkfifo "$stdout_fifo" "$stderr_fifo"
          capture_stream "$stdout_fifo" "$attempt_dir/stdout.txt" "$attempt_dir/stdout-bytes.txt" "$attempt_dir/stdout-truncated.txt" &
          stdout_capture_pid=$!
          capture_stream "$stderr_fifo" "$attempt_dir/stderr.txt" "$attempt_dir/stderr-bytes.txt" "$attempt_dir/stderr-truncated.txt" >&2 &
          stderr_capture_pid=$!

          set +e
          GOTRACEBACK=system /usr/bin/timeout --verbose --signal=QUIT --kill-after=5s 45s \
            "$DIAGNOSTIC_REAL_GO" "${args[@]}" > "$stdout_fifo" 2> "$stderr_fifo"
          helper_exit_code=$?
          set -e
          wait "$stdout_capture_pid"
          wait "$stderr_capture_pid"
          rm -f "$stdout_fifo" "$stderr_fifo"

          stack_bytes=0
          stack_observation='UNKNOWN'
          if grep -Eq '^(SIGQUIT: quit|goroutine [0-9]+ )' "$attempt_dir/stderr.txt"; then
            stack_bytes="$(awk 'BEGIN {seen=0; total=0} /^(SIGQUIT: quit|goroutine [0-9]+ )/ {seen=1} seen {total += length($0)+1} END {print total+0}' "$attempt_dir/stderr.txt")"
            stack_observation='OBSERVED_IN_BOUNDED_CAPTURE'
          fi
          go_version="$($DIAGNOSTIC_REAL_GO version 2>&1)"
          jq -cn --args '$ARGS.positional' -- "${args[@]}" > "$attempt_dir/argv.json"
          jq -n \
            --arg schema 'gooo/function-extractor-diagnostic-receipt/v1' \
            --arg source_sha "$DIAGNOSTIC_SOURCE_SHA" \
            --arg plan_digest "$DIAGNOSTIC_PLAN_DIGEST" \
            --arg action_indicator_id "$DIAGNOSTIC_ACTION_INDICATOR_ID" \
            --arg action_subject "$DIAGNOSTIC_ACTION_SUBJECT" \
            --arg action_executor "$DIAGNOSTIC_ACTION_EXECUTOR" \
            --argjson helper_exit_code "$helper_exit_code" \
            --argjson attempt_sequence "$attempt_sequence" \
            --argjson stdout_bytes "$(cat "$attempt_dir/stdout-bytes.txt")" \
            --argjson stderr_bytes "$(cat "$attempt_dir/stderr-bytes.txt")" \
            --argjson captured_stdout_bytes "$(wc -c < "$attempt_dir/stdout.txt" | tr -d '[:space:]')" \
            --argjson captured_stderr_bytes "$(wc -c < "$attempt_dir/stderr.txt" | tr -d '[:space:]')" \
            --argjson stack_bytes "$stack_bytes" \
            --rawfile go_version <(printf '%s\n' "$go_version") \
            --rawfile stdout_truncated "$attempt_dir/stdout-truncated.txt" \
            --rawfile stderr_truncated "$attempt_dir/stderr-truncated.txt" \
            --arg stack_observation "$stack_observation" \
            --arg timeout_seconds "$DIAGNOSTIC_HELPER_TIMEOUT_SECONDS" \
            --argjson argv "$(cat "$attempt_dir/argv.json")" \
            '{schema:$schema,diagnostic_only:true,source_sha:$source_sha,plan_digest:$plan_digest,action_indicator_id:$action_indicator_id,action_subject:$action_subject,action_executor:$action_executor,attempt_sequence:$attempt_sequence,argv:$argv,go_version:($go_version|rtrimstr("\n")),timeout_seconds:($timeout_seconds|tonumber),helper_exit_code:$helper_exit_code,exit_code_source:"diagnostic helper observation",stdout_bytes:$stdout_bytes,stderr_bytes:$stderr_bytes,captured_stdout_bytes:$captured_stdout_bytes,captured_stderr_bytes:$captured_stderr_bytes,stdout_truncated:($stdout_truncated|rtrimstr("\n")|test("true")),stderr_truncated:($stderr_truncated|rtrimstr("\n")|test("true")),stack_bytes:$stack_bytes,stack_observation:$stack_observation}' \
            > "$attempt_dir/receipt.json"
          # The helper's original stdout/stderr were forwarded by capture_stream;
          # return its original status to the meta-execution caller unchanged.
          exit "$helper_exit_code"
          SHIM
          chmod 700 "$shim_dir/go"

          plan_digest="sha256:$(sha256sum "$source_input/self-improvement-plan.json" | awk '{print $1}')"
          action_indicator_id="$(jq -r '.action_indicator_id' "$root/source-binding.json")"
          action_subject="$(jq -r '.action_subject' "$root/source-binding.json")"
          action_executor="$(jq -r '.action_executor // "bootstrap/function-extractor"' "$root/source-binding.json")"
          export DIAGNOSTIC_REAL_GO="$real_go"
          export DIAGNOSTIC_CAPTURE_ROOT="$capture_root"
          export DIAGNOSTIC_MAX_CAPTURE_BYTES="$MAX_CAPTURE_BYTES"
          export DIAGNOSTIC_HELPER_TIMEOUT_SECONDS="$HELPER_TIMEOUT_SECONDS"
          export DIAGNOSTIC_SOURCE_SHA="$SUBJECT_SHA"
          export DIAGNOSTIC_PLAN_DIGEST="$plan_digest"
          export DIAGNOSTIC_ACTION_INDICATOR_ID="$action_indicator_id"
          export DIAGNOSTIC_ACTION_SUBJECT="$action_subject"
          export DIAGNOSTIC_ACTION_EXECUTOR="$action_executor"
          export METRICS_DIR="$execution_input"
          export PATH="$shim_dir:$PATH"

          test "$(command -v go)" = "$shim_dir/go"
          printf '%s\n' "$plan_digest" > "$root/plan-digest.txt"
          set +e
          /usr/bin/timeout --verbose --signal=TERM --kill-after=5s 180s \
            go run ./scripts/meta-execution \
              -plan "$execution_input/self-improvement-plan.json" \
              -output "$meta_dir/self-improvement-execution.json" \
            > "$meta_dir/stdout.txt" 2> "$meta_dir/stderr.txt"
          meta_exit_code=$?
          set -e
          printf '%s\n' "$meta_exit_code" > "$root/meta-execution-exit-code.txt"

          for stream_name in stdout stderr; do
            stream_file="$meta_dir/$stream_name.txt"
            stream_bytes="$(wc -c < "$stream_file" | tr -d '[:space:]')"
            stream_truncated=false
            if (( stream_bytes > MAX_CAPTURE_BYTES )); then
              head -c "$MAX_CAPTURE_BYTES" "$stream_file" > "$stream_file.capped"
              mv "$stream_file.capped" "$stream_file"
              stream_truncated=true
            fi
            printf '%s\n' "$stream_bytes" > "$meta_dir/$stream_name-bytes.txt"
            printf '%s\n' "$stream_truncated" > "$meta_dir/$stream_name-truncated.txt"
          done

          shopt -s nullglob
          receipts=("$capture_root"/attempt-*/receipt.json)
          test "${#receipts[@]}" -ge 1
          jq -s \
            --arg schema 'gooo/function-extractor-diagnostic-summary/v1' \
            --arg source_sha "$SUBJECT_SHA" \
            --arg workflow_implementation_sha "$GITHUB_SHA" \
            --arg source_artifact_id "$SOURCE_ARTIFACT_ID" \
            --arg source_artifact_digest "$SOURCE_ARTIFACT_DIGEST" \
            --argjson meta_exit_code "$meta_exit_code" \
            --argjson helper_timeout_seconds "$HELPER_TIMEOUT_SECONDS" \
            --argjson meta_timeout_seconds "$META_EXECUTION_TIMEOUT_SECONDS" \
            '{schema:$schema,diagnostic_only:true,decision:"UNKNOWN",resolution:"LOWER_RESOLUTION",source_sha:$source_sha,workflow_implementation_sha:$workflow_implementation_sha,source_artifact_id:$source_artifact_id,source_artifact_digest:$source_artifact_digest,meta_execution_exit_code:$meta_exit_code,helper_timeout_seconds:$helper_timeout_seconds,meta_execution_timeout_seconds:$meta_timeout_seconds,helper_attempts:.,normal_closed:false,promotion_authorized:false}' \
            "$root"/helper-captures/attempt-*/receipt.json > "$root/diagnostic-summary.json"
          jq -e \
            --arg sha "$SUBJECT_SHA" \
            '.diagnostic_only == true and .decision == "UNKNOWN" and .normal_closed == false and .promotion_authorized == false and (.helper_attempts | length) >= 1 and (all(.helper_attempts[]; .source_sha == $sha and .diagnostic_only == true))' \
            "$root/diagnostic-summary.json" >/dev/null

          jq -r \
            --arg sha "$SUBJECT_SHA" \
            --arg artifact "$SOURCE_ARTIFACT_ID" \
            --arg workflow_sha "$GITHUB_SHA" \
            --arg meta_code "$meta_exit_code" \
            '"### Function extractor diagnostic\n- source subject: `" + $sha + "`\n- workflow implementation: `" + $workflow_sha + "`\n- source artifact: `" + $artifact + "`\n- meta-execution exit code: `" + $meta_code + "`\n- helper attempts: `" + ((.helper_attempts|length)|tostring) + "`\n- decision: `" + .decision + " / " + .resolution + "`\n- normal CLOSED/promotion claims: `" + (.normal_closed|tostring) + " / " + (.promotion_authorized|tostring) + "`"' \
            "$root/diagnostic-summary.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostic-only evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: function-extractor-diagnostic-${{ env.SUBJECT_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/function-extractor-diagnostic
          if-no-files-found: error
          retention-days: 30
