name: Language deterministic query conformance

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-query:
    name: Reified deterministic query
    runs-on: ubuntu-latest
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          cache: false

      - name: Execute and replay fixed query plans
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/language-deterministic-query"
          for pass in first second; do
            go run ./cmd/language-deterministic-query-witness \
              -root . \
              -expected-head "$HEAD_SHA" \
              -output "$root/$pass/artifact.json"
          done
          cmp "$root/first/artifact.json" "$root/second/artifact.json"

      - name: Upload deterministic query artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: language-deterministic-query-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/language-deterministic-query/first/artifact.json
          if-no-files-found: error
