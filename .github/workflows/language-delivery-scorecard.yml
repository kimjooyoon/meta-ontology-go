name: Language delivery scorecard

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: language-delivery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: go1.27.0

jobs:
  language-delivery-scorecard:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Resolve subject
        id: subject
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            sha="${{ github.event.pull_request.head.sha }}"
          else
            sha="${{ github.sha }}"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ steps.subject.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.27.0
          cache: true

      - name: Conform with Go 1.27 tools
        shell: bash
        run: |
          set -euo pipefail
          go fix ./cmd/language-delivery-scorecard ./internal/meta/languagedelivery
          git diff --exit-code -- cmd/language-delivery-scorecard internal/meta/languagedelivery
          mapfile -t files < <(find cmd/language-delivery-scorecard internal/meta/languagedelivery -name '*.go' -type f | sort)
          gofmt -w "${files[@]}"
          git diff --exit-code -- cmd/language-delivery-scorecard internal/meta/languagedelivery
          go test ./cmd/language-delivery-scorecard ./internal/meta/languagedelivery

      - name: Await exact transformation ledger
        id: ledger
        env:
          GH_TOKEN: ${{ github.token }}
          SUBJECT_SHA: ${{ steps.subject.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 80); do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/transformation-effect.yml/runs?head_sha=$SUBJECT_SHA&per_page=20")
            run=$(jq -c --arg sha "$SUBJECT_SHA" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.created_at) | last // empty' <<<"$runs")
            if [[ -n "$run" ]]; then
              status=$(jq -r '.status' <<<"$run")
              conclusion=$(jq -r '.conclusion // ""' <<<"$run")
              if [[ "$status" == "completed" ]]; then
                [[ "$conclusion" == "success" ]]
                echo "run_id=$(jq -r '.id' <<<"$run")" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            sleep 15
          done
          echo "exact transformation ledger did not complete" >&2
          exit 1

      - name: Download and bind source artifacts
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          SUBJECT_SHA: ${{ steps.subject.outputs.sha }}
          RUN_ID: ${{ steps.ledger.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery-evidence
          artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100")
          specs=(
            'USER_JOURNEY|user-journey-scorecard|first/report.json|user_journey'
            'TOOLCHAIN_CONFORMANCE|toolchain-conformance|artifact.json|conformance'
            'TOOLCHAIN_LSP|toolchain-lsp|artifact.json|lsp'
            'CROSS_PLATFORM_RELEASE|toolchain-cross-platform-release|artifact.json|release'
            'LANGUAGE_READINESS|language-readiness-artifact|artifact.json|readiness'
          )
          : > delivery-evidence/entries.jsonl
          for spec in "${specs[@]}"; do
            IFS='|' read -r source prefix relative key <<<"$spec"
            name="$prefix-$SUBJECT_SHA"
            matches=$(jq --arg name "$name" '[.artifacts[] | select(.name == $name)] | length' <<<"$artifacts")
            [[ "$matches" == "1" ]]
            id=$(jq -r --arg name "$name" '.artifacts[] | select(.name == $name) | .id' <<<"$artifacts")
            mkdir -p "delivery-evidence/$key"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "delivery-evidence/$key.zip"
            archive="sha256:$(sha256sum "delivery-evidence/$key.zip" | cut -d' ' -f1)"
            unzip -q "delivery-evidence/$key.zip" -d "delivery-evidence/$key"
            report="delivery-evidence/$key/$relative"
            [[ -f "$report" ]]
            digest="sha256:$(sha256sum "$report" | cut -d' ' -f1)"
            jq -nc --arg source "$source" --argjson id "$id" --arg name "$name" --arg archive "$archive" --arg digest "$digest" '{source:$source,artifact_id:$id,artifact_name:$name,archive_digest:$archive,report_digest:$digest}' >> delivery-evidence/entries.jsonl
            echo "$key=$report" >> "$GITHUB_OUTPUT"
          done
          jq -s --arg sha "$SUBJECT_SHA" --argjson run "$RUN_ID" '{schema:"gooo/language-delivery-source-manifest/v1",subject_sha:$sha,workflow_run_id:$run,workflow_name:"Transformation effect ledger",workflow_decision:"success",artifacts:.,repository_writes:0}' delivery-evidence/entries.jsonl > delivery-evidence/manifest.json
          echo "manifest=delivery-evidence/manifest.json" >> "$GITHUB_OUTPUT"

      - name: Reduce fixed delivery contract
        env:
          SUBJECT_SHA: ${{ steps.subject.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery-output
          go run ./cmd/language-delivery-scorecard \
            --expected-head "$SUBJECT_SHA" \
            --contract examples/language-delivery-scorecard/contract.json \
            --manifest "${{ steps.evidence.outputs.manifest }}" \
            --user-journey "${{ steps.evidence.outputs.user_journey }}" \
            --conformance "${{ steps.evidence.outputs.conformance }}" \
            --lsp "${{ steps.evidence.outputs.lsp }}" \
            --release "${{ steps.evidence.outputs.release }}" \
            --readiness "${{ steps.evidence.outputs.readiness }}" \
            --out delivery-output/report.json
          jq -e '.decision == "INCOMPLETE" and .resolution == "EXACT"' delivery-output/report.json
          jq -e '.summary.coordinates == {satisfied:28,not_implemented:8,not_satisfied:0,unknown:0,total:36,basis_points:7777}' delivery-output/report.json
          jq -e '[.views[] | [.audience,.coordinates.satisfied,.coordinates.total]] == [["USER",6,12],["TOOL_AUTHOR",16,24],["GOVERNOR",28,36]]' delivery-output/report.json
          jq -e '.summary.internal_readiness.satisfied == 24 and .summary.internal_readiness.total == 24' delivery-output/report.json
          jq -e '.summary.meta_bindings == 36 and .summary.effects.repository_writes == 0 and .summary.effects.mutation_authority == false' delivery-output/report.json

      - name: Reject unknown and self-minted evidence
        env:
          SUBJECT_SHA: ${{ steps.subject.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          jq '.decision="UNKNOWN"' "${{ steps.evidence.outputs.user_journey }}" > delivery-output/unknown-user.json
          digest="sha256:$(sha256sum delivery-output/unknown-user.json | cut -d' ' -f1)"
          jq --arg digest "$digest" '(.artifacts[] | select(.source=="USER_JOURNEY") | .report_digest)=$digest' "${{ steps.evidence.outputs.manifest }}" > delivery-output/unknown-manifest.json
          set +e
          go run ./cmd/language-delivery-scorecard --expected-head "$SUBJECT_SHA" --contract examples/language-delivery-scorecard/contract.json --manifest delivery-output/unknown-manifest.json --user-journey delivery-output/unknown-user.json --conformance "${{ steps.evidence.outputs.conformance }}" --lsp "${{ steps.evidence.outputs.lsp }}" --release "${{ steps.evidence.outputs.release }}" --readiness "${{ steps.evidence.outputs.readiness }}" --out delivery-output/unknown-report.json
          code=$?
          set -e
          [[ "$code" == "1" ]]
          jq -e '.decision=="FAIL_CLOSED" and .resolution=="LOWER_RESOLUTION" and .summary.coordinates.unknown==6' delivery-output/unknown-report.json
          jq 'del(.obligations[-1])' examples/language-delivery-scorecard/contract.json > delivery-output/drift-contract.json
          if go run ./cmd/language-delivery-scorecard --expected-head "$SUBJECT_SHA" --contract delivery-output/drift-contract.json --manifest "${{ steps.evidence.outputs.manifest }}" --user-journey "${{ steps.evidence.outputs.user_journey }}" --conformance "${{ steps.evidence.outputs.conformance }}" --lsp "${{ steps.evidence.outputs.lsp }}" --release "${{ steps.evidence.outputs.release }}" --readiness "${{ steps.evidence.outputs.readiness }}" --out delivery-output/drift-report.json; then exit 1; fi
          jq '(.obligations[] | select(.id=="USER-RUN-SOURCE") | .evidence)={source:"USER_JOURNEY",kind:"JOURNEY",id:"version-text",target:1}' examples/language-delivery-scorecard/contract.json > delivery-output/self-minted-contract.json
          if go run ./cmd/language-delivery-scorecard --expected-head "$SUBJECT_SHA" --contract delivery-output/self-minted-contract.json --manifest "${{ steps.evidence.outputs.manifest }}" --user-journey "${{ steps.evidence.outputs.user_journey }}" --conformance "${{ steps.evidence.outputs.conformance }}" --lsp "${{ steps.evidence.outputs.lsp }}" --release "${{ steps.evidence.outputs.release }}" --readiness "${{ steps.evidence.outputs.readiness }}" --out delivery-output/self-minted-report.json; then exit 1; fi

      - name: Publish human scorecard
        shell: bash
        run: |
          {
            echo '## Language delivery scorecard'
            echo
            echo '| Reader | Satisfied | Fixed total | Basis points |'
            echo '|---|---:|---:|---:|'
            jq -r '.views[] | "| \(.audience) | \(.coordinates.satisfied) | \(.coordinates.total) | \(.coordinates.basis_points) |"' delivery-output/report.json
            echo
            jq -r '"Known gaps: **\(.summary.coordinates.not_implemented)**  Unknown evidence: **\(.summary.coordinates.unknown)**  Repository writes: **\(.summary.effects.repository_writes)**"' delivery-output/report.json
            echo
            jq -r '"Internal readiness is separately labeled: **\(.summary.internal_readiness.satisfied)/\(.summary.internal_readiness.total)** (`\(.summary.internal_readiness.claim)`)."' delivery-output/report.json
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: language-delivery-scorecard-${{ steps.subject.outputs.sha }}
          path: |
            delivery-output/report.json
            delivery-output/unknown-report.json
            delivery-evidence/manifest.json
          if-no-files-found: error
          retention-days: 30
