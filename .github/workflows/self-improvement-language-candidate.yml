name: Self-improvement non-executing candidate

on:
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/self-improvement-language-observation.yml
      - .github/workflows/self-improvement-language-candidate.yml
      - examples/self-improvement/candidate.gooo
      - examples/self-improvement/transport.gooo
      - examples/self-improvement/TRANSPORT.md
      - examples/self-improvement/CANDIDATE.md
      - internal/meta/selfimprovementcandidate/**
      - internal/meta/selfimprovementtransport/**
      - internal/meta/languagereadiness/languagesyntax/**
      - scripts/self-improvement-candidate/**
      - scripts/self-improvement-transport/**
      - scripts/self-improvement-transport-selector/**
  workflow_run:
    workflows: [Self-improvement language observation]
    types: [completed]
    branches: [dev]

permissions:
  actions: read
  contents: read

jobs:
  propose-non-executing-candidate:
    if: >-
      github.event_name == 'pull_request' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
      TOOLING_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      SOURCE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || github.run_id }}
      SOURCE_RUN_ATTEMPT: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.run_attempt || github.run_attempt }}
      SOURCE_ARTIFACT_NAME: ${{ github.event_name == 'workflow_run' && 'self-improvement-language-observation' || format('self-improvement-language-observation-pr-witness-{0}', github.run_attempt) }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TOOLING_SHA }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.x
          check-latest: true
      - name: Compile transport metaprogram from workflow authority
        shell: bash
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/candidate/transport-tool"
          mkdir -p "$tool"
          go build -o "$tool/self-improvement-transport" ./scripts/self-improvement-transport
          go build -o "$tool/select-transport-artifact" ./scripts/self-improvement-transport-selector
          cp examples/self-improvement/transport.gooo "$tool/transport.gooo"
      - name: Reproduce exact observation for PR
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/language-example-experiment/main.sh
          input="$RUNNER_TEMP/language-example-experiment"
          output="$RUNNER_TEMP/candidate/observation"
          mkdir -p "$output"
          go run ./scripts/self-improvement-contract \
            -contract examples/self-improvement/main.gooo \
            -commit "$HEAD_SHA" -output "$output/contract.json" -check
          go run ./scripts/self-improvement-observation \
            -head-sha "$HEAD_SHA" -source-run-id "$SOURCE_RUN_ID" \
            -report "$input/report.json" -counterexamples "$input/counterexamples.json" \
            -contract "$output/contract.json" -output "$output/first.json" -check
      - name: Bind PR observation to transport contract
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/candidate/observation"
          artifact="$RUNNER_TEMP/candidate/source-artifact"
          mkdir -p "$artifact"
          "$RUNNER_TEMP/candidate/transport-tool/self-improvement-transport" \
            -mode produce \
            -contract "$RUNNER_TEMP/candidate/transport-tool/transport.gooo" \
            -repository "$GITHUB_REPOSITORY" \
            -subject-sha "$HEAD_SHA" \
            -checkout-sha "$(git rev-parse HEAD)" \
            -workflow-ref "$GITHUB_WORKFLOW_REF" \
            -workflow-sha "$GITHUB_WORKFLOW_SHA" \
            -run-id "$SOURCE_RUN_ID" -run-attempt "$SOURCE_RUN_ATTEMPT" \
            -job propose-non-executing-candidate -artifact-name "$SOURCE_ARTIFACT_NAME" \
            -observation "$output/first.json" \
            -output "$output/producer.json" -check
          cp "$output/first.json" "$artifact/first.json"
          cp "$output/producer.json" "$artifact/producer.json"
      - name: Upload PR observation transport witness
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.SOURCE_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/candidate/source-artifact
          if-no-files-found: error
          retention-days: 14
      - name: Observe immutable artifact metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          transport="$RUNNER_TEMP/candidate/transport"
          input="$RUNNER_TEMP/candidate/input"
          mkdir -p "$transport" "$input"
          run_exit=0
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" \
            > "$transport/run.json" || run_exit=$?
          artifacts_exit=0
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" \
            > "$transport/artifacts.json" || artifacts_exit=$?
          "$RUNNER_TEMP/candidate/transport-tool/select-transport-artifact" \
            -mode locate -contract "$RUNNER_TEMP/candidate/transport-tool/transport.gooo" \
            -run "$transport/run.json" -artifacts "$transport/artifacts.json" \
            -repository "$GITHUB_REPOSITORY" -expected-run-id "$SOURCE_RUN_ID" \
            -expected-run-attempt "$SOURCE_RUN_ATTEMPT" \
            -artifact-name "$SOURCE_ARTIFACT_NAME" \
            -run-lookup-exit "$run_exit" -artifacts-lookup-exit "$artifacts_exit" \
            -output "$transport/metadata.json" -receipt "$transport/lifecycle.json"
      - name: Download and seal artifact lifecycle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          transport="$RUNNER_TEMP/candidate/transport"
          archive="$transport/observation.zip"
          download_exit=125
          if [ -f "$transport/metadata.json" ]; then
            artifact_id="$(jq -r '.artifact_id' "$transport/metadata.json")"
            download_exit=0
            curl --fail --location --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
              -o "$archive" || download_exit=$?
          fi
          "$RUNNER_TEMP/candidate/transport-tool/select-transport-artifact" \
            -mode transport -receipt "$transport/lifecycle.json" \
            -archive "$archive" -download-exit "$download_exit"
          jq -r '"artifact lifecycle: \(.decision) \(.metrics.verified_total)/\(.metrics.fixed_step_total) (\(.metrics.coverage_basis_points) bps), unknown-path \(.metrics.unknown_path_count), \(.coordinate.stage)/\(.coordinate.step)/\(.reason)"' \
            "$transport/lifecycle.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload artifact lifecycle receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: self-improvement-artifact-lifecycle-${{ env.SOURCE_RUN_ID }}-${{ env.SOURCE_RUN_ATTEMPT }}
          path: ${{ runner.temp }}/candidate/transport/lifecycle.json
          if-no-files-found: error
          retention-days: 14
      - name: Require exact artifact lifecycle before consumption
        shell: bash
        run: |
          set -euo pipefail
          transport="$RUNNER_TEMP/candidate/transport"
          input="$RUNNER_TEMP/candidate/input"
          jq -e '
            .decision == "PASS" and .resolution == "EXACT" and
            .enforcement_effect == "NO_EFFECT" and
            .metrics.fixed_step_total == 5 and .metrics.verified_total == 5 and
            .metrics.unknown_total == 0 and .metrics.unknown_path_count == 0 and
            .authority.execution == false and .authority.mutation == false and
            .authority.promotion == false and .authority.repository_writes == 0 and
            all(.indicators[]; .status == "VERIFIED")
          ' "$transport/lifecycle.json"
          archive="$transport/observation.zip"
          unzip -q "$archive" -d "$input"
          test -f "$input/first.json"
          test -f "$input/producer.json"
          jq -r '.actual_archive_digest' "$transport/lifecycle.json" \
            > "$transport/archive-digest.txt"
      - name: Verify producer-declared subject and lower unsigned resolution
        id: verify-transport
        shell: bash
        run: |
          set -euo pipefail
          input="$RUNNER_TEMP/candidate/input"
          transport="$RUNNER_TEMP/candidate/transport"
          "$RUNNER_TEMP/candidate/transport-tool/self-improvement-transport" \
            -mode consume \
            -contract "$RUNNER_TEMP/candidate/transport-tool/transport.gooo" \
            -repository "$GITHUB_REPOSITORY" -run-id "$SOURCE_RUN_ID" \
            -observation "$input/first.json" -producer "$input/producer.json" \
            -metadata "$transport/metadata.json" \
            -archive-digest "$(cat "$transport/archive-digest.txt")" \
            -output "$transport/receipt.json" -check-read-only
          subject_sha="$(jq -r '.subject_sha' "$transport/receipt.json")"
          if ! [[ "$subject_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "CONSUME/recompute-subject-digest: invalid producer subject" >&2
            exit 1
          fi
          echo "HEAD_SHA=$subject_sha" >> "$GITHUB_ENV"
          echo "subject_sha=$subject_sha" >> "$GITHUB_OUTPUT"
          jq -r '"transport: \(.decision) \(.metrics.verified_total)/\(.metrics.fixed_obligation_total) (\(.metrics.coverage_basis_points) bps), unknown \(.open_obligation_ids | join(","))"' \
            "$transport/receipt.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout verified producer subject
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.verify-transport.outputs.subject_sha }}
          persist-credentials: false
      - name: Compile Gooo candidate contract and replay proposal
        shell: bash
        run: |
          set -euo pipefail
          input="$RUNNER_TEMP/candidate/input/first.json"
          source_run_id="$(jq -r '.source_workflow_run_id' "$input")"
          if ! [[ "$source_run_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "observation source workflow run id is unknown" >&2
            exit 1
          fi
          output="$RUNNER_TEMP/candidate/output"
          mkdir -p "$output"
          for pass in first second; do
            go run ./scripts/self-improvement-candidate \
              -contract examples/self-improvement/candidate.gooo \
              -head-sha "$HEAD_SHA" -source-run-id "$source_run_id" \
              -observation "$input" -output "$output/$pass.json" -check
          done
          cmp "$output/first.json" "$output/second.json"
          jq -r '"candidate: \(.decision) \(.summary.candidate_count), achieved \(.summary.achieved_delta)/1, target \(.summary.target_delta)/1"' "$output/first.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload exact-head non-executing candidate
        uses: actions/upload-artifact@v6
        with:
          name: self-improvement-nonexecuting-candidate-${{ github.event_name == 'workflow_run' && steps.verify-transport.outputs.subject_sha || env.HEAD_SHA }}
          path: |
            ${{ runner.temp }}/candidate/output/first.json
            ${{ runner.temp }}/candidate/transport/receipt.json
            ${{ runner.temp }}/candidate/transport/lifecycle.json
          if-no-files-found: error
          retention-days: 14
