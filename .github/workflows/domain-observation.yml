name: Domain observation example

on:
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/domain-observation.yml
      - examples/domain-observation/**
      - cmd/gooo/**
      - internal/**
  push:
    branches: [dev]
    paths:
      - .github/workflows/domain-observation.yml
      - examples/domain-observation/**
      - cmd/gooo/**
      - internal/**

permissions:
  contents: read

jobs:
  observe:
    name: Check and deterministically generate domain model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          cache: false
      - name: Check semantic domain definition
        run: go run ./cmd/gooo check --semantic examples/domain-observation/main.gooo
      - name: Generate two independent artifacts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/domain-observation/first" "$RUNNER_TEMP/domain-observation/second"
          go run ./cmd/gooo generate examples/domain-observation/main.gooo --out "$RUNNER_TEMP/domain-observation/first"
          go run ./cmd/gooo generate examples/domain-observation/main.gooo --out "$RUNNER_TEMP/domain-observation/second"
          cmp "$RUNNER_TEMP/domain-observation/first/semantic.gooo.go" "$RUNNER_TEMP/domain-observation/second/semantic.gooo.go"
          test -s "$RUNNER_TEMP/domain-observation/first/semantic.gooo.go"
          test -z "$(gofmt -l "$RUNNER_TEMP/domain-observation/first/semantic.gooo.go")"
      - name: Publish human-readable observation
        run: |
          {
            echo '### Domain observation'
            echo '- domain: service incident resolution'
            echo '- semantic check: CLOSED'
            echo '- deterministic generation: CLOSED (1/1)'
            echo '- runtime usefulness: UNKNOWN (not claimed by this fixture)'
            echo '- repository writes: 0'
          } >> "$GITHUB_STEP_SUMMARY"
