name: Candidate leakage shadow

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: candidate-leakage-shadow-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  candidate-leakage-shadow:
    name: Candidate leakage shadow
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.0
          cache: false
      - uses: ./.github/actions/materialize
        with:
          expected-sha: ${{ env.EXPECTED_SHA }}
      - name: Verify Go 1.27 authority
        run: |
          test "$(go env GOVERSION)" = "go1.27.0"
          go version
      - name: Apply Go 1.27 fixes in check mode
        run: |
          go fix ./internal/meta/languageassurance/candidateleakage ./cmd/candidate-leakage-witness
          git diff --exit-code
      - name: Run candidate leakage conformance
        run: go test ./internal/meta/languageassurance/candidateleakage ./cmd/candidate-leakage-witness
      - name: Generate exact shadow evidence
        run: |
          work="$RUNNER_TEMP/candidate-leakage-shadow"
          mkdir -p "$work/replay"
          cases="isolated-candidate authorized-transition denied-fixed-point-leak fail-closed-allow-leak unknown-promotion digest-mismatch"
          go run ./cmd/candidate-leakage-witness --subject-sha "$EXPECTED_SHA" --case suite --output "$work/suite.json"
          for case_id in $cases; do
            go run ./cmd/candidate-leakage-witness --subject-sha "$EXPECTED_SHA" --case "$case_id" --output "$work/$case_id.json"
          done
          go run ./cmd/candidate-leakage-witness --subject-sha "$EXPECTED_SHA" --case suite --output "$work/replay/suite.json"
          cmp "$work/suite.json" "$work/replay/suite.json"
          (cd "$work" && sha256sum suite.json isolated-candidate.json authorized-transition.json \
            denied-fixed-point-leak.json fail-closed-allow-leak.json unknown-promotion.json digest-mismatch.json > manifest.sha256)
      - name: Assert shadow decision algebra
        run: |
          work="$RUNNER_TEMP/candidate-leakage-shadow"
          jq -e '.decision == "PASS" and .resolution == "EXACT" and
            .summary.cases_total == 6 and .summary.cases_passed == 6 and
            .summary.exact_pass == 2 and .summary.exact_fail_closed == 2 and
            .summary.invariant_fail_closed == 2 and .summary.coverage_bps == 10000 and
            .repository_writes == 0 and .promotion_credit_bps == 0' "$work/suite.json"
          jq -e '.decision == "FAIL_CLOSED" and .resolution == "EXACT" and
            .reason == "CANDIDATE_LEAKAGE_DETECTED" and .summary.leakage_paths == 1' \
            "$work/denied-fixed-point-leak.json" "$work/fail-closed-allow-leak.json"
          jq -e '.decision == "FAIL_CLOSED" and .resolution == "INVARIANT_ONLY" and
            .summary.unknown_paths == 1 and .summary.leakage_paths == 0' \
            "$work/unknown-promotion.json" "$work/digest-mismatch.json"
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-leakage-shadow-${{ env.EXPECTED_SHA }}
          path: ${{ runner.temp }}/candidate-leakage-shadow
          if-no-files-found: error
