name: Language example experiment

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

env:
  GOTOOLCHAIN: go1.27.0
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  operation-manifest:
    name: operation-manifest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up exact Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.27.0
          cache: true
      - name: Observe fixed Gooo-only experiment
        shell: bash
        run: bash scripts/language-example-experiment/main.sh
      - name: Upload experiment receipts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: language-example-experiment-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/language-example-experiment
          if-no-files-found: error
          retention-days: 30

  external-oracle-humility:
    name: external oracle humility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up exact Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.27.0
          cache: true
      - name: Observe external oracle humility boundary
        shell: bash
        run: bash scripts/external-oracle-humility/main.sh
      - name: Upload oracle receipts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: external-oracle-humility-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/external-oracle-humility
          if-no-files-found: error
          retention-days: 30
