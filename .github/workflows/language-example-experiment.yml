name: Language example experiment

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

env:
  GOTOOLCHAIN: go1.27.3
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  operation-manifest:
    name: operation-manifest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up exact Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: true
      - name: Observe fixed Gooo-only experiment
        shell: bash
        run: bash scripts/language-example-experiment/main.sh
      - name: Execute source-owned fixed record contract
        shell: bash
        env:
          GOOO_FIXED_RECORD_NATIVE_E2E: '1'
          GOOO_FIXED_RECORD_NATIVE_OUTPUT: ${{ runner.temp }}/language-example-experiment/fixed-record-contract
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/language-example-experiment"
          go test -count=1 -json ./cmd/gooo -run '^TestFixedRecordNativeFresh1767$' > "$output/fixed-record-native.jsonl"
          jq -s -e '[.[] | select(.Action == "pass" and .Test == "TestFixedRecordNativeFresh1767")] | length == 1' "$output/fixed-record-native.jsonl"
      - name: Upload experiment receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: language-example-experiment-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/language-example-experiment
          if-no-files-found: error
          retention-days: 30
