name: Manual-source-registration-edit-free registry projection

on:
  pull_request:

permissions:
  contents: read

jobs:
  projection:
    if: github.event.pull_request.base.ref == 'dev'
    name: registry projection conformance
    runs-on: ubuntu-latest
    env:
      EXACT_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out the exact pull request head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.EXACT_SHA }}

      - name: Install Go 1.27.0 exactly
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.0
          cache: false

      - name: Assert the exact toolchain
        run: test "$(go version | awk '{print $3}')" = "go1.27.0"

      - name: Validate formatting in CI
        run: |
          files=(
            scripts/conflict-free-registry-projection/*.go
            scripts/conflict-free-registry-projection-consumer/*.go
          )
          test -z "$(gofmt -l "${files[@]}")"

      - name: Compile focused producer and independent consumer
        run: go vet ./scripts/conflict-free-registry-projection ./scripts/conflict-free-registry-projection-consumer

      - name: Generate into a temporary directory without mutating repository outputs
        run: |
          work="$RUNNER_TEMP/manual-source-registration-edit-free-registry-projection"
          mkdir -p "$work"
          go run ./scripts/conflict-free-registry-projection generate \
            -root "$GITHUB_WORKSPACE" \
            -output "$work/generated"
          go run ./scripts/conflict-free-registry-projection check \
            -root "$GITHUB_WORKSPACE" \
            -output "$work/generated"

      - name: Check the committed projection is fresh
        run: go run ./scripts/conflict-free-registry-projection check -root "$GITHUB_WORKSPACE"

      - name: Reconstruct the projection with the independent consumer
        run: |
          work="$RUNNER_TEMP/manual-source-registration-edit-free-registry-projection"
          go run ./scripts/conflict-free-registry-projection-consumer \
            -root "$GITHUB_WORKSPACE" \
            -output "$work/consumer-projection.json" \
            -receipt "$work/consumer-receipt.json" \
            -check-generated
          cmp "$work/consumer-projection.json" \
            internal/meta/registryprojection/generated/projection.json
          jq -e --arg output "$work/consumer-projection.json" '
            .decision == "PASS" and
            .use_case_receipt.status == "UNKNOWN" and
            .use_case_receipt.completed_numerator == 0 and
            .use_case_receipt.denominator == 1 and
            .use_case_receipt.stage == "FOUNDATION" and
            .use_case_receipt.step == "USE_CASE_RECEIPT" and
            .use_case_receipt.reason == "HISTORICAL_CORPUS_PRESENT_BUT_EXECUTION_RECEIPT_UNAVAILABLE" and
            .production_adoption.numerator == 0 and
            .production_adoption.denominator == 1 and
            .production_adoption.decision == "UNKNOWN" and
            .output_artifact.path == $output and
            .output_artifact.bytes > 0 and
            .output_artifact.digest != "" and
            ([.binding_output_receipts[]] | length) == 9 and
            ([.binding_output_receipts[] | select(.output_address == $output and .output_digest != "" and .output_bytes > 0 and .semantic_digest != "")] | length) == 9
          ' "$work/consumer-receipt.json"

      - name: Run the semantic evidence gate
        run: |
          work="$RUNNER_TEMP/manual-source-registration-edit-free-registry-projection"
          go run ./scripts/conflict-free-registry-projection prove \
            -root "$GITHUB_WORKSPACE" \
            -evidence "$work/evidence.json" > "$work/evidence.stdout.json"
          jq -e '
            .decision == "PASS" and
            .baseline_touchpoints == 12 and
            .integration_metrics.existing_shared_source_touchpoints.denominator == 12 and
            .integration_metrics.generator_changed_shared_outputs.numerator == 6 and
            .integration_metrics.generator_changed_shared_outputs.denominator == 8 and
            .integration_metrics.independent_conformance_consumer.numerator == 1 and
            .integration_metrics.independent_conformance_consumer.denominator == 1 and
            .metric_deltas.manual_source_registration_edits.before.numerator == 12 and
            .metric_deltas.manual_source_registration_edits.after.numerator == 0 and
            .metric_deltas.generator_changed_shared_outputs.after.numerator == 6 and
            .metric_deltas.generator_changed_shared_outputs.after.denominator == 8 and
            .generated_output_change_count == 6 and
            .generated_output_denominator == 8 and
            ([.source_digest_preservation[] | select(.equal == true)] | length) == 12 and
            ([.denominator_reconciliations[].stable_id] | unique | length) == 3 and
            ([.denominator_reconciliations[].decision] | all(. == "PASS")) and
            .stale_denominator_receipt.decision == "FAIL_CLOSED" and
            .stale_denominator_receipt.reason == "DENOMINATOR_SOURCE_MISMATCH" and
            .stale_denominator_receipt.declared.cases == 160 and
            .stale_denominator_receipt.calculated.cases == 181 and
            .use_case_receipt.status == "UNKNOWN" and
            .use_case_receipt.completed_numerator == 0 and
            .use_case_receipt.denominator == 1 and
            .use_case_receipt.stage == "FOUNDATION" and
            .use_case_receipt.step == "USE_CASE_RECEIPT" and
            .use_case_receipt.reason == "HISTORICAL_CORPUS_PRESENT_BUT_EXECUTION_RECEIPT_UNAVAILABLE" and
            .production_adoption.numerator == 0 and
            .production_adoption.denominator == 1 and
            .production_adoption.decision == "UNKNOWN" and
            .projection_replay.decision == "PASS" and
            .manifest_order_invariant.decision == "PASS" and
            .semantic_manifest_causality.decision == "PASS" and
            .comment_only_invariant.decision == "PASS" and
            .new_concept_fixture.decision == "PASS" and
            ([.failure_contracts[].diagnostic.decision] | all(. == "FAIL_CLOSED")) and
            ([.failure_contracts[].diagnostic.stage] | all(length > 0)) and
            ([.failure_contracts[].diagnostic.step] | all(length > 0)) and
            ([.failure_contracts[].diagnostic.reason] | all(length > 0)) and
            ([.failure_contracts[]] | length) == 8 and
            ([.predicate_observations[] | select(.observed == true)] | length) == ([.predicate_observations] | length) and
            ([.predicate_observations[] | select(.predicate_truth == "TRUE" and .target_address != "" and .target_digest != "")] | length) == ([.predicate_observations] | length) and
            .failure_predicates.numerator == .failure_predicates.denominator and
            .failure_predicates.denominator == 12 and
            .binding_predicates.numerator == .binding_predicates.denominator and
            .binding_predicates.denominator == 1 and
            .claim_transitions.denominator == 17 and
            .provenance_predicates.numerator == .provenance_predicates.denominator and
            .failure_predicates.numerator == 12 and
            .provenance_predicates.denominator == 12 and
            .ast_resolved_bindings.numerator == 9 and
            .ast_resolved_bindings.denominator == 9 and
            ([.binding_output_receipts[]] | length) == 9 and
            .consumer_output_artifact.digest != "" and
            .consumer_output_artifact.bytes > 0 and
            (.consumer_output_artifact.raw_bytes | length) > 0 and
            .predicate_inventory.decision == "PASS" and
            .failure_inventory.decision == "PASS" and
            .claim_inventory.decision == "PASS" and
            .provenance_inventory.decision == "PASS" and
            .predicate_inventory.expected == ["independent-manifest-order", "independent-resource-digests", "independent-denominator-reconciliation", "independent-binding-registry", "independent-conformance-consumer", "consumer-malformed-manifest", "consumer-missing-manifest", "consumer-cross-directory-manifest", "consumer-missing-binding", "consumer-stale-denominator", "consumer-stale-generated-projection", "consumer-duplicate-stable-id", "consumer-binding-self-search", "consumer-binding-output-digest-mismatch", "consumer-binding-comment-only", "consumer-binding-unused-string", "consumer-success-with-diagnostic-counterexample"] and
            .failure_inventory.expected == ["consumer-malformed-manifest", "consumer-missing-manifest", "consumer-cross-directory-manifest", "consumer-missing-binding", "consumer-stale-denominator", "consumer-stale-generated-projection", "consumer-duplicate-stable-id", "consumer-binding-self-search", "consumer-binding-output-digest-mismatch", "consumer-binding-comment-only", "consumer-binding-unused-string", "consumer-success-with-diagnostic-counterexample"] and
            ([.predicate_inventory.expected[]] | length) == 17 and
            ([.predicate_inventory.observed[]] | length) == 17 and
            ([.failure_inventory.expected[]] | length) == 12 and
            ([.failure_inventory.observed[]] | length) == 12 and
            ([.claim_inventory.expected[]] | length) == 17 and
            ([.claim_inventory.observed[]] | length) == 17 and
            ([.provenance_inventory.expected[]] | length) == 12 and
            ([.provenance_inventory.observed[]] | length) == 12 and
            .repository_net_state_predicates.numerator == 1 and
            .claim_transitions.numerator == .claim_transitions.denominator and
            ([.strategies[] | select(.selected and .decision == "PASS")] | length) == 3 and
            ([.claims[].proposition] | length) == ([.claims[].proposition] | unique | length) and
            ([.claims[].target_address] | length) == ([.claims[].target_address] | unique | length) and
            ([.claims[].target_digest] | length) == ([.claims[].target_digest] | unique | length) and
            ([.claims[] | select(.id | startswith("consumer-")) | .transitions[-1].state] | all(. == "DISCHARGED")) and
            ([.claims[] | select(.transitions[-1].state == "DISCHARGED") | .transitions[-1].reason] | all(. == "independent_consumer_recomputed_predicate")) and
            .repository_net_state.net_state_equal == true and
            .repository_net_state.net_state == "NET_STATE_EQUAL" and
            .repository_net_state.transient_mutation == "UNKNOWN" and
            .repository_net_state.mutation_authority == "UNKNOWN"
          ' "$work/evidence.json"

      - name: Publish projection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-source-registration-edit-free-registry-projection-${{ env.EXACT_SHA }}
          path: ${{ runner.temp }}/manual-source-registration-edit-free-registry-projection
          if-no-files-found: error
          retention-days: 14
