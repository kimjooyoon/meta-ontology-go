name: Experiment promotion ledger

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  experiment-promotion:
    name: experiment-promotion
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: go1.27.0
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@v5
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Go 1.27
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          cache: true
      - name: Produce and independently verify promotion ledger
        shell: bash
        run: bash scripts/experiment-promotion/main.sh
