name: Action runtime conformance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  action-runtime:
    name: Action runtime conformance
    runs-on: ubuntu-latest
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          cache: false

      - name: Require exact Go toolchain
        run: test "$(go env GOVERSION)" = "go1.27.0"

      - name: Project deterministic runtime indicators
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/action-runtime"
          mkdir -p "$output"
          for pass in first second; do
            go run ./scripts/action-runtime \
              -workflow .github/workflows/ci.yml \
              -commit "$HEAD_SHA" \
              -output "$output/$pass.json"
          done
          cmp "$output/first.json" "$output/second.json"
          test "$(jq -r .status "$output/first.json")" = PASS

      - name: Upload exact-head runtime indicators
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: action-runtime-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/action-runtime/first.json
          if-no-files-found: error
