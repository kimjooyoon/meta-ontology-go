name: Meta-circular boundary

on:
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/meta-circular-boundary.yml
      - cmd/meta-circular-boundary-witness/**
      - cmd/meta-circular-boundary-consumer-witness/**
      - cmd/meta-circular-boundary-intervention-witness/**
      - examples/meta-circular-boundary/**
      - internal/meta/metacircularboundary/**
      - internal/meta/metacircularboundarycontract/**
      - internal/meta/metacircularboundaryconsumer/**
  push:
    branches: [dev]
    paths:
      - .github/workflows/meta-circular-boundary.yml
      - cmd/meta-circular-boundary-witness/**
      - cmd/meta-circular-boundary-consumer-witness/**
      - cmd/meta-circular-boundary-intervention-witness/**
      - examples/meta-circular-boundary/**
      - internal/meta/metacircularboundary/**
      - internal/meta/metacircularboundarycontract/**
      - internal/meta/metacircularboundaryconsumer/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundary:
    name: meta-circular boundary
    runs-on: ubuntu-24.04
    env:
      HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.0
          cache: false
      - name: Bind Go 1.27
        run: |
          test "$(go env GOVERSION)" = "go1.27.0"
          go version
      - name: Require formatting
        run: |
          test -z "$(gofmt -l cmd/meta-circular-boundary-witness cmd/meta-circular-boundary-consumer-witness cmd/meta-circular-boundary-intervention-witness internal/meta/metacircularboundary internal/meta/metacircularboundarycontract internal/meta/metacircularboundaryconsumer)"
      - name: Run package tests and vet
        run: |
          go test ./internal/meta/metacircularboundary
          go test ./internal/meta/metacircularboundaryconsumer
          go vet ./cmd/meta-circular-boundary-witness ./cmd/meta-circular-boundary-consumer-witness ./cmd/meta-circular-boundary-intervention-witness ./internal/meta/metacircularboundary ./internal/meta/metacircularboundaryconsumer
      - name: Run shared case-fact regression
        run: go test ./internal/meta/metacircularboundary -run TestConsumerRejectsSharedWrongCaseFactCounterexample -count=1
      - name: Run authority and evidence regressions
        run: |
          go test ./internal/meta/metacircularboundary -run 'TestExpectedDecisionCannotMintAuthorization|TestUnknownComputationDataRemainsOpen|TestContradictoryCapabilityEvidenceIsRefuted' -count=1
      - name: Produce and independently judge two receipts
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/meta-circular-boundary"
          mkdir -p "$output"
          for attempt in first replay; do
            go run ./cmd/meta-circular-boundary-witness \
              --source examples/meta-circular-boundary/main.gooo \
              --head-sha "$HEAD_SHA" \
              --output "$output/$attempt.json"
          done
          cmp -s "$output/first.json" "$output/replay.json"
          go run ./cmd/meta-circular-boundary-consumer-witness \
            --source examples/meta-circular-boundary/main.gooo \
            --head-sha "$HEAD_SHA" \
            --report "$output/first.json"
          go run ./cmd/meta-circular-boundary-intervention-witness \
            --source examples/meta-circular-boundary/main.gooo \
            --head-sha "$HEAD_SHA" \
            --output "$output/causality.json"
          jq -e '
            .schema == "gooo/meta-circular-boundary-report/v1" and
            .scope == "READ_ONLY_META_CIRCULAR_BOUNDARY" and
            .decision == "PASS" and .resolution == "EXACT" and
            .reason == "META_CIRCULAR_BOUNDARY_PROVEN" and
            (.cases | length) == 4 and
            (.receipts | length) == 4 and
            (.indicators | length) == 10 and
            .summary.cases_passed == 4 and
            .summary.cases_total == 4 and
            .summary.case_coverage_bps == 10000 and
            .summary.description_bound == 4 and
            .summary.explicit_authorizations == 1 and
            .summary.allowed_executions == 1 and
            .summary.description_only_blocked == 1 and
            .summary.forged_authorizations_blocked == 1 and
            .summary.out_of_scope_authorizations_blocked == 1 and
            .summary.description_escalation_paths == 0 and
            .summary.replay_matches == 4 and
            .summary.repository_writes == 0 and
            .summary.mutation_authority == 0 and
            .repository_writes == 0 and .mutation_authority == false and
            ([.indicators[] | select(.satisfied == false)] | length) == 0 and
            .independent_judge.consumer == "metacircularboundaryconsumer.Judge"
          ' "$output/first.json"
      - name: Measure consumer dependency boundary
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/meta-circular-boundary"
          deps="$output/consumer-deps.txt"
          go list -deps ./cmd/meta-circular-boundary-consumer-witness > "$deps"
          forbidden="$(grep -Fx 'github.com/kimjooyoon/meta-ontology-go/internal/meta/metacircularboundary' "$deps" | wc -l | tr -d ' ')"
          test "$forbidden" -eq 0
          jq -n \
            --arg consumer "cmd/meta-circular-boundary-consumer-witness" \
            --argjson observed "$forbidden" \
            '{schema:"gooo/meta-circular-boundary-independence/v1", consumer:$consumer, forbidden_producer_dependencies_observed:$observed, forbidden_producer_dependencies_allowed_max:0, independence_contract:"1/1", independence_contract_passed:1, independence_contract_total:1}' \
            > "$output/independence.json"
          jq -e '.forbidden_producer_dependencies_observed == 0 and .forbidden_producer_dependencies_allowed_max == 0 and .independence_contract == "1/1" and .independence_contract_passed == 1 and .independence_contract_total == 1' "$output/independence.json"
      - name: Check semantic causality interventions
        run: |
          jq -e '
            .schema == "gooo/meta-circular-boundary-causality/v1" and
            .summary.total == 2 and .summary.passed == 2 and .summary.coverage_bps == 10000 and
            ([.cases[] | select(
              .kind == "SEMANTIC" and
              .source_changed == true and .semantic_changed == true and .expected_semantic_change == true and
              .consumer_accepted == true and .passed == true and
              .baseline_case_decision != .intervened_case_decision and
              .baseline_authorization != .intervened_authorization and
              .baseline_execution != .intervened_execution and
              .baseline_receipt_decision != .intervened_receipt_decision and
              .baseline_capability_digest != .intervened_capability_digest and
              .baseline_authorization_claim != .intervened_authorization_claim and
              .baseline_execution_claim != .intervened_execution_claim and
              .semantic_outputs_preserved == false
            )] | length) == 1 and
            ([.cases[] | select(
              .kind == "NON_SEMANTIC" and
              .source_changed == true and .semantic_changed == false and .expected_semantic_change == false and
              .consumer_accepted == true and .passed == true and
              .baseline_case_decision == .intervened_case_decision and
              .baseline_authorization == .intervened_authorization and
              .baseline_execution == .intervened_execution and
              .baseline_receipt_decision == .intervened_receipt_decision and
              .baseline_authorization_claim == .intervened_authorization_claim and
              .baseline_execution_claim == .intervened_execution_claim and
              .semantic_outputs_preserved == true
            )] | length) == 1
          ' "$RUNNER_TEMP/meta-circular-boundary/causality.json"
      - name: Upload exact-head evidence
        uses: actions/upload-artifact@v6
        with:
          name: meta-circular-boundary-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/meta-circular-boundary
          if-no-files-found: error
          retention-days: 14
