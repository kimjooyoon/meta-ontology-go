name: Repository projection diagnostics

on:
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/repository-projection-diagnostics.yml'
      - 'bootstrap/repository-projector/**'
      - 'examples/repository-projection-diagnostics/**'
      - 'go.mod'
      - 'go.sum'
  push:
    branches: [dev]
    paths:
      - '.github/workflows/repository-projection-diagnostics.yml'
      - 'bootstrap/repository-projector/**'
      - 'examples/repository-projection-diagnostics/**'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-projection-diagnostics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  diagnose:
    name: Resolve physical topology subjects
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact subject
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EXACT_SHA }}
      - name: Set up Go 1.27
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          check-latest: true
      - name: Conform diagnostic code
        shell: bash
        run: |
          set -euo pipefail
          go fix ./bootstrap/repository-projector/...
          git diff --exit-code -- bootstrap/repository-projector
          gofmt -l bootstrap/repository-projector | tee "$RUNNER_TEMP/repository-projector-unformatted.txt"
          test ! -s "$RUNNER_TEMP/repository-projector-unformatted.txt"
          go test ./bootstrap/repository-projector/...
      - name: Observe the fail-closed storage subject
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/repository-projection-diagnostics"
          mkdir -p "$work"
          fixture="$work/fixture-repository"
          mkdir -p "$fixture/bootstrap/dense"
          for index in $(seq -w 0 10); do
            printf 'fixture evidence\n' > "$fixture/bootstrap/dense/entry-$index.txt"
          done
          git -C "$fixture" init --quiet
          git -C "$fixture" config user.name 'projection-diagnostic'
          git -C "$fixture" config user.email 'projection-diagnostic@example.invalid'
          git -C "$fixture" add .
          git -C "$fixture" commit --quiet -m fixture
          fixture_sha=$(git -C "$fixture" rev-parse HEAD)
          set +e
          go run ./bootstrap/repository-projector/command \
            --root "$fixture" \
            --work "$work/fixture-projector" \
            --expected-sha "$fixture_sha" \
            > "$work/fixture-projector.log" 2>&1
          fixture_status=$?
          set -e
          test "$fixture_status" -eq 1
          jq -e --arg sha "$fixture_sha" '
            .source_sha==$sha and
            (.indicators[]|select(.id=="storage.direct-entry-observed")|.value==1) and
            (.indicators[]|select(.id=="storage.direct-entry")|.value==1) and
            (.indicators[]|select(.id=="storage.bootstrap-direct-entry")|.value==0) and
            (.indicators[]|select(.id=="storage.direct-entry-unclassified")|.value==0) and
            (.indicators[]|select(.id=="storage.mixed-kind")|.value==0) and
            ([.subjects[]|select(.indicator=="storage.direct-entry" and .physical=="bootstrap/dense" and .value==11 and .limit==10 and .applicability=="APPLICABLE")]|length)==1 and
            ([.subjects[]|select(.physical==".")]|length)==0
          ' "$work/fixture-projector/evidence.json"
          set +e
          go run ./bootstrap/repository-projector/command \
            --root "$GITHUB_WORKSPACE" \
            --work "$work/projector" \
            --expected-sha "$EXACT_SHA" \
            > "$work/projector.log" 2>&1
          status=$?
          set -e
          test "$status" -eq 0
          evidence="$work/projector/evidence.json"
          workflow_count=$(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) | wc -l | tr -d ' ')
          jq -e --arg sha "$EXACT_SHA" --argjson workflows "$workflow_count" '
            .schema=="gooo.repository-projection-evidence.v1" and .source_sha==$sha and
            (.indicators[]|select(.id=="projection.roundtrip-loss")|.value==0) and
            (.indicators[]|select(.id=="projection.unbound-entry")|.value==0) and
            (.indicators[]|select(.id=="storage.direct-entry-observed")|.value==1 and .blocking==false) and
            (.indicators[]|select(.id=="storage.direct-entry")|.value==0 and .limit==0 and .blocking==true) and
            (.indicators[]|select(.id=="storage.bootstrap-direct-entry")|.value==1 and .limit==1 and .blocking==true) and
            (.indicators[]|select(.id=="storage.direct-entry-unclassified")|.value==0 and .blocking==true) and
            (.indicators[]|select(.id=="storage.mixed-kind")|.value==0) and
            ([.subjects[]|select(.indicator=="storage.bootstrap-direct-entry" and .physical==".github/workflows" and .value==$workflows and .limit==10 and .consumer=="github-actions" and .meta_operation=="preserve-workflow-discovery" and .applicability=="NOT_APPLICABLE" and .applicability_reason=="GITHUB_WORKFLOW_DISCOVERY_ROOT")]|length)==1 and
            ([.subjects[]|select(.physical==".")]|length)==0
          ' "$evidence"
          cat "$work/projector.log"
          {
            echo '### Repository projection diagnostic'
            echo
            jq -r '.subjects[]|select(.indicator|startswith("storage."))|"- \(.indicator): `\(.physical)` = \(.value), limit \(.limit), applicability `\(.applicability)`, reason `\(.applicability_reason)`, operation `\(.meta_operation)`"' "$evidence"
            echo '- observed direct subjects: `1`'
            echo '- classified subjects: `1`'
            echo '- blocking direct subjects: `0`'
            echo '- decision: `PASS / EXACT`'
            echo '- repository writes: `0`'
          } >> "$GITHUB_STEP_SUMMARY"
          sha256sum "$evidence" > "$work/evidence.json.sha256"
          cp "$RUNNER_TEMP/repository-projector-unformatted.txt" "$work/unformatted.txt"
      - name: Upload exact-head diagnostic evidence
        uses: actions/upload-artifact@v7
        with:
          name: repository-projection-diagnostics-${{ env.EXACT_SHA }}
          path: ${{ runner.temp }}/repository-projection-diagnostics
          if-no-files-found: error
