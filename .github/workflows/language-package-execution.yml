name: Language Package Execution

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  package-execution:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.0
          cache: true
      - name: Conform package execution through Go 1.27
        run: scripts/language-package-execution/main.sh "$RUNNER_TEMP/language-package-execution"
      - uses: actions/upload-artifact@v5
        with:
          name: language-package-execution-${{ github.sha }}
          path: ${{ runner.temp }}/language-package-execution
          if-no-files-found: error
          retention-days: 14
