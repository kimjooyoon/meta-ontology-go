name: Proof-choice algebra

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  proof-choice-algebra:
    name: proof-choice algebra
    runs-on: ubuntu-latest
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          cache: false
      - name: Require exact Go toolchain
        run: test "$(go env GOVERSION)" = "go1.27.0"
      - name: Reject source-declared proof outputs
        shell: bash
        run: |
          set -euo pipefail
          if rg -n '"(choice|numerator|denominator|evidence_kind|admissible_routes|observed|predicate|value|slots|observations|dependencies|provenance)"' examples/proof-choice-algebra/*.gooo; then
            echo 'semantic input contains an observed proof output' >&2
            exit 1
          fi
          if ! rg -n '"evidence_capabilities"' examples/proof-choice-algebra/*.gooo; then
            echo 'semantic input has no evidence capability contract' >&2
            exit 1
          fi
      - name: Produce canonical replay baselines
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/proof-choice-algebra"
          mkdir -p "$output/baseline" "$output/first" "$output/replay" "$output/judged" "$output/state"
          for case in regression combined composition-failure; do
            go run ./scripts/proof-choice-algebra -mode artifact \
              -source "examples/proof-choice-algebra/$case.gooo" \
              -output "$output/baseline/$case.json"
          done
      - name: Produce and independently reconstruct semantic cases
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/proof-choice-algebra"
          for case in foundation coherence regression combined; do
            source="examples/proof-choice-algebra/$case.gooo"
            baseline=()
            if test -f "$output/baseline/$case.json"; then
              baseline=(-replay-baseline "$output/baseline/$case.json")
            fi
            go run ./scripts/proof-choice-algebra -mode produce -source "$source" -repo-root "$GITHUB_WORKSPACE" \
              -before-state "$output/state/$case.before" -after-state "$output/state/$case.after" \
              -output "$output/first/$case.json" -expect PASS "${baseline[@]}"
            go run ./scripts/proof-choice-algebra -mode judge -source "$source" -receipt "$output/first/$case.json" \
              -before-state "$output/state/$case.before" -after-state "$output/state/$case.after" \
              -output "$output/judged/$case.json" -expect PASS "${baseline[@]}"
            go run ./scripts/proof-choice-algebra -mode produce -source "$source" -repo-root "$GITHUB_WORKSPACE" \
              -before-state "$output/state/$case.replay.before" -after-state "$output/state/$case.replay.after" \
              -output "$output/replay/$case.json" -expect PASS "${baseline[@]}"
            cmp "$output/first/$case.json" "$output/replay/$case.json"
            jq -e '.decision == "PASS" and .subject_resolution == "EXACT" and .summary.fixed_denominator == 3 and .summary.route_denominator == 3 and .summary.claim_denominator == .summary.claims and .effects.observed == true and .effects.repository_writes == 0 and .effects.mutation_authority == false' "$output/first/$case.json"
            jq -e '.decision == "PASS" and .independent_evidence == 1 and .receipt_digest_match == true and .source_digest_match == true and .semantic_digest_match == true and .effects_match == true and .source_reconstruction.numerator == .source_reconstruction.denominator and (.evidence | length) > 0' "$output/judged/$case.json"
          done
          jq -e '.evidence[] | select(.route == "FOUNDATION") | .stable_identity != null and .origin_digest != null and .subject_binding != null and .state == "OBSERVED"' "$output/first/foundation.json"
          jq -e '.evidence[] | select(.route == "FOUNDATION") | .producer == "canonical-ir-foundation-producer" and .consumer == "proof-choice-selector"' "$output/first/foundation.json"
          jq -e '.evidence[] | select(.route == "COHERENCE") | (.observation_slots | length) == 3 and .agreement == true' "$output/first/coherence.json"
          jq -e '.evidence[] | select(.route == "COHERENCE") | .producer == "independent-projection-coherence-producer" and .consumer == "proof-choice-selector"' "$output/first/coherence.json"
          jq -e '.evidence[] | select(.route == "REGRESSION") | .byte_equal == true and .semantic_equal == true and .state == "OBSERVED"' "$output/first/regression.json"
          jq -e '.evidence[] | select(.route == "REGRESSION") | .producer == "canonical-artifact-replay-producer" and .consumer == "proof-choice-selector"' "$output/first/regression.json"
          jq -e '.compositions[0].operator == "ALL_ROUTES" and .compositions[0].result == "DISCHARGED" and (.compositions[0].routes | length) == 3' "$output/first/combined.json"
      - name: Require lower, unknown, contradiction, and composition failure
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/proof-choice-algebra"
          for case in lower-resolution unknown; do
            source="examples/proof-choice-algebra/$case.gooo"
            go run ./scripts/proof-choice-algebra -mode produce -source "$source" -repo-root "$GITHUB_WORKSPACE" \
              -before-state "$output/state/$case.before" -after-state "$output/state/$case.after" \
              -output "$output/first/$case.json" -expect PASS
            go run ./scripts/proof-choice-algebra -mode judge -source "$source" -receipt "$output/first/$case.json" \
              -before-state "$output/state/$case.before" -after-state "$output/state/$case.after" \
              -output "$output/judged/$case.json" -expect PASS
            jq -e '.subject_resolution == "LOWER_RESOLUTION" and .decision == "PASS" and .summary.fixed_denominator == 3 and .effects.repository_writes == 0 and .effects.mutation_authority == false' "$output/first/$case.json"
            jq -e '.independent_evidence == 1 and .receipt_digest_match == true and .source_digest_match == true and .semantic_digest_match == true and .effects_match == true' "$output/judged/$case.json"
          done
          jq -e '.items[0].observation_state == "INSUFFICIENT" and .transitions[0].to == "OPEN" and .transitions[0].resolution == "LOWER_RESOLUTION"' "$output/first/lower-resolution.json"
          jq -e '.items[0].observation_state == "UNKNOWN" and .transitions[0].to == "OPEN" and .transitions[0].resolution == "LOWER_RESOLUTION"' "$output/first/unknown.json"
          for case in contradiction composition-failure; do
            source="examples/proof-choice-algebra/$case.gooo"
            baseline=()
            if test -f "$output/baseline/$case.json"; then
              baseline=(-replay-baseline "$output/baseline/$case.json")
            fi
            go run ./scripts/proof-choice-algebra -mode produce -source "$source" -repo-root "$GITHUB_WORKSPACE" \
              -before-state "$output/state/$case.before" -after-state "$output/state/$case.after" \
              -output "$output/first/$case.json" -expect FAIL_CLOSED "${baseline[@]}"
            go run ./scripts/proof-choice-algebra -mode judge -source "$source" -receipt "$output/first/$case.json" \
              -before-state "$output/state/$case.before" -after-state "$output/state/$case.after" \
              -output "$output/judged/$case.json" -expect FAIL_CLOSED "${baseline[@]}"
            jq -e '.decision == "FAIL_CLOSED" and .subject_resolution == "EXACT" and (.transitions | all(.resolution != "FAIL_CLOSED")) and .effects.repository_writes == 0' "$output/first/$case.json"
            jq -e '.independent_evidence == 1 and .receipt_digest_match == true and .source_digest_match == true and .semantic_digest_match == true and .effects_match == true' "$output/judged/$case.json"
          done
          jq -e '.transitions[0].to == "REFUTED" and .transitions[0].resolution == "EXACT" and .reason == "PROOF_ROUTE_CONTRADICTION"' "$output/first/contradiction.json"
          jq -e '.compositions[0].operator == "ALL_ROUTES" and .compositions[0].result == "REFUTED" and .transitions[-1].to == "REFUTED" and .transitions[-1].resolution == "EXACT"' "$output/first/composition-failure.json"
      - name: Prove semantic and nonsemantic interventions
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/proof-choice-algebra"
          cp examples/proof-choice-algebra/foundation.gooo "$output/foundation-semantic.gooo"
          sed -i 's#gooo://proof-choice/foundation/subject#unstable://proof-choice/foundation/subject#' "$output/foundation-semantic.gooo"
          go run ./scripts/proof-choice-algebra -mode produce -source "$output/foundation-semantic.gooo" -repo-root "$GITHUB_WORKSPACE" \
            -before-state "$output/state/semantic.before" -after-state "$output/state/semantic.after" \
            -output "$output/first/semantic.json" -expect PASS
          go run ./scripts/proof-choice-algebra -mode judge -source "$output/foundation-semantic.gooo" -receipt "$output/first/semantic.json" \
            -before-state "$output/state/semantic.before" -after-state "$output/state/semantic.after" -output "$output/judged/semantic.json" -expect PASS
          cp examples/proof-choice-algebra/foundation.gooo "$output/foundation-comment.gooo"
          sed -i 's/nonsemantic-marker: foundation/nonsemantic-marker: changed/' "$output/foundation-comment.gooo"
          go run ./scripts/proof-choice-algebra -mode produce -source "$output/foundation-comment.gooo" -repo-root "$GITHUB_WORKSPACE" \
            -before-state "$output/state/comment.before" -after-state "$output/state/comment.after" \
            -output "$output/first/comment.json" -expect PASS
          go run ./scripts/proof-choice-algebra -mode judge -source "$output/foundation-comment.gooo" -receipt "$output/first/comment.json" \
            -before-state "$output/state/comment.before" -after-state "$output/state/comment.after" -output "$output/judged/comment.json" -expect PASS
          jq -e --slurpfile base "$output/first/foundation.json" '.source_digest != $base[0].source_digest and .semantic_digest != $base[0].semantic_digest and .decision == "PASS" and .subject_resolution == "LOWER_RESOLUTION" and .transitions[0].to == "OPEN" and .evidence[0].state == "INSUFFICIENT"' "$output/first/semantic.json"
          jq -e --slurpfile base "$output/first/foundation.json" '.source_digest != $base[0].source_digest and .semantic_digest == $base[0].semantic_digest and .decision == $base[0].decision and .subject_resolution == $base[0].subject_resolution and .transitions == $base[0].transitions and .evidence == $base[0].evidence' "$output/first/comment.json"
          jq -e '.semantic_digest_match == true and .source_digest_match == true and .independent_evidence == 1 and .effects_match == true' "$output/judged/semantic.json" "$output/judged/comment.json"
      - name: Count receipt-only evidence and producer imports
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/proof-choice-algebra"
          go run ./scripts/proof-choice-algebra -mode receipt-only -receipt "$output/first/foundation.json" -output "$output/receipt-only.json" -expect FAIL_CLOSED
          jq -e '.decision == "FAIL_CLOSED" and .independent_evidence == 0 and .receipt_only == true' "$output/receipt-only.json"
          if go list -deps ./internal/meta/proofchoicejudge | grep -Fxq 'github.com/kimjooyoon/meta-ontology-go/internal/meta/proofchoicealgebra'; then
            producer_imports=1
          else
            producer_imports=0
          fi
          jq -n --argjson imports "$producer_imports" '{producer_imports:$imports, producer_import_denominator:1, receipt_only_evidence:0, receipt_only_denominator:1}' > "$output/independence.json"
          test "$producer_imports" -eq 0
      - name: Write separate fixed-denominator evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/proof-choice-algebra"
          jq -s '{cases:{numerator:length,denominator:8},routes:{selected:{FOUNDATION:(map(.summary.choice_counts.FOUNDATION)|add),COHERENCE:(map(.summary.choice_counts.COHERENCE)|add),REGRESSION:(map(.summary.choice_counts.REGRESSION)|add)},denominator:3},evidence_slots:{FOUNDATION:(map([((.evidence // [])[] | select(.route == "FOUNDATION") | (.observation_slots | length))] | add // 0)|add // 0),COHERENCE:(map([((.evidence // [])[] | select(.route == "COHERENCE") | (.observation_slots | length))] | add // 0)|add // 0),REGRESSION:(map([((.evidence // [])[] | select(.route == "REGRESSION") | (.observation_slots | length))] | add // 0)|add // 0),denominator:3},metrics:{numerator:(map(.summary.metric_slot_numerator)|add // 0),denominator:(map(.summary.metric_slot_denominator)|add // 0)},claims:{transitions:(map([.transitions[] | select(.claim_id | startswith("claim."))] | length)|add // 0),denominator:(map(.summary.claim_denominator)|add // 0)},source_reconstruction:{numerator:(map(.source_reconstruction.numerator)|add // 0),denominator:(map(.source_reconstruction.denominator)|add // 0)},effects:{repository_writes:(map(.effects.repository_writes)|add // 0),mutation_authority:(map(if .effects.mutation_authority then 1 else 0 end)|add // 0),denominator:8},interventions:{semantic:1,nonsemantic:1,denominator:2}}' \
            "$output"/first/{foundation,coherence,regression,combined,lower-resolution,unknown,contradiction,composition-failure}.json > "$output/aggregate.json"
      - name: Upload semantic proof artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: proof-choice-algebra-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/proof-choice-algebra
          if-no-files-found: error
