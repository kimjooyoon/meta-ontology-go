name: Language value witness

on:
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/language-value-witness.yml
      - examples/language-value-witness/**
      - examples/language-syntax-roundtrip/corpus.json
      - internal/bidir/**
      - internal/semantic/**
      - internal/meta/languagereadiness/languagesyntax/**
      - internal/syntax/**
      - internal/valueexecution/**
      - scripts/language-value-witness/**
  push:
    branches: [dev]
    paths:
      - .github/workflows/language-value-witness.yml
      - examples/language-value-witness/**
      - examples/language-syntax-roundtrip/corpus.json
      - internal/bidir/**
      - internal/semantic/**
      - internal/meta/languagereadiness/languagesyntax/**
      - internal/syntax/**
      - internal/valueexecution/**
      - scripts/language-value-witness/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-value-level-computation:
    runs-on: ubuntu-latest
    env:
      HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.HEAD_SHA }}
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.x
          check-latest: true
      - name: Go 1.27 fix and canonical format conformance
        shell: bash
        run: |
          set -euo pipefail
          go fix ./internal/semantic ./internal/bidir ./internal/valueexecution ./scripts/language-value-witness
          gofmt -w \
            internal/syntax/ast_part03.go \
            internal/syntax/activity_parser.go \
            internal/syntax/format_part04.go \
            internal/syntax/format_value_program.go \
            internal/syntax/value_program_test.go \
            internal/bidir/lower_part05.go \
            internal/bidir/lower_document_part03.go \
            internal/bidir/lower_value_program.go \
            internal/bidir/value_program.go \
            internal/bidir/value_program_test.go \
            internal/semantic/types_part02.go \
            internal/semantic/types_part03.go \
            internal/semantic/node_value_program.go \
            internal/semantic/canonical_part01.go \
            internal/valueexecution/model.go \
            internal/valueexecution/model_evidence.go \
            internal/valueexecution/model_summary.go \
            internal/valueexecution/failure.go \
            internal/valueexecution/digest.go \
            internal/valueexecution/registry.go \
            internal/valueexecution/compile.go \
            internal/valueexecution/program.go \
            internal/valueexecution/evaluate.go \
            internal/valueexecution/evaluation.go \
            internal/valueexecution/measurement.go \
            internal/valueexecution/core_ir_measurement.go \
            internal/valueexecution/cases.go \
            internal/valueexecution/counterexamples.go \
            internal/valueexecution/counterexample_results.go \
            internal/valueexecution/helpers.go \
            internal/valueexecution/indicators.go \
            internal/valueexecution/indicator_results.go \
            internal/valueexecution/views.go \
            internal/valueexecution/proofs.go \
            internal/valueexecution/validate.go \
            internal/valueexecution/evaluate_test.go \
            scripts/language-value-witness/main.go
          git diff --exit-code -- \
            internal/syntax internal/bidir internal/semantic internal/valueexecution \
            scripts/language-value-witness
      - name: Compile parser, semantic binding, and value executor
        run: go test ./internal/syntax ./internal/bidir ./internal/semantic ./internal/valueexecution
      - name: Dogfood the int.sign Gooo declaration and generated Go
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/language-value-sign-dogfood"
          mkdir -p "$output/first" "$output/second"
          go run ./cmd/gooo check --semantic examples/language-value-witness/sign.gooo > "$output/check.txt"
          for pass in first second; do
            go run ./cmd/gooo generate examples/language-value-witness/sign.gooo --out "$output/$pass"
            test -s "$output/$pass/semantic.gooo.go"
            test -s "$output/$pass/semantic.gooo.manifest.jsonl"
            test -z "$(gofmt -l "$output/$pass/semantic.gooo.go")"
          done
          cmp "$output/first/semantic.gooo.go" "$output/second/semantic.gooo.go"
          jq -S 'del(.generated_file)' "$output/first/semantic.gooo.manifest.jsonl" > "$output/first/canonical-manifest.json"
          jq -S 'del(.generated_file)' "$output/second/semantic.gooo.manifest.jsonl" > "$output/second/canonical-manifest.json"
          cmp "$output/first/canonical-manifest.json" "$output/second/canonical-manifest.json"
          {
            echo "### Gooo int.sign dogfood"
            echo '- declaration: `examples/language-value-witness/sign.gooo`'
            echo '- semantic check: `PASS`'
            echo '- generated Go replay: `IDENTICAL`'
            echo '- generated manifest replay: `IDENTICAL (canonical; output path excluded)`'
            echo '- repository writes: `0`'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload int.sign dogfood evidence
        uses: actions/upload-artifact@v7
        with:
          name: language-value-sign-dogfood-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/language-value-sign-dogfood
          if-no-files-found: error
          retention-days: 14
      - name: Dogfood the int.mod Gooo declaration and generated Go
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/language-value-mod-dogfood"
          mkdir -p "$output/first" "$output/second"
          go run ./cmd/gooo check --semantic examples/language-value-witness/mod.gooo > "$output/check.txt"
          for pass in first second; do
            go run ./cmd/gooo generate examples/language-value-witness/mod.gooo --out "$output/$pass"
            test -s "$output/$pass/semantic.gooo.go"
            test -s "$output/$pass/semantic.gooo.manifest.jsonl"
            test -z "$(gofmt -l "$output/$pass/semantic.gooo.go")"
          done
          cmp "$output/first/semantic.gooo.go" "$output/second/semantic.gooo.go"
          jq -S 'del(.generated_file)' "$output/first/semantic.gooo.manifest.jsonl" > "$output/first/canonical-manifest.json"
          jq -S 'del(.generated_file)' "$output/second/semantic.gooo.manifest.jsonl" > "$output/second/canonical-manifest.json"
          cmp "$output/first/canonical-manifest.json" "$output/second/canonical-manifest.json"
          {
            echo "### Gooo int.mod dogfood"
            echo '- declaration: `examples/language-value-witness/mod.gooo`'
            echo '- semantic check: `PASS`'
            echo '- generated Go replay: `IDENTICAL`'
            echo '- generated manifest replay: `IDENTICAL (canonical; output path excluded)`'
            echo '- repository writes: `0`'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload int.mod dogfood evidence
        uses: actions/upload-artifact@v7
        with:
          name: language-value-mod-dogfood-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/language-value-mod-dogfood
          if-no-files-found: error
          retention-days: 14
      - name: Execute the int.mod Gooo plan and replay its receipt
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/language-value-mod-execution"
          mkdir -p "$output"
          printf '{"value":41}\n' > "$output/input.json"
          for pass in first second; do
            go run ./cmd/gooo run --json --entry Remainder \
              --input "$output/input.json" \
              examples/language-value-witness/mod.gooo > "$output/$pass.json"
          done
          cmp "$output/first.json" "$output/second.json"
          jq -e '
            .schema == "gooo/value-execution-plan/v1" and
            .decision == "PASS" and
            .entry == "Remainder" and
            .source_digest != "" and
            .semantic_fingerprint != "" and
            .execution.scope == "REGISTERED_VALUE_OPERATION" and
            .execution.apply_calls == 1 and
            .execution.deliveries == 0 and
            .execution.results.Remainder.value == 2 and
            .execution.results.Remainder.operation_spec_digest != "" and
            .execution.results.Remainder.result_digest != ""
          ' "$output/first.json" > /dev/null
          {
            echo "### Gooo int.mod execution"
            echo '- declaration: `examples/language-value-witness/mod.gooo`'
            echo '- input: `41`'
            echo '- observed result: `2`'
            echo '- execution receipt replay: `IDENTICAL`'
            echo '- repository writes: `0`'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload int.mod execution evidence
        uses: actions/upload-artifact@v7
        with:
          name: language-value-mod-execution-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/language-value-mod-execution
          if-no-files-found: error
          retention-days: 14
      - name: Dogfood the int.neg Gooo declaration and generated Go
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/language-value-neg-dogfood"
          mkdir -p "$output/first" "$output/second"
          go run ./cmd/gooo check --semantic examples/language-value-witness/neg.gooo > "$output/check.txt"
          for pass in first second; do
            go run ./cmd/gooo generate examples/language-value-witness/neg.gooo --out "$output/$pass"
            test -s "$output/$pass/semantic.gooo.go"
            test -s "$output/$pass/semantic.gooo.manifest.jsonl"
            test -z "$(gofmt -l "$output/$pass/semantic.gooo.go")"
          done
          cmp "$output/first/semantic.gooo.go" "$output/second/semantic.gooo.go"
          jq -S 'del(.generated_file)' "$output/first/semantic.gooo.manifest.jsonl" > "$output/first/canonical-manifest.json"
          jq -S 'del(.generated_file)' "$output/second/semantic.gooo.manifest.jsonl" > "$output/second/canonical-manifest.json"
          cmp "$output/first/canonical-manifest.json" "$output/second/canonical-manifest.json"
          {
            echo "### Gooo int.neg dogfood"
            echo '- declaration: `examples/language-value-witness/neg.gooo`'
            echo '- semantic check: `PASS`'
            echo '- generated Go replay: `IDENTICAL`'
            echo '- generated manifest replay: `IDENTICAL (canonical; output path excluded)`'
            echo '- repository writes: `0`'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload int.neg dogfood evidence
        uses: actions/upload-artifact@v7
        with:
          name: language-value-neg-dogfood-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/language-value-neg-dogfood
          if-no-files-found: error
          retention-days: 14
      - name: Execute the int.neg Gooo plan and replay its receipt
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/language-value-neg-execution"
          mkdir -p "$output"
          printf '{"value":5}\n' > "$output/input.json"
          for pass in first second; do
            go run ./cmd/gooo run --json --entry Negate \
              --input "$output/input.json" \
              examples/language-value-witness/neg.gooo > "$output/$pass.json"
          done
          cmp "$output/first.json" "$output/second.json"
          jq -e '
            .schema == "gooo/value-execution-plan/v1" and
            .decision == "PASS" and
            .entry == "Negate" and
            .source_digest != "" and
            .semantic_fingerprint != "" and
            .execution.scope == "REGISTERED_VALUE_OPERATION" and
            .execution.apply_calls == 1 and
            .execution.deliveries == 0 and
            .execution.results.Negate.value == -5 and
            .execution.results.Negate.operation_spec_digest != "" and
            .execution.results.Negate.result_digest != ""
          ' "$output/first.json" > /dev/null
          {
            echo "### Gooo int.neg execution"
            echo '- declaration: `examples/language-value-witness/neg.gooo`'
            echo '- input: `5`'
            echo '- observed result: `-5`'
            echo '- execution receipt replay: `IDENTICAL`'
            echo '- repository writes: `0`'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload int.neg execution evidence
        uses: actions/upload-artifact@v7
        with:
          name: language-value-neg-execution-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/language-value-neg-execution
          if-no-files-found: error
          retention-days: 14
      - name: Dogfood the int.abs Gooo declaration and generated Go
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/language-value-abs-dogfood"
          mkdir -p "$output/first" "$output/second"
          go run ./cmd/gooo check --semantic examples/language-value-witness/abs.gooo > "$output/check.txt"
          for pass in first second; do
            go run ./cmd/gooo generate examples/language-value-witness/abs.gooo --out "$output/$pass"
            test -s "$output/$pass/semantic.gooo.go"
            test -s "$output/$pass/semantic.gooo.manifest.jsonl"
            test -z "$(gofmt -l "$output/$pass/semantic.gooo.go")"
          done
          cmp "$output/first/semantic.gooo.go" "$output/second/semantic.gooo.go"
          jq -S 'del(.generated_file)' "$output/first/semantic.gooo.manifest.jsonl" > "$output/first/canonical-manifest.json"
          jq -S 'del(.generated_file)' "$output/second/semantic.gooo.manifest.jsonl" > "$output/second/canonical-manifest.json"
          cmp "$output/first/canonical-manifest.json" "$output/second/canonical-manifest.json"
          {
            echo "### Gooo int.abs dogfood"
            echo '- declaration: `examples/language-value-witness/abs.gooo`'
            echo '- semantic check: `PASS`'
            echo '- generated Go replay: `IDENTICAL`'
            echo '- generated manifest replay: `IDENTICAL (canonical; output path excluded)`'
            echo '- repository writes: `0`'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload int.abs dogfood evidence
        uses: actions/upload-artifact@v7
        with:
          name: language-value-abs-dogfood-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/language-value-abs-dogfood
          if-no-files-found: error
          retention-days: 14
      - name: Execute the int.abs Gooo plan and replay its receipt
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/language-value-abs-execution"
          mkdir -p "$output"
          printf '{"value":-9}\n' > "$output/input.json"
          for pass in first second; do
            go run ./cmd/gooo run --json --entry Absolute \
              --input "$output/input.json" \
              examples/language-value-witness/abs.gooo > "$output/$pass.json"
          done
          cmp "$output/first.json" "$output/second.json"
          jq -e '
            .schema == "gooo/value-execution-plan/v1" and
            .decision == "PASS" and
            .entry == "Absolute" and
            .source_digest != "" and
            .semantic_fingerprint != "" and
            .execution.scope == "REGISTERED_VALUE_OPERATION" and
            .execution.apply_calls == 1 and
            .execution.deliveries == 0 and
            .execution.results.Absolute.value == 9 and
            .execution.results.Absolute.operation_spec_digest != "" and
            .execution.results.Absolute.result_digest != ""
          ' "$output/first.json" > /dev/null
          {
            echo "### Gooo int.abs execution"
            echo '- declaration: `examples/language-value-witness/abs.gooo`'
            echo '- input: `-9`'
            echo '- observed result: `9`'
            echo '- execution receipt replay: `IDENTICAL`'
            echo '- repository writes: `0`'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload int.abs execution evidence
        uses: actions/upload-artifact@v7
        with:
          name: language-value-abs-execution-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/language-value-abs-execution
          if-no-files-found: error
          retention-days: 14
      - name: Replay exact Gooo value witness
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/language-value-witness"
          mkdir -p "$output"
          for pass in first second; do
            go run ./scripts/language-value-witness \
              -source examples/language-value-witness/main.gooo \
              -activity Increment -head-sha "$HEAD_SHA" \
              -output "$output/$pass.json" -check
          done
          cmp "$output/first.json" "$output/second.json"
          {
            echo "### Gooo value witness"
            jq -r '"- decision: `\(.decision)` at `\(.resolution)`"' "$output/first.json"
            jq -r '"- value cases: `\(.summary.value_cases_passed)/\(.summary.value_cases_total)`; outputs: `\(.summary.value_outputs_observed)`"' "$output/first.json"
            jq -r '"- counterexamples: `\(.summary.counterexamples_passed)/\(.summary.counterexamples_total)`; replays: `\(.summary.deterministic_replays)/5`"' "$output/first.json"
            jq -r '"- scoped improvement: `\(.improvement.before.satisfied)/\(.improvement.before.total) -> \(.improvement.after.satisfied)/\(.improvement.after.total)`"' "$output/first.json"
            jq -r '"- reader views: `\(.views[0].satisfied)/\(.views[0].total)`, `\(.views[1].satisfied)/\(.views[1].total)`, `\(.views[2].satisfied)/\(.views[2].total)`"' "$output/first.json"
            jq -r '"- core IR preservation: `\(.summary.core_ir_program_preserved.satisfied)/\(.summary.core_ir_program_preserved.total)`; fingerprint: `\(.summary.core_ir_fingerprint_sensitive.satisfied)/\(.summary.core_ir_fingerprint_sensitive.total)`; unknown-attribute guard: `\(.summary.core_ir_unknown_attribute_fail_closed.satisfied)/\(.summary.core_ir_unknown_attribute_fail_closed.total)`"' "$output/first.json"
            jq -r '"- repository writes: `\(.summary.repository_writes)`; mutation authority: `\(.authority.repository_mutation_authorized)`"' "$output/first.json"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload exact-head value witness
        uses: actions/upload-artifact@v7
        with:
          name: language-value-witness-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/language-value-witness/first.json
          if-no-files-found: error
          retention-days: 14
