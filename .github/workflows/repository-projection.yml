name: Repository projection conformance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  roundtrip:
    name: repository projection roundtrip
    runs-on: ubuntu-latest
    env:
      EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out the exact source identity
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.EXACT_SHA }}

      - name: Install the declared Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.0
          cache: false

      - name: Prove physical storage and logical restoration
        run: |
          go run ./bootstrap/repository-projector \
            --root "$GITHUB_WORKSPACE" \
            --work "$RUNNER_TEMP/repository-projection" \
            --expected-sha "$EXACT_SHA"

      - name: Restore solely from the physical manifest
        run: |
	          go run ./bootstrap/repository-materializer \
	            --root "$GITHUB_WORKSPACE" \
	            --physical-root "$RUNNER_TEMP/repository-projection/physical" \
	            --work "$RUNNER_TEMP/repository-restored" \
	            --git-index "$RUNNER_TEMP/repository-restored/logical.index" \
	            --expected-sha "$EXACT_SHA"

      - name: Classify logical source split operations
        run: |
          go run ./bootstrap/logical-split-planner \
            --root "$RUNNER_TEMP/repository-restored/materialized" \
            --evidence "$RUNNER_TEMP/repository-projection/evidence.json" \
            --expected-sha "$EXACT_SHA" \
            --output "$RUNNER_TEMP/repository-projection/split-plan.json"

      - name: Apply metric-selected density rewrites
        run: |
          go run ./bootstrap/line-density-rewriter \
            --root "$RUNNER_TEMP/repository-restored/materialized" \
            --plan "$RUNNER_TEMP/repository-projection/split-plan.json" \
            --expected-sha "$EXACT_SHA" \
            --output "$RUNNER_TEMP/repository-projection/density-report.json"

      - name: Apply metric-selected helper extractions
        run: |
          go run ./bootstrap/function-extractor \
            --root "$RUNNER_TEMP/repository-restored/materialized" \
            --plan "$RUNNER_TEMP/repository-projection/split-plan.json" \
            --density-report "$RUNNER_TEMP/repository-projection/density-report.json" \
            --expected-sha "$EXACT_SHA" \
            --output "$RUNNER_TEMP/repository-projection/extraction-report.json"

      - name: Test the restored logical module
        working-directory: ${{ runner.temp }}/repository-restored/materialized
        env:
          GIT_DIR: ${{ github.workspace }}/.git
          GIT_WORK_TREE: ${{ runner.temp }}/repository-restored/materialized
	          GIT_INDEX_FILE: ${{ runner.temp }}/repository-restored/logical.index
	        run: |
	          test -z "$(git status --porcelain)"
	          go test ./...

      - name: Upload exact-SHA projection indicators
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-projection-${{ env.EXACT_SHA }}
          path: |
            ${{ runner.temp }}/repository-projection/evidence.json
            ${{ runner.temp }}/repository-projection/split-plan.json
            ${{ runner.temp }}/repository-projection/density-report.json
	            ${{ runner.temp }}/repository-projection/extraction-report.json
	            ${{ runner.temp }}/repository-projection/physical/projection/catalog/manifest.json
	            ${{ runner.temp }}/repository-restored/materialization-evidence.json
          if-no-files-found: error
          retention-days: 14
