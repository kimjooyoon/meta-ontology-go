name: Phase separation witness

on:
  pull_request:
    branches: [dev]
    paths:
      - .github/agent-scope-table.md
      - .github/ci-governance.json
      - .github/workflows/phase-separation-witness.yml
      - examples/phase-separation-witness/**
      - internal/meta/phaseseparation/**
      - internal/verify/scope_phase_separation_witness.go
      - scripts/phase-separation-adjudicator/**
      - scripts/phase-separation-witness/**
  push:
    branches: [dev]
    paths:
      - .github/agent-scope-table.md
      - .github/ci-governance.json
      - .github/workflows/phase-separation-witness.yml
      - examples/phase-separation-witness/**
      - internal/meta/phaseseparation/**
      - internal/verify/scope_phase_separation_witness.go
      - scripts/phase-separation-adjudicator/**
      - scripts/phase-separation-witness/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-phase-separation:
    name: prove phase separation
    runs-on: ubuntu-latest
    env:
      HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.0
          cache: false
      - name: Require Go 1.27 and compile the isolated witness
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = "go1.27.0"
          go test ./internal/meta/phaseseparation ./scripts/phase-separation-witness ./scripts/phase-separation-adjudicator
      - name: Emit and replay the producer receipt
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/phase-separation-witness"
          mkdir -p "$output"
          for pass in first second; do
            go run ./scripts/phase-separation-witness \
              -source examples/phase-separation-witness/main.gooo \
              -leaks examples/phase-separation-witness/leaks.gooo \
              -head-sha "$HEAD_SHA" -output "$output/$pass.json"
          done
          cmp -s "$output/first.json" "$output/second.json"
      - name: Independently adjudicate the proven receipt
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/phase-separation-witness"
          go run ./scripts/phase-separation-adjudicator \
            -receipt "$output/first.json" -expected-head "$HEAD_SHA" -mode proven
      - name: Emit, replay, and independently adjudicate UNKNOWN
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/phase-separation-witness"
          for pass in first second; do
            go run ./scripts/phase-separation-witness \
              -source examples/phase-separation-witness/unknown.gooo \
              -leaks examples/phase-separation-witness/leaks.gooo \
              -head-sha "$HEAD_SHA" -output "$output/unknown-$pass.json"
          done
          cmp -s "$output/unknown-first.json" "$output/unknown-second.json"
          go run ./scripts/phase-separation-adjudicator \
            -receipt "$output/unknown-first.json" -expected-head "$HEAD_SHA" -mode unknown
          {
            echo '### Phase separation witness'
            jq -r '"- decision: `\(.decision)` at `\(.coordinate.stage)/\(.coordinate.step)/\(.coordinate.reason)`"' "$output/first.json"
            jq -r '"- clean: `\(.summary.clean_cases_passed)/\(.summary.clean_cases_total)`; leakage caught: `\(.summary.leakage_cases_caught)/\(.summary.leakage_cases_total)`"' "$output/first.json"
            jq -r '"- preserved claims: `\(.summary.claim_transitions_preserved)/\(.summary.claim_transitions_total)`; indicators: `\(.summary.indicators_satisfied)/\(.summary.indicators_total)`"' "$output/first.json"
            jq -r '"- repository writes: `\(.summary.repository_writes)`; mutation authority: `\(.authority.mutation)`"' "$output/first.json"
            jq -r '"- unknown probe: `\(.decision)` at `\(.coordinate.stage)/\(.coordinate.step)/\(.coordinate.reason)`"' "$output/unknown-first.json"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload exact-head witness receipts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: phase-separation-witness-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/phase-separation-witness
          if-no-files-found: error
          retention-days: 14
