name: Core conformance registry

on:
  pull_request:
    paths:
      - 'examples/language-syntax-roundtrip/corpus.json'
      - 'examples/self-improvement-ci-continuation/**'
      - 'internal/meta/languagereadiness/languagesyntax/**'
      - 'internal/meta/languageassurance/verticalsliceclosureshadow/**'
      - '.github/workflows/core-conformance-registry.yml'
      - '.github/workflows/transformation-effect.yml'

permissions:
  contents: read

jobs:
  registry-conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
      - name: Check changed Go formatting
        shell: bash
        run: |
          set -euo pipefail
          gofmt -d \
            internal/meta/languagereadiness/languagesyntax/model.go \
            internal/meta/languagereadiness/languagesyntax/registry.go \
            internal/meta/languagereadiness/languagesyntax/conformance/evaluate_test.go \
            internal/meta/languagereadiness/languagesyntax/conformance/inventory_test.go \
            internal/meta/languageassurance/verticalsliceclosureshadow/contract.go \
            internal/meta/languageassurance/verticalsliceclosureshadow/evidence.go \
            internal/meta/languageassurance/verticalsliceclosureshadow/denominator.go \
            internal/meta/languageassurance/verticalsliceclosureshadow/denominator_migration_test.go \
            > "$RUNNER_TEMP/core-conformance-format.diff"
          test ! -s "$RUNNER_TEMP/core-conformance-format.diff"
      - name: Test registry, inventory and pinned denominator
        shell: bash
        run: |
          set -euo pipefail
          go test \
            ./internal/meta/languagereadiness/languagesyntax/... \
            ./internal/meta/languageassurance/verticalsliceclosureshadow \
            2>&1 | tee "$RUNNER_TEMP/core-conformance-tests.log"
      - name: Preserve conformance diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: core-conformance-registry-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/core-conformance-*
          if-no-files-found: error
