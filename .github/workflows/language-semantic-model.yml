name: Language semantic model conformance

on:
  pull_request:
    paths:
      - ".github/workflows/language-semantic-model.yml"
      - "cmd/language-semantic-witness/**"
      - "internal/meta/languagereadiness/languagesemantic/**"
      - "examples/language-semantic-model/**"
      - "docs/language/language-semantic-model.md"
  push:
    branches: [dev]
    paths:
      - ".github/workflows/language-semantic-model.yml"
      - "cmd/language-semantic-witness/**"
      - "internal/meta/languagereadiness/languagesemantic/**"
      - "examples/language-semantic-model/**"
      - "docs/language/language-semantic-model.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-model:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact subject
        uses: actions/checkout@v5
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Go 1.27
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.0"
          cache: true
      - name: Produce exact-head syntax dependency
        shell: bash
        run: |
          set -euo pipefail
          concept="$RUNNER_TEMP/language-concept-artifact"
          syntax="$RUNNER_TEMP/language-syntax-roundtrip"
          mkdir -p "$concept" "$syntax"
          go run ./cmd/language-concept-artifact-witness \
            -root "$GITHUB_WORKSPACE" \
            -output "$concept/artifact.json"
          go run ./cmd/language-syntax-witness \
            --root "$GITHUB_WORKSPACE" \
            --head "$HEAD_SHA" \
            --registry "$GITHUB_WORKSPACE/examples/language-syntax-roundtrip/corpus.json" \
            --concept-artifact "$concept/artifact.json" \
            --output "$syntax/artifact.json"
      - name: Produce replay and consume semantic receipt
        shell: bash
        run: |
          set -euo pipefail
          first="$RUNNER_TEMP/language-semantic-model/first"
          replay="$RUNNER_TEMP/language-semantic-model/replay"
          syntax="$RUNNER_TEMP/language-syntax-roundtrip/artifact.json"
          registry="$GITHUB_WORKSPACE/examples/language-semantic-model/corpus.json"
          mkdir -p "$first" "$replay"
          for target in "$first" "$replay"; do
            go run ./cmd/language-semantic-witness \
              --root "$GITHUB_WORKSPACE" \
              --head "$HEAD_SHA" \
              --registry "$registry" \
              --syntax-artifact "$syntax" \
              --output "$target/artifact.json"
          done
          cmp -s "$first/artifact.json" "$replay/artifact.json"
          go run ./cmd/language-semantic-witness \
            --root "$GITHUB_WORKSPACE" \
            --head "$HEAD_SHA" \
            --registry "$registry" \
            --syntax-artifact "$syntax" \
            --check "$first/artifact.json"
      - name: Upload exact-head semantic receipt
        uses: actions/upload-artifact@v6
        with:
          name: language-semantic-model-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/language-semantic-model/first/artifact.json
          if-no-files-found: error
          retention-days: 30
