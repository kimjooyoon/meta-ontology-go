name: CI Plan Use Case

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-plan-usecase-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: Gooo CI plan use case
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.x
          cache: true
      - name: Conform, execute, measure, and replay
        run: bash scripts/ci-plan-usecase/main.sh
      - name: Upload deterministic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-plan-usecase-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/gooo-ci-plan
          if-no-files-found: error
          retention-days: 14
