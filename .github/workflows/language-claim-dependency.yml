name: Gooo claim dependency causality

on:
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/language-claim-dependency.yml
      - docs/research/claim-dependency-causality.md
      - examples/language-claim-dependency/**
      - internal/meta/claimdependency/**
      - internal/meta/claimdependencyjudge/**
      - internal/verify/scope_gooo_claim_dependency.go
      - scripts/language-claim-dependency/**
      - scripts/language-claim-dependency-evidence/**
      - scripts/language-claim-dependency-judge/**
      - scripts/language-claim-dependency-intervention/**
  push:
    branches: [dev]
    paths:
      - .github/workflows/language-claim-dependency.yml
      - docs/research/claim-dependency-causality.md
      - examples/language-claim-dependency/**
      - internal/meta/claimdependency/**
      - internal/meta/claimdependencyjudge/**
      - internal/verify/scope_gooo_claim_dependency.go
      - scripts/language-claim-dependency/**
      - scripts/language-claim-dependency-evidence/**
      - scripts/language-claim-dependency-judge/**
      - scripts/language-claim-dependency-intervention/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  claim-dependency:
    runs-on: ubuntu-latest
    env:
      HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.HEAD_SHA }}
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          check-latest: false
      - name: Format and package checks
        shell: bash
        run: |
          set -euo pipefail
          files=(
            internal/meta/claimdependency/contract.go
            internal/meta/claimdependency/evaluate.go
            internal/meta/claimdependency/evaluate_test.go
            internal/meta/claimdependency/model.go
            internal/meta/claimdependencyjudge/judge.go
            internal/meta/claimdependencyjudge/judge_test.go
            internal/verify/scope_gooo_claim_dependency.go
            scripts/language-claim-dependency/main.go
            scripts/language-claim-dependency-evidence/main.go
            scripts/language-claim-dependency-judge/main.go
            scripts/language-claim-dependency-intervention/main.go
          )
          test -z "$(gofmt -l "${files[@]}")"
          go vet ./internal/meta/claimdependency ./internal/meta/claimdependencyjudge ./scripts/language-claim-dependency ./scripts/language-claim-dependency-evidence ./scripts/language-claim-dependency-judge ./scripts/language-claim-dependency-intervention
          go test ./internal/meta/claimdependency ./internal/meta/claimdependencyjudge
      - name: Emit provider evidence, producer receipts, and raw judge results
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/claim-dependency"
          mkdir -p "$output/first" "$output/second" "$output/provider"
          capability="$output/capability.json"
          jq -n '{provider:"github-actions",permission:"contents:read",status:"CURRENT_EVIDENCE",coordinate:{stage:"AUTHORITY",step:"workflow-permissions",reason:"DECLARED_READ_ONLY_CONTENTS"}}' > "$capability"
          for pass in first second; do
            go run ./scripts/language-claim-dependency-evidence -artifact examples/language-claim-dependency/unknown.gooo -operation availability -capability "$capability" -repo-root "$GITHUB_WORKSPACE" -output "$output/provider/unknown.json"
            go run ./scripts/language-claim-dependency-evidence -artifact examples/language-claim-dependency/refuted.gooo -operation contradiction -capability "$capability" -repo-root "$GITHUB_WORKSPACE" -output "$output/provider/refuted.json"
            go run ./scripts/language-claim-dependency-evidence -artifact examples/language-claim-dependency/main.gooo -operation acceptance -capability "$capability" -repo-root "$GITHUB_WORKSPACE" -output "$output/provider/accepted.json"
            go run ./scripts/language-claim-dependency -source examples/language-claim-dependency/unknown.gooo -evidence "$output/provider/unknown.json" -output "$output/$pass/unknown.json" -check
            go run ./scripts/language-claim-dependency -source examples/language-claim-dependency/refuted.gooo -evidence "$output/provider/refuted.json" -output "$output/$pass/refuted.json" -check
            go run ./scripts/language-claim-dependency -source examples/language-claim-dependency/main.gooo -evidence "$output/provider/accepted.json" -prior-receipt "$output/$pass/unknown.json" -output "$output/$pass/recovered.json" -check
            go run ./scripts/language-claim-dependency-intervention -baseline examples/language-claim-dependency/unknown.gooo -semantic examples/language-claim-dependency/value-intervention.gooo -edge examples/language-claim-dependency/edge-intervention.gooo -comment examples/language-claim-dependency/main.gooo -repo-root "$GITHUB_WORKSPACE" -capability "$capability" -output "$output/$pass/interventions.json"
            go run ./scripts/language-claim-dependency-judge -source examples/language-claim-dependency/unknown.gooo -evidence "$output/provider/unknown.json" -receipt "$output/$pass/unknown.json" -output "$output/$pass/unknown-judgment.json"
            go run ./scripts/language-claim-dependency-judge -source examples/language-claim-dependency/refuted.gooo -evidence "$output/provider/refuted.json" -receipt "$output/$pass/refuted.json" -output "$output/$pass/refuted-judgment.json"
            go run ./scripts/language-claim-dependency-judge -source examples/language-claim-dependency/main.gooo -prior-receipt "$output/$pass/unknown.json" -evidence "$output/provider/accepted.json" -receipt "$output/$pass/recovered.json" -output "$output/$pass/recovered-judgment.json"
          done
          for name in unknown refuted recovered; do
            cmp -s "$output/first/$name.json" "$output/second/$name.json"
            cmp -s "$output/first/$name-judgment.json" "$output/second/$name-judgment.json"
          done
          cmp -s "$output/first/interventions.json" "$output/second/interventions.json"
          if rg -n 'internal/meta/claimdependency"' internal/meta/claimdependencyjudge scripts/language-claim-dependency-judge; then echo "consumer imported producer package" >&2; exit 1; fi
      - name: Assert exact causal algebra, evidence, effects, and interventions
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/claim-dependency/first"
          jq -e '
            .schema == "gooo.meta.claim-dependency-receipt/v3" and .evidence.status == "CURRENT_EVIDENCE" and .metrics.fixed_claim_total == 6 and .metrics.distinct_proposition_total == 6 and .graph.node_total == 6 and .graph.edge_total == 8 and .metrics.eligible_edge_total == 8 and .metrics.truth_table_case_total == 8 and (.truth_table | length) == 8 and .metrics.classified_claim_total == 6 and .metrics.open_claim_total == 6 and .metrics.direct_unknown_claim_total == 1 and .metrics.dependency_blocked_claim_total == 5 and .metrics.current_evidence_total == 6 and .metrics.historical_evidence_total == 0 and .metrics.unknown_evidence_total == 6 and .metrics.observed_causal_edge_total == 5 and .metrics.minimum_causal_edge_total == 3 and .metrics.observed_blocking_edge_total == 5 and .metrics.observed_refuting_edge_total == 0 and .metrics.observed_recovery_edge_total == 0 and .metrics.maximum_cause_path_depth == 2 and .metrics.transition_total == 12 and .decision.resolution == "UNRESOLVED_CLAIM" and .subject.authority_resolution == "READ_ONLY_VERIFIED" and .subject.repository_writes == 0 and .decision.semantic_promotion_authorized == false and ([.metrics.edge_metrics[] | select(.kind == "SUPPORTS")][0] | .eligible == 2 and .observed_causal == 2 and .blocking == 2) and ([.metrics.edge_metrics[] | select(.kind == "REQUIRES")][0] | .eligible == 3 and .observed_causal == 3 and .blocking == 3) and ([.metrics.edge_metrics[] | select(.kind == "CONTRADICTS")][0] | .eligible == 2 and .observed_causal == 0) and ([.metrics.edge_metrics[] | select(.kind == "FAILURE_ENTAILMENT")][0] | .eligible == 1 and .observed_causal == 0)
          ' "$output/unknown.json"
          jq -e '
            .evidence.observed_predicate == "EXPLICIT_CONTRADICTION" and .metrics.current_evidence_total == 6 and .metrics.unknown_evidence_total == 5 and .metrics.direct_refuted_claim_total == 1 and .metrics.dependency_refuted_claim_total == 2 and .metrics.open_claim_total == 3 and .metrics.refuted_claim_total == 3 and .metrics.observed_causal_edge_total == 7 and .metrics.minimum_causal_edge_total == 5 and .metrics.observed_blocking_edge_total == 5 and .metrics.observed_refuting_edge_total == 2 and .metrics.maximum_cause_path_depth == 2 and ([.metrics.edge_metrics[] | select(.kind == "SUPPORTS")][0] | .observed_causal == 2 and .blocking == 2 and .refuting == 0) and ([.metrics.edge_metrics[] | select(.kind == "REQUIRES")][0] | .observed_causal == 3 and .blocking == 3 and .refuting == 0) and ([.metrics.edge_metrics[] | select(.kind == "CONTRADICTS")][0] | .observed_causal == 1 and .blocking == 0 and .refuting == 1) and ([.metrics.edge_metrics[] | select(.kind == "FAILURE_ENTAILMENT")][0] | .observed_causal == 1 and .blocking == 0 and .refuting == 1) and .decision.resolution == "CAUSAL_REFUTATION"
          ' "$output/refuted.json"
          jq -e '
            .evidence.observed_predicate == "EVIDENCE_ACCEPTED" and .prior_receipt_digest != "" and .previous_transition_digest != "" and (.prior_claim_states | length) == 6 and .metrics.transition_total == 18 and .metrics.append_only_transition_total == 6 and .metrics.discharged_claim_total == 6 and .metrics.direct_discharged_claim_total == 1 and .metrics.dependency_discharged_claim_total == 5 and .metrics.eligible_edge_total == 8 and .metrics.observed_causal_edge_total == 3 and .metrics.minimum_causal_edge_total == 2 and .metrics.observed_recovery_edge_total == 3 and .metrics.current_evidence_total == 6 and .metrics.unknown_evidence_total == 0 and .decision.value == "PASS" and .decision.resolution == "CAUSAL_RECOVERY_DISCHARGED" and .subject.authority_resolution == "READ_ONLY_VERIFIED"
          ' "$output/recovered.json"
          for name in unknown refuted recovered; do jq -e '.schema == "gooo.meta.claim-dependency-judgment/v3" and .accepted == true and .independent_replay == "RAW_GOOO_PARSE_LOWER_ARTIFACT_REOBSERVE_AND_TRANSITION_REDERIVED" and .source_reconstruction == "syntax.ParseFile->bidir.Lower->semantic.IR" and .source_reconstruction_numerator == 1 and .source_reconstruction_denominator == 1 and .producer_package_import_numerator == 0 and .producer_package_import_denominator == 1 and .read_only == true and .semantic_promotion_authorized == false and .authority_resolution == "READ_ONLY_VERIFIED"' "$output/$name-judgment.json"; done
          jq -e '
            (.schema == "gooo.meta.claim-dependency-intervention/v2") and (.interventions | length) == 4 and .interventions[0].kind == "VALUE_PROGRAM" and .interventions[0].evidence_digest_changed == false and .interventions[0].semantic_digest_changed == true and .interventions[0].state_transition_changed == true and .interventions[0].decision_changed == true and .interventions[1].kind == "OBSERVATION" and .interventions[1].semantic_digest_changed == false and .interventions[1].evidence_digest_changed == true and .interventions[1].state_transition_changed == true and .interventions[1].decision_changed == true and .interventions[2].kind == "EDGE_KIND" and .interventions[2].semantic_digest_changed == true and .interventions[2].edge_type_changed == true and .interventions[2].state_transition_changed == true and .interventions[2].decision_changed == true and .interventions[3].kind == "COMMENT_ONLY" and .interventions[3].semantic_digest_changed == false and .interventions[3].graph_digest_changed == false and .interventions[3].evidence_digest_changed == false and .interventions[3].state_transition_changed == false and .interventions[3].decision_changed == false and ([.interventions[] | select(.baseline_authority_resolution == "READ_ONLY_VERIFIED" and .intervention_authority_resolution == "READ_ONLY_VERIFIED" and .baseline_repository_writes == 0 and .intervention_repository_writes == 0)] | length) == 4
          ' "$output/interventions.json"
          {
            echo "### Gooo claim dependency causality"
            echo ""
            echo "- propositions: distinct 6/6; typed edges eligible 8/8; truth-table cases 8/8 (2 each: SUPPORTS 2, REQUIRES 2, CONTRADICTS 2, FAILURE_ENTAILMENT 2)"
            echo "- CURRENT_EVIDENCE: unknown 6 claims / refuted 6 claims (5 UNKNOWN) / recovery 6 claims (0 UNKNOWN); HISTORICAL_FIXTURE 0; UNKNOWN status count 6/5/0"
            echo "- states: unknown direct 1 + blocked 5 OPEN; refuted direct 1 + dependency 2 REFUTED + 3 OPEN; recovery direct 1 + dependency 5 DISCHARGED"
            echo "- causal edges: unknown 5 observed / 8 eligible / 3 minimum; refuted 7 / 8 / 5; recovery 3 / 8 / 2; edge depth 2"
            echo "- append-only recovery: 12 preserved + 6 appended, chain count 1; producer import 0/1; source reconstruction 1/1"
            echo "- authority: tracked+untracked pre/post snapshot equal, repository writes 0, READ_ONLY_VERIFIED via contents:read capability, semantic promotion false"
            echo "- interventions: source-only fixed evidence; observation-only fixed source; edge-only typed edge; comment-only digest-preserving"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload claim dependency receipts and interventions
        uses: actions/upload-artifact@v4
        with:
          name: claim-dependency-causality-${{ github.sha }}
          path: ${{ runner.temp }}/claim-dependency/first
          if-no-files-found: error
          retention-days: 14
