name: Gooo claim dependency causality

on:
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/language-claim-dependency.yml
      - docs/research/claim-dependency-causality.md
      - examples/language-claim-dependency/**
      - internal/meta/claimdependency/**
      - internal/meta/claimdependencyjudge/**
      - internal/verify/scope_gooo_claim_dependency.go
      - scripts/language-claim-dependency/**
      - scripts/language-claim-dependency-evidence/**
      - scripts/language-claim-dependency-failure/**
      - scripts/language-claim-dependency-judge/**
      - scripts/language-claim-dependency-intervention/**
      - scripts/language-claim-dependency-observation/**
  push:
    branches: [dev]
    paths:
      - .github/workflows/language-claim-dependency.yml
      - docs/research/claim-dependency-causality.md
      - examples/language-claim-dependency/**
      - internal/meta/claimdependency/**
      - internal/meta/claimdependencyjudge/**
      - internal/verify/scope_gooo_claim_dependency.go
      - scripts/language-claim-dependency/**
      - scripts/language-claim-dependency-evidence/**
      - scripts/language-claim-dependency-failure/**
      - scripts/language-claim-dependency-judge/**
      - scripts/language-claim-dependency-intervention/**
      - scripts/language-claim-dependency-observation/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  claim-dependency:
    runs-on: ubuntu-latest
    env:
      HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.HEAD_SHA }}
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          check-latest: false
      - name: Format and package checks
        shell: bash
        run: |
          set -euo pipefail
          files=(
            internal/meta/claimdependency/contract.go
            internal/meta/claimdependency/evaluate.go
            internal/meta/claimdependency/evaluate_test.go
            internal/meta/claimdependency/model.go
            internal/meta/claimdependencyjudge/judge.go
            internal/meta/claimdependencyjudge/judge_test.go
            internal/verify/scope_gooo_claim_dependency.go
            scripts/language-claim-dependency/main.go
            scripts/language-claim-dependency-evidence/main.go
            scripts/language-claim-dependency-failure/main.go
            scripts/language-claim-dependency-judge/main.go
            scripts/language-claim-dependency-intervention/main.go
            scripts/language-claim-dependency-observation/main.go
            scripts/language-claim-dependency-structural-fixtures/main.go
          )
          test -z "$(gofmt -l "${files[@]}")"
          go vet ./internal/meta/claimdependency ./internal/meta/claimdependencyjudge ./scripts/language-claim-dependency ./scripts/language-claim-dependency-evidence ./scripts/language-claim-dependency-failure ./scripts/language-claim-dependency-judge ./scripts/language-claim-dependency-intervention ./scripts/language-claim-dependency-observation
          go test ./internal/meta/claimdependency ./internal/meta/claimdependencyjudge
      - name: Emit provider evidence, producer receipts, and raw judge results
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/claim-dependency"
          mkdir -p "$output/first" "$output/second" "$output/provider" "$output/observation"
          capability="$output/capability.json"
          jq -n '{provider:"github-actions",permission:"contents:read",status:"CURRENT_EVIDENCE",toolchain:{name:"go",version:"go1.27.0"},coordinate:{stage:"AUTHORITY",step:"workflow-permissions",reason:"GITHUB_API_CONTENTS_READ_CAPABILITY"}}' > "$capability"
          contract=examples/language-claim-dependency/validator-contract.json
          refuted_contract=examples/language-claim-dependency/validator-contract-refuted.json
          cp "$contract" "$output/validator-contract.json"
          cp "$refuted_contract" "$output/validator-contract-refuted.json"
          failure_output="$output/failure-process.txt"
          go run ./scripts/language-claim-dependency-failure -source examples/language-claim-dependency/refuted.gooo -artifact examples/language-claim-dependency/refuted-target.gooo -edge-id E08 -output "$output/failure.json" > "$failure_output" 2>&1
          go run ./scripts/language-claim-dependency-observation -source examples/language-claim-dependency/main.gooo -artifact examples/language-claim-dependency/accepted-target.gooo -contract "$contract" -profile accepted-fixture -output "$output/observation/accepted.json"
          go run ./scripts/language-claim-dependency-observation -source examples/language-claim-dependency/main.gooo -artifact examples/language-claim-dependency/accepted-target.gooo -contract "$contract" -profile relabelled-fixture -output "$output/observation/accepted-alt.json"
          go run ./scripts/language-claim-dependency-observation -source examples/language-claim-dependency/refuted.gooo -artifact examples/language-claim-dependency/refuted-target.gooo -contract "$refuted_contract" -failure-receipt "$output/failure.json" -profile refuted-fixture -output "$output/observation/refuted.json"
          go run ./scripts/language-claim-dependency-observation -source examples/language-claim-dependency/refuted.gooo -artifact examples/language-claim-dependency/refuted-target.gooo -contract "$refuted_contract" -profile no-failure-fixture -output "$output/observation/refuted-no-failure.json"
          go run ./scripts/language-claim-dependency-observation -source examples/language-claim-dependency/main.gooo -artifact examples/language-claim-dependency/unrelated-target.txt -contract "$contract" -profile unrelated-fixture -output "$output/observation/unrelated.json"
          go run ./scripts/language-claim-dependency-observation -source examples/language-claim-dependency/main.gooo -artifact examples/language-claim-dependency/value-intervention.gooo -contract "$contract" -profile semantic-artifact-fixture -output "$output/observation/semantic-accepted.json"
          go run ./scripts/language-claim-dependency-observation -source examples/language-claim-dependency/main.gooo -artifact examples/language-claim-dependency/comment-whitespace-target.gooo -contract examples/language-claim-dependency/validator-contract-comment.json -profile comment-whitespace-fixture -output "$output/observation/comment-whitespace.json"
          go run ./scripts/language-claim-dependency-evidence -source examples/language-claim-dependency/refuted.gooo -artifact examples/language-claim-dependency/accepted-target.gooo -operation contradiction -capability "$capability" -repo-root "$GITHUB_WORKSPACE" -output "$output/provider/marker-only.json"
          go run ./scripts/language-claim-dependency-evidence -source examples/language-claim-dependency/main.gooo -artifact examples/language-claim-dependency/unrelated-target.txt -operation contradiction -observation "$output/observation/unrelated.json" -capability "$capability" -repo-root "$GITHUB_WORKSPACE" -output "$output/provider/unrelated.json"
          for pass in first second; do
            go run ./scripts/language-claim-dependency-evidence -source examples/language-claim-dependency/unknown.gooo -artifact examples/language-claim-dependency/accepted-target.gooo -operation availability -capability "$capability" -repo-root "$GITHUB_WORKSPACE" -output "$output/provider/unknown.json"
            go run ./scripts/language-claim-dependency-evidence -source examples/language-claim-dependency/refuted.gooo -artifact examples/language-claim-dependency/refuted-target.gooo -operation contradiction -observation "$output/observation/refuted.json" -capability "$capability" -repo-root "$GITHUB_WORKSPACE" -output "$output/provider/refuted.json"
            go run ./scripts/language-claim-dependency-evidence -source examples/language-claim-dependency/refuted.gooo -artifact examples/language-claim-dependency/refuted-target.gooo -operation contradiction -observation "$output/observation/refuted-no-failure.json" -capability "$capability" -repo-root "$GITHUB_WORKSPACE" -output "$output/provider/refuted-no-failure.json"
            go run ./scripts/language-claim-dependency-evidence -source examples/language-claim-dependency/main.gooo -artifact examples/language-claim-dependency/accepted-target.gooo -operation acceptance -observation "$output/observation/accepted.json" -capability "$capability" -repo-root "$GITHUB_WORKSPACE" -output "$output/provider/accepted.json"
            go run ./scripts/language-claim-dependency-evidence -source examples/language-claim-dependency/main.gooo -artifact examples/language-claim-dependency/accepted-target.gooo -operation acceptance -observation "$output/observation/accepted-alt.json" -capability "$capability" -repo-root "$GITHUB_WORKSPACE" -output "$output/provider/accepted-alt.json"
            go run ./scripts/language-claim-dependency -source examples/language-claim-dependency/unknown.gooo -evidence "$output/provider/unknown.json" -output "$output/$pass/unknown.json" -check
            go run ./scripts/language-claim-dependency -source examples/language-claim-dependency/refuted.gooo -evidence "$output/provider/refuted.json" -output "$output/$pass/refuted.json" -check
            go run ./scripts/language-claim-dependency -source examples/language-claim-dependency/refuted.gooo -evidence "$output/provider/refuted-no-failure.json" -output "$output/$pass/refuted-no-failure.json" -check
            go run ./scripts/language-claim-dependency -source examples/language-claim-dependency/main.gooo -evidence "$output/provider/accepted.json" -prior-receipt "$output/$pass/unknown.json" -output "$output/$pass/recovered.json" -check
            go run ./scripts/language-claim-dependency -source examples/language-claim-dependency/main.gooo -evidence "$output/provider/accepted.json" -output "$output/$pass/accepted.json" -check
            go run ./scripts/language-claim-dependency -source examples/language-claim-dependency/main.gooo -evidence "$output/provider/accepted-alt.json" -output "$output/$pass/accepted-alt.json" -check
            go run ./scripts/language-claim-dependency-evidence -source examples/language-claim-dependency/main.gooo -artifact examples/language-claim-dependency/comment-whitespace-target.gooo -operation acceptance -observation "$output/observation/comment-whitespace.json" -capability "$capability" -repo-root "$GITHUB_WORKSPACE" -output "$output/provider/comment-whitespace.json"
            go run ./scripts/language-claim-dependency -source examples/language-claim-dependency/main.gooo -evidence "$output/provider/comment-whitespace.json" -output "$output/$pass/comment-whitespace.json" -check
            go run ./scripts/language-claim-dependency-intervention -baseline examples/language-claim-dependency/unknown.gooo -semantic examples/language-claim-dependency/value-intervention.gooo -edge examples/language-claim-dependency/edge-intervention.gooo -comment examples/language-claim-dependency/main.gooo -repo-root "$GITHUB_WORKSPACE" -capability "$capability" -observation-dir "$output/observation" -output "$output/$pass/interventions.json"
            go run ./scripts/language-claim-dependency-judge -source examples/language-claim-dependency/unknown.gooo -evidence "$output/provider/unknown.json" -receipt "$output/$pass/unknown.json" -output "$output/$pass/unknown-judgment.json"
            go run ./scripts/language-claim-dependency-judge -source examples/language-claim-dependency/refuted.gooo -evidence "$output/provider/refuted.json" -receipt "$output/$pass/refuted.json" -output "$output/$pass/refuted-judgment.json"
            go run ./scripts/language-claim-dependency-judge -source examples/language-claim-dependency/refuted.gooo -evidence "$output/provider/refuted-no-failure.json" -receipt "$output/$pass/refuted-no-failure.json" -output "$output/$pass/refuted-no-failure-judgment.json"
            go run ./scripts/language-claim-dependency-judge -source examples/language-claim-dependency/main.gooo -prior-receipt "$output/$pass/unknown.json" -evidence "$output/provider/accepted.json" -receipt "$output/$pass/recovered.json" -output "$output/$pass/recovered-judgment.json"
            go run ./scripts/language-claim-dependency-judge -source examples/language-claim-dependency/main.gooo -evidence "$output/provider/accepted.json" -receipt "$output/$pass/accepted.json" -output "$output/$pass/accepted-judgment.json"
            go run ./scripts/language-claim-dependency-judge -source examples/language-claim-dependency/main.gooo -evidence "$output/provider/accepted-alt.json" -receipt "$output/$pass/accepted-alt.json" -output "$output/$pass/accepted-alt-judgment.json"
            go run ./scripts/language-claim-dependency-judge -source examples/language-claim-dependency/main.gooo -evidence "$output/provider/comment-whitespace.json" -receipt "$output/$pass/comment-whitespace.json" -output "$output/$pass/comment-whitespace-judgment.json"
          done
          for name in unknown refuted refuted-no-failure recovered accepted accepted-alt comment-whitespace; do
            cmp -s "$output/first/$name.json" "$output/second/$name.json"
            cmp -s "$output/first/$name-judgment.json" "$output/second/$name-judgment.json"
          done
          cmp -s "$output/first/interventions.json" "$output/second/interventions.json"
          if rg -n 'internal/meta/claimdependency"' internal/meta/claimdependencyjudge scripts/language-claim-dependency-judge; then echo "consumer imported producer package" >&2; exit 1; fi
      - name: Reject tampered prior receipts
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/claim-dependency"
          tamper="$output/prior-tamper"
          mkdir -p "$tamper"
          jq '.digest = "sha256:tampered-digest"' "$output/first/unknown.json" > "$tamper/digest.json"
          jq '.resolutions[0].state = "DISCHARGED"' "$output/first/unknown.json" > "$tamper/state.json"
          jq '.transitions[6].event = "TAMPERED_EVENT"' "$output/first/unknown.json" > "$tamper/transition.json"
          for case in digest state transition; do
            if go run ./scripts/language-claim-dependency -source examples/language-claim-dependency/main.gooo -evidence "$output/provider/accepted.json" -prior-receipt "$tamper/$case.json" -output "$tamper/$case-result.json" -check; then
              echo "tampered prior receipt accepted: $case" >&2
              exit 1
            fi
          done
          jq -n '[{case:"digest",accepted:false},{case:"state",accepted:false},{case:"transition",accepted:false}]' > "$output/first/prior-tamper.json"
      - name: Reject tampered observations and false failure labels
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/claim-dependency"
          tamper="$output/observation-tamper"
          mkdir -p "$tamper"
          jq '.observations[0].claim_id = "tampered-claim"' "$output/observation/accepted.json" > "$tamper/claim.json"
          jq '.observations[0].proposition_digest = "sha256:tampered-proposition"' "$output/observation/accepted.json" > "$tamper/proposition.json"
          jq '.observations[0].target.artifact = "tampered-target"' "$output/observation/accepted.json" > "$tamper/target.json"
          jq '.observations[4].edge_kind = "SUPPORTS"' "$output/observation/refuted.json" > "$tamper/edge-kind.json"
          jq '.observed_exit_code = 0' "$output/failure.json" > "$tamper/success-labelled-failure.json"
          jq '.input_targets[0].artifact_digest = "sha256:wrong-edge-input"' "$output/failure.json" > "$tamper/wrong-edge-input.json"
          for case in claim proposition target; do
            if go run ./scripts/language-claim-dependency-evidence -source examples/language-claim-dependency/main.gooo -artifact examples/language-claim-dependency/accepted-target.gooo -operation acceptance -observation "$tamper/$case.json" -capability "$output/capability.json" -repo-root "$GITHUB_WORKSPACE" -output "$tamper/$case-result.json"; then
              echo "tampered observation accepted: $case" >&2
              exit 1
            fi
          done
          if go run ./scripts/language-claim-dependency-evidence -source examples/language-claim-dependency/refuted.gooo -artifact examples/language-claim-dependency/refuted-target.gooo -operation contradiction -observation "$tamper/edge-kind.json" -capability "$output/capability.json" -repo-root "$GITHUB_WORKSPACE" -output "$tamper/edge-kind-result.json"; then
            echo "tampered edge kind accepted" >&2
            exit 1
          fi
          if go run ./scripts/language-claim-dependency-observation -source examples/language-claim-dependency/refuted.gooo -artifact examples/language-claim-dependency/refuted-target.gooo -contract examples/language-claim-dependency/validator-contract-refuted.json -failure-receipt "$tamper/success-labelled-failure.json" -profile false-label -output "$tamper/false-label.json"; then
            echo "zero-exit failure label accepted" >&2
            exit 1
          fi
          if go run ./scripts/language-claim-dependency-observation -source examples/language-claim-dependency/refuted.gooo -artifact examples/language-claim-dependency/refuted-target.gooo -contract examples/language-claim-dependency/validator-contract-refuted.json -failure-receipt "$tamper/wrong-edge-input.json" -profile wrong-input -output "$tamper/wrong-input.json"; then
            echo "wrong edge input was accepted" >&2
            exit 1
          fi
          if go run ./scripts/language-claim-dependency-failure -source examples/language-claim-dependency/refuted.gooo -artifact examples/language-claim-dependency/refuted-target.gooo -edge-id E07 -output "$tamper/unrelated-exit.json"; then
            echo "unrelated exit was accepted as a failure antecedent" >&2
            exit 1
          fi
          jq -n '[{case:"claim",accepted:false},{case:"proposition",accepted:false},{case:"target",accepted:false},{case:"edge-kind",accepted:false},{case:"zero-exit-failure-label",accepted:false},{case:"wrong-edge-input",accepted:false},{case:"unrelated-exit",accepted:false}]' > "$output/first/observation-tamper.json"
      - name: Reject resealed structural inventory mutations
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/claim-dependency"
          tamper="$output/structural-tamper"
          mkdir -p "$tamper"
          for case in missing duplicate additional replacement; do
            go run ./scripts/language-claim-dependency-structural-fixtures -evidence "$output/provider/refuted.json" -case "$case" -output "$tamper/$case.json"
            if go run ./scripts/language-claim-dependency -source examples/language-claim-dependency/refuted.gooo -evidence "$tamper/$case.json" -output "$tamper/$case-producer.json" 2>"$tamper/$case-producer.err"; then
              echo "resealed structural inventory accepted by producer: $case" >&2
              exit 1
            fi
            if ! rg -q "STRUCTURAL_INVENTORY_${case^^}" "$tamper/$case-producer.err"; then
              echo "producer did not report typed structural inventory reason: $case" >&2
              cat "$tamper/$case-producer.err" >&2
              exit 1
            fi
            if go run ./scripts/language-claim-dependency-judge -source examples/language-claim-dependency/refuted.gooo -evidence "$tamper/$case.json" -receipt "$output/first/refuted.json" -output "$tamper/$case-judge.json" 2>"$tamper/$case-judge.err"; then
              echo "resealed structural inventory accepted by judge: $case" >&2
              exit 1
            fi
            if ! rg -q "STRUCTURAL_INVENTORY_${case^^}" "$tamper/$case-judge.err"; then
              echo "judge did not report typed structural inventory reason: $case" >&2
              cat "$tamper/$case-judge.err" >&2
              exit 1
            fi
          done
          jq -n '[{case:"missing",producer:false,judge:false},{case:"duplicate",producer:false,judge:false},{case:"additional",producer:false,judge:false},{case:"replacement",producer:false,judge:false}]' > "$output/first/structural-inventory-tamper.json"
      - name: Reject nonsemantic and relabelled target fixtures
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/claim-dependency"
          tamper="$output/canonical-target-tamper"
          mkdir -p "$tamper"
          for fixture in negative-duplicate-target commented-out-activity negative-invalid-target; do
            if go run ./scripts/language-claim-dependency-observation -source examples/language-claim-dependency/main.gooo -artifact "examples/language-claim-dependency/negative/$fixture.gooo" -contract examples/language-claim-dependency/validator-contract.json -profile negative-fixture -output "$tamper/$fixture.json" 2>"$tamper/$fixture.err"; then
              echo "nonsemantic target fixture accepted: $fixture" >&2
              exit 1
            fi
            if ! rg -q 'TARGET_SYNTAX_OR_LOWER_INVALID|TARGET_ACTIVITY_OCCURRENCE_CARDINALITY' "$tamper/$fixture.err"; then
              echo "target fixture did not fail at canonical parse/lower boundary: $fixture" >&2
              cat "$tamper/$fixture.err" >&2
              exit 1
            fi
          done
          jq '.claims[0].procedure_id = "CI_CLAIM_TARGET_ROW_RELABELLED_V1"' examples/language-claim-dependency/validator-contract.json > "$tamper/procedure-relabel.json"
          if go run ./scripts/language-claim-dependency-observation -source examples/language-claim-dependency/main.gooo -artifact examples/language-claim-dependency/accepted-target.gooo -contract "$tamper/procedure-relabel.json" -profile procedure-relabel -output "$tamper/procedure-relabel-observation.json" 2>"$tamper/procedure-relabel.err"; then
            echo "relabelled procedure contract accepted" >&2
            exit 1
          fi
          rg -q 'VALIDATOR_CONTRACT_PROCEDURE_RELABEL' "$tamper/procedure-relabel.err"
          jq -n '[{case:"duplicate-target",accepted:false},{case:"commented-out-activity",accepted:false},{case:"invalid-target",accepted:false},{case:"procedure-relabel",accepted:false}]' > "$output/first/canonical-target-tamper.json"
      - name: Assert source-bound observations, profile invariance, and causal algebra
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/claim-dependency/first"
          jq -e '.status == "UNKNOWN" and .observed_predicate == "UNKNOWN" and (.claims | length) == 6 and ([.claims[] | select(.status == "UNKNOWN")] | length) == 6 and .semantic_occurrence_numerator == 0 and .semantic_occurrence_denominator == 6 and .raw_provenance_binding_numerator == 0 and .raw_provenance_binding_denominator == 6' "$RUNNER_TEMP/claim-dependency/provider/marker-only.json"
          jq -e '.status == "UNKNOWN" and (.observations | length) == 1 and ([.claims[] | select(.status == "UNKNOWN")] | length) == 6' "$RUNNER_TEMP/claim-dependency/provider/unrelated.json"
          jq -e '.evidence.status == "UNKNOWN" and .metrics.open_claim_total == 6 and .metrics.direct_unknown_claim_total == 1 and .metrics.dependency_blocked_claim_total == 5 and .metrics.fixed_claim_total == 6 and .metrics.distinct_proposition_total == 6 and .metrics.structural_contradiction_numerator == 0 and .metrics.structural_contradiction_denominator == 0 and .metrics.structural_contradiction_denominator_coordinate.reason == "NO_CURRENT_TARGET_OBSERVATION_EXPECTED_INVENTORY_ZERO" and .metrics.semantic_occurrence_numerator == 0 and .metrics.semantic_occurrence_denominator == 6 and .metrics.raw_provenance_binding_numerator == 0 and .metrics.raw_provenance_binding_denominator == 6 and .metrics.fixed_edge_total == 8 and .metrics.eligible_edge_total == 8 and .metrics.truth_table_case_total == 8 and .metrics.authority_case_total == 3' "$output/unknown.json"
          jq -e '.evidence.status == "CURRENT_EVIDENCE" and (.evidence.observations | map(select(.binding == "CLAIM")) | length) == 4 and (.evidence.observations | map(select(.binding == "EDGE" and .edge_kind == "CONTRADICTS")) | length) == 2 and (.evidence.observations | map(select(.binding == "EDGE" and .edge_kind == "FAILURE_ENTAILMENT")) | length) == 1 and (.evidence.structural_contradictions | length) == 2 and .metrics.structural_contradiction_numerator == 2 and .metrics.structural_contradiction_denominator == 2 and .metrics.semantic_occurrence_numerator == 6 and .metrics.semantic_occurrence_denominator == 6 and .metrics.raw_provenance_binding_numerator == 6 and .metrics.raw_provenance_binding_denominator == 6 and .metrics.discharged_claim_total == 4 and .metrics.refuted_claim_total == 2 and .metrics.open_claim_total == 0 and .metrics.observed_causal_edge_total == 6 and .metrics.eligible_edge_total == 8 and .metrics.maximum_cause_path_depth == 2 and ([.resolutions[] | select(.state == "DISCHARGED" and .failure_responsibility == "N/A" and .failure_owner_claim_id == "")] | length) == 4' "$output/refuted.json"
          jq -e '.evidence.status == "CURRENT_EVIDENCE" and (.evidence.observations | map(select(.binding == "CLAIM")) | length) == 4 and (.evidence.observations | map(select(.binding == "EDGE" and .edge_kind == "CONTRADICTS")) | length) == 2 and (.evidence.observations | map(select(.binding == "EDGE" and .edge_kind == "FAILURE_ENTAILMENT")) | length) == 0 and (.evidence.structural_contradictions | length) == 2 and .metrics.structural_contradiction_numerator == 2 and .metrics.structural_contradiction_denominator == 2 and .metrics.semantic_occurrence_numerator == 6 and .metrics.semantic_occurrence_denominator == 6 and .metrics.raw_provenance_binding_numerator == 6 and .metrics.raw_provenance_binding_denominator == 6 and .metrics.refuted_claim_total == 1 and .metrics.open_claim_total == 1 and .metrics.observed_refuting_edge_total == 2 and .decision.resolution == "CAUSAL_REFUTATION"' "$output/refuted-no-failure.json"
          jq -e '.evidence.status == "CURRENT_EVIDENCE" and (.evidence.observations | map(select(.binding == "CLAIM")) | length) == 6 and (.evidence.structural_contradictions | length) == 0 and .metrics.structural_contradiction_numerator == 0 and .metrics.structural_contradiction_denominator == 0 and .metrics.semantic_occurrence_numerator == 6 and .metrics.semantic_occurrence_denominator == 6 and .metrics.raw_provenance_binding_numerator == 6 and .metrics.raw_provenance_binding_denominator == 6 and .metrics.discharged_claim_total == 6 and .metrics.refuted_claim_total == 0 and .decision.value == "PASS" and .metrics.current_evidence_total == 6 and .metrics.unknown_evidence_total == 0 and ([.resolutions[] | select(.state == "DISCHARGED" and .failure_responsibility == "N/A" and .failure_owner_claim_id == "")] | length) == 6' "$output/recovered.json"
          jq -e '.metrics.semantic_occurrence_numerator == 6 and .metrics.semantic_occurrence_denominator == 6 and .metrics.raw_provenance_binding_numerator == 6 and .metrics.raw_provenance_binding_denominator == 6 and .decision.value == "PASS"' "$output/comment-whitespace.json"
          jq -e '.claims | length == 6 and (map(.claim_id) | unique | length) == 6 and (map(.proposition_digest) | unique | length) == 6 and (map(.procedure_id) | unique | length) == 6 and (map(.target_row_digest) | unique | length) == 6' "$RUNNER_TEMP/claim-dependency/validator-contract.json"
          jq -e '.evidence.observation_bundle_raw != null and (.evidence.observations | map(select(.binding == "CLAIM")) | length) == 6 and ([.evidence.observations[] | select(.binding == "CLAIM") | .procedure] | unique | length) == 6 and ([.evidence.observations[] | select(.binding == "CLAIM") | .procedure_digest] | unique | length) == 6 and ([.evidence.observations[] | select(.binding == "CLAIM") | .output_digest] | unique | length) == 6 and ([.evidence.observations[] | select(.binding == "CLAIM") | .target_occurrence.address] | unique | length) == 6 and ([.evidence.observations[] | select(.binding == "CLAIM") | .target_occurrence.semantic_digest] | unique | length) == 6 and ([.evidence.observations[] | select(.binding == "CLAIM") | .raw_provenance_digest] | unique | length) == 6 and all(.evidence.observations[]; .target_occurrence.semantic_digest != "" and .target_occurrence.context_digest != "" and .raw_provenance_digest != "")' "$output/accepted.json"
          jq -e '(.structural_contradictions | length) == 2 and ((.structural_contradictions | map(.claim_id) | sort) == ["claimdependency://activity/contradictioncheck","claimdependency://activity/failureentailmentcheck"]) and all(.structural_contradictions[]; .proposition_digest != "" and .procedure_id != "" and .target_occurrence.address == ("activity:" + .claim_id) and .target_occurrence.raw_row_digest != "" and .target_occurrence.semantic_digest != "" and .target_occurrence.context_digest != "" and .expected_value != .declared_value)' "$RUNNER_TEMP/claim-dependency/observation/refuted.json"
          jq -e '.observed_exit_code == 1 and .executable_digest != "" and (.argv | length) > 0 and (.input_targets | length) == 2 and all(.input_targets[]; .target_occurrence.address == ("activity:" + .claim_id) and .target_occurrence.semantic_digest != "" and .target_output_digest == .target_occurrence.raw_row_digest) and .stdout != null and .stderr != null' "$RUNNER_TEMP/claim-dependency/failure.json"
          jq -e '.decision == "PASS" and .receipt_digest != "" and .metrics.fixed_claim_total == 6' "$output/accepted-alt-judgment.json"
          jq -e -s '.[0].digest == .[1].digest and (.[0].observations == .[1].observations)' "$RUNNER_TEMP/claim-dependency/observation/accepted.json" "$RUNNER_TEMP/claim-dependency/observation/accepted-alt.json"
          jq -e -s '.[0].decision == .[1].decision and .[0].resolution == .[1].resolution and .[0].metrics == .[1].metrics' "$output/accepted-judgment.json" "$output/accepted-alt-judgment.json"
          jq -e -s '.[0].graph == .[1].graph and .[0].resolutions == .[1].resolutions and .[0].transitions == .[1].transitions and .[0].decision == .[1].decision and (.[0].evidence.artifact_bytes_digest != .[1].evidence.artifact_bytes_digest) and ((.[0].evidence.observations | map(select(.binding == "CLAIM") | .target_occurrence.address)) == (.[1].evidence.observations | map(select(.binding == "CLAIM") | .target_occurrence.address))) and ((.[0].evidence.observations | map(select(.binding == "CLAIM") | .target_occurrence.semantic_digest)) == (.[1].evidence.observations | map(select(.binding == "CLAIM") | .target_occurrence.semantic_digest))) and ((.[0].evidence.observations | map(select(.binding == "CLAIM") | .target_occurrence.raw_span_start)) != (.[1].evidence.observations | map(select(.binding == "CLAIM") | .target_occurrence.raw_span_start))) and ((.[0].evidence.observations | map(select(.binding == "CLAIM") | .raw_provenance_digest)) != (.[1].evidence.observations | map(select(.binding == "CLAIM") | .raw_provenance_digest)))' "$output/accepted.json" "$output/comment-whitespace.json"
          jq -e -s '.[0].graph == .[1].graph and .[0].resolutions == .[1].resolutions and .[0].transitions == .[1].transitions and .[0].decision == .[1].decision and (.[0].evidence.artifact_bytes_digest != .[1].evidence.artifact_bytes_digest) and ((.[0].evidence.observations | map(select(.binding == "CLAIM") | .target_occurrence.address)) == (.[1].evidence.observations | map(select(.binding == "CLAIM") | .target_occurrence.address))) and ((.[0].evidence.observations | map(select(.binding == "CLAIM") | .target_occurrence.semantic_digest)) == (.[1].evidence.observations | map(select(.binding == "CLAIM") | .target_occurrence.semantic_digest))) and ((.[0].evidence.observations | map(select(.binding == "CLAIM") | .target_occurrence.raw_span_start)) != (.[1].evidence.observations | map(select(.binding == "CLAIM") | .target_occurrence.raw_span_start))) and ((.[0].evidence.observations | map(select(.binding == "CLAIM") | .raw_provenance_digest)) != (.[1].evidence.observations | map(select(.binding == "CLAIM") | .raw_provenance_digest)))' "$output/accepted-judgment.json" "$output/comment-whitespace-judgment.json"
          jq -n '{semantic_occurrence_numerator:6,semantic_occurrence_denominator:6,raw_provenance_binding_numerator:6,raw_provenance_binding_denominator:6,comment_only_semantic_preservation_numerator:1,comment_only_semantic_preservation_denominator:1,producer_and_judge:"1/1"}' > "$output/comment-only-preservation.json"
          jq -e '(.interventions | length == 4 and ([.[] | select(.name == "comment-only" and .semantic_digest_changed == false and .state_transition_changed == false and .decision_changed == false)] | length) == 1 and ([.[] | select(.name == "source-only" and .semantic_digest_changed == true)] | length) == 1 and ([.[] | select(.name == "edge-only" and .edge_type_changed == true)] | length) == 1) and .comment_only_semantic_preservation_numerator == 1 and .comment_only_semantic_preservation_denominator == 1' "$output/interventions.json"
          jq -e '.evidence_provenance_cases | length == 3 and ([.[] | select(.name == "caller-flag-only" and (.baseline_states == .intervention_states) and .decision_changed == false)] | length) == 1 and ([.[] | select(.name == "observation-artifact-changed" and .evidence_digest_changed == true and .state_transition_changed == true)] | length) == 1 and ([.[] | select(.name == "observation-absent" and .decision_changed == true)] | length) == 1' "$output/interventions.json"
          jq -e 'length == 7 and all(.[]; .accepted == false)' "$output/observation-tamper.json"
          jq -e 'length == 4 and all(.[]; .producer == false and .judge == false)' "$output/structural-inventory-tamper.json"
          jq -e 'length == 4 and all(.[]; .accepted == false)' "$output/canonical-target-tamper.json"
          jq -e 'length == 3 and all(.[]; .accepted == false)' "$output/prior-tamper.json"
          for name in unknown refuted refuted-no-failure recovered; do jq -e '.accepted == true and .source_reconstruction_numerator == 1 and .source_reconstruction_denominator == 1 and .producer_package_import_numerator == 0 and .producer_package_import_denominator == 1 and .semantic_promotion_authorized == false' "$output/$name-judgment.json"; done
          {
            echo "### Gooo claim dependency causality"
            echo ""
            echo "- external validator contract: fixed target material, no status/outcome; source graph and raw artifact are separately re-observed"
            echo "- propositions: distinct 6/6; typed edges 8/8; truth-table executed 8/8 (2 per edge kind)"
            echo "- evidence provenance: CURRENT accepted/comment 6/6 claim observations with semantic occurrence 6/6 and raw provenance 6/6; refuted 4/6 claim receipts plus structural contradictions 2/2 + 3 edge receipts; no-failure 4/6 + structural contradictions 2/2 + 2 edge receipts; unrelated 0/6; HISTORICAL_FIXTURE 0"
            echo "- states: unknown 1 direct + 5 blocked OPEN; refuted 4 DISCHARGED + 2 dependency REFUTED; no-failure 4 DISCHARGED + 1 dependency REFUTED + 1 OPEN; recovery 6 DISCHARGED"
            echo "- causal edges: refuted 6/8 observed and 8 eligible, no-failure 5/8 observed and 8 eligible; edge depth is measured from CauseEdgeIDs"
            echo "- failure proof: CI captured actual non-zero exit 1; zero-exit labelled receipt rejected; unrelated mismatch and reversed/tampered bindings fail closed"
            echo "- interventions: source-only, observation-only, edge-only, comment-only; profile relabel does not alter decision; repository snapshot is tracked+untracked pre/post"
            echo "- independence: source reconstruction 1/1; producer package import 0/1; semantic occurrence 6/6; raw provenance binding 6/6; comment-only semantic preservation 1/1; prior tamper 3/3; observation negative cases 7/7; structural inventory negatives 4/4 producer+judge; canonical target negatives 4/4; semantic promotion false"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload claim dependency receipts and interventions
        uses: actions/upload-artifact@v4
        with:
          name: claim-dependency-causality-${{ github.sha }}
          path: ${{ runner.temp }}/claim-dependency
          if-no-files-found: error
          retention-days: 14
