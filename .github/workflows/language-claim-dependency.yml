name: Gooo claim dependency causality

on:
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/language-claim-dependency.yml
      - docs/research/claim-dependency-causality.md
      - examples/language-claim-dependency/**
      - internal/meta/claimdependency/**
      - internal/meta/claimdependencyjudge/**
      - internal/verify/scope_gooo_claim_dependency.go
      - scripts/language-claim-dependency/**
      - scripts/language-claim-dependency-judge/**
      - scripts/language-claim-dependency-intervention/**
  push:
    branches: [dev]
    paths:
      - .github/workflows/language-claim-dependency.yml
      - docs/research/claim-dependency-causality.md
      - examples/language-claim-dependency/**
      - internal/meta/claimdependency/**
      - internal/meta/claimdependencyjudge/**
      - internal/verify/scope_gooo_claim_dependency.go
      - scripts/language-claim-dependency/**
      - scripts/language-claim-dependency-judge/**
      - scripts/language-claim-dependency-intervention/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  claim-dependency:
    runs-on: ubuntu-latest
    env:
      HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.HEAD_SHA }}
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          check-latest: false
      - name: Format and package checks
        shell: bash
        run: |
          set -euo pipefail
          files=(
            internal/meta/claimdependency/contract.go
            internal/meta/claimdependency/evaluate.go
            internal/meta/claimdependency/evaluate_test.go
            internal/meta/claimdependency/model.go
            internal/meta/claimdependencyjudge/judge.go
            internal/meta/claimdependencyjudge/judge_test.go
            internal/verify/scope_gooo_claim_dependency.go
            scripts/language-claim-dependency/main.go
            scripts/language-claim-dependency-judge/main.go
            scripts/language-claim-dependency-intervention/main.go
          )
          test -z "$(gofmt -l "${files[@]}")"
          go vet ./internal/meta/claimdependency ./internal/meta/claimdependencyjudge ./scripts/language-claim-dependency ./scripts/language-claim-dependency-judge ./scripts/language-claim-dependency-intervention
          go test ./internal/meta/claimdependency ./internal/meta/claimdependencyjudge
      - name: Emit source-bound receipts and raw independent judgments
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/claim-dependency"
          mkdir -p "$output/first" "$output/second"
          for pass in first second; do
            go run ./scripts/language-claim-dependency \
              -source examples/language-claim-dependency/unknown.gooo \
              -predicate UNKNOWN \
              -observation "$output/$pass/unknown-observation.json" \
              -output "$output/$pass/unknown.json" -check
            go run ./scripts/language-claim-dependency \
              -source examples/language-claim-dependency/refuted.gooo \
              -predicate EXPLICIT_CONTRADICTION -evidence "explicit contradiction evidence" \
              -observation "$output/$pass/refuted-observation.json" \
              -output "$output/$pass/refuted.json" -check
            go run ./scripts/language-claim-dependency \
              -source examples/language-claim-dependency/main.gooo \
              -predicate EVIDENCE_ACCEPTED -evidence "accepted evidence" \
              -prior-receipt "$output/$pass/unknown.json" \
              -observation "$output/$pass/recovered-observation.json" \
              -output "$output/$pass/recovered.json" -check
            go run ./scripts/language-claim-dependency-intervention \
              -baseline examples/language-claim-dependency/unknown.gooo \
              -semantic examples/language-claim-dependency/refuted.gooo \
              -edge examples/language-claim-dependency/edge-intervention.gooo \
              -comment examples/language-claim-dependency/main.gooo \
              -output "$output/$pass/interventions.json"
            go run ./scripts/language-claim-dependency-judge \
              -source examples/language-claim-dependency/unknown.gooo \
              -observation "$output/$pass/unknown-observation.json" \
              -receipt "$output/$pass/unknown.json" \
              -output "$output/$pass/unknown-judgment.json"
            go run ./scripts/language-claim-dependency-judge \
              -source examples/language-claim-dependency/refuted.gooo \
              -observation "$output/$pass/refuted-observation.json" \
              -receipt "$output/$pass/refuted.json" \
              -output "$output/$pass/refuted-judgment.json"
            go run ./scripts/language-claim-dependency-judge \
              -source examples/language-claim-dependency/main.gooo \
              -prior-receipt "$output/$pass/unknown.json" \
              -observation "$output/$pass/recovered-observation.json" \
              -receipt "$output/$pass/recovered.json" \
              -output "$output/$pass/recovered-judgment.json"
          done
          for name in unknown refuted recovered; do
            cmp -s "$output/first/$name.json" "$output/second/$name.json"
            cmp -s "$output/first/$name-judgment.json" "$output/second/$name-judgment.json"
            cmp -s "$output/first/$name-observation.json" "$output/second/$name-observation.json"
          done
          cmp -s "$output/first/interventions.json" "$output/second/interventions.json"
          if rg -n 'internal/meta/claimdependency"' internal/meta/claimdependencyjudge scripts/language-claim-dependency-judge; then
            echo "consumer imported producer package" >&2
            exit 1
          fi
      - name: Assert exact causal algebra and intervention artifact
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/claim-dependency/first"
          jq -e '
            .schema == "gooo.meta.claim-dependency-receipt/v2" and
            .observation.predicate == "UNKNOWN" and
            .subject.read_only == true and .subject.repository_writes == 0 and
            .graph.node_total == 6 and .graph.edge_total == 8 and
            .metrics.classified_claim_total == 6 and .metrics.open_claim_total == 6 and
            .metrics.direct_unknown_claim_total == 1 and
            .metrics.dependency_blocked_claim_total == 5 and
            .metrics.observed_blocking_edge_total == 8 and
            .metrics.observed_refuting_edge_total == 0 and
            .metrics.observed_recovery_edge_total == 0 and
            .metrics.transition_total == 12 and .metrics.append_only_transition_total == 0 and
            ([.metrics.edge_metrics[] | select(.kind == "SUPPORTS")][0] | .total == 2 and .blocking == 2 and .refuting == 0 and .recovery == 0) and
            ([.metrics.edge_metrics[] | select(.kind == "REQUIRES")][0] | .total == 3 and .blocking == 3 and .refuting == 0 and .recovery == 0) and
            ([.metrics.edge_metrics[] | select(.kind == "CONTRADICTS")][0] | .total == 2 and .blocking == 2 and .refuting == 0 and .recovery == 0) and
            ([.metrics.edge_metrics[] | select(.kind == "FAILURE_ENTAILMENT")][0] | .total == 1 and .blocking == 1 and .refuting == 0 and .recovery == 0) and
            .decision.value == "FAIL_CLOSED" and .decision.resolution == "UNRESOLVED_CLAIM"
          ' "$output/unknown.json"
          jq -e '
            .observation.predicate == "EXPLICIT_CONTRADICTION" and
            .metrics.direct_refuted_claim_total == 1 and
            .metrics.dependency_refuted_claim_total == 2 and
            .metrics.open_claim_total == 3 and .metrics.refuted_claim_total == 3 and
            .metrics.observed_blocking_edge_total == 5 and
            .metrics.observed_refuting_edge_total == 2 and
            ([.metrics.edge_metrics[] | select(.kind == "SUPPORTS")][0] | .blocking == 2 and .refuting == 0) and
            ([.metrics.edge_metrics[] | select(.kind == "REQUIRES")][0] | .blocking == 3 and .refuting == 0) and
            ([.metrics.edge_metrics[] | select(.kind == "CONTRADICTS")][0] | .blocking == 0 and .refuting == 1) and
            ([.metrics.edge_metrics[] | select(.kind == "FAILURE_ENTAILMENT")][0] | .blocking == 0 and .refuting == 1) and
            .decision.resolution == "CAUSAL_REFUTATION"
          ' "$output/refuted.json"
          jq -e '
            .observation.predicate == "EVIDENCE_ACCEPTED" and
            .prior_receipt_digest != "" and .previous_transition_digest != "" and
            (.prior_claim_states | length) == 6 and
            .metrics.transition_total == 18 and .metrics.append_only_transition_total == 6 and
            .metrics.discharged_claim_total == 6 and .metrics.dependency_discharged_claim_total == 5 and
            .metrics.observed_recovery_edge_total == 8 and
            .decision.value == "PASS" and .decision.resolution == "CAUSAL_RECOVERY_DISCHARGED"
          ' "$output/recovered.json"
          for name in unknown refuted recovered; do
            jq -e '
              .schema == "gooo.meta.claim-dependency-judgment/v2" and
              .accepted == true and
              .independent_replay == "RAW_GOOO_PARSE_LOWER_GRAPH_AND_TRANSITION_REDERIVED" and
              .source_reconstruction == "syntax.ParseFile->bidir.Lower->semantic.IR" and
              .producer_package_import_numerator == 0 and
              .producer_package_import_denominator == 1 and
              .read_only == true and .semantic_promotion_authorized == false
            ' "$output/$name-judgment.json"
          done
          jq -e '
            .read_only == true and .repository_writes == 0 and (.interventions | length) == 3 and
            .interventions[0].kind == "VALUE_PROGRAM" and .interventions[0].semantic_digest_changed == true and .interventions[0].state_transition_changed == true and .interventions[0].decision_changed == true and
            .interventions[1].kind == "EDGE_KIND" and .interventions[1].semantic_digest_changed == true and .interventions[1].edge_type_changed == true and .interventions[1].state_transition_changed == true and
            .interventions[2].kind == "COMMENT_ONLY" and .interventions[2].semantic_digest_changed == false and .interventions[2].graph_digest_changed == false and .interventions[2].state_transition_changed == false and .interventions[2].decision_changed == false
          ' "$output/interventions.json"
          {
            echo "### Gooo claim dependency causality"
            echo ""
            echo "- fixed denominator: 6 source-reconstructed claims / 8 typed edges / 12 initial transitions"
            echo "- edge types: SUPPORTS 2, REQUIRES 3, CONTRADICTS 2, FAILURE_ENTAILMENT 1"
            echo "- UNKNOWN: direct 1 OPEN / dependency-blocked 5 OPEN / blocking edges 8"
            echo "- explicit refutation: direct 1 REFUTED / dependency-refuted 2 / blocked 3 OPEN / effective refuting edges 2"
            echo "- append-only recovery: 12 preserved + 6 appended transitions / 8 recovery edges"
            echo "- raw source reconstruction: 1/1 consumer run; producer package import 0/1"
            echo "- interventions: value changes state/decision; edge kind changes state; comment-only preserves semantic digest/decision"
            echo "- authority: read-only / repository writes 0 / semantic promotion 0"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload claim dependency receipts and interventions
        uses: actions/upload-artifact@v4
        with:
          name: claim-dependency-causality-${{ github.sha }}
          path: ${{ runner.temp }}/claim-dependency/first
          if-no-files-found: error
          retention-days: 14
