name: Language profile experiment

on:
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/language-profile-experiment.yml'
      - 'cmd/gooo/**'
      - 'cmd/language-profile-experiment/**'
      - 'internal/languageprofile/**'
      - 'internal/meta/languageprofileexperiment/**'
      - 'examples/language-profile/**'
      - 'scripts/language-profile-experiment/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up exact Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.27.0
          cache: true
      - name: Observe fixed runner profile
        shell: bash
        run: bash scripts/language-profile-experiment/main.sh
      - name: Upload profile receipts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: language-profile-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/language-profile-experiment
          if-no-files-found: error
          retention-days: 30
