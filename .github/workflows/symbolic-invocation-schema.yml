name: Symbolic invocation schema

on:
  pull_request:
    branches: [dev]
    paths:
      - "cmd/gooo/**"
      - "internal/packageruntime/artifactemit/**"
      - "examples/symbolic-invocation-schema/**"
      - "scripts/symbolic-invocation-schema/**"
      - ".github/workflows/symbolic-invocation-schema.yml"
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: symbolic-invocation-schema-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: go1.27.0
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  produce:
    name: symbolic-invocation-schema
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up exact Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.0
          cache: true
      - name: Produce independently validated schema receipt
        shell: bash
        run: bash scripts/symbolic-invocation-schema/main.sh
      - name: Upload producer evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: symbolic-invocation-schema-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/symbolic-invocation-schema
          if-no-files-found: error
          retention-days: 30
