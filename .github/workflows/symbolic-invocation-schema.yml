name: Symbolic invocation schema

on:
  pull_request:
    branches: [dev]
    paths:
      - "cmd/gooo/**"
      - "internal/packageruntime/artifactemit/**"
      - "examples/symbolic-invocation-schema/**"
      - "scripts/symbolic-invocation-schema/**"
      - ".github/workflows/symbolic-invocation-schema.yml"
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: symbolic-invocation-schema-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: go1.27.0
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  produce:
    name: symbolic-invocation-schema
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up exact Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.27.0
          cache: true
      - name: Produce independently validated schema receipt
        shell: bash
        run: bash scripts/symbolic-invocation-schema/main.sh
      - name: Upload producer evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: symbolic-invocation-schema-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/symbolic-invocation-schema
          if-no-files-found: error
          retention-days: 30
