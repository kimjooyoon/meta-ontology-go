name: Repair handoff dogfood

on:
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/repair-handoff-dogfood.yml
      - .github/ci-governance.json
      - .github/agent-scope-table.md
      - examples/repair-handoff/**
      - cmd/gooo/**
      - internal/valueexecution/**
      - go.mod
      - go.sum
  push:
    branches: [dev, agent/repair-handoff-dogfood-20260920]
    paths:
      - .github/workflows/repair-handoff-dogfood.yml
      - .github/ci-governance.json
      - .github/agent-scope-table.md
      - examples/repair-handoff/**
      - cmd/gooo/**
      - internal/valueexecution/**
      - go.mod
      - go.sum

permissions:
  contents: read

concurrency:
  group: repair-handoff-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dogfood:
    name: Generate and consume repair handoff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Build the bound CLI and record subject identity
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/repair-handoff-evidence"
          mkdir -p "$evidence"
          jq -n --arg source_sha "$(git rev-parse HEAD)" --arg head_sha "${PR_HEAD:-$GITHUB_SHA}" \
            --arg base_sha "$PR_BASE" --arg workflow_sha "$GITHUB_WORKFLOW_SHA" \
            --arg toolchain "$(go version)" --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            '{source_sha:$source_sha,head_sha:$head_sha,base_sha:$base_sha,workflow_sha:$workflow_sha,
              toolchain:$toolchain,run_id:$run_id,run_attempt:$run_attempt}' > "$evidence/subject.json"
          go build -o "$RUNNER_TEMP/gooo-repair-handoff" ./cmd/gooo
      - name: Check and generate the declared repair handoff domain
        run: |
          set -euo pipefail
          cli="$RUNNER_TEMP/gooo-repair-handoff"
          evidence="$RUNNER_TEMP/repair-handoff-evidence"
          "$cli" check --semantic examples/repair-handoff/main.gooo > "$evidence/semantic-check.txt"
          "$cli" generate examples/repair-handoff/main.gooo \
            --out "$evidence/generation" --runtime-plan runtime-plan.json \
            > "$evidence/generation.log"
          test -s "$evidence/generation/semantic.gooo.go"
          test -s "$evidence/generation/semantic.gooo.manifest.jsonl"
          test -s "$evidence/generation/runtime-plan.json"
          jq -e '
            .schema == "gooo/runtime-plan/v1" and
            (.source_digest | test("^sha256:[0-9a-f]{64}$")) and
            (.semantic_hash | length == 64) and
            (.runtime_binding_count == (.bindings | length)) and
            (.runtime_binding_count == 1)
          ' "$evidence/generation/runtime-plan.json"
      - name: Consume the candidate as a deferred next operation
        run: |
          set -euo pipefail
          cli="$RUNNER_TEMP/gooo-repair-handoff"
          evidence="$RUNNER_TEMP/repair-handoff-evidence"
          "$cli" consume-repair examples/repair-handoff/repair-candidate.json \
            --out "$evidence/handoff" > "$evidence/consume.log"
          jq -e '
            .schema == "gooo/value-execution-repair-handoff/v1" and
            .status == "DEFERRED" and
            .trigger_state == "REFUTED" and
            .trigger_reason == "REPLAY_EXECUTION_DIGEST_MISMATCH" and
            .next_operation == "PRESERVE_COUNTEREXAMPLE_AND_OPEN_REPAIR_CANDIDATE" and
            (.candidate_digest | startswith("sha256:")) and
            (.comparison_digest | startswith("sha256:")) and
            .execution_allowed == false and
            .repository_writes == 0
          ' "$evidence/handoff/repair-handoff.json"
          {
            echo '### Repair handoff dogfood'
            echo '- semantic declaration: checked'
            echo '- runtime plan: one typed binding'
            echo '- candidate consumption: DEFERRED'
            echo '- execution authority: false'
            echo '- repository writes: 0'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Run the focused regression packages in CI
        run: go test -count=1 ./internal/valueexecution ./cmd/gooo
      - name: Retain exact handoff evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: repair-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/repair-handoff-evidence/
          if-no-files-found: error
          retention-days: 14
