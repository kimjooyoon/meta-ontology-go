name: Capability-scoped expansion witness

on:
  push:
    branches: [agent/luna-meta-04-capability-scoped-expansion]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  capability-scoped-expansion:
    name: capability-scoped-expansion
    if: >-
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/agent/luna-meta-04-capability-scoped-expansion'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: go1.27.0
      HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact head
        uses: actions/checkout@v5
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Go 1.27.0
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          cache: false
      - name: Require exact Go toolchain
        run: test "$(go env GOVERSION)" = "go1.27.0"
      - name: Generate provider observations and receipts twice
        shell: bash
        run: |
          set -euo pipefail
          sandbox="$RUNNER_TEMP/capability-scoped-expansion-sandbox"
          mkdir -p "$sandbox"
          printf '%s\n' 'pinned-capability-input-v1' > "$sandbox/pinned-input"
          for pass in first second; do
            output="$RUNNER_TEMP/capability-scoped-expansion/$pass"
            mkdir -p "$output"
            go run ./cmd/capability-scoped-expansion-witness \
              --source examples/capability-scoped-expansion/main.gooo \
              --pinned-file "$sandbox/pinned-input" \
              --sandbox "$sandbox" \
              --output-dir "$output" --subject-sha "$HEAD_SHA"
          done
      - name: Compare raw observations and assert fixed denominator
        shell: bash
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/capability-scoped-expansion"
          for name in provider-observations.json allow-receipt.json deny-receipt.json unknown-receipt.json suite.json independent-judge.json; do
            cmp "$base/first/$name" "$base/second/$name"
          done
          for name in policy-change.json comment-only.json; do
            cmp "$base/first/interventions/$name" "$base/second/interventions/$name"
          done
          jq -e '
            .schema == "gooo/capability-scoped-expansion-suite/v2" and
            .decision == "PASS" and .resolution == "EXACT" and
            .summary.cases_total == 8 and .summary.cases_passed == 8 and
            .summary.allow_cases == 1 and .summary.deny_cases == 6 and
            .summary.unknown_cases == 1 and
            .summary.capability_requests == 9 and
            .summary.capability_authorized == 2 and
            .summary.capability_denied == 6 and
            .summary.capability_unknown == 1 and
            .summary.current_evidence_capabilities == 2 and
            .summary.current_evidence_denominator == 4 and
            .summary.historical_fixture_capabilities == 1 and
            .summary.enforcement_observations == 3 and
            .summary.blocked_write_attempts == 1 and
            .summary.blocked_mutation_attempts == 1 and
            .summary.repository_writes == 0 and
            .summary.mutation_authority == false and
            .summary.promotion_authority == false and
            .summary.source_reconstruction_passes == 1 and
            .summary.source_reconstruction_total == 1 and
            .summary.producer_import_numerator == 0 and
            .summary.producer_import_denominator == 1 and
            .independent_judge == "PASS"
          ' "$base/first/suite.json"
          jq -e '.decision == "ALLOW" and .semantic_digest != "" and .authority.current_evidence_capabilities == 2 and .repository_writes == 0 and .mutation_authority == false' "$base/first/allow-receipt.json" >/dev/null
          jq -e '.decision == "DENY" and .resolution == "EXACT" and .reason == "CAPABILITY_NOT_DECLARED" and .unknown == null and .authority.capabilities_authorized == 0' "$base/first/deny-receipt.json" >/dev/null
          jq -e '.decision == "UNKNOWN" and .resolution == "LOWER_RESOLUTION" and .unknown.stage != "" and .unknown.step != "" and .unknown.reason != ""' "$base/first/unknown-receipt.json" >/dev/null
          jq -e '.schema == "gooo/capability-scoped-expansion/provider/v2" and (.file_reads | length) == 1 and (.logical_inputs | length) == 1 and (.environment_reads | length) == 0 and (.network_reads | length) == 0 and .actual_repository_writes == 0 and .actual_mutation_authority == false and .actual_promotion_authority == false and ([.effect_attempts[] | select(.result == "DENIED" and .boundary_observed == true and .before_digest == .after_digest and .actual_writes == 0)] | length) == 3' "$base/first/provider-observations.json" >/dev/null
          ! rg -n 'internal/meta/capabilityscopedexpansion' internal/meta/capabilityscopedexpansion/verify/judge.go
      - name: Assert claim transitions and interventions
        shell: bash
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/capability-scoped-expansion/first"
          jq -e '[.claim_transitions[] | select(.prior_state == "OPEN" and .next_state == "DISCHARGED" and .stage != "" and .step != "" and .reason != "" and .evidence_digest != "" and .provenance != "")] | length >= 3' "$base/allow-receipt.json" >/dev/null
          jq -e '.base_decision == "ALLOW" and .changed_decision == "DENY" and .base_claim_status == "DISCHARGED" and .changed_claim_status == "REFUTED" and .decision_preserved == false and .semantic_digest_preserved == false and .independent_judge == "PASS"' "$base/interventions/policy-change.json" >/dev/null
          jq -e '.base_decision == "ALLOW" and .changed_decision == "ALLOW" and .base_claim_status == "DISCHARGED" and .changed_claim_status == "DISCHARGED" and .decision_preserved == true and .semantic_digest_preserved == true and .base_source_digest != .changed_source_digest and .independent_judge == "PASS"' "$base/interventions/comment-only.json" >/dev/null
          {
            echo "### Capability-scoped expansion witness"
            jq -r '"- cases: `\(.summary.cases_passed)/\(.summary.cases_total)`; ALLOW `\(.summary.allow_cases)`, DENY `\(.summary.deny_cases)`, UNKNOWN `\(.summary.unknown_cases)`"' "$base/suite.json"
            jq -r '"- CURRENT_EVIDENCE capabilities: `\(.summary.current_evidence_capabilities)/\(.summary.current_evidence_denominator)`; HISTORICAL_FIXTURE `\(.summary.historical_fixture_capabilities)`"' "$base/suite.json"
            jq -r '"- enforcement observations: `\(.summary.enforcement_observations)`; repository writes `\(.summary.repository_writes)`; mutation authority `\(.summary.mutation_authority)`"' "$base/suite.json"
            jq -r '"- source reconstruction: `\(.summary.source_reconstruction_passes)/\(.summary.source_reconstruction_total)`; producer imports `\(.summary.producer_import_numerator)/\(.summary.producer_import_denominator)`"' "$base/suite.json"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload capability-scoped receipts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: capability-scoped-expansion-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/capability-scoped-expansion/first
          if-no-files-found: error
          retention-days: 14
