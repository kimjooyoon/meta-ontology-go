name: Capability-scoped expansion

on:
  pull_request:
    branches: [dev]
    paths:
      - .github/agent-scope-table.md
      - .github/ci-governance.json
      - .github/workflows/capability-scoped-expansion.yml
      - cmd/capability-scoped-expansion-witness/**
      - docs/language/capability-scoped-expansion.md
      - examples/capability-scoped-expansion/**
      - internal/meta/capabilityscopedexpansion/**
      - internal/verify/scope_capability_scoped_expansion.go
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    name: Capability-scoped expansion
    runs-on: ubuntu-latest
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          cache: false
      - name: Require exact Go toolchain
        run: test "$(go env GOVERSION)" = "go1.27.0"
      - name: Generate and independently judge the same-source comparison
        shell: bash
        run: |
          set -euo pipefail
          for pass in first second; do
            output="$RUNNER_TEMP/capability-scoped-expansion/$pass"
            mkdir -p "$output"
            go run ./cmd/capability-scoped-expansion-witness \
              --source examples/capability-scoped-expansion/main.gooo \
              --output-dir "$output" --subject-sha "$HEAD_SHA"
          done
          cmp "$RUNNER_TEMP/capability-scoped-expansion/first/allow-receipt.json" "$RUNNER_TEMP/capability-scoped-expansion/second/allow-receipt.json"
          cmp "$RUNNER_TEMP/capability-scoped-expansion/first/deny-receipt.json" "$RUNNER_TEMP/capability-scoped-expansion/second/deny-receipt.json"
          cmp "$RUNNER_TEMP/capability-scoped-expansion/first/unknown-receipt.json" "$RUNNER_TEMP/capability-scoped-expansion/second/unknown-receipt.json"
          cmp "$RUNNER_TEMP/capability-scoped-expansion/first/suite.json" "$RUNNER_TEMP/capability-scoped-expansion/second/suite.json"
          cmp "$RUNNER_TEMP/capability-scoped-expansion/first/independent-judge.json" "$RUNNER_TEMP/capability-scoped-expansion/second/independent-judge.json"
          jq -e '
            .schema == "gooo/capability-scoped-expansion-suite/v1" and
            .decision == "PASS" and .resolution == "EXACT" and
            .summary.cases_total == 8 and .summary.cases_passed == 8 and
            .summary.allow_cases == 1 and .summary.deny_cases == 6 and
            .summary.unknown_cases == 1 and
            .summary.capability_requests == 32 and
            .summary.capability_authorized == 4 and
            .summary.capability_denied == 24 and
            .summary.capability_unknown == 4 and
            .summary.repository_writes == 0 and
            .summary.mutation_authority == false and
            .summary.promotion_authority == false and
            .independent_judge == "PASS"
          ' "$RUNNER_TEMP/capability-scoped-expansion/first/suite.json"
          jq -e --slurpfile deny "$RUNNER_TEMP/capability-scoped-expansion/first/deny-receipt.json" \
            '.decision == "ALLOW" and .resolution == "EXACT" and .source_digest == $deny[0].source_digest and .authority.capabilities_authorized == 4 and .repository_writes == 0 and .mutation_authority == false' \
            "$RUNNER_TEMP/capability-scoped-expansion/first/allow-receipt.json" >/dev/null
          jq -e '.decision == "DENY" and .resolution == "INVARIANT_ONLY" and .reason == "CAPABILITY_NOT_DECLARED" and .unknown == null and .authority.capabilities_authorized == 0' \
            "$RUNNER_TEMP/capability-scoped-expansion/first/deny-receipt.json"
          jq -e '.decision == "UNKNOWN" and .unknown.stage != "" and .unknown.step != "" and .unknown.reason != ""' \
            "$RUNNER_TEMP/capability-scoped-expansion/first/unknown-receipt.json"
          {
            echo "### Capability-scoped expansion"
            jq -r '"- cases: `\(.summary.cases_passed)/\(.summary.cases_total)`; allow `\(.summary.allow_cases)`, deny `\(.summary.deny_cases)`, UNKNOWN `\(.summary.unknown_cases)`"' "$RUNNER_TEMP/capability-scoped-expansion/first/suite.json"
            jq -r '"- capability permissions: requested `\(.summary.capability_requests)`, authorized `\(.summary.capability_authorized)`, denied `\(.summary.capability_denied)`, UNKNOWN `\(.summary.capability_unknown)`"' "$RUNNER_TEMP/capability-scoped-expansion/first/suite.json"
            jq -r '"- effects: repository writes `\(.summary.repository_writes)`, mutation authority `\(.summary.mutation_authority)`, promotion authority `\(.summary.promotion_authority)`"' "$RUNNER_TEMP/capability-scoped-expansion/first/suite.json"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload capability and evidence receipts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: capability-scoped-expansion-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/capability-scoped-expansion/first
          if-no-files-found: error
          retention-days: 14
