name: Operation artifact coverage

on:
  pull_request:
  push:
    branches:
      - dev
      - main

permissions:
  actions: read
  contents: read

concurrency:
  group: operation-artifact-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  witness:
    name: Canonical operation artifact witness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      RUN_EVENT: ${{ github.event_name }}
      OUTPUT_DIR: ${{ runner.temp }}/operation-artifact
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.HEAD_SHA }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - id: canonical
        name: Resolve exact-head canonical run
        run: bash scripts/operation-artifact-ci/resolve-run.sh
      - name: Build exact-head artifact observations
        env:
          RUN_ID: ${{ steps.canonical.outputs.run_id }}
        run: bash scripts/operation-artifact-ci/build-observations.sh
      - name: Evaluate deterministic witness twice
        run: bash scripts/operation-artifact-ci/evaluate.sh
      - name: Upload operation artifact witness
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: operation-artifact-coverage-${{ env.HEAD_SHA }}
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: error

