name: Semantic delta receipt

on:
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/semantic-delta-receipt.yml'
      - 'cmd/semantic-delta-receipt-witness/**'
      - 'examples/semantic-delta-receipt/**'
      - 'internal/detection/semanticdelta/**'
      - 'internal/meta/languageassurance/semanticdeltareceipt/**'
      - 'internal/meta/languageassurance/semanticdeltareceiptconsumer/**'
      - 'internal/meta/languagereadiness/languagesemantic/**'
      - 'internal/meta/languagereadiness/languagesyntax/**'
      - 'internal/meta/languagereadiness/languagesemanticbinding/**'
      - 'internal/meta/languagereadiness/toolchainconformance/**'
      - 'internal/meta/languageassurance/verticalsliceclosureshadow/**'
      - 'examples/language-syntax-roundtrip/corpus.json'
      - 'examples/language-semantic-model/corpus.json'
      - 'examples/toolchain-conformance/corpus.json'
      - 'internal/verify/scope_semantic_delta_receipt.go'
      - 'docs/language/semantic-delta-receipt.md'
      - 'go.mod'
      - 'go.sum'
  push:
    branches: [dev, agent/luna-meta-20-semantic-delta-receipt]
    paths:
      - '.github/workflows/semantic-delta-receipt.yml'
      - 'cmd/semantic-delta-receipt-witness/**'
      - 'examples/semantic-delta-receipt/**'
      - 'internal/detection/semanticdelta/**'
      - 'internal/meta/languageassurance/semanticdeltareceipt/**'
      - 'internal/meta/languageassurance/semanticdeltareceiptconsumer/**'
      - 'internal/meta/languagereadiness/languagesemantic/**'
      - 'internal/meta/languagereadiness/languagesyntax/**'
      - 'internal/meta/languagereadiness/languagesemanticbinding/**'
      - 'internal/meta/languagereadiness/toolchainconformance/**'
      - 'internal/meta/languageassurance/verticalsliceclosureshadow/**'
      - 'examples/language-syntax-roundtrip/corpus.json'
      - 'examples/language-semantic-model/corpus.json'
      - 'examples/toolchain-conformance/corpus.json'
      - 'internal/verify/scope_semantic_delta_receipt.go'
      - 'docs/language/semantic-delta-receipt.md'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semantic-delta-receipt-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: go1.27.0
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  receipt:
    name: semantic-delta-receipt
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact subject
        uses: actions/checkout@v5
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go 1.27
        uses: actions/setup-go@v6
        with:
          go-version: 1.27.0
          cache: true

      - name: Require exact Go fixes and replay the independent suite
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/semantic-delta-receipt"
          mkdir -p "$out"
          workspace_content_snapshot() {
            { git ls-files; git ls-files --others --exclude-standard; } | sort -u | while IFS= read -r path; do
              if [ -f "$path" ]; then
                printf '%s\t%s\n' "$path" "$(sha256sum "$path" | awk '{print $1}')"
              else
                printf '%s\tMISSING\n' "$path"
              fi
            done
          }
          case "$out" in "$RUNNER_TEMP"/*) ;; *) exit 1 ;; esac
          workspace_content_snapshot > "$out/workspace-before.tsv"
          set +e
          go fix -diff ./internal/meta/languageassurance/semanticdeltareceipt ./internal/meta/languageassurance/semanticdeltareceiptconsumer ./cmd/semantic-delta-receipt-witness > "$out/go-fix.stdout" 2>&1
          fix_status=$?
          set -e
          fix_empty=0
          if [ "$fix_status" -eq 0 ] && [ ! -s "$out/go-fix.stdout" ]; then fix_empty=1; fi
          jq -n --argjson exit "$fix_status" --argjson empty "$fix_empty" '{command:"go fix -diff", exit_code:$exit, empty_stdout:$empty, pass:($exit == 0 and $empty == 1)}' > "$out/go-fix-attestation.json"
          test "$fix_empty" -eq 1
          test -z "$(grep -R -n --include='*.go' 'internal/meta/languageassurance/semanticdeltareceipt\"' internal/meta/languageassurance/semanticdeltareceiptconsumer || true)"
          go test ./internal/meta/languageassurance/semanticdeltareceipt ./internal/meta/languageassurance/semanticdeltareceiptconsumer ./cmd/semantic-delta-receipt-witness
          for pass in first second; do
            go run ./cmd/semantic-delta-receipt-witness \
              --case suite --subject-sha "$HEAD_SHA" --output "$out/$pass.json"
          done
          jq -S 'del(.output_path, .suite_digest)' "$out/first.json" > "$out/first-deterministic.json"
          jq -S 'del(.output_path, .suite_digest)' "$out/second.json" > "$out/second-deterministic.json"
          cmp "$out/first-deterministic.json" "$out/second-deterministic.json"
          jq -e --arg output "$out/first.json" '
            .schema == "gooo/semantic-delta-receipt-conformance/v2" and
            .decision == "FIXED_POINT" and .resolution == "EXACT" and
            .contract_reproduction == "FIXED_FIVE_CASE_CONTRACT_REPRODUCED" and
            .subject_semantic_equivalence == "NOT_ASSERTED" and .output_path == $output and
            ([.source_paths[]] | length) == 11 and
            .denominator_version == "v2" and .meta_source_path == "examples/semantic-delta-receipt/main.gooo" and
            .modeled_semantic_components == 5 and .total_semantic_components == 5 and
            .summary.cases_total == 5 and .summary.cases_passed == 5 and
            .coverage_bps == 10000 and .summary.textual_changes == 5 and
            .summary.structural_observations == 5 and
            .summary.claim_transition_cases == 5 and
            .summary.adjudicated_cases == 5 and .summary.unknown_paths == 2 and
            .summary.semantic_preserved == 1 and
            .summary.semantic_changed == 2 and .summary.indeterminate == 2 and
            .summary.distinct_propositions == 24 and .summary.added_claims == 0 and .summary.removed_claims == 0 and .summary.changed_claims == 1 and
            .summary.open_claims == 10 and .summary.discharged_claims == 18 and .summary.refuted_claims == 3 and .summary.ambiguous_cases == 1 and
            .summary.repository_writes == 0 and
            ([.cases[] | select((.report.source_paths | length) == 2 and .report.output_path == "")] | length) == 5 and
            ([.cases[] | select(.passed == true)] | length) == 5 and
            ([.cases[].report.independent_verdict | select(.consumer == "semanticdeltareceiptconsumer.AdjudicateFiles")] | length) == 5 and
            ([.cases[0].report.indicators[] | select(.proof_choice == "FOUNDATION")] | length) == 3 and
            ([.cases[0].report.indicators[] | select(.proof_choice == "COHERENCE")] | length) == 2 and
            ([.cases[0].report.indicators[] | select(.proof_choice == "REGRESSION")] | length) == 1
          ' "$out/first.json"

      - name: Replay actual Gooo source pairs
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/semantic-delta-receipt"
          mkdir -p "$out"
          root=examples/semantic-delta-receipt
          go run ./cmd/semantic-delta-receipt-witness \
            --before "$root/before.gooo" --after "$root/equivalent-after.gooo" \
            --subject-sha "$HEAD_SHA" --output "$out/equivalent.json"
          go run ./cmd/semantic-delta-receipt-witness \
            --before "$root/before.gooo" --after "$root/semantic-after.gooo" \
            --subject-sha "$HEAD_SHA" --output "$out/semantic-change.json"
          go run ./cmd/semantic-delta-receipt-witness \
            --before "$root/before.gooo" --after "$root/indeterminate-after.gooo" \
            --subject-sha "$HEAD_SHA" --output "$out/indeterminate.json"
          go run ./cmd/semantic-delta-receipt-witness \
            --before "$root/value-program-before.gooo" --after "$root/value-program-after.gooo" \
            --subject-sha "$HEAD_SHA" --output "$out/value-program-change.json"
          go run ./cmd/semantic-delta-receipt-witness \
            --before "$root/ambiguous-before.gooo" --after "$root/ambiguous-after.gooo" \
            --subject-sha "$HEAD_SHA" --output "$out/ambiguous-match.json"
          jq -e --arg before "$root/before.gooo" --arg after "$root/equivalent-after.gooo" --arg output "$out/equivalent.json" '.source_paths == [$before, $after] and .output_path == $output and .repository_writes == 0 and .receipt.textual_delta.before_digest != .receipt.textual_delta.after_digest and .receipt.raw_decision == "RAW_CHANGED" and .receipt.semantic_decision == "SEMANTIC_PRESERVED" and .receipt.before.semantic_digest == .receipt.after.semantic_digest and .receipt.claim_transitions[0].kind == "BOUNDED_SEMANTIC_EQUIVALENCE" and .receipt.claim_transitions[0].to_status == "DISCHARGED" and ([.receipt.claim_transitions[] | select(.kind == "BEFORE_CLAIM_PRESERVATION" and .to_status == "DISCHARGED")] | length) == 2 and ([.receipt.claim_transitions[] | select(.to_status == "REFUTED")] | length) == 0 and .receipt.classification == "SEMANTIC_PRESERVED" and .receipt.textual_delta.changed == true and (.receipt.structural_delta.added_nodes | length) == 0 and .independent_verdict.passed == true' "$out/equivalent.json"
          jq -e --arg before "$root/before.gooo" --arg after "$root/semantic-after.gooo" --arg output "$out/semantic-change.json" '.source_paths == [$before, $after] and .output_path == $output and .repository_writes == 0 and .receipt.textual_delta.before_digest != .receipt.textual_delta.after_digest and .receipt.raw_decision == "RAW_CHANGED" and .receipt.semantic_decision == "SEMANTIC_CHANGED" and .receipt.before.semantic_digest != .receipt.after.semantic_digest and .receipt.classification == "SEMANTIC_CHANGED" and (.receipt.semantic_claim_delta.changed | length) == 1 and ([.receipt.claim_transitions[] | select(.kind == "BOUNDED_SEMANTIC_EQUIVALENCE" and .to_status == "REFUTED")] | length) == 1 and ([.receipt.claim_transitions[] | select(.kind == "BEFORE_CLAIM_PRESERVATION" and .to_status == "REFUTED")] | length) == 1 and ([.receipt.claim_transitions[] | select(.kind == "OBJECT_PROPOSITION" and .to_status == "DISCHARGED")] | length) == 1 and ([.receipt.claim_transitions[] | select(.to_status == "REFUTED")] | length) == 2 and .independent_verdict.passed == true' "$out/semantic-change.json"
          jq -e --arg before "$root/before.gooo" --arg after "$root/indeterminate-after.gooo" --arg output "$out/indeterminate.json" '.source_paths == [$before, $after] and .output_path == $output and .repository_writes == 0 and .receipt.textual_delta.before_digest != .receipt.textual_delta.after_digest and .receipt.raw_decision == "RAW_CHANGED" and .receipt.semantic_decision == "SEMANTIC_UNKNOWN" and .receipt.classification == "INDETERMINATE" and .receipt.decision == "FAIL_CLOSED" and .receipt.resolution == "LOWER_RESOLUTION" and .receipt.stage == "project-source" and .receipt.step == "parse-lower" and .receipt.reason == "SEMANTIC_TRANSLATION_VALIDATION_UNAVAILABLE" and .independent_verdict.passed == true' "$out/indeterminate.json"
          jq -e --arg before "$root/value-program-before.gooo" --arg after "$root/value-program-after.gooo" --arg output "$out/value-program-change.json" '.source_paths == [$before, $after] and .output_path == $output and .receipt.textual_delta.before_digest != .receipt.textual_delta.after_digest and .receipt.before.semantic_digest != .receipt.after.semantic_digest and .receipt.semantic_decision == "SEMANTIC_CHANGED" and .receipt.classification == "SEMANTIC_CHANGED" and (.receipt.structural_delta.added_nodes | length) == 0 and (.receipt.semantic_claim_delta.changed | length) == 0 and (.receipt.semantic_component_delta.changed | length) > 0 and .receipt.reason == "SEMANTIC_COMPONENT_DELTA_OBSERVED" and ([.receipt.claim_transitions[] | select(.kind == "BOUNDED_SEMANTIC_EQUIVALENCE" and .to_status == "REFUTED")] | length) == 1 and .independent_verdict.passed == true' "$out/value-program-change.json"
          jq -e --arg before "$root/ambiguous-before.gooo" --arg after "$root/ambiguous-after.gooo" --arg output "$out/ambiguous-match.json" '.source_paths == [$before, $after] and .output_path == $output and .receipt.semantic_decision == "SEMANTIC_UNKNOWN" and .receipt.decision == "FAIL_CLOSED" and .receipt.resolution == "LOWER_RESOLUTION" and .receipt.stage == "claim-delta" and .receipt.step == "match-claims" and .receipt.reason == "AMBIGUOUS_CLAIM_MATCH" and (.receipt.semantic_claim_delta.ambiguous | length) > 0 and .independent_verdict.passed == true' "$out/ambiguous-match.json"
          go run ./cmd/semantic-delta-receipt-witness \
            --before "$root/before.gooo" --after "$root/equivalent-after.gooo" \
            --subject-sha UNKNOWN --output "$out/unknown-subject.json"
          jq -e --arg before "$root/before.gooo" --arg after "$root/equivalent-after.gooo" --arg output "$out/unknown-subject.json" '.source_paths == [$before, $after] and .output_path == $output and .repository_writes == 0 and .receipt.textual_delta.before_digest != .receipt.textual_delta.after_digest and .receipt.raw_decision == "RAW_CHANGED" and .receipt.semantic_decision == "SEMANTIC_UNKNOWN" and .receipt.resolution == "LOWER_RESOLUTION" and .receipt.stage == "bind-subject" and .receipt.step == "resolve-subject" and .receipt.reason == "SEMANTIC_DELTA_SUBJECT_UNKNOWN" and .independent_verdict.passed == true' "$out/unknown-subject.json"
          sha256sum "$out"/*.json > "$out/manifest.sha256"

      - name: Check executable Gooo contract sources
        run: |
          set -euo pipefail
          go run ./cmd/gooo check examples/semantic-delta-receipt/main.gooo
          go run ./cmd/gooo check examples/semantic-delta-receipt/before.gooo
          go run ./cmd/gooo check examples/semantic-delta-receipt/equivalent-after.gooo
          go run ./cmd/gooo check examples/semantic-delta-receipt/semantic-after.gooo
          go run ./cmd/gooo check examples/semantic-delta-receipt/value-program-before.gooo
          go run ./cmd/gooo check examples/semantic-delta-receipt/value-program-after.gooo
          go run ./cmd/gooo check examples/semantic-delta-receipt/ambiguous-before.gooo
          go run ./cmd/gooo check examples/semantic-delta-receipt/ambiguous-after.gooo
          out="$RUNNER_TEMP/semantic-delta-receipt"
          workspace_content_snapshot() {
            { git ls-files; git ls-files --others --exclude-standard; } | sort -u | while IFS= read -r path; do
              if [ -f "$path" ]; then
                printf '%s\t%s\n' "$path" "$(sha256sum "$path" | awk '{print $1}')"
              else
                printf '%s\tMISSING\n' "$path"
              fi
            done
          }
          case "$out" in "$RUNNER_TEMP"/*) ;; *) exit 1 ;; esac
          workspace_content_snapshot > "$out/workspace-after.tsv"
          comm -3 "$out/workspace-before.tsv" "$out/workspace-after.tsv" > "$out/workspace-write-set.tsv"
          before_count=$(wc -l < "$out/workspace-before.tsv")
          after_count=$(wc -l < "$out/workspace-after.tsv")
          changed_count=$(wc -l < "$out/workspace-write-set.tsv")
          jq -n --argjson before "$before_count" --argjson after "$after_count" --argjson changed "$changed_count" --argjson repository_writes 0 '{before_paths:$before, after_paths:$after, changed_path_or_content_digests:$changed, repository_writes:$repository_writes, authority:"UNKNOWN"}' > "$out/workspace-attestation.json"
          test "$changed_count" -eq 0

      - name: Upload semantic delta receipts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: semantic-delta-receipt-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/semantic-delta-receipt
          if-no-files-found: error
          retention-days: 30
