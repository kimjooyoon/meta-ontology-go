name: Semantic delta receipt

on:
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/semantic-delta-receipt.yml'
      - 'cmd/semantic-delta-receipt-witness/**'
      - 'examples/semantic-delta-receipt/**'
      - 'internal/detection/semanticdelta/**'
      - 'internal/meta/languageassurance/semanticdeltareceipt/**'
      - 'internal/meta/languageassurance/semanticdeltareceiptconsumer/**'
      - 'internal/meta/languagereadiness/languagesemantic/**'
      - 'internal/meta/languagereadiness/languagesyntax/**'
      - 'internal/meta/languagereadiness/languagesemanticbinding/**'
      - 'internal/meta/languagereadiness/toolchainconformance/**'
      - 'internal/meta/languageassurance/verticalsliceclosureshadow/**'
      - 'examples/language-syntax-roundtrip/corpus.json'
      - 'examples/language-semantic-model/corpus.json'
      - 'examples/toolchain-conformance/corpus.json'
      - 'internal/verify/scope_semantic_delta_receipt.go'
      - 'docs/language/semantic-delta-receipt.md'
      - 'scripts/semantic-delta-receipt-gates.sh'
      - 'go.mod'
      - 'go.sum'
  push:
    branches: [dev, agent/luna-meta-20-semantic-delta-receipt]
    paths:
      - '.github/workflows/semantic-delta-receipt.yml'
      - 'cmd/semantic-delta-receipt-witness/**'
      - 'examples/semantic-delta-receipt/**'
      - 'internal/detection/semanticdelta/**'
      - 'internal/meta/languageassurance/semanticdeltareceipt/**'
      - 'internal/meta/languageassurance/semanticdeltareceiptconsumer/**'
      - 'internal/meta/languagereadiness/languagesemantic/**'
      - 'internal/meta/languagereadiness/languagesyntax/**'
      - 'internal/meta/languagereadiness/languagesemanticbinding/**'
      - 'internal/meta/languagereadiness/toolchainconformance/**'
      - 'internal/meta/languageassurance/verticalsliceclosureshadow/**'
      - 'examples/language-syntax-roundtrip/corpus.json'
      - 'examples/language-semantic-model/corpus.json'
      - 'examples/toolchain-conformance/corpus.json'
      - 'internal/verify/scope_semantic_delta_receipt.go'
      - 'docs/language/semantic-delta-receipt.md'
      - 'scripts/semantic-delta-receipt-gates.sh'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semantic-delta-receipt-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: go1.27.0
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  receipt:
    name: semantic-delta-receipt
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact subject
        uses: actions/checkout@v5
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go 1.27
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.0
          cache: true

      - name: Observe exact checkout, Go fixes, and repository effects
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/semantic-delta-receipt"
          mkdir -p "$out"
          case "$out" in "$RUNNER_TEMP"/*) ;; *) exit 1 ;; esac
          observed_checkout_sha="$(git rev-parse HEAD)"
          printf '%s\n' "$observed_checkout_sha" > "$out/observed-checkout-sha.txt"
          workspace_content_snapshot() {
            { git ls-files; git ls-files --others --exclude-standard; } | sort -u | while IFS= read -r path; do
              if [ -f "$path" ]; then
                printf '%s\t%s\n' "$path" "$(sha256sum "$path" | awk '{print $1}')"
              else
                printf '%s\tMISSING\n' "$path"
              fi
            done
          }
          workspace_content_snapshot > "$out/workspace-before.tsv"
          set +e
          go fix -diff ./internal/meta/languageassurance/semanticdeltareceipt ./internal/meta/languageassurance/semanticdeltareceiptconsumer ./cmd/semantic-delta-receipt-witness > "$out/go-fix.stdout" 2> "$out/go-fix.stderr"
          fix_status=$?
          set -e
          fix_empty=0
          if [ "$fix_status" -eq 0 ] && [ ! -s "$out/go-fix.stdout" ]; then fix_empty=1; fi
          jq -n --argjson exit "$fix_status" --argjson empty "$fix_empty" '{command:"go fix -diff", exit_code:$exit, empty_stdout:$empty, pass:($exit == 0 and $empty == 1)}' > "$out/go-fix-attestation.json"
          test "$fix_status" -eq 0
          test "$fix_empty" -eq 1
          forbidden_imports="$(rg -n --glob '*.go' 'github.com/kimjooyoon/meta-ontology-go/internal/meta/languageassurance/semanticdeltareceipt"' internal/meta/languageassurance/semanticdeltareceiptconsumer || true)"
          forbidden_import_count=0
          if [ -n "$forbidden_imports" ]; then forbidden_import_count="$(printf '%s\n' "$forbidden_imports" | wc -l | tr -d ' ')"; fi
          jq -n --argjson observed "$forbidden_import_count" '{forbidden_imports_observed:$observed, forbidden_imports_allowed_max:0, forbidden_import_conformance_numerator:(if $observed == 0 then 1 else 0 end), forbidden_import_conformance_denominator:1, forbidden_import_conformance_bps:(if $observed == 0 then 10000 else 0 end), contract:"FORBIDDEN_PRODUCER_IMPORTS_ALLOWED_MAX=0;CONFORMANCE=1/1", decision:(if $observed == 0 then "PASS" else "FAIL_CLOSED" end), resolution:(if $observed == 0 then "EXACT" else "LOWER_RESOLUTION" end), stage:"independent-consumer", step:"import-boundary", reason:(if $observed == 0 then "PRODUCER_IMPORT_FORBIDDEN_NONE" else "PRODUCER_IMPORT_FORBIDDEN" end)}' > "$out/consumer-import-boundary.json"
          fixture_import_count="$(printf '%s\n' 'import "github.com/kimjooyoon/meta-ontology-go/internal/meta/languageassurance/semanticdeltareceipt"' | rg -c 'github.com/kimjooyoon/meta-ontology-go/internal/meta/languageassurance/semanticdeltareceipt"' || true)"
          jq -n --argjson observed "$fixture_import_count" '{fixture:"forbidden-producer-import", forbidden_imports_observed:$observed, forbidden_imports_allowed_max:0, forbidden_import_conformance_numerator:(if $observed == 0 then 1 else 0 end), forbidden_import_conformance_denominator:1, decision:(if $observed == 0 then "PASS" else "FAIL_CLOSED" end), resolution:(if $observed == 0 then "EXACT" else "LOWER_RESOLUTION" end), stage:"independent-consumer", step:"import-boundary-fixture", reason:(if $observed == 0 then "PRODUCER_IMPORT_FORBIDDEN_NONE" else "PRODUCER_IMPORT_FORBIDDEN" end)}' > "$out/consumer-import-boundary-failure-fixture.json"
          jq -e '.forbidden_imports_observed > 0 and .forbidden_imports_allowed_max == 0 and .forbidden_import_conformance_numerator == 0 and .forbidden_import_conformance_denominator == 1 and .decision == "FAIL_CLOSED" and .resolution == "LOWER_RESOLUTION" and .stage == "independent-consumer" and .step == "import-boundary-fixture" and .reason == "PRODUCER_IMPORT_FORBIDDEN"' "$out/consumer-import-boundary-failure-fixture.json"
          test "$forbidden_import_count" -eq 0
          go test ./internal/meta/languageassurance/semanticdeltareceipt ./internal/meta/languageassurance/semanticdeltareceiptconsumer ./cmd/semantic-delta-receipt-witness
          workspace_content_snapshot > "$out/workspace-after.tsv"
          awk -F '\t' 'NR==FNR { b[$1]=$2; next } { a[$1]=$2 } END { for (p in b) if (!(p in a) || b[p] != a[p]) print p "\t" b[p] "\t" a[p]; for (p in a) if (!(p in b)) print p "\tMISSING\t" a[p] }' "$out/workspace-before.tsv" "$out/workspace-after.tsv" | sort > "$out/workspace-write-set.tsv"
          changed_count=$(wc -l < "$out/workspace-write-set.tsv")
          before_count=$(wc -l < "$out/workspace-before.tsv")
          after_count=$(wc -l < "$out/workspace-after.tsv")
          before_digest=$(sha256sum "$out/workspace-before.tsv" | awk '{print $1}')
          after_digest=$(sha256sum "$out/workspace-after.tsv" | awk '{print $1}')
          jq -n --arg expected "$HEAD_SHA" --arg observed "$observed_checkout_sha" --arg before "$out/workspace-before.tsv" --arg after "$out/workspace-after.tsv" --arg before_digest "$before_digest" --arg after_digest "$after_digest" --argjson before_count "$before_count" --argjson after_count "$after_count" --argjson changed "$changed_count" '{expected_checkout_sha:$expected, observed_checkout_sha:$observed, before_snapshot_path:$before, after_snapshot_path:$after, before_snapshot_digest:("sha256:"+$before_digest), after_snapshot_digest:("sha256:"+$after_digest), before_path_count:$before_count, after_path_count:$after_count, changed_path_or_content_count:$changed, net_repository_state:(if $changed == 0 then "NET_REPOSITORY_STATE_UNCHANGED" else "NET_REPOSITORY_STATE_CHANGED" end), transient_write_observation:"UNKNOWN", mutation_authority:"UNKNOWN", output_root:"RUNNER_TEMP"}' > "$out/workspace-attestation.json"
          test "$changed_count" -eq 0

      - name: Replay fixed contract and actual Gooo source pairs
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/semantic-delta-receipt"
          root=examples/semantic-delta-receipt
          observed_checkout_sha="$(cat "$out/observed-checkout-sha.txt")"
          cp "$root/claim-transition-expectations.json" "$out/claim-transition-expectations.json"
          cp "$root/claim-transition-expectations-v2.json" "$out/claim-transition-expectations-v2.json"
          cp "$root/claim-identity-persistence-manifest.json" "$out/claim-identity-persistence-manifest.json"
          cp "$root/claim-identity-fault.json" "$out/claim-identity-fault.json"
          cp "$root/semantic-claim-delta-manifest.json" "$out/semantic-claim-delta-manifest.json"
          expectation_digest="sha256:$(sha256sum "$out/claim-transition-expectations.json" | awk '{print $1}')"
          go run ./cmd/semantic-delta-receipt-witness \
            --evolution --subject-sha "$HEAD_SHA" --old-expectation "$out/claim-transition-expectations-v2.json" --new-expectation "$out/claim-transition-expectations.json" --persistence-manifest "$root/claim-identity-persistence-manifest.json" --output "$out/claim-transition-expectation-evolution.json"
          go run ./cmd/semantic-delta-receipt-witness \
            --semantic-claim-manifest "$out/semantic-claim-delta-manifest.json" --subject-sha "$HEAD_SHA" --observed-checkout-sha "$(cat "$out/observed-checkout-sha.txt")" --output "$out/semantic-claim-delta-manifest-reconstruction.json"
          semantic_manifest_digest="sha256:$(sha256sum "$out/semantic-claim-delta-manifest.json" | awk '{print $1}')"
          jq -e --arg digest "$semantic_manifest_digest" '
            .schema == "gooo/semantic-delta-claim-delta-fixtures/v1" and .manifest_digest == $digest and
            .rows_reconstructed == 2 and .rows_total == 2 and .rows_exact == 2 and .decision == "PASS" and .resolution == "EXACT" and
            ([.cases[].case_id] | sort) == ["claim-addition","claim-removal"] and
            ([.cases[] | select(.producer_consumer_exact == true and .decision == "PASS" and .resolution == "EXACT" and .reason == "SEMANTIC_CLAIM_DELTA_MANIFEST_EXACT")] | length) == 2
          ' "$out/semantic-claim-delta-manifest-reconstruction.json"
          persistence_digest="sha256:$(sha256sum "$root/claim-identity-persistence-manifest.json" | awk '{print $1}')"
          jq -e --slurpfile manifest "$root/claim-identity-persistence-manifest.json" --arg digest "$persistence_digest" '
            .persistence_manifest_digest == $digest and
            ($manifest[0].schema == "gooo/semantic-delta-claim-identity-persistence/v1") and
            ($manifest[0].fixed_case_total == 5 and $manifest[0].fixed_claim_total == 31) and
            ([$manifest[0].cases[].id] | sort) == ["ambiguous-match","equivalent","indeterminate","semantic-change","value-program-change"] and
            ([$manifest[0].cases[].id] | unique | length) == 5 and
            ([$manifest[0].cases | map(.expected_claim_total) | add] == 31) and
            ([.cases[] | select((.baseline_observation.records | length) == (if .case_id == "indeterminate" then 3 else 7 end))] | length) == 5 and
            ([.cases[] | select((.producer_baseline_observation.records | length) == (.consumer_baseline_observation.records | length) and (.producer_alternate_observation.records | length) == (.consumer_alternate_observation.records | length) and (.producer_persistence.baseline_ids | sort) == (.consumer_persistence.baseline_ids | sort) and (.producer_persistence.alternate_ids | sort) == (.consumer_persistence.alternate_ids | sort))] | length) == 5 and
            (($manifest[0].cases | map({id, baseline_before_path, baseline_after_path, alternate_before_path, alternate_after_path}) | sort_by(.id)) == ([.cases[] | {id:.case_id, baseline_before_path:.producer_baseline_observation.source_pair.before_path, baseline_after_path:.producer_baseline_observation.source_pair.after_path, alternate_before_path:.producer_alternate_observation.source_pair.before_path, alternate_after_path:.producer_alternate_observation.source_pair.after_path}] | sort_by(.id)))
          ' "$out/claim-transition-expectation-evolution.json"
          for pass in first second; do
            go run ./cmd/semantic-delta-receipt-witness \
              --case suite --subject-sha "$HEAD_SHA" --observed-checkout-sha "$observed_checkout_sha" \
              --effects-before "$out/workspace-before.tsv" --effects-after "$out/workspace-after.tsv" --output "$out/$pass.json"
          done
          jq -S 'del(.output_path, .suite_digest)' "$out/first.json" > "$out/first-deterministic.json"
          jq -S 'del(.output_path, .suite_digest)' "$out/second.json" > "$out/second-deterministic.json"
          cmp "$out/first-deterministic.json" "$out/second-deterministic.json"
          bash scripts/semantic-delta-receipt-gates.sh "$out" "$HEAD_SHA" "$observed_checkout_sha" "$expectation_digest"
          jq -e '
            .schema == "gooo/semantic-delta-claim-transition-expectations/v2" and
            .denominator_id == "gooo://semantic-delta-receipt-denominator/v2" and .fixed_case_total == 5 and
            .claim_count_contract_version == "v1" and .fixed_claim_total == 31 and .denominator_evolution_receipt == "REQUIRED_FOR_FIXED_CLAIM_COUNT_CHANGE" and
            ([.cases[].id] | sort) == ["ambiguous-match","equivalent","indeterminate","semantic-change","value-program-change"] and
            ([.cases[].id] | length) == 5 and ([.cases[].id] | unique | length) == 5 and
            (([.cases | sort_by(.id)[] | .expected_claim_total]) == [7,7,3,7,7]) and (([.cases[].expected_claim_total] | add) == .fixed_claim_total) and
            ([.cases[] | select((.expected_claim_ids | length) > 0 and ((.expected_claim_ids | unique | length) == (.expected_claim_ids | length)) and ((.expected_claims | length) == .expected_claim_total) and (([.expected_claims[].stable_id] | sort) == (.expected_claim_ids | sort)) and ([.expected_claims[].stable_id] | unique | length) == (.expected_claims | length) and (.expected_claim_total > 0) and (.expected_transition_identity_digest | test("^sha256:[0-9a-f]{64}$")) and (.case_row_digest | test("^sha256:[0-9a-f]{64}$")))] | length) == 5
          ' "$out/claim-transition-expectations.json"
          jq -e --slurpfile expected "$out/claim-transition-expectations.json" '
            ($expected[0].cases | map({id, expected_claim_ids:(.expected_claim_ids|sort), expected_claims:(.expected_claims|sort_by(.stable_id)), expected_transition_identity_digest, expected_claim_total, case_row_digest}) | sort_by(.id)) as $fixed |
            ([.cases[] | {id:.report.case_id, expected_claim_ids:(.report.claim_identity.expected_claim_ids|sort), expected_claims:(.report.claim_identity.expected_claims|sort_by(.stable_id)), expected_transition_identity_digest:.report.claim_identity.expected_transition_identity_digest, expected_claim_total:.report.claim_identity.expected_claim_total, case_row_digest:.report.claim_identity.expectation_case_row_digest, observed_claim_ids:(.report.claim_identity.observed_claim_ids|sort), observed_transition_identity_digest:.report.claim_identity.observed_transition_identity_digest}] | sort_by(.id)) as $observed |
            ($fixed | map({id, expected_claim_ids, expected_claims, expected_transition_identity_digest, expected_claim_total, case_row_digest, observed_claim_ids:expected_claim_ids, observed_claims:expected_claims, observed_transition_identity_digest:expected_transition_identity_digest})) == $observed
          ' "$out/first.json"
          test "$(jq -c '.recipes' "$root/denominator.json")" = "$(jq -c '.cases | map({id,before_path,after_path})' "$root/denominator.json")"
          go run ./cmd/semantic-delta-receipt-witness --before "$root/before.gooo" --after "$root/equivalent-after.gooo" --subject-sha "$HEAD_SHA" --observed-checkout-sha "$observed_checkout_sha" --effects-before "$out/workspace-before.tsv" --effects-after "$out/workspace-after.tsv" --output "$out/equivalent.json"
          go run ./cmd/semantic-delta-receipt-witness --before "$root/before.gooo" --after "$root/before.gooo" --subject-sha "$HEAD_SHA" --observed-checkout-sha "$observed_checkout_sha" --effects-before "$out/workspace-before.tsv" --effects-after "$out/workspace-after.tsv" --output "$out/equivalent-reference.json"
          jq -S '.receipt.claim_transitions | map({kind,from_status,to_status,preservation_of,stage,step,reason})' "$out/equivalent.json" > "$out/equivalent-transitions.json"
          jq -S '.receipt.claim_transitions | map({kind,from_status,to_status,preservation_of,stage,step,reason})' "$out/equivalent-reference.json" > "$out/equivalent-reference-transitions.json"
          cmp "$out/equivalent-transitions.json" "$out/equivalent-reference-transitions.json"
          go run ./cmd/semantic-delta-receipt-witness --before "$root/before.gooo" --after "$root/semantic-after.gooo" --subject-sha "$HEAD_SHA" --observed-checkout-sha "$observed_checkout_sha" --effects-before "$out/workspace-before.tsv" --effects-after "$out/workspace-after.tsv" --output "$out/semantic-change.json"
          go run ./cmd/semantic-delta-receipt-witness --before "$root/before.gooo" --after "$root/indeterminate-after.gooo" --subject-sha "$HEAD_SHA" --observed-checkout-sha "$observed_checkout_sha" --effects-before "$out/workspace-before.tsv" --effects-after "$out/workspace-after.tsv" --output "$out/indeterminate.json"
          go run ./cmd/semantic-delta-receipt-witness --before "$root/value-program-before.gooo" --after "$root/value-program-after.gooo" --subject-sha "$HEAD_SHA" --observed-checkout-sha "$observed_checkout_sha" --effects-before "$out/workspace-before.tsv" --effects-after "$out/workspace-after.tsv" --output "$out/value-program-change.json"
          go run ./cmd/semantic-delta-receipt-witness --before "$root/ambiguous-before.gooo" --after "$root/ambiguous-after.gooo" --subject-sha "$HEAD_SHA" --observed-checkout-sha "$observed_checkout_sha" --effects-before "$out/workspace-before.tsv" --effects-after "$out/workspace-after.tsv" --output "$out/ambiguous-match.json"
          jq -e --arg before "$root/before.gooo" --arg after "$root/equivalent-after.gooo" --arg output "$out/equivalent.json" --arg expected "$HEAD_SHA" --arg observed "$observed_checkout_sha" '.source_paths == [$before, $after] and .output_path == $output and .receipt.expected_subject_sha == $expected and .receipt.observed_checkout_sha == $observed and .receipt.subject_binding == "EXACT" and .receipt.effects.status == "NET_REPOSITORY_STATE_UNCHANGED" and .receipt.effects.changed_path_or_content_count == 0 and .receipt.effects.output_location == "OUTSIDE_REPOSITORY" and .receipt.textual_delta.before_digest != .receipt.textual_delta.after_digest and .receipt.raw_decision == "RAW_CHANGED" and .receipt.semantic_decision == "SEMANTIC_PRESERVED" and .receipt.before.semantic_digest == .receipt.after.semantic_digest and .receipt.declared_projection_component_kind_coverage_bps == 10000 and .receipt.claim_status_coverage_bps == 10000 and .independent_verdict.passed == true' "$out/equivalent.json"
          go run ./cmd/semantic-delta-receipt-witness --tamper-matrix --subject-sha "$HEAD_SHA" --observed-checkout-sha "$observed_checkout_sha" --output "$out/tamper-matrix.json"
          jq -e '
            .status == "EXACT" and .denominator_id == "gooo://semantic-delta/tamper-inventory/v1" and
            (.expected_ids | length) == 12 and (.observed_ids | length) == 12 and
            .expected_ids == ["proof-choice","stage","step","reason","decision","resolution","classification","expected-subject","observed-checkout","meta-contract","transition-head","effects-status"] and
            ((.expected_ids | sort) == (.observed_ids | sort)) and .fixed_total == 12 and .rejected_count == 12 and .coverage_bps == 10000 and
            .context_denominator_id == "gooo://semantic-delta/replay-context-inventory/v1" and
            (.expected_context_ids | length) == 4 and (.observed_context_ids | length) == 4 and
            .expected_context_ids == ["exact","parse-unknown","subject-unknown","ambiguous"] and
            ((.expected_context_ids | sort) == (.observed_context_ids | sort)) and .context_fixed_total == 4 and .context_coverage_bps == 10000 and
            (.contexts | length) == 4 and ([.contexts[] | select(.fixed_total == 12 and .rejected_count == 12 and .coverage_bps == 10000)] | length) == 4
          ' "$out/tamper-matrix.json"
          jq -e '.receipt.raw_decision == "RAW_CHANGED" and .receipt.semantic_decision == "SEMANTIC_CHANGED" and .receipt.before.semantic_digest != .receipt.after.semantic_digest and .receipt.classification == "SEMANTIC_CHANGED" and (.receipt.semantic_claim_delta.changed | length) == 1 and .receipt.claim_status_coverage_bps == 10000 and .receipt.effects.status == "NET_REPOSITORY_STATE_UNCHANGED" and .independent_verdict.passed == true' "$out/semantic-change.json"
          jq -e '.receipt.semantic_decision == "SEMANTIC_UNKNOWN" and .receipt.classification == "INDETERMINATE" and .receipt.decision == "FAIL_CLOSED" and .receipt.resolution == "LOWER_RESOLUTION" and .receipt.stage == "project-source" and .receipt.step == "parse-lower" and .receipt.reason == "SEMANTIC_TRANSLATION_VALIDATION_UNAVAILABLE" and .independent_verdict.passed == true' "$out/indeterminate.json"
          jq -e '.receipt.raw_decision == "RAW_CHANGED" and .receipt.before.semantic_digest != .receipt.after.semantic_digest and .receipt.semantic_decision == "SEMANTIC_CHANGED" and .receipt.classification == "SEMANTIC_CHANGED" and (.receipt.structural_delta.added_nodes | length) == 0 and (.receipt.semantic_claim_delta.changed | length) == 0 and (.receipt.semantic_component_delta.changed | length) > 0 and .receipt.reason == "SEMANTIC_COMPONENT_DELTA_OBSERVED" and .receipt.claim_status_coverage_bps == 10000 and .independent_verdict.passed == true' "$out/value-program-change.json"
          jq -e '.receipt.semantic_decision == "SEMANTIC_UNKNOWN" and .receipt.decision == "FAIL_CLOSED" and .receipt.resolution == "LOWER_RESOLUTION" and .receipt.stage == "claim-delta" and .receipt.step == "match-claims" and .receipt.reason == "AMBIGUOUS_CLAIM_MATCH" and (.receipt.semantic_claim_delta.ambiguous | length) > 0 and .receipt.claim_status_coverage_bps == 10000 and .independent_verdict.passed == true' "$out/ambiguous-match.json"
          go run ./cmd/semantic-delta-receipt-witness --before "$root/before.gooo" --after "$root/equivalent-after.gooo" --subject-sha "$HEAD_SHA" --effects-before "$out/workspace-before.tsv" --effects-after "$out/workspace-after.tsv" --output "$out/unknown-subject.json"
          jq -e '.receipt.subject_binding == "UNKNOWN" and .receipt.semantic_decision == "SEMANTIC_UNKNOWN" and .receipt.resolution == "LOWER_RESOLUTION" and .receipt.stage == "bind-subject" and .receipt.step == "observe-checkout-sha" and .receipt.reason == "SUBJECT_SHA_UNAVAILABLE" and .independent_verdict.passed == true' "$out/unknown-subject.json"
          go run ./cmd/semantic-delta-receipt-witness --before "$root/before.gooo" --after "$root/equivalent-after.gooo" --subject-sha "$HEAD_SHA" --observed-checkout-sha "$(printf 'b%.0s' {1..40})" --effects-before "$out/workspace-before.tsv" --effects-after "$out/workspace-after.tsv" --output "$out/subject-mismatch.json"
          jq -e '.receipt.subject_binding == "REFUTED" and .receipt.decision == "FAIL_CLOSED" and .receipt.resolution == "LOWER_RESOLUTION" and .receipt.reason == "REFUTED_SUBJECT_SHA_MISMATCH" and .independent_verdict.passed == true' "$out/subject-mismatch.json"
          go run ./cmd/semantic-delta-receipt-witness --before "$root/comment-only-before.gooo" --after "$root/comment-only-after.gooo" --subject-sha "$HEAD_SHA" --observed-checkout-sha "$observed_checkout_sha" --effects-before "$out/workspace-before.tsv" --effects-after "$out/workspace-after.tsv" --output "$out/comment-only.json"
          go run ./cmd/semantic-delta-receipt-witness --before "$root/comment-only-before.gooo" --after "$root/comment-only-before.gooo" --subject-sha "$HEAD_SHA" --observed-checkout-sha "$observed_checkout_sha" --effects-before "$out/workspace-before.tsv" --effects-after "$out/workspace-after.tsv" --output "$out/comment-only-reference.json"
