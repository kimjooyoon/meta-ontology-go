name: Counterexample-first meta compilation

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  counterexample-first-compiler:
    name: counterexample-first-compiler
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: go1.27.0
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@v5
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Go 1.27
        uses: actions/setup-go@v6
        with:
          go-version: 1.27.0
          cache: true
      - name: Run counterexample-first compiler and independent judge
        shell: bash
        run: bash scripts/counterexample-first-compiler/main.sh
      - name: Upload exact-head receipts and report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: counterexample-first-compiler-${{ env.HEAD_SHA }}
          path: counterexample-first-output
          if-no-files-found: error
          retention-days: 30
