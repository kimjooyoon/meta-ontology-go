name: Meta-operation provenance

on:
  workflow_dispatch:
  pull_request:
    branches: [dev]
    paths:
      - '.github/agent-scope-table.md'
      - '.github/ci-governance.json'
      - '.github/workflows/meta-operation-provenance.yml'
      - 'examples/meta-operation-provenance/**'
      - 'internal/meta/operationprovenance/**'
      - 'internal/verify/scope_meta_operation_provenance.go'
      - 'scripts/meta-operation-provenance/**'

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: go1.27.0
      SUBJECT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SUBJECT_SHA }}
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.0
      - name: Build, replay, and independently judge the lineage receipt
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/meta-operation-provenance"
          mkdir -p "$work/first" "$work/replay"
          source=examples/meta-operation-provenance/main.gooo
          for out in "$work/first/receipt.json" "$work/replay/receipt.json"; do
            go run ./scripts/meta-operation-provenance -mode build -source "$source" -out "$out"
          done
          cmp -s "$work/first/receipt.json" "$work/replay/receipt.json"
          go run ./scripts/meta-operation-provenance -mode verify -source "$source" \
            -receipt "$work/first/receipt.json" -out "$work/first/verification.json"
          cmp -s "$work/first/receipt.json" examples/meta-operation-provenance/receipt.json
          jq -e '
            .schema == "gooo/meta-operation-provenance-receipt/v1" and
            .toolchain == "go1.27.0" and
            .repository_workspace_writes == false and
            .mutation_authority == false and
            ([.scenarios[] | select(.denominator == 12)] | length) == 4 and
            ([.scenarios[] | select(.id == "complete" and .numerator == 12 and .decisions.PASS == 3)] | length) == 1 and
            ([.scenarios[] | select(.id == "disconnected" and .numerator == 11 and .decisions.FAIL_CLOSED == 1)] | length) == 1 and
            ([.scenarios[] | select(.id == "direct-unknown" and .decisions.UNKNOWN == 1 and .metrics[0].issue.cause == "DIRECT_CAUSE")] | length) == 1 and
            ([.scenarios[] | select(.id == "dependency-blocked" and .metrics[2].issue.cause == "DEPENDENCY_BLOCK")] | length) == 1
          ' "$work/first/receipt.json"
          jq -e '.schema == "gooo/meta-operation-provenance-verification/v1" and .status == "VERIFIED" and .fail_closed_count == 1 and .direct_unknowns == 2 and .dependency_blocks == 1' "$work/first/verification.json"
          test -z "$(git status --porcelain)"
      - name: Upload lineage evidence
        uses: actions/upload-artifact@v6
        with:
          name: meta-operation-provenance-${{ env.SUBJECT_SHA }}
          path: ${{ runner.temp }}/meta-operation-provenance/first
          if-no-files-found: error
          retention-days: 30
