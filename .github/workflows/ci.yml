name: CI
run-name: "CI [${{ github.event_name == 'pull_request' && 'PR authoritative' || 'push full' }}]"

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  actions: read
  checks: read
  # Branch protection is intentionally not observed from this pull_request
  # workflow. Main promotion consumes the base-pinned Guardian envelope.
  # administration: read must not be added here.

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.run_attempt > 1 && format('replay-{0}', github.run_id) || 'head' }}
  cancel-in-progress: true

jobs:
  format:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.0
          cache: false
      - name: Materialize exact logical workspace
        id: materialize
        uses: ./.github/actions/materialize
        with:
          expected-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind the declared Go 1.27 toolchain
        run: |
          test "$(go env GOVERSION)" = "go1.27.0"
          go version
      - name: Require Go modernizers and module graph at a fixed point
        run: |
          go fix ./...
          go mod tidy
          git diff --exit-code
      - name: Compile module-declared meta tools
        run: |
          go list tool
          go build tool
      - name: Materialize exact Go format remediation evidence
        if: ${{ always() }}
        env:
          EXACT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          remediation_root="$RUNNER_TEMP/go-format-remediation"
          paths="$remediation_root/gofmt-paths.txt"
          patch_a="$remediation_root/gofmt.patch"
          patch_b="$remediation_root/gofmt-replay.patch"
          patch_a_fixed="$remediation_root/gofmt-fixed-point.patch"
          receipt="$remediation_root/receipt.json"
          source_before="$remediation_root/source-before.status"
          source_after="$remediation_root/source-after.status"
          mkdir -p "$remediation_root"
          : > "$paths"
          : > "$patch_a"
          : > "$patch_b"
          : > "$patch_a_fixed"
          : > "$receipt"
          env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE git status --porcelain=v1 --untracked-files=all > "$source_before"
          gofmt -l . | sort > "$paths"
          path_count="$(wc -l < "$paths" | tr -d '[:space:]')"
          candidate_a="$(mktemp -d "$RUNNER_TEMP/go-format-candidate-a.XXXXXX")"
          candidate_b="$(mktemp -d "$RUNNER_TEMP/go-format-candidate-b.XXXXXX")"

          materialize_candidate() {
            candidate="$1"
            patch="$2"
            env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE git init --quiet "$candidate"
            env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE git -C "$candidate" config user.email ci-format@example.invalid
            env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE git -C "$candidate" config user.name ci-format-remediation
            while IFS= read -r path; do
              if [ -z "$path" ]; then
                continue
              fi
              case "$path" in
                /*|../*|*/../*|*/..)
                  echo "unsafe gofmt path: $path" >&2
                  return 1
                  ;;
              esac
              mkdir -p "$candidate/$(dirname -- "$path")"
              cp -- "$path" "$candidate/$path"
            done < "$paths"
            if [ "$path_count" -gt 0 ]; then
              env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE git -C "$candidate" add -- .
              env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE git -C "$candidate" commit --quiet -m baseline
              (
                cd "$candidate"
                while IFS= read -r path; do
                  if [ -n "$path" ]; then
                    gofmt -w "./$path"
                  fi
                done < "$paths"
              )
            fi
            env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE git -C "$candidate" diff --binary -- . > "$patch"
          }

          materialize_candidate "$candidate_a" "$patch_a"
          materialize_candidate "$candidate_b" "$patch_b"
          (
            cd "$candidate_a"
            while IFS= read -r path; do
              if [ -n "$path" ]; then
                gofmt -w "./$path"
              fi
            done < "$paths"
            env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE git diff --binary -- .
          ) > "$patch_a_fixed"
          replay_equal=false
          fixed_point=false
          if cmp -s "$patch_a" "$patch_b"; then
            replay_equal=true
          fi
          if cmp -s "$patch_a" "$patch_a_fixed"; then
            fixed_point=true
          fi
          env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE git status --porcelain=v1 --untracked-files=all > "$source_after"
          source_repository_writes=0
          if ! cmp -s "$source_before" "$source_after"; then
            source_repository_writes=1
          fi
          paths_json="$(jq -Rsc 'split("\n") | if . == [""] then [] elif .[-1] == "" then .[:-1] else . end' < "$paths")"
          patch_bytes="$(wc -c < "$patch_a" | tr -d '[:space:]')"
          patch_sha256="sha256:$(sha256sum "$patch_a" | awk '{print $1}')"
          replay_patch_sha256="sha256:$(sha256sum "$patch_b" | awk '{print $1}')"
          jq -n \
            --arg schema gooo/go-format-remediation/v1 \
            --arg head_sha "$EXACT_HEAD_SHA" \
            --arg toolchain go1.27.0 \
            --arg go_version "$(go version)" \
            --arg go_env_goversion "$(go env GOVERSION)" \
            --argjson paths "$paths_json" \
            --arg path_count "$path_count" \
            --arg patch_sha256 "$patch_sha256" \
            --arg replay_patch_sha256 "$replay_patch_sha256" \
            --arg patch_bytes "$patch_bytes" \
            --argjson replay_equal "$replay_equal" \
            --argjson fixed_point "$fixed_point" \
            --arg source_repository_writes "$source_repository_writes" \
            --arg candidate_workspace_writes "$path_count" \
            '{schema:$schema,head_sha:$head_sha,toolchain:$toolchain,go_version:$go_version,go_env_goversion:$go_env_goversion,sorted_paths:$paths,path_count:($path_count|tonumber),patch_sha256:$patch_sha256,replay_patch_sha256:$replay_patch_sha256,patch_bytes:($patch_bytes|tonumber),replay_equal:$replay_equal,fixed_point:$fixed_point,source_repository_writes:($source_repository_writes|tonumber),candidate_workspace_writes:($candidate_workspace_writes|tonumber)}' \
            > "$receipt"
          test -s "$receipt"
          if [ "$path_count" -gt 0 ]; then
            test -s "$patch_a"
            test -s "$patch_b"
            test -s "$patch_a_fixed"
          else
            test ! -s "$patch_a"
            test ! -s "$patch_b"
            test ! -s "$patch_a_fixed"
          fi
          test "$replay_equal" = true
          test "$fixed_point" = true
          test "$source_repository_writes" -eq 0
          jq -e \
            --arg schema gooo/go-format-remediation/v1 \
            --arg head_sha "$EXACT_HEAD_SHA" \
            --arg toolchain go1.27.0 \
            --argjson paths "$paths_json" \
            --arg path_count "$path_count" \
            --arg patch_sha256 "$patch_sha256" \
            --arg replay_patch_sha256 "$replay_patch_sha256" \
            --arg patch_bytes "$patch_bytes" \
            '.schema == $schema and .head_sha == $head_sha and .toolchain == $toolchain and .sorted_paths == $paths and .path_count == ($path_count|tonumber) and .patch_sha256 == $patch_sha256 and .replay_patch_sha256 == $replay_patch_sha256 and .patch_bytes == ($patch_bytes|tonumber) and .replay_equal == true and .fixed_point == true and .source_repository_writes == 0 and .candidate_workspace_writes == ($path_count|tonumber)' \
            "$receipt" > /dev/null
          echo "format remediation paths=$path_count replay_equal=$replay_equal fixed_point=$fixed_point source_repository_writes=$source_repository_writes"
      - name: Upload Go format remediation artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: go-format-remediation-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/go-format-remediation/gofmt-paths.txt
            ${{ runner.temp }}/go-format-remediation/gofmt.patch
            ${{ runner.temp }}/go-format-remediation/gofmt-replay.patch
            ${{ runner.temp }}/go-format-remediation/gofmt-fixed-point.patch
            ${{ runner.temp }}/go-format-remediation/receipt.json
          if-no-files-found: error
      - name: Require formatted Go
        if: ${{ always() }}
        env:
          EXACT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          remediation_root="$RUNNER_TEMP/go-format-remediation"
          paths="$remediation_root/gofmt-paths.txt"
          patch_a="$remediation_root/gofmt.patch"
          patch_b="$remediation_root/gofmt-replay.patch"
          patch_a_fixed="$remediation_root/gofmt-fixed-point.patch"
          receipt="$remediation_root/receipt.json"
          test -s "$receipt"
          path_count="$(jq -r '.path_count' "$receipt")"
          test "$path_count" -ge 0
          jq -e \
            --arg head_sha "$EXACT_HEAD_SHA" \
            '.head_sha == $head_sha and .toolchain == "go1.27.0" and .replay_equal == true and .fixed_point == true and .source_repository_writes == 0 and (.path_count|type) == "number" and .path_count >= 0' \
            "$receipt" > /dev/null
          cmp -s "$patch_a" "$patch_b"
          cmp -s "$patch_a" "$patch_a_fixed"
          if [ "$path_count" -ne 0 ]; then
            echo "gofmt required for $path_count paths"
            exit 1
          fi

  vet:
    name: go vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.0
          cache: false
      - name: Materialize exact logical workspace
        id: materialize
        uses: ./.github/actions/materialize
        with:
          expected-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: go vet ./...

  test:
    name: go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.0
          cache: false
      - name: Materialize exact logical workspace
        id: materialize
        uses: ./.github/actions/materialize
        with:
          expected-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: go test ./...

  race:
    name: go test -race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.0
          cache: false
      - name: Materialize exact logical workspace
        id: materialize
        uses: ./.github/actions/materialize
        with:
          expected-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: go test -race ./...

  semantic:
    name: Semantic conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.0
          cache: false
      - name: Materialize exact logical workspace
        id: materialize
        uses: ./.github/actions/materialize
        with:
          expected-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Semantic conformance (staged verifier promotion)
        env:
          # Stage 0 is the current trust boundary. Advancing it requires a
          # deterministic CI-authorized governance change documented in .github/conformance-plan.md.
          GOOO_CONFORMANCE_STAGE: "0"
          GOOO_STORAGE_ROOT: ${{ steps.materialize.outputs.storage-root }}
        run: ./scripts/semantic-conformance.sh

  policy:
    name: CI policy
    needs: [format, vet, test, race, semantic]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.0
          cache: false
      - name: Materialize exact logical workspace
        id: materialize
        uses: ./.github/actions/materialize
        with:
          expected-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record CI event source
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_REF: ${{ github.ref }}
        run: |
          if [ "$CI_EVENT" = "pull_request" ]; then
            source="PR authoritative"
          else
            source="push full"
          fi
          {
            echo "### CI event source"
            echo "- run source: $source"
            echo "- event: $CI_EVENT"
            echo "- ref: $CI_REF"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify PR checkout identity
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          actual_head="$(git rev-parse HEAD)"
          test "$actual_head" = "$EXPECTED_HEAD"
          git rev-parse --verify "$EXPECTED_BASE^{commit}" >/dev/null
      - name: Emit source metrics (go/gooo + folders/files)
        env:
          METRICS_COMMIT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          GENERATION_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          METRICS_DIR: ${{ runner.temp }}/source-metrics
        run: |
          mkdir -p "$METRICS_DIR"
          go run ./scripts/line-metrics -root "$GITHUB_WORKSPACE" -storage-root "${{ steps.materialize.outputs.storage-root }}" -json > "$METRICS_DIR/source-metrics-raw.json"
          go run ./scripts/line-metrics -root "$GITHUB_WORKSPACE" -storage-root "${{ steps.materialize.outputs.storage-root }}" -summary > "$METRICS_DIR/source-metrics.txt"
          go run ./bootstrap/meta-binding-witness -root "$GITHUB_WORKSPACE" -metrics "$METRICS_DIR/source-metrics-raw.json" -bound-metrics "$METRICS_DIR/source-metrics.json" -report "$METRICS_DIR/meta-binding-report.json" -check
          go run ./bootstrap/meta-binding-witness -root "$GITHUB_WORKSPACE" -metrics "$METRICS_DIR/source-metrics-raw.json" -bound-metrics "$METRICS_DIR/source-metrics-replay.json" -report "$METRICS_DIR/meta-binding-report-replay.json" -check
          cmp -s "$METRICS_DIR/source-metrics.json" "$METRICS_DIR/source-metrics-replay.json"
          cmp -s "$METRICS_DIR/meta-binding-report.json" "$METRICS_DIR/meta-binding-report-replay.json"
          go run ./bootstrap/meta-actionability-witness -root "$GITHUB_WORKSPACE" -metrics "$METRICS_DIR/source-metrics.json" -binding "$METRICS_DIR/meta-binding-report.json" -report "$METRICS_DIR/meta-actionability-report.json" -check
          go run ./bootstrap/meta-actionability-witness -root "$GITHUB_WORKSPACE" -metrics "$METRICS_DIR/source-metrics.json" -binding "$METRICS_DIR/meta-binding-report.json" -report "$METRICS_DIR/meta-actionability-report-replay.json" -check
          cmp -s "$METRICS_DIR/meta-actionability-report.json" "$METRICS_DIR/meta-actionability-report-replay.json"
          go run ./cmd/directory-partition-witness -source-metrics "$METRICS_DIR/source-metrics.json" > "$METRICS_DIR/directory-partition-report.json"
          go run ./cmd/directory-partition-witness -source-metrics "$METRICS_DIR/source-metrics.json" -mode check > "$METRICS_DIR/directory-partition-report-replay.json"
          cmp -s "$METRICS_DIR/directory-partition-report.json" "$METRICS_DIR/directory-partition-report-replay.json"
          go run ./cmd/directory-kind-witness -source-metrics "$METRICS_DIR/source-metrics.json" -mode check > "$METRICS_DIR/directory-kind-report.json"
          go run ./cmd/directory-kind-witness -source-metrics "$METRICS_DIR/source-metrics.json" -mode check > "$METRICS_DIR/directory-kind-report-replay.json"
          cmp -s "$METRICS_DIR/directory-kind-report.json" "$METRICS_DIR/directory-kind-report-replay.json"
          jq -r '"### Directory kind separation\\n- decision: \\(.decision) (\\(.reason))\\n- plan digest: \\(.plan_digest)"' "$METRICS_DIR/directory-kind-report.json" >> "$GITHUB_STEP_SUMMARY"
          jq -r '"### Directory partition\n- decision: \(.decision) (\(.reason))\n- plan digest: \(.plan_digest)"' "$METRICS_DIR/directory-partition-report.json" >> "$GITHUB_STEP_SUMMARY"
          jq -r '"### Meta actionability\n- decision: \(.decision) (\(.reason))\n- indicator coverage: \(.summary.indicator_coverage_basis_points) bps\n- operation coverage: \(.summary.operation_coverage_basis_points) bps\n- selected operation: \(.selected_operation)\n- project-root exemptions: \(.summary.project_root_exemptions)\n- replay proof: \(.replay_proof_choice)"' "$METRICS_DIR/meta-actionability-report.json" >> "$GITHUB_STEP_SUMMARY"
          go run ./scripts/refactor-metrics -root "$GITHUB_WORKSPACE" -metrics "$METRICS_DIR/source-metrics.json" -sha "$METRICS_COMMIT_SHA" -base-sha "$GENERATION_BASE_SHA" -plan "$METRICS_DIR/self-improvement-plan.json" -check
          go run ./scripts/refactor-metrics -root "$GITHUB_WORKSPACE" -metrics "$METRICS_DIR/source-metrics.json" -sha "$METRICS_COMMIT_SHA" -base-sha "$GENERATION_BASE_SHA" -plan "$METRICS_DIR/self-improvement-replay.json" -check
          cmp -s "$METRICS_DIR/self-improvement-plan.json" "$METRICS_DIR/self-improvement-replay.json"
          bash ./scripts/operation-artifact-ci/build-observations.sh "$METRICS_DIR"
          bash ./scripts/operation-artifact-ci/evaluate.sh "$METRICS_DIR"
          go run ./scripts/meta-execution -plan "$METRICS_DIR/self-improvement-plan.json" -output "$METRICS_DIR/self-improvement-execution.json"
          go run ./scripts/meta-execution -plan "$METRICS_DIR/self-improvement-plan.json" -output "$METRICS_DIR/self-improvement-execution-replay.json"
          cmp -s "$METRICS_DIR/self-improvement-execution.json" "$METRICS_DIR/self-improvement-execution-replay.json"
          go run ./scripts/meta-receipts -plan "$METRICS_DIR/self-improvement-plan.json" -output "$METRICS_DIR/self-improvement-receipts.json"
          go run ./scripts/meta-receipts -plan "$METRICS_DIR/self-improvement-plan.json" -output "$METRICS_DIR/self-improvement-receipts-replay.json"
          cmp -s "$METRICS_DIR/self-improvement-receipts.json" "$METRICS_DIR/self-improvement-receipts-replay.json"
          go run ./scripts/meta-provenance -plan "$METRICS_DIR/self-improvement-plan.json" -execution "$METRICS_DIR/self-improvement-execution.json" -receipts "$METRICS_DIR/self-improvement-receipts.json" -output "$METRICS_DIR/self-improvement-provenance.json"
          go run ./scripts/meta-provenance -plan "$METRICS_DIR/self-improvement-plan.json" -execution "$METRICS_DIR/self-improvement-execution.json" -receipts "$METRICS_DIR/self-improvement-receipts.json" -output "$METRICS_DIR/self-improvement-provenance-replay.json"
          cmp -s "$METRICS_DIR/self-improvement-provenance.json" "$METRICS_DIR/self-improvement-provenance-replay.json"
          go run ./scripts/artifact-feedback-resolution-ci -root "$GITHUB_WORKSPACE" -coverage "$METRICS_DIR/operation-artifact/report-1.json" -provenance "$METRICS_DIR/self-improvement-provenance.json" -output "$METRICS_DIR/artifact-feedback-resolution-input.json"
          go run ./scripts/artifact-feedback-resolution-ci -root "$GITHUB_WORKSPACE" -coverage "$METRICS_DIR/operation-artifact/report-1.json" -provenance "$METRICS_DIR/self-improvement-provenance.json" -output "$METRICS_DIR/artifact-feedback-resolution-input-replay.json"
          cmp -s "$METRICS_DIR/artifact-feedback-resolution-input.json" "$METRICS_DIR/artifact-feedback-resolution-input-replay.json"
          go run ./cmd/artifact-feedback-resolution-witness -root "$GITHUB_WORKSPACE" -input "$METRICS_DIR/artifact-feedback-resolution-input.json" -report "$METRICS_DIR/artifact-feedback-resolution-receipt.json" -check
          go run ./cmd/artifact-feedback-resolution-witness -root "$GITHUB_WORKSPACE" -input "$METRICS_DIR/artifact-feedback-resolution-input.json" -report "$METRICS_DIR/artifact-feedback-resolution-receipt-replay.json" -check
          cmp -s "$METRICS_DIR/artifact-feedback-resolution-receipt.json" "$METRICS_DIR/artifact-feedback-resolution-receipt-replay.json"
          jq -r '"### Artifact feedback resolution\n- decision: \(.report.decision) (\(.report.reason))\n- replay verified: \(.replay_verified)\n- receipt digest: \(.receipt_digest)"' "$METRICS_DIR/artifact-feedback-resolution-receipt.json" >> "$GITHUB_STEP_SUMMARY"
          go run ./scripts/source-splitter -root "$GITHUB_WORKSPACE" -metrics "$METRICS_DIR/source-metrics.json" -sha "$METRICS_COMMIT_SHA" -check
          go run ./bootstrap/source-repacker -root "$GITHUB_WORKSPACE" -metrics "$METRICS_DIR/source-metrics.json" -sha "$METRICS_COMMIT_SHA" -check
          go run ./scripts/meta-summary \
            -metrics "$METRICS_DIR/source-metrics.json" \
            -plan "$METRICS_DIR/self-improvement-plan.json" \
            -execution "$METRICS_DIR/self-improvement-execution.json" \
            -receipts "$METRICS_DIR/self-improvement-receipts.json" \
            -provenance "$METRICS_DIR/self-improvement-provenance.json" \
            -output "$METRICS_DIR/ci-summary.md" -report "$METRICS_DIR/ci-summary.json"
          go run ./scripts/meta-summary \
            -metrics "$METRICS_DIR/source-metrics.json" \
            -plan "$METRICS_DIR/self-improvement-plan.json" \
            -execution "$METRICS_DIR/self-improvement-execution.json" \
            -receipts "$METRICS_DIR/self-improvement-receipts.json" \
            -provenance "$METRICS_DIR/self-improvement-provenance.json" \
            -output "$METRICS_DIR/ci-summary-replay.md" -report "$METRICS_DIR/ci-summary-replay.json"
          cmp -s "$METRICS_DIR/ci-summary.md" "$METRICS_DIR/ci-summary-replay.md"
          cmp -s "$METRICS_DIR/ci-summary.json" "$METRICS_DIR/ci-summary-replay.json"
          cat "$METRICS_DIR/ci-summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload source metrics artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: source-line-metrics-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/source-metrics/source-metrics.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload meta-binding coverage artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: meta-binding-coverage-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/source-metrics/meta-binding-report.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload meta-actionability artifact
