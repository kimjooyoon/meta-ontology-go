name: CI
run-name: "CI [${{ github.event_name == 'pull_request' && 'PR authoritative' || 'push full' }}]"

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  actions: read
  checks: read
  # Branch protection is intentionally not observed from this pull_request
  # workflow. Main promotion consumes the base-pinned Guardian envelope.
  # administration: read must not be added here.

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.0
          cache: false
      - name: Materialize exact logical workspace
        id: materialize
        uses: ./.github/actions/materialize
        with:
          expected-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind the declared Go 1.27 toolchain
        run: |
          test "$(go env GOVERSION)" = "go1.27.0"
          go version
      - name: Require Go modernizers and module graph at a fixed point
        run: |
          go fix ./...
          go mod tidy
          git diff --exit-code
      - name: Compile module-declared meta tools
        run: |
          go list tool
          go build tool
      - name: Require formatted Go
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'gofmt required:\n%s\n' "$unformatted"
            exit 1
          fi

  vet:
    name: go vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.0
          cache: false
      - name: Materialize exact logical workspace
        id: materialize
        uses: ./.github/actions/materialize
        with:
          expected-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: go vet ./...

  test:
    name: go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.0
          cache: false
      - name: Materialize exact logical workspace
        id: materialize
        uses: ./.github/actions/materialize
        with:
          expected-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: go test ./...

  race:
    name: go test -race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.0
          cache: false
      - name: Materialize exact logical workspace
        id: materialize
        uses: ./.github/actions/materialize
        with:
          expected-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: go test -race ./...

  semantic:
    name: Semantic conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.0
          cache: false
      - name: Materialize exact logical workspace
        id: materialize
        uses: ./.github/actions/materialize
        with:
          expected-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Semantic conformance (staged verifier promotion)
        env:
          # Stage 0 is the current trust boundary. Advancing it requires a
          # deterministic CI-authorized governance change documented in .github/conformance-plan.md.
          GOOO_CONFORMANCE_STAGE: "0"
          GOOO_STORAGE_ROOT: ${{ steps.materialize.outputs.storage-root }}
        run: ./scripts/semantic-conformance.sh

  policy:
    name: CI policy
    needs: [format, vet, test, race, semantic]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.0
          cache: false
      - name: Materialize exact logical workspace
        id: materialize
        uses: ./.github/actions/materialize
        with:
          expected-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record CI event source
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_REF: ${{ github.ref }}
        run: |
          if [ "$CI_EVENT" = "pull_request" ]; then
            source="PR authoritative"
          else
            source="push full"
          fi
          {
            echo "### CI event source"
            echo "- run source: $source"
            echo "- event: $CI_EVENT"
            echo "- ref: $CI_REF"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify PR checkout identity
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          actual_head="$(git rev-parse HEAD)"
          test "$actual_head" = "$EXPECTED_HEAD"
          git rev-parse --verify "$EXPECTED_BASE^{commit}" >/dev/null
      - name: Emit source metrics (go/gooo + folders/files)
        env:
          METRICS_COMMIT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          GENERATION_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          METRICS_DIR: ${{ runner.temp }}/source-metrics
        run: |
          mkdir -p "$METRICS_DIR"
          go run ./scripts/line-metrics -root "$GITHUB_WORKSPACE" -storage-root "${{ steps.materialize.outputs.storage-root }}" -json > "$METRICS_DIR/source-metrics.json"
          go run ./scripts/line-metrics -root "$GITHUB_WORKSPACE" -storage-root "${{ steps.materialize.outputs.storage-root }}" -summary > "$METRICS_DIR/source-metrics.txt"
          go run ./scripts/refactor-metrics -root "$GITHUB_WORKSPACE" -metrics "$METRICS_DIR/source-metrics.json" -sha "$METRICS_COMMIT_SHA" -base-sha "$GENERATION_BASE_SHA" -plan "$METRICS_DIR/self-improvement-plan.json" -check
          go run ./scripts/refactor-metrics -root "$GITHUB_WORKSPACE" -metrics "$METRICS_DIR/source-metrics.json" -sha "$METRICS_COMMIT_SHA" -base-sha "$GENERATION_BASE_SHA" -plan "$METRICS_DIR/self-improvement-replay.json" -check
          cmp -s "$METRICS_DIR/self-improvement-plan.json" "$METRICS_DIR/self-improvement-replay.json"
          go run ./scripts/meta-execution -plan "$METRICS_DIR/self-improvement-plan.json" -output "$METRICS_DIR/self-improvement-execution.json"
          go run ./scripts/meta-execution -plan "$METRICS_DIR/self-improvement-plan.json" -output "$METRICS_DIR/self-improvement-execution-replay.json"
          cmp -s "$METRICS_DIR/self-improvement-execution.json" "$METRICS_DIR/self-improvement-execution-replay.json"
          go run ./scripts/meta-receipts -plan "$METRICS_DIR/self-improvement-plan.json" -output "$METRICS_DIR/self-improvement-receipts.json"
          go run ./scripts/meta-receipts -plan "$METRICS_DIR/self-improvement-plan.json" -output "$METRICS_DIR/self-improvement-receipts-replay.json"
          cmp -s "$METRICS_DIR/self-improvement-receipts.json" "$METRICS_DIR/self-improvement-receipts-replay.json"
          go run ./scripts/meta-provenance -plan "$METRICS_DIR/self-improvement-plan.json" -execution "$METRICS_DIR/self-improvement-execution.json" -receipts "$METRICS_DIR/self-improvement-receipts.json" -output "$METRICS_DIR/self-improvement-provenance.json"
          go run ./scripts/meta-provenance -plan "$METRICS_DIR/self-improvement-plan.json" -execution "$METRICS_DIR/self-improvement-execution.json" -receipts "$METRICS_DIR/self-improvement-receipts.json" -output "$METRICS_DIR/self-improvement-provenance-replay.json"
          cmp -s "$METRICS_DIR/self-improvement-provenance.json" "$METRICS_DIR/self-improvement-provenance-replay.json"
          go run ./scripts/source-splitter -root "$GITHUB_WORKSPACE" -metrics "$METRICS_DIR/source-metrics.json" -sha "$METRICS_COMMIT_SHA" -check
          go run ./bootstrap/source-repacker -root "$GITHUB_WORKSPACE" -metrics "$METRICS_DIR/source-metrics.json" -sha "$METRICS_COMMIT_SHA" -check
          {
            echo "### Source metrics (go/gooo + folders/files)"
            echo '```text'
            cat "$METRICS_DIR/source-metrics.txt"
            echo '```'
            echo "### Deterministic self-improvement generation"
            echo '```json'
            cat "$METRICS_DIR/self-improvement-plan.json"
            echo '```'
            echo "### Deterministic sandbox execution manifest"
            echo '```json'
            cat "$METRICS_DIR/self-improvement-execution.json"
            echo '```'
            echo "### Deterministic conformance receipt report"
            echo '```json'
            cat "$METRICS_DIR/self-improvement-receipts.json"
            echo '```'
            echo "### Deterministic artifact provenance envelope"
            echo '```json'
            cat "$METRICS_DIR/self-improvement-provenance.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload source metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-line-metrics-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/source-metrics/source-metrics.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload self-improvement generation artifact
        uses: actions/upload-artifact@v4
        with:
          name: self-improvement-generation-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/source-metrics/self-improvement-plan.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload self-improvement execution artifact
        uses: actions/upload-artifact@v4
        with:
          name: self-improvement-execution-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/source-metrics/self-improvement-execution.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload self-improvement receipt artifact
        uses: actions/upload-artifact@v4
        with:
          name: self-improvement-receipts-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/source-metrics/self-improvement-receipts.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload self-improvement provenance artifact
        uses: actions/upload-artifact@v4
        with:
          name: self-improvement-provenance-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/source-metrics/self-improvement-provenance.json
          if-no-files-found: error
          retention-days: 30
      - name: Check DAMP/DRY caps
        if: github.event_name == 'pull_request'
        env:
          GOOO_SCOPE_FROM: ${{ github.event.pull_request.base.sha }}
          GOOO_SCOPE_TO: ${{ github.event.pull_request.head.sha }}
          GOOO_STORAGE_ROOT: ${{ steps.materialize.outputs.storage-root }}
        run: go run ./scripts/verify --caps-only
      - name: Check changed-file scope, Go size caps, and PR target
        if: github.event_name == 'pull_request'
        env:
          GOOO_SCOPE_FROM: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          GOOO_SCOPE_TO: ${{ github.event.pull_request.head.sha }}
          GOOO_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          GOOO_SCOPE_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          GOOO_PR_HEAD: ${{ github.head_ref }}
          GOOO_PR_BASE: ${{ github.base_ref }}
        run: go run ./scripts/verify --skip-caps
      - name: Check Go caps on protected push
        if: github.event_name == 'push'
        env:
          # A rebase can make github.event.before unavailable to checkout. Push
          # validation therefore keeps the local size caps while PR events run
          # the complete changed-path scope and ownership check.
          GOOO_SCOPE_FROM: ""
          GOOO_SCOPE_TO: ""
          GOOO_SCOPE_BRANCH: ${{ github.ref_name }}
          GOOO_PR_HEAD: ""
          GOOO_PR_BASE: ""
          GOOO_STORAGE_ROOT: ${{ steps.materialize.outputs.storage-root }}
        run: go run ./scripts/verify
  evidence:
    name: CI evidence
    needs: [format, vet, test, race, semantic, policy]
    if: ${{ always() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.0
          cache: false
      - name: Materialize exact logical workspace
        id: materialize
        uses: ./.github/actions/materialize
        with:
          expected-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Test artifact paginator contract
        run: node scripts/ci-proof/artifacts_test.js
      - name: Collect terminal canonical job evidence
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const jobs = [];
            for (let page = 1; page <= 1000; page++) {
              const response = await github.rest.actions.listJobsForWorkflowRun({owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId, per_page: 100, page});
              if (!response.data || !Array.isArray(response.data.jobs)) throw new Error('canonical job API returned malformed data');
              jobs.push(...response.data.jobs);
              if (response.data.jobs.length < 100) {
                require('fs').writeFileSync('ci-jobs.json', JSON.stringify(jobs));
                return;
              }
            }
            throw new Error('canonical job API pagination exceeded the fail-closed page limit');
      - name: Reproduce generated evidence input
        run: |
          mkdir -p ci-generated/first ci-generated/second
          go run ./cmd/gooo generate examples/billing/main.gooo --out ci-generated/first
          go run ./cmd/gooo generate examples/billing/main.gooo --out ci-generated/second
          cmp ci-generated/first/semantic.gooo.go ci-generated/second/semantic.gooo.go
          test -z "$(gofmt -l ci-generated/first/semantic.gooo.go)"
          grep -Fq '//gooo:slot:start' ci-generated/first/semantic.gooo.go
          grep -Fq '//gooo:slot:end' ci-generated/first/semantic.gooo.go
          test -z "$(git diff --name-only)"
          unexpected="$(git status --porcelain | grep -vE '^\?\? (ci-generated/|ci-jobs.json$|ci-evidence.json$|ci-domain/)' || true)"
          test -z "$unexpected"
      - name: Capture CLI domain evidence
        run: |
          mkdir -p ci-domain
          go run ./cmd/gooo check examples/billing/main.gooo > ci-domain/cli-check.stdout 2> ci-domain/cli-check.stderr
      - name: Verify and write CI evidence bundle
        env:
          CI_REPOSITORY: ${{ github.repository }}
          CI_EVENT: ${{ github.event_name }}
          CI_EVENT_REF: ${{ github.ref }}
          CI_CHECKOUT_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          CI_BASE_REF: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
          CI_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          CI_RUN_ID: ${{ github.run_id }}
          CI_RUN_ATTEMPT: ${{ github.run_attempt }}
          CI_WORKFLOW_SHA: ${{ github.workflow_sha }}
          CI_SLOT_PRESERVATION: "true"
          CI_NO_WRITE_OUTSIDE_GENERATED: "true"
        run: |
          go run ./scripts/ci-evidence --jobs ci-jobs.json --generated ci-generated/first --output ci-evidence.json
          go run ./scripts/ci-evidence --verify ci-evidence.json
      - name: Write machine-readable domain evidence
        uses: actions/github-script@v7
        env:
          CI_WORKFLOW_SHA: ${{ github.workflow_sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const crypto = require('crypto');
            const fs = require('fs');
            const evidence = JSON.parse(fs.readFileSync('ci-evidence.json', 'utf8'));
            const pull = context.payload.pull_request;
            const headSha = pull ? pull.head.sha : context.sha;
            const baseSha = pull ? pull.base.sha : context.payload.before;
            const {normalizeBaseRef} = require('./scripts/ci-proof/refs');
            const baseRef = normalizeBaseRef(context.eventName, context.ref, pull);
            const output = fs.readFileSync('ci-domain/cli-check.stdout', 'utf8');
            const domain = {
              schema: 'gooo/domain-evidence/v2', repository: context.payload.repository.full_name, event: context.eventName,
              base_ref: baseRef, base_sha: baseSha, head_sha: headSha, event_ref: context.ref, checkout_ref: headSha,
              run_id: context.runId, run_attempt: Number(process.env.GITHUB_RUN_ATTEMPT || 1), workflow_sha: process.env.CI_WORKFLOW_SHA,
              cli: {command: 'go run ./cmd/gooo check examples/billing/main.gooo', fixture: 'examples/billing/main.gooo', status: 'verified', available: true, output, output_sha256: crypto.createHash('sha256').update(output).digest('hex')},
              graph: {command: 'go run ./cmd/gooo graph-dump examples/billing/main.gooo', status: 'deferred', available: false, reason: 'graph-dump is not implemented in the current checkout', output_sha256: crypto.createHash('sha256').update('').digest('hex')},
              observer_receipt_refs: [], observer_status: 'unavailable', protection_status: 'unavailable', provenance_status: 'not_applicable',
              digests: {source_sha256: evidence.digests.source_sha256, ir_sha256: evidence.digests.ir_sha256, generated_output_sha256: evidence.digests.generated_output_sha256, bundle_sha256: evidence.digests.bundle_sha256, domain_sha256: ''},
              missing_reasons: {protection: 'domain_protection_observer_unavailable'},
            };
            const domainPayload = {...domain, digests: {...domain.digests, domain_sha256: ''}};
            domain.digests.domain_sha256 = crypto.createHash('sha256').update(JSON.stringify(domainPayload)).digest('hex');
            fs.writeFileSync('ci-domain-evidence.json', JSON.stringify(domain, null, 2) + '\n');
      - name: Upload CI evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-evidence.json
            ci-domain-evidence.json
          if-no-files-found: error
          retention-days: 14

  proof:
    name: CI proof bundle
    needs: [format, vet, test, race, semantic, policy, evidence]
    if: ${{ always() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.0
          cache: false
      - name: Materialize exact logical workspace
        id: materialize
        uses: ./.github/actions/materialize
        with:
          expected-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Download canonical evidence
        uses: actions/download-artifact@v4
        with:
          name: ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-evidence-input
      - name: Collect terminal canonical jobs
        uses: actions/github-script@v7
        env:
          CI_RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const jobsFromAPI = [];
            for (let page = 1; page <= 1000; page++) {
              const response = await github.rest.actions.listJobsForWorkflowRun({owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId, per_page: 100, page});
              jobsFromAPI.push(...response.data.jobs);
              if (response.data.jobs.length < 100) break;
              if (page === 1000) throw new Error('proof job API pagination exceeded the fail-closed page limit');
            }
            const names = ['gofmt', 'go vet', 'go test', 'go test -race', 'Semantic conformance', 'CI policy'];
            const head = context.payload.pull_request?.head.sha || context.sha;
            const byName = new Map();
            for (const job of jobsFromAPI) {
              if (!names.includes(job.name)) continue;
              if (byName.has(job.name)) throw new Error(`duplicate canonical job ${job.name}`);
              byName.set(job.name, job);
            }
            const attempt = Number(process.env.CI_RUN_ATTEMPT || 1);
            const jobs = names.map(name => {
              const job = byName.get(name);
              return job ? {...job, run_attempt: attempt} : job;
            });
            const ids = new Set();
            for (const job of jobs) {
              if (!job || job.status !== 'completed' || job.conclusion !== 'success' || job.head_sha !== head || job.id <= 0 || ids.has(job.id)) {
                throw new Error('canonical jobs are not terminal, successful, unique, and bound to the immutable head');
              }
              ids.add(job.id);
            }
            fs.writeFileSync('ci-final-jobs.json', JSON.stringify(jobs));
            fs.writeFileSync('ci-jobs.json', JSON.stringify(jobs));
      - name: Reproduce proof fixture
        run: |
          mkdir -p ci-generated/first
          go run ./cmd/gooo generate examples/billing/main.gooo --out ci-generated/first
          test -s ci-generated/first/semantic.gooo.go
          test -z "$(gofmt -l ci-generated/first/semantic.gooo.go)"
          test -z "$(git diff --name-only)"
      - name: Select exact Guardian promotion evidence
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        uses: actions/github-script@v7
        env:
          CI_WORKFLOW_SHA: ${{ github.workflow_sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const eventPull = context.payload.pull_request;
            const pullResponse = await github.rest.pulls.get({owner: context.repo.owner, repo: context.repo.repo, pull_number: eventPull.number});
            const pull = pullResponse.data;
            if (!pull || pull.base.ref !== 'main' || pull.base.sha !== eventPull.base.sha || pull.head.ref !== eventPull.head.ref || pull.head.sha !== eventPull.head.sha || pull.base.repo.full_name !== context.payload.repository.full_name || pull.head.repo.full_name !== context.payload.repository.full_name) throw new Error('promotion PR changed during Guardian selection');
            const expectedHead = pull.head.sha;
            const runs = [];
            for (let page = 1; page <= 1000; page++) {
              const response = await github.rest.actions.listWorkflowRuns({owner: context.repo.owner, repo: context.repo.repo, workflow_id: 'ci-guardian.yml', event: 'pull_request_target', per_page: 100, page});
              if (!response.data || !Array.isArray(response.data.workflow_runs)) throw new Error('Guardian workflow run API returned malformed data');
              runs.push(...response.data.workflow_runs);
              if (response.data.workflow_runs.length < 100) break;
              if (page === 1000) throw new Error('Guardian workflow run pagination exceeded the fail-closed page limit');
            }
