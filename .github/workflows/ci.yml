  evidence:
    name: CI evidence
    needs: [format, vet, test, race, semantic, policy]
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.0
          cache: false
      - name: Materialize exact logical workspace
        id: materialize
        uses: ./.github/actions/materialize
        with:
          expected-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Download exact artifact provenance
        uses: actions/download-artifact@v7
        with:
          name: self-improvement-provenance-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: ci-meta-provenance
      - name: Test CI proof selector contracts
        run: |
          node scripts/ci-proof/artifacts_test.js
          node scripts/ci-proof/route_test.js
          node scripts/ci-proof/concurrency_test.js
          node scripts/ci-proof/foundation_authorization_test.js
          node scripts/ci-proof/guardian_test.js
          node scripts/ci-proof/linear_tree_reconciliation_test.js
          node scripts/ci-proof/source_migration_v3_test.js
          node scripts/ci-proof/time_causality_v011_test.js
      - name: Collect terminal canonical job evidence
        uses: actions/github-script@v8
        with:
          github-token: ${{ github.token }}
          script: |
            const jobs = [];
            for (let page = 1; page <= 1000; page++) {
              const response = await github.rest.actions.listJobsForWorkflowRun({owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId, per_page: 100, page});
              if (!response.data || !Array.isArray(response.data.jobs)) throw new Error('canonical job API returned malformed data');
              jobs.push(...response.data.jobs);
              if (response.data.jobs.length < 100) {
                require('fs').writeFileSync('ci-jobs.json', JSON.stringify(jobs));
                return;
              }
            }
            throw new Error('canonical job API pagination exceeded the fail-closed page limit');
      - name: Reproduce generated evidence input
        run: |
          mkdir -p ci-generated/first ci-generated/second
          go run ./cmd/gooo generate examples/billing/main.gooo --out ci-generated/first
          go run ./cmd/gooo generate examples/billing/main.gooo --out ci-generated/second
          cmp ci-generated/first/semantic.gooo.go ci-generated/second/semantic.gooo.go
          test -z "$(gofmt -l ci-generated/first/semantic.gooo.go)"
          grep -Fq '//gooo:slot:start' ci-generated/first/semantic.gooo.go
          grep -Fq '//gooo:slot:end' ci-generated/first/semantic.gooo.go
          test -z "$(git diff --name-only)"
          unexpected="$(git status --porcelain | grep -vE '^\?\? (ci-generated/|ci-jobs.json$|ci-evidence.json$|ci-domain/|ci-meta-provenance/)' || true)"
          test -z "$unexpected"
      - name: Capture CLI domain evidence
        run: |
          mkdir -p ci-domain
          go run ./cmd/gooo check examples/billing/main.gooo > ci-domain/cli-check.stdout 2> ci-domain/cli-check.stderr
      - name: Verify and write CI evidence bundle
        env:
          CI_REPOSITORY: ${{ github.repository }}
          CI_EVENT: ${{ github.event_name }}
          CI_EVENT_REF: ${{ github.ref }}
          CI_CHECKOUT_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          CI_BASE_REF: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
          CI_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          CI_RUN_ID: ${{ github.run_id }}
          CI_RUN_ATTEMPT: ${{ github.run_attempt }}
          CI_WORKFLOW_SHA: ${{ github.workflow_sha }}
          CI_SLOT_PRESERVATION: "true"
          CI_NO_WRITE_OUTSIDE_GENERATED: "true"
        run: |
          go run ./scripts/ci-evidence --jobs ci-jobs.json --generated ci-generated/first --provenance ci-meta-provenance/self-improvement-provenance.json --output ci-evidence.json
          go run ./scripts/ci-evidence --verify ci-evidence.json
      - name: Write machine-readable domain evidence
        uses: actions/github-script@v8
        env:
          CI_WORKFLOW_SHA: ${{ github.workflow_sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const crypto = require('crypto');
            const fs = require('fs');
            const evidence = JSON.parse(fs.readFileSync('ci-evidence.json', 'utf8'));
            const pull = context.payload.pull_request;
            const headSha = pull ? pull.head.sha : context.sha;
            const baseSha = pull ? pull.base.sha : context.payload.before;
            const {normalizeBaseRef} = require('./scripts/ci-proof/refs');
            const baseRef = normalizeBaseRef(context.eventName, context.ref, pull);
            const output = fs.readFileSync('ci-domain/cli-check.stdout', 'utf8');
            const domain = {
              schema: 'gooo/domain-evidence/v2', repository: context.payload.repository.full_name, event: context.eventName,
              base_ref: baseRef, base_sha: baseSha, head_sha: headSha, event_ref: context.ref, checkout_ref: headSha,
              run_id: context.runId, run_attempt: Number(process.env.GITHUB_RUN_ATTEMPT || 1), workflow_sha: process.env.CI_WORKFLOW_SHA,
              cli: {command: 'go run ./cmd/gooo check examples/billing/main.gooo', fixture: 'examples/billing/main.gooo', status: 'verified', available: true, output, output_sha256: crypto.createHash('sha256').update(output).digest('hex')},
              graph: {command: 'go run ./cmd/gooo graph-dump examples/billing/main.gooo', status: 'deferred', available: false, reason: 'graph-dump is not implemented in the current checkout', output_sha256: crypto.createHash('sha256').update('').digest('hex')},
              observer_receipt_refs: [], observer_status: 'unavailable', protection_status: 'unavailable', provenance_status: 'not_applicable',
              digests: {source_sha256: evidence.digests.source_sha256, ir_sha256: evidence.digests.ir_sha256, generated_output_sha256: evidence.digests.generated_output_sha256, bundle_sha256: evidence.digests.bundle_sha256, domain_sha256: ''},
              missing_reasons: {protection: 'domain_protection_observer_unavailable'},
            };
            const domainPayload = {...domain, digests: {...domain.digests, domain_sha256: ''}};
            domain.digests.domain_sha256 = crypto.createHash('sha256').update(JSON.stringify(domainPayload)).digest('hex');
            fs.writeFileSync('ci-domain-evidence.json', JSON.stringify(domain, null, 2) + '\n');
      - name: Upload CI evidence bundle
        uses: actions/upload-artifact@v6
        with:
          name: ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-evidence.json
            ci-domain-evidence.json
          if-no-files-found: error
          retention-days: 14

  proof:
    name: CI proof bundle
    needs: [format, vet, test, race, semantic, policy, evidence, feedback-predecessor]
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.0
          cache: false
      - name: Materialize exact logical workspace
        id: materialize
        uses: ./.github/actions/materialize
        with:
          expected-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Resolve CI concurrency lane
        id: concurrency-lane
        uses: actions/github-script@v8
        env:
          CI_RUN_ATTEMPT: ${{ github.run_attempt }}
          CI_WORKFLOW: ${{ github.workflow }}
          CI_CONCURRENCY_SCOPE: ${{ github.event.pull_request.number || github.ref }}
        with:
          script: |
            const fs = require('fs');
            const {buildConcurrencyReceipt} = require('./scripts/ci-proof/concurrency');
            const report = buildConcurrencyReceipt(fs.readFileSync('.github/workflows/ci.yml', 'utf8'), {
              workflow: process.env.CI_WORKFLOW,
              scope: process.env.CI_CONCURRENCY_SCOPE,
              run_id: Number(context.runId),
              run_attempt: Number(process.env.CI_RUN_ATTEMPT || 1),
            });
            fs.writeFileSync('ci-concurrency-lane.json', JSON.stringify(report, null, 2) + '\n');
            await core.summary
              .addHeading('CI concurrency lane')
              .addTable([
                [{data: 'indicator', header: true}, {data: 'value', header: true}],
                ['decision', report.decision],
                ['reason', report.reason],
                ['lane class', report.lane_class],
                ['resolved group', report.resolved_group],
                ['head preemption risk', String(report.summary.head_preemption_risk)],
                ['repository writes', String(report.summary.repository_writes)],
              ])
              .write();
            if (report.decision !== 'EXACT' || !report.execution_authorized) {
              core.setFailed(`${report.decision}: ${report.reason}; next=${report.next_operation}`);
            }
      - name: Resolve canonical evidence lineage
        id: evidence-lineage
        uses: actions/github-script@v8
        env:
          CI_RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const {listWorkflowArtifacts, selectArtifactLineage} = require('./scripts/ci-proof/artifacts');
            const rows = await listWorkflowArtifacts(page => github.rest.actions.listWorkflowRunArtifacts({owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId, per_page: 100, page}));
            const attempt = Number(process.env.CI_RUN_ATTEMPT || 1);
            const report = selectArtifactLineage(rows, 'ci-evidence', context.runId, attempt);
            const replay = selectArtifactLineage(rows.slice().reverse(), 'ci-evidence', context.runId, attempt);
            if (report.report_digest !== replay.report_digest) throw new Error('artifact lineage replay digest mismatch');
            fs.writeFileSync('ci-artifact-lineage.json', JSON.stringify(report, null, 2) + '\n');
            await core.summary
              .addHeading('CI artifact lineage')
              .addTable([
                [{data: 'indicator', header: true}, {data: 'value', header: true}],
                ['decision', report.decision],
                ['reason', report.reason],
                ['current attempt', String(report.current_attempt)],
                ['selected attempt', String(report.summary.selected_attempt)],
                ['fallback distance', String(report.summary.fallback_distance_attempts)],
                ['ambiguity', String(report.summary.ambiguous_candidates)],
                ['repository writes', String(report.summary.repository_writes)],
              ])
              .write();
            if (report.decision !== 'EXACT' || !report.exact_consumption_authorized) {
              core.setFailed(`${report.decision}: ${report.reason}; next=${report.next_operation}`);
              return;
            }
            core.setOutput('artifact-name', report.selected.name);
      - name: Download canonical evidence
        uses: actions/download-artifact@v7
        with:
          name: ${{ steps.evidence-lineage.outputs.artifact-name }}
          path: ci-evidence-input
      - name: Collect terminal canonical jobs
        uses: actions/github-script@v8
        env:
          CI_RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const jobsFromAPI = [];
            for (let page = 1; page <= 1000; page++) {
              const response = await github.rest.actions.listJobsForWorkflowRun({owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId, per_page: 100, page});
              jobsFromAPI.push(...response.data.jobs);
              if (response.data.jobs.length < 100) break;
              if (page === 1000) throw new Error('proof job API pagination exceeded the fail-closed page limit');
            }
            const names = ['gofmt', 'go vet', 'go test', 'go test -race', 'Semantic conformance', 'CI policy'];
            const head = context.payload.pull_request?.head.sha || context.sha;
            const byName = new Map();
            for (const job of jobsFromAPI) {
              if (!names.includes(job.name)) continue;
              if (byName.has(job.name)) throw new Error(`duplicate canonical job ${job.name}`);
              byName.set(job.name, job);
            }
            const attempt = Number(process.env.CI_RUN_ATTEMPT || 1);
            const jobs = names.map(name => {
              const job = byName.get(name);
              return job ? {...job, run_attempt: attempt} : job;
            });
            const ids = new Set();
            for (const job of jobs) {
              if (!job || job.status !== 'completed' || job.conclusion !== 'success' || job.head_sha !== head || job.id <= 0 || ids.has(job.id)) {
                throw new Error('canonical jobs are not terminal, successful, unique, and bound to the immutable head');
              }
              ids.add(job.id);
            }
            fs.writeFileSync('ci-final-jobs.json', JSON.stringify(jobs));
            fs.writeFileSync('ci-jobs.json', JSON.stringify(jobs));
      - name: Reproduce proof fixture
        run: |
          mkdir -p ci-generated/first
          go run ./cmd/gooo generate examples/billing/main.gooo --out ci-generated/first
          test -s ci-generated/first/semantic.gooo.go
          test -z "$(gofmt -l ci-generated/first/semantic.gooo.go)"
          test -z "$(git diff --name-only)"
      - name: Compile deterministic proof route
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const pull = context.payload.pull_request;
            const {normalizeBaseRef} = require('./scripts/ci-proof/refs');
            const route = require('./scripts/ci-proof/route');
            const baseRef = normalizeBaseRef(context.eventName, context.ref, pull);
            const headSha = pull ? pull.head.sha : context.sha;
            const baseSha = pull ? pull.base.sha : context.payload.before;
            const evidence = route.buildProofRouteEvidence({
              event: context.eventName, eventRef: context.ref, baseRef, baseSha, headSha,
              repository: context.payload.repository.full_name, prNumber: pull ? pull.number : 0,
              headRef: pull ? pull.head.ref : '',
            });
            fs.writeFileSync('ci-proof-route.json', JSON.stringify(evidence, null, 2) + '\n');
      - name: Select exact Guardian promotion evidence
        if: github.event_name == 'pull_request' && github.base_ref == 'main' && (github.event.pull_request.number != 602 || github.head_ref != 'agent/foundation-discovery-recovery-20260830' || github.event.pull_request.base.sha != 'cd9727af80f5118405290d3be96890c18e1529c0')
        uses: actions/github-script@v8
        env:
          CI_WORKFLOW_SHA: ${{ github.workflow_sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const eventPull = context.payload.pull_request;
            const pullResponse = await github.rest.pulls.get({owner: context.repo.owner, repo: context.repo.repo, pull_number: eventPull.number});
            const pull = pullResponse.data;
            if (!pull || pull.base.ref !== 'main' || pull.base.sha !== eventPull.base.sha || pull.head.ref !== eventPull.head.ref || pull.head.sha !== eventPull.head.sha || pull.base.repo.full_name !== context.payload.repository.full_name || pull.head.repo.full_name !== context.payload.repository.full_name) throw new Error('promotion PR changed during Guardian selection');
            const expectedHead = pull.head.sha;
            const runs = [];
            for (let page = 1; page <= 1000; page++) {
              const response = await github.rest.actions.listWorkflowRuns({owner: context.repo.owner, repo: context.repo.repo, workflow_id: 'ci-guardian.yml', event: 'pull_request_target', per_page: 100, page});
              if (!response.data || !Array.isArray(response.data.workflow_runs)) throw new Error('Guardian workflow run API returned malformed data');
              runs.push(...response.data.workflow_runs);
              if (response.data.workflow_runs.length < 100) break;
              if (page === 1000) throw new Error('Guardian workflow run pagination exceeded the fail-closed page limit');
            }
            const matching = runs.filter(run => run.workflow_id && run.event === 'pull_request_target' && run.head_sha === expectedHead && run.head_branch === pull.head.ref && Array.isArray(run.pull_requests) && run.pull_requests.some(candidate => Number(candidate.number) === pull.number && candidate.base && candidate.base.ref === 'main' && candidate.base.sha === pull.base.sha && candidate.head && candidate.head.ref === pull.head.ref && candidate.head.sha === pull.head.sha));
            matching.sort((left, right) => Number(right.run_number || 0) - Number(left.run_number || 0) || Number(right.run_attempt || 1) - Number(left.run_attempt || 1) || Number(right.id) - Number(left.id));
            if (matching.length === 0) throw new Error('no current exact-head Guardian run exists');
            const selected = matching[0];
            if (selected.status !== 'completed' || selected.conclusion !== 'success') throw new Error('latest exact-head Guardian run is not successful and terminal');
            const selectedKey = `${selected.run_number || 0}:${selected.run_attempt || 1}:${selected.id}`;
            const sameMax = matching.filter(run => `${run.run_number || 0}:${run.run_attempt || 1}:${run.id}` === selectedKey);
            if (sameMax.length !== 1) throw new Error('Guardian run selection is ambiguous');
            const workflow = await github.rest.actions.getWorkflow({owner: context.repo.owner, repo: context.repo.repo, workflow_id: selected.workflow_id});
            if (!workflow.data || workflow.data.id !== selected.workflow_id || workflow.data.path !== '.github/workflows/ci-guardian.yml') throw new Error('selected workflow is not ci-guardian.yml');
            const jobs = [];
            for (let page = 1; page <= 1000; page++) {
              const response = await github.rest.actions.listJobsForWorkflowRun({owner: context.repo.owner, repo: context.repo.repo, run_id: selected.id, per_page: 100, page});
              if (!response.data || !Array.isArray(response.data.jobs)) throw new Error('Guardian job API returned malformed data');
              jobs.push(...response.data.jobs);
              if (response.data.jobs.length < 100) break;
              if (page === 1000) throw new Error('Guardian job pagination exceeded the fail-closed page limit');
            }
            const guardianJobs = jobs.filter(job => job.name === 'CI guardian' && job.status === 'completed' && job.conclusion === 'success' && job.head_sha === expectedHead && typeof job.check_run_url === 'string');
            if (guardianJobs.length !== 1) throw new Error('selected Guardian run does not have exactly one successful exact-head CI guardian job');
            const checkURL = guardianJobs[0].check_run_url;
            const checkResponse = await github.request(checkURL);
            const check = checkResponse.data;
            if (!check || check.name !== 'CI guardian' || !check.app || check.app.id !== 15368 || check.status !== 'completed' || check.conclusion !== 'success' || check.head_sha !== expectedHead || !check.check_suite || check.check_suite.id <= 0 || !String(check.details_url || '').includes(`/actions/runs/${selected.id}/`)) throw new Error('selected Guardian job check is not app-bound, terminal, or exact-head');
            const suiteResponse = await github.rest.checks.getSuite({owner: context.repo.owner, repo: context.repo.repo, check_suite_id: check.check_suite.id});
            const suite = suiteResponse.data;
            if (!suite || suite.id !== check.check_suite.id || suite.app?.id !== 15368 || suite.status !== 'completed' || suite.conclusion !== 'success' || suite.head_sha !== expectedHead) throw new Error('selected Guardian check suite is not app-bound, terminal, or exact-head');
            const suiteChecks = [];
