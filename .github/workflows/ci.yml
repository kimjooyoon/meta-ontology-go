name: CI
run-name: "CI [${{ github.event_name == 'pull_request' && 'PR authoritative' || github.event_name == 'push' && startsWith(github.ref, 'refs/heads/agent/') && 'agent push cap-only' || 'push full' }}]"

on:
  push:
    branches:
      - integration
      - main
      - 'agent/**'
  pull_request:
    branches:
      - integration
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: gofmt
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/heads/agent/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Require formatted Go
        run: test -z "$(gofmt -l .)"

  vet:
    name: go vet
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/heads/agent/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...

  test:
    name: go test
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/heads/agent/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...

  race:
    name: go test -race
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/heads/agent/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...

  semantic:
    name: Semantic conformance
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/heads/agent/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Semantic conformance (staged verifier promotion)
        env:
          # Stage 0 is the current trust boundary. Advancing it is a reviewed
          # governance change documented in .github/conformance-plan.md.
          GOOO_CONFORMANCE_STAGE: "0"
        run: ./scripts/semantic-conformance.sh

  policy:
    name: CI policy
    needs: [format, vet, test, race, semantic]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Record CI event source
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_REF: ${{ github.ref }}
        run: |
          if [ "$CI_EVENT" = "pull_request" ]; then
            source="PR authoritative"
          elif [ "$CI_EVENT" = "push" ] && [[ "$CI_REF" == refs/heads/agent/* ]]; then
            source="agent push cap-only"
          else
            source="push full"
          fi
          {
            echo "### CI event source"
            echo "- run source: $source"
            echo "- event: $CI_EVENT"
            echo "- ref: $CI_REF"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify PR checkout identity
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          actual_head="$(git rev-parse HEAD)"
          test "$actual_head" = "$EXPECTED_HEAD"
          git rev-parse --verify "$EXPECTED_BASE^{commit}" >/dev/null
      - name: Check changed-file scope, Go size caps, and PR target
        if: github.event_name == 'pull_request'
        env:
          GOOO_SCOPE_FROM: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          GOOO_SCOPE_TO: ${{ github.event.pull_request.head.sha }}
          GOOO_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          GOOO_SCOPE_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          GOOO_PR_HEAD: ${{ github.head_ref }}
          GOOO_PR_BASE: ${{ github.base_ref }}
        run: go run ./scripts/verify
      - name: Check Go caps on branch push
        if: github.event_name == 'push'
        env:
          # A rebase can make github.event.before unavailable to checkout. Push
          # validation therefore keeps the local size caps while PR events run
          # the complete changed-path scope and ownership check.
          GOOO_SCOPE_FROM: ""
          GOOO_SCOPE_TO: ""
          GOOO_SCOPE_BRANCH: ${{ github.ref_name }}
          GOOO_PR_HEAD: ""
          GOOO_PR_BASE: ""
        run: go run ./scripts/verify
      - name: Collect canonical job evidence
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/integration' || github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const response = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              per_page: 100,
            });
            require('fs').writeFileSync('ci-jobs.json', JSON.stringify(response.data.jobs));
      - name: Reproduce generated evidence input
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/integration' || github.ref == 'refs/heads/main'
        run: |
          rm -rf ci-generated
          mkdir -p ci-generated/first ci-generated/second
          go run ./cmd/gooo generate examples/billing/main.gooo --out ci-generated/first
          go run ./cmd/gooo generate examples/billing/main.gooo --out ci-generated/second
          cmp ci-generated/first/semantic.gooo.go ci-generated/second/semantic.gooo.go
          test -z "$(gofmt -l ci-generated/first/semantic.gooo.go)"
          grep -Fq '//gooo:slot:start' ci-generated/first/semantic.gooo.go
          grep -Fq '//gooo:slot:end' ci-generated/first/semantic.gooo.go
          test -z "$(git diff --name-only)"
          unexpected="$(git status --porcelain | grep -vE '^\?\? (ci-generated/|ci-jobs.json$|ci-evidence.json$)' || true)"
          test -z "$unexpected"
      - name: Verify and write CI evidence bundle
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/integration' || github.ref == 'refs/heads/main'
        env:
          CI_REPOSITORY: ${{ github.repository }}
          CI_EVENT: ${{ github.event_name }}
          CI_BASE_REF: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
          CI_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          CI_RUN_ID: ${{ github.run_id }}
          CI_RUN_ATTEMPT: ${{ github.run_attempt }}
          CI_WORKFLOW_SHA: ${{ github.workflow_sha }}
          CI_POLICY_SELF_SUCCESS: "true"
          CI_SLOT_PRESERVATION: "true"
          CI_NO_WRITE_OUTSIDE_GENERATED: "true"
        run: |
          go run ./scripts/ci-evidence --jobs ci-jobs.json --generated ci-generated/first --output ci-evidence.json
          go run ./scripts/ci-evidence --verify ci-evidence.json
      - name: Upload CI evidence bundle
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/integration' || github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-evidence.json
          if-no-files-found: error
          retention-days: 14

  proof:
    name: CI proof bundle
    needs: [format, vet, test, race, semantic, policy]
    if: ${{ always() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/integration' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Download canonical evidence
        uses: actions/download-artifact@v4
        with:
          name: ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-evidence-input
      - name: Collect terminal canonical jobs
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const response = await github.rest.actions.listJobsForWorkflowRun({owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId, per_page: 100});
            const names = ['gofmt', 'go vet', 'go test', 'go test -race', 'Semantic conformance', 'CI policy'];
            const head = context.payload.pull_request?.head.sha || context.sha;
            const byName = new Map();
            for (const job of response.data.jobs) {
              if (!names.includes(job.name)) continue;
              if (byName.has(job.name)) throw new Error(`duplicate canonical job ${job.name}`);
              byName.set(job.name, job);
            }
            const jobs = names.map(name => byName.get(name));
            const ids = new Set();
            for (const job of jobs) {
              if (!job || job.status !== 'completed' || job.conclusion !== 'success' || job.head_sha !== head || job.id <= 0 || ids.has(job.id)) {
                throw new Error('canonical jobs are not terminal, successful, unique, and bound to the immutable head');
              }
              ids.add(job.id);
            }
            fs.writeFileSync('ci-final-jobs.json', JSON.stringify(jobs));
            fs.writeFileSync('ci-jobs.json', JSON.stringify(jobs));
      - name: Reproduce proof fixture
        run: |
          rm -rf ci-generated-proof
          mkdir -p ci-generated-proof
          go run ./cmd/gooo generate examples/billing/main.gooo --out ci-generated-proof
          test -s ci-generated-proof/semantic.gooo.go
          test -z "$(gofmt -l ci-generated-proof/semantic.gooo.go)"
          test -z "$(git diff --name-only)"
      - name: Collect proof context
        uses: actions/github-script@v7
        env:
          BRANCH_PROTECTION_TOKEN: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
          CI_WORKFLOW_SHA: ${{ github.workflow_sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const crypto = require('crypto');
            const fs = require('fs');
            const pull = context.payload.pull_request;
            const baseRef = pull ? pull.base.ref : context.ref_name;
            const baseSha = pull ? pull.base.sha : context.payload.before;
            const headSha = pull ? pull.head.sha : context.sha;
            const evidence = JSON.parse(fs.readFileSync('ci-evidence-input/ci-evidence.json', 'utf8'));
            let protection = {
              repository: `${context.repo.owner}/${context.repo.repo}`,
              branch: baseRef,
              policy_sha256: evidence.digests.policy_sha256,
              exists: false,
              strict: false,
              required_checks: [],
              enforce_admins: false,
              required_reviews: 0,
              dismiss_stale_reviews: false,
              require_last_push_approval: false,
              linear_history: false,
              allow_force_pushes: false,
              allow_deletions: false,
              base_sha: baseSha,
              head_sha: headSha,
              run_id: context.runId,
              run_attempt: Number(process.env.GITHUB_RUN_ATTEMPT || 1),
              workflow_sha: process.env.CI_WORKFLOW_SHA,
              digest_sha256: ''
            };
            if (!process.env.BRANCH_PROTECTION_TOKEN) {
              core.warning('BRANCH_PROTECTION_TOKEN is unavailable; branch protection proof will fail closed');
            } else {
              try {
                const adminGithub = github.getOctokit(process.env.BRANCH_PROTECTION_TOKEN);
                const response = await adminGithub.rest.repos.getBranchProtection({owner: context.repo.owner, repo: context.repo.repo, branch: baseRef});
                const data = response.data;
                const reviews = data.required_pull_request_reviews || {};
                const checks = data.required_status_checks || {};
                protection = {
                  ...protection,
                  exists: true,
                  strict: Boolean(checks.strict),
                  required_checks: [...(checks.contexts || [])].sort(),
                  enforce_admins: Boolean(data.enforce_admins?.enabled),
                  required_reviews: Number(reviews.required_approving_review_count || 0),
                  dismiss_stale_reviews: Boolean(reviews.dismiss_stale_reviews),
                  require_last_push_approval: Boolean(reviews.require_last_push_approval),
                  linear_history: Boolean(data.required_linear_history?.enabled),
                  allow_force_pushes: Boolean(data.allow_force_pushes?.enabled),
                  allow_deletions: Boolean(data.allow_deletions?.enabled),
                };
              } catch (error) {
                core.warning(`branch protection API snapshot unavailable: ${error.message}`);
              }
            }
            const protectionPayload = {...protection, digest_sha256: ''};
            protection.digest_sha256 = crypto.createHash('sha256').update(JSON.stringify(protectionPayload)).digest('hex');
            let approvals = [];
            if (pull) {
              try {
                const response = await github.rest.pulls.listReviews({owner: context.repo.owner, repo: context.repo.repo, pull_number: pull.number, per_page: 100});
                const seen = new Set();
                approvals = response.data.filter(review => review.state === 'APPROVED' && review.user && !seen.has(review.user.login) && seen.add(review.user.login)).map(review => ({actor: review.user.login, state: review.state}));
              } catch (_) {}
            }
            let artifacts = [];
            try {
              const response = await github.rest.actions.listWorkflowRunArtifacts({owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId, per_page: 100});
              artifacts = response.data.artifacts.map(artifact => ({id: artifact.id, name: artifact.name, size_bytes: artifact.size_in_bytes, expired: artifact.expired}));
            } catch (_) {}
            const eventRef = context.ref;
            const checkoutRef = headSha;
            const contextData = {
              repository: `${context.repo.owner}/${context.repo.repo}`, event: context.eventName, ref: eventRef, event_ref: eventRef, checkout_ref: checkoutRef,
              base_ref: baseRef, base_sha: baseSha, head_sha: headSha, workflow_sha: process.env.CI_WORKFLOW_SHA,
              pr_number: pull ? pull.number : 0, run_id: context.runId, run_attempt: Number(process.env.GITHUB_RUN_ATTEMPT || 1),
              actor: context.actor, builder: context.actor, guardian: approvals[0]?.actor || '', approver: approvals[1]?.actor || '', gate: 'CI policy',
              branch_protected: protection.exists, branch_protection: protection, scope_decision: 'passed', fixture_status: 'verified', source_status: 'verified', semantic_status: 'verified',
              provenance_status: 'unavailable', artifacts_status: artifacts.length ? 'verified' : 'missing', approvals_status: approvals.length >= 2 ? 'verified' : 'missing',
              write_effect: 'none', no_write_outside_generated: true, approvals, artifacts, fixture_paths: ['examples/billing/main.gooo'],
              cache: {cache_key: 'none', outcome: 'not_run', status: 'not_applicable'}, diagnostic_ids: [], repair_ids: [], predecessors: []
            };
            fs.writeFileSync('ci-proof-context.json', JSON.stringify(contextData));
      - name: Build deterministic proof and append receipt
        run: |
          go run ./scripts/ci-proof \
            --root . --governance .github/ci-governance.json --evidence ci-evidence-input/ci-evidence.json \
            --jobs ci-final-jobs.json --context ci-proof-context.json --generated ci-generated-proof \
            --output ci-proof.json --receipt provenance-receipt.jsonl
      - name: Verify promotion proof fail closed
        run: go run ./scripts/ci-proof --verify ci-proof.json --governance .github/ci-governance.json --receipt provenance-receipt.jsonl --require-pass
      - name: Upload proof and provenance receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-proof.json
            provenance-receipt.jsonl
            ci-jobs.json
          if-no-files-found: error
          retention-days: 14
