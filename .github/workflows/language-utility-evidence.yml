name: Language utility evidence

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  actions: read
  contents: read

concurrency:
  group: language-utility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    name: language-utility-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.0
          cache: false
      - name: Measure fixed language utility portfolio
        run: bash scripts/language-utility-evidence/main.sh
      - name: Upload exact-head utility evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: language-utility-evidence-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/language-utility-evidence
          if-no-files-found: warn
          retention-days: 30
