name: Self-improvement cycle envelope

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [dev, main]

concurrency:
  group: self-improvement-cycle-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  envelope:
    name: Self-improvement cycle envelope
    if: >-
      github.event.workflow_run.event == 'push' &&
      (github.event.workflow_run.head_branch == 'dev' ||
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    env:
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      CI_RUN_ID: ${{ github.event.workflow_run.id }}
      CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          cache: false

      - name: Download canonical cycle artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: self-improvement-*-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/cycle/input
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ env.CI_RUN_ID }}

      - name: Download canonical source metrics
        uses: actions/download-artifact@v7
        with:
          name: source-line-metrics-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/cycle/source
          github-token: ${{ github.token }}
          run-id: ${{ env.CI_RUN_ID }}

      - name: Bind and replay the complete cycle
        shell: bash
        run: |
          set -euo pipefail
          input="$RUNNER_TEMP/cycle/input"
          output="$RUNNER_TEMP/cycle/output"
          mkdir -p "$output"
          go run ./scripts/self-improvement-contract \
            -contract examples/self-improvement/main.gooo \
            -commit "$HEAD_SHA" -output "$output/contract.json" -check
          for pass in first second; do
            go run ./scripts/self-improvement-cycle \
              -head-sha "$HEAD_SHA" -branch "$HEAD_BRANCH" \
              -ci-run-id "$CI_RUN_ID" -ci-conclusion "$CI_CONCLUSION" \
              -metrics "$RUNNER_TEMP/cycle/source/source-metrics.json" \
              -plan "$input/self-improvement-plan.json" \
              -execution "$input/self-improvement-execution.json" \
              -receipts "$input/self-improvement-receipts.json" \
              -provenance "$input/self-improvement-provenance.json" \
              -contract "$output/contract.json" -output "$output/$pass.json" -check
          done
          cmp "$output/first.json" "$output/second.json"

      - name: Upload exact-head cycle envelope
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: self-improvement-cycle-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/cycle/output/first.json
          if-no-files-found: error
