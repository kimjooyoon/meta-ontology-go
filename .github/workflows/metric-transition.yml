name: Metric transition ledger

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  metric-transition:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.head_branch == 'dev' || github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: go1.27.0
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      CI_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.0
      - name: Download exact meta artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: '*-${{ github.event.workflow_run.head_sha }}'
          path: ${{ runner.temp }}/meta-inputs
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Bind metric state to verified transformation effect
        shell: bash
        run: |
          set -euo pipefail
          inputs="$RUNNER_TEMP/meta-inputs"
          effect="$RUNNER_TEMP/metric-transition/effect"
          first="$RUNNER_TEMP/metric-transition/first"
          replay="$RUNNER_TEMP/metric-transition/replay"
          mkdir -p "$effect" "$first" "$replay"
          effect_common=(
            -root "$GITHUB_WORKSPACE"
            -metrics "$inputs/source-line-metrics-$HEAD_SHA/source-metrics.json"
            -plan "$inputs/self-improvement-generation-$HEAD_SHA/self-improvement-plan.json"
            -execution "$inputs/self-improvement-execution-$HEAD_SHA/self-improvement-execution.json"
            -receipts "$inputs/self-improvement-receipts-$HEAD_SHA/self-improvement-receipts.json"
            -provenance "$inputs/self-improvement-provenance-$HEAD_SHA/self-improvement-provenance.json"
            -expected-sha "$HEAD_SHA"
          )
          go run ./scripts/transformation-effect "${effect_common[@]}" \
            -output "$effect/ledger.json" \
            -generated-receipts "$effect/receipts.json" \
            -executed-provenance "$effect/provenance.json" \
            -patch "$effect/patch.json"
          transition_common=(
            -metrics "$inputs/source-line-metrics-$HEAD_SHA/source-metrics.json"
            -effect "$effect/ledger.json"
            -receipts "$effect/receipts.json"
            -provenance "$effect/provenance.json"
            -patch "$effect/patch.json"
            -expected-sha "$HEAD_SHA"
            -ci-run-id "$CI_RUN_ID"
          )
          for target in "$first" "$replay"; do
            go run ./scripts/metric-transition "${transition_common[@]}" \
              -output-state "$target/state.json" \
              -output-ledger "$target/ledger.json"
          done
          cmp -s "$first/state.json" "$replay/state.json"
          cmp -s "$first/ledger.json" "$replay/ledger.json"
          go run ./scripts/metric-transition "${transition_common[@]}" \
            -verify-state "$first/state.json" \
            -verify-ledger "$first/ledger.json"
      - name: Upload exact-head metric transition
        uses: actions/upload-artifact@v7
        with:
          name: metric-transition-${{ github.event.workflow_run.head_sha }}
          path: |
            ${{ runner.temp }}/metric-transition/first
            ${{ runner.temp }}/metric-transition/effect
          if-no-files-found: error
          retention-days: 30
