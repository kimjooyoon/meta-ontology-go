name: Self-improvement separate execution grant

on:
  pull_request:
    branches: [dev]
    paths:
      - '.github/agent-scope-table.md'
      - '.github/ci-governance.json'
      - '.github/workflows/self-improvement-execution-grant.yml'
      - '.github/workflows/transformation-effect.yml'
      - 'examples/language-syntax-roundtrip/corpus.json'
      - 'examples/self-improvement-execution-grant/**'
      - 'internal/meta/languagereadiness/languagesyntax/conformance/evaluate_test.go'
      - 'internal/meta/languagereadiness/languagesyntax/model.go'
      - 'internal/meta/languagereadiness/languagesyntax/registry.go'
      - 'internal/meta/selfimprovementexecutiongrant/**'
      - 'internal/verify/scope_gooo_self_improvement_execution_grant_v26.go'
      - 'internal/verify/scope_gooo_self_improvement_execution_grant_v26_1.go'
      - 'scripts/self-improvement-execution-grant/**'
  workflow_dispatch:
    inputs:
      source_workflow_name:
        description: Exact source workflow name
        required: true
        type: string
      source_workflow_path:
        description: Exact source workflow path
        required: true
        type: string
      source_repository:
        description: Exact source repository
        required: true
        type: string
      source_event:
        description: Exact source workflow event
        required: true
        type: string
      source_ref:
        description: Exact source ref
        required: true
        type: string
      source_head_sha:
        description: Exact source head SHA
        required: true
        type: string
      source_run_id:
        description: Exact source workflow run ID
        required: true
        type: string
      source_run_attempt:
        description: Exact source workflow run attempt
        required: true
        type: string
      source_artifact_name:
        description: Exact v25 contract artifact name
        required: true
        type: string
      source_artifact_id:
        description: Exact v25 contract artifact ID
        required: true
        type: string
      source_artifact_archive_digest:
        description: API archive digest for the exact v25 contract artifact
        required: true
        type: string
      source_artifact_observed_digest:
        description: Observed archive digest for the exact v25 contract artifact
        required: true
        type: string
      source_receipt_digest:
        description: Embedded v25 verification receipt digest
        required: true
        type: string
      target_workflow_name:
        description: Exact target workflow name
        required: true
        type: string
      target_workflow_path:
        description: Exact target workflow path
        required: true
        type: string
      dispatch_ref:
        description: Exact dispatch ref
        required: true
        type: string
      dispatch_mode:
        description: Exact dispatch mode
        required: true
        type: string
      continuation_request_digest:
        description: Exact CI continuation request digest
        required: true
        type: string
      decision:
        description: Optional explicit human grant decision; empty means automatic request only
        required: false
        type: string

permissions:
  actions: read
  contents: read

jobs:
  execution-grant:
    runs-on: ubuntu-latest
    env:
      SUBJECT_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.source_head_sha || github.event.pull_request.head.sha }}
      SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || '' }}
      SOURCE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || '' }}
      SOURCE_RUN_ATTEMPT: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_attempt || '' }}
      SOURCE_WORKFLOW_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.source_workflow_name || '' }}
      SOURCE_WORKFLOW_PATH: ${{ github.event_name == 'workflow_dispatch' && inputs.source_workflow_path || '' }}
      SOURCE_REPOSITORY: ${{ github.event_name == 'workflow_dispatch' && inputs.source_repository || '' }}
      SOURCE_EVENT: ${{ github.event_name == 'workflow_dispatch' && inputs.source_event || '' }}
      SOURCE_ARTIFACT_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.source_artifact_name || '' }}
      SOURCE_ARTIFACT_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.source_artifact_id || '' }}
      SOURCE_ARTIFACT_ARCHIVE_DIGEST: ${{ github.event_name == 'workflow_dispatch' && inputs.source_artifact_archive_digest || '' }}
      SOURCE_ARTIFACT_OBSERVED_DIGEST: ${{ github.event_name == 'workflow_dispatch' && inputs.source_artifact_observed_digest || '' }}
      SOURCE_RECEIPT_DIGEST: ${{ github.event_name == 'workflow_dispatch' && inputs.source_receipt_digest || '' }}
      TARGET_WORKFLOW_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.target_workflow_name || '' }}
      TARGET_WORKFLOW_PATH: ${{ github.event_name == 'workflow_dispatch' && inputs.target_workflow_path || '' }}
      DISPATCH_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.dispatch_ref || '' }}
      DISPATCH_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.dispatch_mode || '' }}
      CONTINUATION_REQUEST_DIGEST: ${{ github.event_name == 'workflow_dispatch' && inputs.continuation_request_digest || '' }}
      DISPATCH_DECISION: ${{ github.event_name == 'workflow_dispatch' && inputs.decision || '' }}
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly

    steps:
      - name: Check out the exact v25 subject
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Go 1.27
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          cache: false

      - name: Bind exact subject and toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = "go1.27.0"
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          test "$(git status --porcelain)" = ""

      - name: Run focused execution-grant unit tests
        shell: bash
        run: go test ./internal/meta/selfimprovementexecutiongrant

      - name: Locate and verify exact v25 source artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/self-improvement-execution-grant"
          source_dir="$work/source"
          output_dir="$work/output"
          mkdir -p "$source_dir" "$output_dir"
          artifact_id=0
          artifact_run_id=0
          artifact_run_attempt=0
          artifact_name="$SOURCE_ARTIFACT_NAME"
          declared_digest="$SOURCE_ARTIFACT_ARCHIVE_DIGEST"
          actual_digest=""
          artifact_expired=true
          artifact_expiry_known=false
          artifact_retrieved=false
          retrieval_error=""
          v25_contract=""
          v24_request=""
          v24_resolution=""
          v24_verification=""
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            test "$SOURCE_REPOSITORY" = "$GITHUB_REPOSITORY"
            test "$SOURCE_WORKFLOW_NAME" = "Self-improvement candidate execution contract"
            test "$SOURCE_WORKFLOW_PATH" = ".github/workflows/self-improvement-execution-contract.yml"
            test "$SOURCE_EVENT" = "workflow_dispatch"
            test "$SOURCE_REF" = "refs/heads/dev"
            test "$DISPATCH_REF" = "dev"
            test "$DISPATCH_MODE" = "workflow_dispatch"
            test "$TARGET_WORKFLOW_NAME" = "Self-improvement separate execution grant"
            test "$TARGET_WORKFLOW_PATH" = ".github/workflows/self-improvement-execution-grant.yml"
            test "$CONTINUATION_REQUEST_DIGEST" = "$SOURCE_RECEIPT_DIGEST"
            test "$SOURCE_ARTIFACT_NAME" = "self-improvement-execution-contract-$SUBJECT_SHA"
            [[ "$SUBJECT_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "$SOURCE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
            [[ "$SOURCE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > "$work/source-run.json"
            jq -e --argjson id "$SOURCE_RUN_ID" --argjson attempt "$SOURCE_RUN_ATTEMPT" \
              --arg name "$SOURCE_WORKFLOW_NAME" --arg path "$SOURCE_WORKFLOW_PATH" \
              --arg repository "$GITHUB_REPOSITORY" --arg sha "$SUBJECT_SHA" \
              '.id == $id and .run_attempt == $attempt and .name == $name and .path == $path and
               .event == "workflow_dispatch" and .head_branch == "dev" and .head_sha == $sha and
               .head_repository.full_name == $repository and .repository.full_name == $repository' \
              "$work/source-run.json" >/dev/null
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" > "$work/artifacts.json"
            test "$(jq -r --arg name "$artifact_name" '[.artifacts[] | select(.name == $name)] | length' "$work/artifacts.json")" = 1
            artifact_id="$(jq -r --arg name "$artifact_name" '[.artifacts[] | select(.name == $name)][0].id' "$work/artifacts.json")"
            api_digest="$(jq -r --arg name "$artifact_name" '[.artifacts[] | select(.name == $name)][0].digest' "$work/artifacts.json")"
            test "$artifact_id" = "$SOURCE_ARTIFACT_ID"
            test "$api_digest" = "$SOURCE_ARTIFACT_ARCHIVE_DIGEST"
            test "$(jq -r --arg name "$artifact_name" '[.artifacts[] | select(.name == $name)][0].expired' "$work/artifacts.json")" = false
            artifact_run_id="$SOURCE_RUN_ID"
            artifact_run_attempt="$SOURCE_RUN_ATTEMPT"
            artifact_expired=false
            artifact_expiry_known=true
            archive="$work/v25-contract.zip"
            curl --fail --location --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" -o "$archive"
            actual_digest="sha256:$(sha256sum "$archive" | awk '{print $1}')"
            test "$actual_digest" = "$SOURCE_ARTIFACT_OBSERVED_DIGEST"
            test "$actual_digest" = "$SOURCE_ARTIFACT_ARCHIVE_DIGEST"
            unzip -q "$archive" -d "$source_dir"
            while IFS= read -r file; do
              if jq -e '.schema == "gooo/self-improvement-execution-contract/v1"' "$file" >/dev/null 2>&1; then v25_contract="$file"; break; fi
            done < <(find "$source_dir" -type f -name '*.json' -print | sort)
            v24_request="$source_dir/source-authorization-request.json"
            v24_resolution="$source_dir/source-authorization-resolution.json"
            v24_verification="$source_dir/source-authorization-verification.json"
            continuation_verification="$source_dir/source-continuation-verification.json"
            test -f "$v24_request"
            test -f "$v24_resolution"
            test -f "$v24_verification"
            test -f "$continuation_verification"
            jq -e --arg sha "$SUBJECT_SHA" \
              '.schema == "gooo/self-improvement-candidate-authorization-request/v1" and .candidate.subject_sha == $sha and .live_authorized == 0 and .repository_writes == 0 and .local_test_executions == 0' "$v24_request" >/dev/null
            jq -e '.schema == "gooo/self-improvement-candidate-authorization-resolution/v1" and .live_authorized == 0 and .repository_writes == 0 and .local_test_executions == 0' "$v24_resolution" >/dev/null
            jq -e '.schema == "gooo/self-improvement-candidate-authorization-verification/v1" and .decision_verified == true and .live_authorized == 0 and .live_state == "UNKNOWN" and .repository_writes == 0 and .local_test_executions == 0 and (.digest | startswith("sha256:"))' "$v24_verification" >/dev/null
            jq -e '.schema == "gooo/self-improvement-ci-continuation-verification/v1" and .verified == true and .independent_replay_comparisons == 1 and .execution_authorized == false and .live_execution_count == 0 and .grant_consumed_uses == 0 and .repository_writes == 0 and .local_test_executions == 0' "$continuation_verification" >/dev/null
            if [ -n "$v25_contract" ]; then
              jq -e --arg receipt "$SOURCE_RECEIPT_DIGEST" --arg sha "$SUBJECT_SHA" \
                '.schema == "gooo/self-improvement-execution-contract/v1" and
                 .verification.digest == $receipt and .execution_input.subject_sha == $sha and
                 .verification.verified == true and .execution_authorized == false and
                 .execution_grant_required == true and .max_executions == 1 and
                 .repository_writes_allowed == false and .metrics.live_execution_count == 0 and
                 .metrics.execution_grants == 0 and .metrics.repository_writes == 0 and
                 .metrics.local_test_executions == 0' "$v25_contract" >/dev/null
              artifact_retrieved=true
            else
              retrieval_error="SOURCE_ARTIFACT_RETRIEVAL_FAILED"
            fi
          else
            artifact_name=""
            declared_digest=""
          fi
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson workflow_run_id "${artifact_run_id:-0}" \
            --argjson workflow_run_attempt "${artifact_run_attempt:-0}" \
            --argjson artifact_id "${artifact_id:-0}" \
            --arg artifact_digest "$declared_digest" \
            --arg observed_artifact_digest "$actual_digest" \
            --argjson artifact_expired "$artifact_expired" \
            --argjson artifact_expiry_known "$artifact_expiry_known" \
            --argjson artifact_retrieved "$artifact_retrieved" \
            --arg artifact_retrieval_error "$retrieval_error" \
            '{repository:$repository,workflow_run_id:$workflow_run_id,workflow_run_attempt:$workflow_run_attempt,artifact_id:$artifact_id,artifact_digest:$artifact_digest,observed_artifact_digest:$observed_artifact_digest,artifact_expired:$artifact_expired,artifact_expiry_known:$artifact_expiry_known,artifact_retrieved:$artifact_retrieved} + (if $artifact_retrieval_error == "" then {} else {artifact_retrieval_error:$artifact_retrieval_error} end)' \
            > "$work/source.json"
          source_provenance="$work/source-provenance.json"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            jq -n \
              --arg schema "gooo/self-improvement-execution-grant-source-artifact/v1" \
              --arg workflow_name "$SOURCE_WORKFLOW_NAME" --arg workflow_path "$SOURCE_WORKFLOW_PATH" \
              --arg repository "$SOURCE_REPOSITORY" --arg event "$SOURCE_EVENT" --arg ref "$SOURCE_REF" \
              --arg head_sha "$SUBJECT_SHA" --argjson workflow_run_id "$artifact_run_id" \
              --argjson workflow_run_attempt "$artifact_run_attempt" --arg artifact_name "$artifact_name" \
              --argjson artifact_id "$artifact_id" --arg api_digest "$declared_digest" \
              --arg observed_digest "$actual_digest" --arg embedded_digest "$SOURCE_RECEIPT_DIGEST" \
              --argjson artifact_expired "$artifact_expired" --argjson artifact_expiry_known "$artifact_expiry_known" \
              --argjson artifact_retrieved "$artifact_retrieved" --arg retrieval_error "$retrieval_error" \
              '{schema:$schema,workflow_name:$workflow_name,workflow_path:$workflow_path,repository:$repository,event:$event,ref:$ref,head_sha:$head_sha,workflow_run_id:$workflow_run_id,workflow_run_attempt:$workflow_run_attempt,artifact_name:$artifact_name,artifact_id:$artifact_id,api_archive_digest:$api_digest,observed_archive_digest:$observed_digest,embedded_verification_digest:$embedded_digest,artifact_expired:$artifact_expired,artifact_expiry_known:$artifact_expiry_known,artifact_retrieved:$artifact_retrieved} + (if $retrieval_error == "" then {} else {artifact_retrieval_error:$retrieval_error} end)' \
              > "$source_provenance"
          else
            : > "$source_provenance"
          fi
          echo "V25_CONTRACT=$v25_contract" >> "$GITHUB_ENV"
          echo "V24_REQUEST=$v24_request" >> "$GITHUB_ENV"
          echo "V24_RESOLUTION=$v24_resolution" >> "$GITHUB_ENV"
          echo "V24_VERIFICATION=$v24_verification" >> "$GITHUB_ENV"
          echo "SOURCE_PROVENANCE=$source_provenance" >> "$GITHUB_ENV"
          echo "GRANT_WORK=$work" >> "$GITHUB_ENV"
          echo "GRANT_OUTPUT=$output_dir" >> "$GITHUB_ENV"

      - name: Prepare pinned exact canonical executor fixture inputs
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/self-improvement-execution-grant/pinned-canonical"
          v24_dir="$work/v24"
          v25_dir="$work/v25"
          output_dir="$work/output"
          mkdir -p "$v24_dir" "$v25_dir" "$output_dir"
          subject_sha="9088b24e5f5815c51b4bcf2d99cf19453c9eeff0"
          v24_id=9959553042
          v24_digest="sha256:78896c1277aff87f3feb2e33b32b589b1f4db3b7dd1403f7e7e15c0c56ff24ae"
          v25_id=9959571804
          v25_digest="sha256:05056447a43ebea59867e7bee2184ff412ef3ca80d46d2d35a28d9f835b35f7d"
          v25_name="self-improvement-execution-contract-$subject_sha"
          download_artifact() {
            label="$1"
            artifact_id="$2"
            expected_digest="$3"
            destination="$4"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" > "$work/$label-artifact.json"
            jq -e --argjson id "$artifact_id" --arg digest "$expected_digest" \
              '.id == $id and .digest == $digest and .expired == false' "$work/$label-artifact.json" >/dev/null
            archive="$work/$label.zip"
            curl --fail --location --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" -o "$archive"
            observed_digest="sha256:$(sha256sum "$archive" | awk '{print $1}')"
            test "$observed_digest" = "$expected_digest"
            unzip -q "$archive" -d "$destination"
          }
          download_artifact v24 "$v24_id" "$v24_digest" "$v24_dir"
          download_artifact v25 "$v25_id" "$v25_digest" "$v25_dir"
          v24_request="$(find "$v24_dir" -type f -name request.json -print -quit)"
          v24_resolution="$(find "$v24_dir" -type f -name resolution.json -print -quit)"
          v24_verification="$(find "$v24_dir" -type f -name verification.json -print -quit)"
          v25_contract="$(find "$v25_dir" -type f -name '*.json' -print | while read -r file; do jq -e '.schema == "gooo/self-improvement-execution-contract/v1"' "$file" >/dev/null 2>&1 && echo "$file" && break; done)"
          test -n "$v24_request"
          test -n "$v24_resolution"
          test -n "$v24_verification"
          test -n "$v25_contract"
          jq -e --arg sha "$subject_sha" \
            '.schema == "gooo/self-improvement-candidate-authorization-request/v1" and .digest == "sha256:a133df0a141ba9a9b7e928ca7c22ce0c00fbc485c67e21df1c940e5fd0b2f198" and .candidate.subject_sha == $sha and .candidate.execution_input_digest != null and .live_authorized == 0 and .live_state == "UNKNOWN" and .repository_writes == 0 and .local_test_executions == 0' "$v24_request" >/dev/null
          jq -e --arg sha "$subject_sha" \
            '.schema == "gooo/self-improvement-candidate-authorization-resolution/v1" and .digest == "sha256:0de17f47a04e82802e7743ac678f7fa381dd48d97f5271d3f9dfdfd5c2fc9d16" and .candidate.subject_sha == $sha and .live_authorized == 0 and .live_state == "UNKNOWN" and .repository_writes == 0 and .local_test_executions == 0' "$v24_resolution" >/dev/null
          jq -e \
            '.schema == "gooo/self-improvement-candidate-authorization-verification/v1" and .request_digest == "sha256:a133df0a141ba9a9b7e928ca7c22ce0c00fbc485c67e21df1c940e5fd0b2f198" and .resolution_digest == "sha256:0de17f47a04e82802e7743ac678f7fa381dd48d97f5271d3f9dfdfd5c2fc9d16" and .digest == "sha256:9f3cd581cea3ba8276f243d6815e5996d3c4a57af457d9736a863ab19c93ecd7" and .decision_verified == true and .live_authorized == 0 and .live_state == "UNKNOWN" and .repository_writes == 0 and .local_test_executions == 0' "$v24_verification" >/dev/null
          v25_run_id="$(jq -r '.workflow_run.id' "$work/v25-artifact.json")"
          v25_run_attempt="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$v25_run_id" --jq '.run_attempt')"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$v25_run_id" > "$work/v25-run.json"
          jq -e --argjson id "$v25_run_id" --argjson attempt "$v25_run_attempt" --arg name "Self-improvement candidate execution contract" --arg path ".github/workflows/self-improvement-execution-contract.yml" --arg sha "$subject_sha" \
            '.id == $id and .run_attempt == $attempt and .name == $name and .path == $path and .event == "workflow_dispatch" and .head_branch == "dev" and .head_sha == $sha and .conclusion == "success"' "$work/v25-run.json" >/dev/null
          jq -e --arg sha "$subject_sha" \
            '.schema == "gooo/self-improvement-execution-contract/v1" and .verification.digest == "sha256:1865e8c83ec51e74fd8b3c228ddcc18acdf7c5ff1bb6451ce64219b723109542" and .execution_input.subject_sha == $sha and .execution_authorized == false and .execution_grant_required == true and .max_executions == 1 and .repository_writes_allowed == false and .metrics.live_execution_count == 0 and .metrics.execution_grants == 0 and .metrics.repository_writes == 0 and .metrics.local_test_executions == 0' "$v25_contract" >/dev/null
          jq -e --arg name "$v25_name" --arg sha "$subject_sha" --argjson run "$v25_run_id" \
            '.name == $name and .workflow_run.id == $run and .workflow_run.head_sha == $sha and .workflow_run.head_branch == "dev"' "$work/v25-artifact.json" >/dev/null
          v25_artifact_name="$(jq -r '.name' "$work/v25-artifact.json")"
          v25_api_digest="$(jq -r '.digest' "$work/v25-artifact.json")"
          v25_observed_digest="sha256:$(sha256sum "$work/v25.zip" | awk '{print $1}')"
          test "$v25_observed_digest" = "$v25_api_digest"
          v25_expired="$(jq -r '.expired' "$work/v25-artifact.json")"
          source_provenance="$work/source-provenance.json"
          jq -n \
            --arg schema "gooo/self-improvement-execution-grant-source-artifact/v1" \
            --arg workflow "Self-improvement candidate execution contract" \
            --arg path ".github/workflows/self-improvement-execution-contract.yml" \
            --arg repository "$GITHUB_REPOSITORY" --arg event "workflow_dispatch" --arg ref "refs/heads/dev" \
            --arg sha "$subject_sha" --argjson run_id "$v25_run_id" --argjson run_attempt "$v25_run_attempt" \
            --arg artifact "$v25_artifact_name" --argjson artifact_id "$v25_id" \
            --arg api_digest "$v25_api_digest" --arg observed_digest "$v25_observed_digest" \
            --arg embedded_digest "$(jq -r '.verification.digest' "$v25_contract")" --argjson expired "$v25_expired" \
            '{schema:$schema,workflow_name:$workflow,workflow_path:$path,repository:$repository,event:$event,ref:$ref,head_sha:$sha,workflow_run_id:$run_id,workflow_run_attempt:$run_attempt,artifact_name:$artifact,artifact_id:$artifact_id,api_archive_digest:$api_digest,observed_archive_digest:$observed_digest,embedded_verification_digest:$embedded_digest,artifact_expired:$expired,artifact_expiry_known:true,artifact_retrieved:true}' \
            > "$source_provenance"
          echo "CANONICAL_V24_REQUEST=$v24_request" >> "$GITHUB_ENV"
          echo "CANONICAL_V24_RESOLUTION=$v24_resolution" >> "$GITHUB_ENV"
          echo "CANONICAL_V24_VERIFICATION=$v24_verification" >> "$GITHUB_ENV"
          echo "CANONICAL_V25_CONTRACT=$v25_contract" >> "$GITHUB_ENV"
          echo "CANONICAL_SOURCE_PROVENANCE=$source_provenance" >> "$GITHUB_ENV"
          echo "CANONICAL_OUTPUT=$output_dir" >> "$GITHUB_ENV"

      - name: Emit and replay nine v26 canonical grant cases
        shell: bash
        run: |
          set -euo pipefail
          go run ./scripts/self-improvement-execution-grant \
            -mode cases \
            -contract examples/self-improvement-execution-grant/grant.gooo \
            -output "$GRANT_OUTPUT/canonical-cases.json" \
            -check
          jq -e '
            .schema == "gooo/self-improvement-execution-grant-cases/v1" and
            .case_denominator == 9 and
            .counts == {CLOSED:3,UNKNOWN:3,REFUTED:3} and
            .structural_separate_grant_edges_before == 0 and
            .structural_separate_grant_edges_after == 1 and
            .source_artifact_bound_before == 0 and .source_artifact_bound_after == 1 and
            .source_artifact_bound == 1 and
            .source_artifact_expired_misclassified_before == 1 and .source_artifact_expired_misclassified_after == 0 and
            .source_artifact_expired_misclassified == 0 and
            .exact_source_digest_bound_before == 0 and .exact_source_digest_bound_after == 1 and
            .exact_source_digest_bound == 1 and
            (.counterexample_artifact_ids | index(9955461668)) != null and
            .closed_cases == 3 and .unknown_cases == 3 and .refuted_cases == 3 and
            .replay_equal and .live_grant_requests == 0 and .live_grants == 0 and
            .live_execution_count == 0 and .canonical_granted_cases == 2 and
            .canonical_execution_count == 0 and .six_field_unknowns == 3 and
            .refuted_contradictions == 3 and .grant_remaining_uses == 2 and
            .grant_consumed_uses == 0 and .repository_writes == 0 and
            .local_test_executions == 0 and .fallback_accepted == 0 and
            .independent_replay_comparisons == 1 and .artifact_files == 9 and
            .artifact_types == 3 and .performance_improvement == "UNKNOWN" and
            ([.cases[] | select(.pass == false)] | length) == 0' \
            "$GRANT_OUTPUT/canonical-cases.json" >/dev/null

      - name: Emit live grant request or explicit grant declaration
        shell: bash
        run: |
          set -euo pipefail
          args=(-mode live -contract examples/self-improvement-execution-grant/grant.gooo -source "$GRANT_WORK/source.json" -output "$GRANT_OUTPUT/live-grant.json" -check)
          if [ -n "$V24_REQUEST" ] && [ -n "$V24_RESOLUTION" ]; then
            args+=(-v24-request "$V24_REQUEST" -v24-resolution "$V24_RESOLUTION")
          fi
          if [ -n "$V25_CONTRACT" ]; then args+=(-v25-contract "$V25_CONTRACT"); fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ -n "$DISPATCH_DECISION" ]; then
            args+=(-decision "$DISPATCH_DECISION" -decision-source workflow_dispatch -actor "$GITHUB_ACTOR" -repository "$GITHUB_REPOSITORY" -event "$GITHUB_EVENT_NAME" -workflow-run-id "$GITHUB_RUN_ID" -workflow-run-attempt "$GITHUB_RUN_ATTEMPT")
          fi
          go run ./scripts/self-improvement-execution-grant "${args[@]}"
          if [ -z "$DISPATCH_DECISION" ]; then
            jq --arg event "$GITHUB_EVENT_NAME" -e '
              .schema == "gooo/self-improvement-execution-grant/v1" and
              ((.resolution.unknown | keys | sort) == ["blocked_by","next_operation","reason","stage","step","unknown_class"]) and
              .metrics.live_grant_requests == 1 and .metrics.live_grants == 0 and
              .metrics.live_execution_count == 0 and .metrics.grant_consumed_uses == 0 and
              .metrics.repository_writes == 0 and .metrics.local_test_executions == 0 and
              .metrics.fallback_accepted == 0 and
              .metrics.source_artifact_bound_before == 0 and .metrics.source_artifact_expired_misclassified_before == 1 and
              .metrics.exact_source_digest_bound_before == 0 and .metrics.live_grants_before == 0 and
              .metrics.execution_count_before == 0 and .metrics.repository_writes_before == 0 and
              .metrics.source_artifact_expired_misclassified_after == 0 and .metrics.live_grants_after == 0 and
              .metrics.execution_count_after == 0 and .metrics.repository_writes_after == 0 and .verification.verified and
              (if .request.source_artifact.artifact_retrieval_error then
                .resolution.decision == "UNKNOWN" and .resolution.resolution == "LOWER_RESOLUTION" and
                .resolution.reason == "SOURCE_ARTIFACT_RETRIEVAL_FAILED" and
                .metrics.source_artifact_bound_after == 0 and .metrics.exact_source_digest_bound_after == 0 and
                .metrics.source_artifact_bound == 0 and .metrics.exact_source_digest_bound == 0 and
                .resolution.unknown.blocked_by == "source_artifact_retrieval" and
                (.resolution.obligations | index("explicit_execution_grant_decision")) != null and
                (.resolution.obligations | index("source_artifact_retrieval")) != null
               elif ($event == "workflow_run" or $event == "workflow_dispatch") then
                .request.source_artifact.artifact_retrieved and .request.source_artifact.artifact_expired == false and
                .request.source_artifact.artifact_digest == .request.source_artifact.observed_artifact_digest and
                .metrics.source_artifact_bound_after == 1 and .metrics.exact_source_digest_bound_after == 1 and
                .metrics.source_artifact_bound == 1 and .metrics.exact_source_digest_bound == 1 and
                .resolution.decision == "UNKNOWN" and .resolution.resolution == "LOWER_RESOLUTION" and
                .resolution.reason == "MISSING_EXPLICIT_EXECUTION_GRANT_DECISION" and
                .resolution.unknown.blocked_by == "explicit_execution_grant_decision"
               else
                .metrics.source_artifact_bound_after == 0 and .metrics.exact_source_digest_bound_after == 0 and
                .metrics.source_artifact_bound == 0 and .metrics.exact_source_digest_bound == 0 and
                .resolution.decision == "UNKNOWN" and .resolution.resolution == "LOWER_RESOLUTION" and
                .resolution.reason == "MISSING_EXPLICIT_EXECUTION_GRANT_DECISION" and
                .resolution.unknown.blocked_by == "explicit_execution_grant_decision"
               end)' \
              "$GRANT_OUTPUT/live-grant.json" >/dev/null
          fi
          jq -r '"live grant: \(.resolution.decision)/\(.resolution.resolution)/\(.resolution.reason), grant_allows_execution=\(.resolution.grant_allows_execution), remaining_uses=\(.resolution.remaining_uses), consumed_uses=\(.resolution.consumed_uses), execution_count=\(.resolution.execution_count)"' "$GRANT_OUTPUT/live-grant.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Materialize exact canonical executor grant fixture
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          v24_request="${CANONICAL_V24_REQUEST:-$V24_REQUEST}"
          v24_resolution="${CANONICAL_V24_RESOLUTION:-$V24_RESOLUTION}"
          v24_verification="${CANONICAL_V24_VERIFICATION:-$V24_VERIFICATION}"
          v25_contract="${CANONICAL_V25_CONTRACT:-$V25_CONTRACT}"
          source_provenance="${CANONICAL_SOURCE_PROVENANCE:-$SOURCE_PROVENANCE}"
          output_dir="${CANONICAL_OUTPUT:-$GRANT_OUTPUT}"
          test -n "$v24_request" -a -n "$v24_resolution" -a -n "$v24_verification" -a -n "$v25_contract" -a -n "$source_provenance"
          go run ./scripts/self-improvement-execution-grant \
            -mode canonical-fixture \
            -contract examples/self-improvement-execution-grant/grant.gooo \
            -v24-request "$v24_request" \
            -v24-resolution "$v24_resolution" \
            -v24-verification "$v24_verification" \
            -v25-contract "$v25_contract" \
            -source-provenance "$source_provenance" \
            -output-dir "$output_dir" \
            -check
          test "$(find "$output_dir" -maxdepth 1 -type f -name 'canonical-executor-*.json' | wc -l | tr -d ' ')" = 5
          jq -e '.schema == "gooo/self-improvement-execution-grant-canonical-request/v1" and .candidate_input.schema == "gooo/self-improvement-value-witness-execution-input/v1" and .candidate_input.allowed_effects == []' "$output_dir/canonical-executor-grant-request.json" >/dev/null
          jq -e '.schema == "gooo/self-improvement-execution-grant-canonical-decision/v1" and .decision_type == "CANONICAL_EXECUTOR_CONFORMANCE_ONLY" and .fixture and (.live_authority | not) and (.user_decision | not) and (.product_utility_evidence | not) and .execution_scope == "CALLER_OWNED_TEMP_ONLY"' "$output_dir/canonical-executor-grant-decision.json" >/dev/null
          jq -e '.schema == "gooo/self-improvement-execution-grant-canonical-receipt/v1" and .max_executions == 1 and .grant_receipt.remaining_uses == 1 and .grant_receipt.consumed_uses == 0 and .grant_receipt.execution_count == 0 and (.live_authority | not)' "$output_dir/canonical-executor-grant-receipt.json" >/dev/null
          jq -e '.schema == "gooo/self-improvement-execution-grant-canonical-verification/v1" and .verified and .fixture and (.live_authority | not) and .case_denominator == 14 and .counts == {CLOSED:1,UNKNOWN:4,REFUTED:9} and .canonical_execution_count == 0 and .grant_consumed_uses == 0 and .repository_writes == 0 and .local_test_executions == 0 and .independent_replay_comparisons == 1 and ([.cases[] | select(.pass == false)] | length) == 0 and ([.cases[] | select(.actual_decision == "UNKNOWN" and ((.unknown | keys | sort) != ["blocked_by","next_operation","reason","stage","step","unknown_class"]))] | length) == 0' "$output_dir/canonical-executor-grant-verification.json" >/dev/null
          jq -e '.schema == "gooo/self-improvement-execution-grant-canonical-binding-manifest/v1" and .fixture and (.live_authority | not) and .materialized_fixture_count_after == (.materialized_fixture_count_before + 1) and .exact_grant_identity_bindings == .exact_grant_identity_binding_denominator and .exact_grant_identity_binding_denominator == 32 and .artifact_files == 5 and .artifact_types == 5 and (.artifact_names | length) == 5 and .canonical_execution_count == 0 and .receipt_consumed_uses == 0 and .receipt_execution_count == 0 and .executor_contract_digest != null and .materialize_activity_digest != null and .verify_activity_digest != null' "$output_dir/canonical-executor-grant-binding-manifest.json" >/dev/null

      - name: Independently replay the live grant resolution
        shell: bash
        run: |
          set -euo pipefail
          jq '.request' "$GRANT_OUTPUT/live-grant.json" > "$GRANT_WORK/live-request.json"
          jq '.resolution' "$GRANT_OUTPUT/live-grant.json" > "$GRANT_WORK/live-resolution.json"
          go run ./scripts/self-improvement-execution-grant \
            -mode verify \
            -contract examples/self-improvement-execution-grant/grant.gooo \
            -grant-request "$GRANT_WORK/live-request.json" \
            -resolution "$GRANT_WORK/live-resolution.json" \
            -output "$GRANT_OUTPUT/verification.json" \
            -check
          jq -e '.verified and .independent_replay_comparisons == 1 and .execution_count == 0 and .grant_consumed_uses == 0 and .repository_writes == 0 and .local_test_executions == 0' "$GRANT_OUTPUT/verification.json" >/dev/null

      - name: Upload v26 grant evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: self-improvement-execution-grant-${{ env.SUBJECT_SHA }}
          path: |
            ${{ runner.temp }}/self-improvement-execution-grant/output/*.json
            ${{ runner.temp }}/self-improvement-execution-grant/pinned-canonical/output/*.json
          if-no-files-found: error
          retention-days: 14
