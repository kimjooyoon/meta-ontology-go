name: Audience resolution projection

on:
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/audience-resolution.yml
      - cmd/audience-resolution-witness/**
      - cmd/audience-resolution-consumer/**
      - examples/audience-resolution/**
      - internal/meta/audienceresolution/**
      - internal/meta/audienceresolutionconsumer/**
      - internal/bidir/**
      - internal/semantic/**
      - internal/syntax/**
  push:
    branches: [dev]
    paths:
      - .github/workflows/audience-resolution.yml
      - cmd/audience-resolution-witness/**
      - cmd/audience-resolution-consumer/**
      - examples/audience-resolution/**
      - internal/meta/audienceresolution/**
      - internal/meta/audienceresolutionconsumer/**
      - internal/bidir/**
      - internal/semantic/**
      - internal/syntax/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  projection:
    name: Raw ledger projection and independent reconstruction
    runs-on: ubuntu-24.04
    env:
      HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v5
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false
      - name: Set up Go 1.27
        uses: actions/setup-go@v6
        with:
          go-version: 1.27.0
          cache: false
      - name: Execute base projection and independent consumer
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/audience-resolution"
          mkdir -p "$out"
          source="examples/audience-resolution/main.gooo"
          ledger="examples/audience-resolution/ledger.json"
          contract="examples/audience-resolution/contract.json"
          go run ./cmd/audience-resolution-witness --contract "$contract" --ledger "$ledger" --source "$source" --out "$out/base-receipt.json" --artifacts "$out/base-artifacts"
          go run ./cmd/audience-resolution-consumer --ledger "$ledger" --source "$source" --receipt "$out/base-receipt.json" --out "$out/base-consumer.json" --root "$GITHUB_WORKSPACE" --artifacts "$out/base-artifacts" --attestation "$out/base-attestation.json"
          jq -e '(.decision == "PASS") and (.provisional == true) and (.resolution == "EXACT") and (.summary.distinct_propositions == 12) and (.summary.source_denominator > 0) and (.summary.coordinates.satisfied == .summary.coordinates.total) and (.summary.coordinates.total == 10) and (.summary.evidence_counts.current_evidence == 11) and (.summary.evidence_counts.historical_fixture == 12) and (.summary.evidence_counts.unknown == 1) and (.views[0].visible == 4) and (.views[0].required == 12) and (.views[0].local_decision == "UNKNOWN") and (.views[0].local_resolution == "LOWER_RESOLUTION") and (.views[1].visible == 8) and (.views[1].required == 12) and (.views[1].local_decision == "UNKNOWN") and (.views[1].local_resolution == "LOWER_RESOLUTION") and (.views[2].visible == 12) and (.views[2].required == 12) and (.views[2].local_decision == "PASS") and (.views[2].local_resolution == "EXACT") and (.views[2].subject_required == 10) and (.summary.conformance.decision == "UNKNOWN") and (.summary.conformance.seal_evidence_status == "UNKNOWN") and ((.claim_transitions | length) == 36) and ((.counterexamples | map(.global_decision) | sort) == ["REFUTED", "UNKNOWN"]) and (.replay.equal == true) and (.replay.run_a_path != .replay.run_b_path) and (.replay.run_a_digest != "") and (.replay.run_b_digest != "")' "$out/base-receipt.json"
          jq -e '(.decision == "PASS") and (.raw_ledger_final_fields_absent == true) and (.raw_evidence_historical_only == true) and (.receipt_digest_match == true) and (.source_reconstruction.parsed_and_lowered == true) and (.source_reconstruction.declaration_count > 0) and (.source_reconstruction.receipt_matches == true) and (.producer_imports.producer_import_numerator == 0) and (.producer_imports.producer_import_denominator > 0) and (.current_evidence_counts.current_evidence == 11) and (.current_evidence_counts.historical_fixture == 12) and (.current_evidence_counts.unknown == 1) and (.distinct_propositions == 12) and (.replay.equal == true) and (.counterexamples_checked == 2) and (.claim_transitions_checked == 36) and (.verification_attestation.decision == "PASS") and (.verification_attestation.evidence_status == "CURRENT_EVIDENCE") and (.verification_attestation.evidence.observed_value == "true")' "$out/base-consumer.json"
      - name: Execute omission counterexample from a mutated raw ledger
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/audience-resolution"
          source="examples/audience-resolution/main.gooo"
          jq 'del(.records[] | select(.coordinate == "source.binding"))' examples/audience-resolution/ledger.json > "$out/omission-ledger.json"
          go run ./cmd/audience-resolution-witness --contract examples/audience-resolution/contract.json --ledger "$out/omission-ledger.json" --source "$source" --out "$out/omission-receipt.json" --artifacts "$out/omission-artifacts"
          go run ./cmd/audience-resolution-consumer --ledger "$out/omission-ledger.json" --source "$source" --receipt "$out/omission-receipt.json" --out "$out/omission-consumer.json" --root "$GITHUB_WORKSPACE" --artifacts "$out/omission-artifacts" --attestation "$out/omission-attestation.json"
          jq -e '(.decision == "UNKNOWN") and (.resolution == "LOWER_RESOLUTION") and (.summary.evidence_counts.current_evidence == 10) and (.summary.evidence_counts.historical_fixture == 11) and (.summary.evidence_counts.unknown == 1) and (.views[0].local_decision == "UNKNOWN") and (.views[1].local_decision == "UNKNOWN") and (.views[2].local_decision == "UNKNOWN") and (.views[2].visible == 11) and (.views[2].required == 12) and ((.claim_transitions | map(select(.audience == "GOVERNOR" and .indicator_id == "source.binding"))[0].after) == "OPEN") and ((.counterexamples | map(select(.id == "counterexample.missing-information"))[0] | .execution_validated) == true) and ((.counterexamples | map(select(.id == "counterexample.missing-information"))[0] | .after_claim) == "OPEN")' "$out/omission-receipt.json"
          jq -e '(.decision == "PASS") and (.source_reconstruction.receipt_matches == true) and (.verification_attestation.decision == "PASS")' "$out/omission-consumer.json"
      - name: Execute contradiction counterexample from a mutated raw ledger
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/audience-resolution"
          source="examples/audience-resolution/main.gooo"
          jq '(.records[] | select(.coordinate == "ledger.coverage") | .observed_value) = "CONTRADICTORY"' examples/audience-resolution/ledger.json > "$out/contradiction-ledger.json"
          go run ./cmd/audience-resolution-witness --contract examples/audience-resolution/contract.json --ledger "$out/contradiction-ledger.json" --source "$source" --out "$out/contradiction-receipt.json" --artifacts "$out/contradiction-artifacts"
          go run ./cmd/audience-resolution-consumer --ledger "$out/contradiction-ledger.json" --source "$source" --receipt "$out/contradiction-receipt.json" --out "$out/contradiction-consumer.json" --root "$GITHUB_WORKSPACE" --artifacts "$out/contradiction-artifacts" --attestation "$out/contradiction-attestation.json"
          jq -e '(.decision == "REFUTED") and (.resolution == "INVARIANT_ONLY") and (.views[0].local_decision == "REFUTED") and (.views[1].local_decision == "REFUTED") and (.views[2].local_decision == "REFUTED") and ((.claim_transitions | map(select(.indicator_id == "ledger.coverage" and .after == "REFUTED")) | length) == 3) and ((.counterexamples | map(select(.id == "counterexample.decision-contradiction"))[0] | .execution_validated) == true) and ((.counterexamples | map(select(.id == "counterexample.decision-contradiction"))[0] | .after_claim) == "REFUTED")' "$out/contradiction-receipt.json"
          jq -e '(.decision == "PASS") and (.source_reconstruction.receipt_matches == true) and (.verification_attestation.decision == "PASS")' "$out/contradiction-consumer.json"
      - name: Execute semantic-policy and comment-only interventions
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/audience-resolution"
          source="examples/audience-resolution/main.gooo"
          cp "$source" "$out/comment-only.gooo"
          sed -i '1i# presentation-only intervention' "$out/comment-only.gooo"
          cp "$source" "$out/semantic-policy.gooo"
          sed -i \
            -e 's|/TOOL_AUTHOR/08/governor.coordinates|/TOOL_AUTHOR/09/governor.coordinates|' \
            -e 's|/TOOL_AUTHOR/07/author.coordinates|/TOOL_AUTHOR/08/author.coordinates|' \
            -e 's|/TOOL_AUTHOR/06/ledger.replay|/TOOL_AUTHOR/07/ledger.replay|' \
            -e 's|/TOOL_AUTHOR/05/source.binding|/TOOL_AUTHOR/06/source.binding|' \
            -e 's|/GOVERNOR/12/receipt.seal|/GOVERNOR/13/receipt.seal|' \
            -e 's|/GOVERNOR/11/counterexample.contradiction|/GOVERNOR/12/counterexample.contradiction|' \
            -e 's|/GOVERNOR/10/counterexample.omission|/GOVERNOR/11/counterexample.omission|' \
            -e 's|/GOVERNOR/09/projection.nesting|/GOVERNOR/10/projection.nesting|' \
            -e 's|/GOVERNOR/08/governor.coordinates|/GOVERNOR/09/governor.coordinates|' \
            -e 's|/GOVERNOR/07/author.coordinates|/GOVERNOR/08/author.coordinates|' \
            -e 's|/GOVERNOR/06/ledger.replay|/GOVERNOR/07/ledger.replay|' \
            -e 's|/GOVERNOR/05/source.binding|/GOVERNOR/06/source.binding|' \
            "$out/semantic-policy.gooo"
          printf '%s\n' \
            'entity PolicyUserSemanticIntervention id "gooo://audience-resolution/policy/USER/05/semantic.intervention"' \
            'entity PolicyAuthorSemanticIntervention id "gooo://audience-resolution/policy/TOOL_AUTHOR/05/semantic.intervention"' \
            'entity PolicyGovernorSemanticIntervention id "gooo://audience-resolution/policy/GOVERNOR/05/semantic.intervention"' >> "$out/semantic-policy.gooo"
          for kind in comment-only semantic-policy; do
            variant="$out/$kind.gooo"
            digest="sha256:$(sha256sum "$variant" | awk '{print $1}')"
            jq --arg digest "$digest" '.source.digest = $digest' examples/audience-resolution/ledger.json > "$out/$kind-ledger.json"
            go run ./cmd/audience-resolution-witness --contract examples/audience-resolution/contract.json --ledger "$out/$kind-ledger.json" --source "$variant" --out "$out/$kind-receipt.json" --artifacts "$out/$kind-artifacts"
            go run ./cmd/audience-resolution-consumer --ledger "$out/$kind-ledger.json" --source "$variant" --receipt "$out/$kind-receipt.json" --out "$out/$kind-consumer.json" --root "$GITHUB_WORKSPACE" --artifacts "$out/$kind-artifacts" --attestation "$out/$kind-attestation.json"
            jq -e '(.decision == "PASS") and (.source_reconstruction.receipt_matches == true) and (.verification_attestation.decision == "PASS")' "$out/$kind-consumer.json"
          done
          base_state="$(jq -c '[.decision,.resolution]' "$out/base-receipt.json")"
          semantic_state="$(jq -c '[.decision,.resolution]' "$out/semantic-policy-receipt.json")"
          comment_state="$(jq -c '[.decision,.resolution]' "$out/comment-only-receipt.json")"
          base_views="$(jq -c '[.views[] | {audience,local_decision,local_resolution,visible,required,subject_satisfied,subject_required}]' "$out/base-receipt.json")"
          semantic_views="$(jq -c '[.views[] | {audience,local_decision,local_resolution,visible,required,subject_satisfied,subject_required}]' "$out/semantic-policy-receipt.json")"
          comment_views="$(jq -c '[.views[] | {audience,local_decision,local_resolution,visible,required,subject_satisfied,subject_required}]' "$out/comment-only-receipt.json")"
          base_transitions="$(jq -c '[.claim_transitions[] | {claim_id,audience,indicator_id,before,after,visibility,evidence_status}]' "$out/base-receipt.json")"
          semantic_transitions="$(jq -c '[.claim_transitions[] | {claim_id,audience,indicator_id,before,after,visibility,evidence_status}]' "$out/semantic-policy-receipt.json")"
          comment_transitions="$(jq -c '[.claim_transitions[] | {claim_id,audience,indicator_id,before,after,visibility,evidence_status}]' "$out/comment-only-receipt.json")"
          jq -n \
            --arg base_raw "$(jq -r '.source.digest' "$out/base-receipt.json")" \
            --arg semantic_raw "$(jq -r '.source.digest' "$out/semantic-policy-receipt.json")" \
            --arg comment_raw "$(jq -r '.source.digest' "$out/comment-only-receipt.json")" \
            --arg base_semantic "$(jq -r '.source.semantic_digest' "$out/base-receipt.json")" \
            --arg semantic_semantic "$(jq -r '.source.semantic_digest' "$out/semantic-policy-receipt.json")" \
            --arg comment_semantic "$(jq -r '.source.semantic_digest' "$out/comment-only-receipt.json")" \
            --argjson base_state "$base_state" --argjson semantic_state "$semantic_state" --argjson comment_state "$comment_state" \
            --argjson base_views "$base_views" --argjson semantic_views "$semantic_views" --argjson comment_views "$comment_views" \
            --argjson base_transitions "$base_transitions" --argjson semantic_transitions "$semantic_transitions" --argjson comment_transitions "$comment_transitions" \
            '{semantic_policy:{raw_digest_changed:($base_raw != $semantic_raw),semantic_digest_changed:($base_semantic != $semantic_semantic),decision_changed:($base_state != $semantic_state),projection_changed:($base_views != $semantic_views),claim_transitions_changed:($base_transitions != $semantic_transitions),base_state:$base_state,variant_state:$semantic_state,base_transition_count:($base_transitions|length),variant_transition_count:($semantic_transitions|length)},comment_only:{raw_digest_changed:($base_raw != $comment_raw),semantic_digest_preserved:($base_semantic == $comment_semantic),decision_preserved:($base_state == $comment_state),projection_preserved:($base_views == $comment_views),claim_transitions_preserved:($base_transitions == $comment_transitions)}}' > "$out/interventions.json"
          jq -e '(.semantic_policy.semantic_digest_changed == true) and (.semantic_policy.decision_changed == true or .semantic_policy.projection_changed == true or .semantic_policy.claim_transitions_changed == true) and (.semantic_policy.claim_transitions_changed == true) and (.comment_only.raw_digest_changed == true) and (.comment_only.semantic_digest_preserved == true) and (.comment_only.decision_preserved == true) and (.comment_only.projection_preserved == true) and (.comment_only.claim_transitions_preserved == true)' "$out/interventions.json"
      - name: Publish audience resolution summary
        if: always()
        shell: bash
        run: |
          out="$RUNNER_TEMP/audience-resolution"
          if [ -f "$out/base-receipt.json" ]; then
            {
              echo '### Audience resolution projection'
              jq -r '"- global subject: `\(.decision)` / `\(.resolution)`; provisional: `\(.provisional)`; source-derived IR denominator: `\(.summary.source_denominator)`; distinct propositions: `\(.summary.distinct_propositions)`"' "$out/base-receipt.json"
              jq -r '"- evidence lifecycle: CURRENT `\(.summary.evidence_counts.current_evidence)`, HISTORICAL `\(.summary.evidence_counts.historical_fixture)`, UNKNOWN `\(.summary.evidence_counts.unknown)`; replay: `\(.replay.run_a_digest)` = `\(.replay.run_b_digest)`; seal conformance: `\(.summary.conformance.decision)` / `\(.summary.conformance.seal_evidence_status)`"' "$out/base-receipt.json"
              jq -r '"- USER: visible/required `\(.views[0].visible)/\(.views[0].required)`, local `\(.views[0].local_decision)`; TOOL_AUTHOR: `\(.views[1].visible)/\(.views[1].required)`, `\(.views[1].local_decision)`; GOVERNOR: `\(.views[2].visible)/\(.views[2].required)`, `\(.views[2].local_decision)`"' "$out/base-receipt.json"
              jq -r '"- claims: `\(.claim_transitions | length)` audience events over `\(.summary.distinct_propositions)` propositions; counterexamples: `\(.counterexamples | map(.global_decision) | sort | join(", "))`"' "$out/base-receipt.json"
              jq -r '"- independent consumer: `\(.decision)`; producer imports: `\(.producer_imports.producer_import_numerator)/\(.producer_imports.producer_import_denominator)`; attestation: `\(.verification_attestation.digest)`"' "$out/base-consumer.json"
              jq -r '"- interventions: semantic digest/decision/projection/transitions `\(.semantic_policy.semantic_digest_changed)/\(.semantic_policy.decision_changed)/\(.semantic_policy.projection_changed)/\(.semantic_policy.claim_transitions_changed)`; comment-only preserved `\(.comment_only.semantic_digest_preserved)/\(.comment_only.decision_preserved)/\(.comment_only.projection_preserved)/\(.comment_only.claim_transitions_preserved)`"' "$out/interventions.json"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload receipts, mutations, and independent artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: audience-resolution-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/audience-resolution
          if-no-files-found: error
          retention-days: 30
