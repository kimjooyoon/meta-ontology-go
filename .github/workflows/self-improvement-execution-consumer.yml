name: Self-improvement bounded execution consumer

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: Producer repository
        required: true
        type: string
      source_head_sha:
        description: Producer workflow commit
        required: true
        type: string
      subject_sha:
        description: Logical program subject
        required: true
        type: string
      source_run_id:
        description: Exact grant producer run
        required: true
        type: string
      source_run_attempt:
        description: Original producer attempt
        required: true
        type: string
      source_artifact_id:
        description: Immutable grant artifact
        required: true
        type: string
      source_artifact_digest:
        description: Grant archive digest
        required: true
        type: string
      grant_request_digest:
        description: Grant intent identity and serialization key
        required: true
        type: string
      source_wait:
        description: Parent wait boundary
        required: true
        type: string
      policy_digest:
        description: Gooo continuation source identity
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: self-improvement-grant-${{ inputs.grant_request_digest }}
  cancel-in-progress: false

jobs:
  consume:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_REPOSITORY: ${{ inputs.source_repository }}
      SOURCE_HEAD_SHA: ${{ inputs.source_head_sha }}
      SUBJECT_SHA: ${{ inputs.subject_sha }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
      SOURCE_ARTIFACT_ID: ${{ inputs.source_artifact_id }}
      SOURCE_ARTIFACT_DIGEST: ${{ inputs.source_artifact_digest }}
      GRANT_REQUEST_DIGEST: ${{ inputs.grant_request_digest }}
      SOURCE_WAIT: ${{ inputs.source_wait }}
      SOURCE_POLICY_DIGEST: ${{ inputs.policy_digest }}
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
      - name: Check out the consumer workflow authority
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.3'
          cache: false

      - name: Bind grant, contract and exact subject snapshot
        id: prepare
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = "go1.27.3"
          work="$RUNNER_TEMP/self-improvement-execution-consumer"
          go run ./scripts/self-improvement-execution-consumer -mode prepare -output "$work/input"
          jq -r '"ready=\(.state == "SOURCE_BOUND")"' "$work/input/binding.json" >> "$GITHUB_OUTPUT"
          jq -r '"consumer source: \(.state)/\(.reason)"' "$work/input/binding.json" >> "$GITHUB_STEP_SUMMARY"
          echo "CONSUMER_WORK=$work" >> "$GITHUB_ENV"
          echo "CONSUMPTION_ARTIFACT=gooo-consumed-${GRANT_REQUEST_DIGEST//:/-}" >> "$GITHUB_ENV"

      - name: Reserve the exact grant before execution
        if: steps.prepare.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          env -u GH_TOKEN -u GITHUB_TOKEN go run ./scripts/self-improvement-execution-consumer \
            -mode reserve -input "$CONSUMER_WORK/input/prepared.json" -output "$CONSUMER_WORK/reservation.json"
          jq -e '.status == "CONSUMPTION_RESERVED" and .consumed_uses == 1 and
            .remaining_uses == 0 and .execution_count == 0 and .one_use_enforced and
            .enforcement_scope == "SERIALIZED_CONSUMER_WITH_RETAINED_ARTIFACT_HISTORY"' \
            "$CONSUMER_WORK/reservation.json" >/dev/null

      - name: Persist the one-use reservation
        if: steps.prepare.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CONSUMPTION_ARTIFACT }}
          path: ${{ runner.temp }}/self-improvement-execution-consumer/reservation.json
          if-no-files-found: error
          retention-days: 14

      - name: Execute the bounded Gooo value experiment
        if: steps.prepare.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          output="$CONSUMER_WORK/consumption-report.json"
          env -u GH_TOKEN -u GITHUB_TOKEN go run ./scripts/self-improvement-execution-consumer \
            -mode consume -input "$CONSUMER_WORK/input/prepared.json" \
            -reservation "$CONSUMER_WORK/reservation.json" -output "$output"
          jq -e '.schema == "gooo/self-improvement-execution-consumption/v2" and
            .stage == "EXECUTION_OBSERVED" and .execution_count == 1 and .evaluator_invocations == 5 and
            .consumed_uses == 1 and .remaining_uses == 0 and .one_use_enforced and
            .repository_writes == 0 and .external_effects == [] and
            .case_count == 5 and .passed_cases == 5 and .performance_improvement == "UNKNOWN" and
            ([.cases[] | select(.passed == false)] | length) == 0' "$output" >/dev/null
          jq -r '"Gooo execution: \(.passed_cases)/\(.case_count), evaluator calls \(.evaluator_invocations), stage \(.stage)"' \
            "$output" >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve consumer origins and result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: self-improvement-consumer-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/self-improvement-execution-consumer/input/binding.json
            ${{ runner.temp }}/self-improvement-execution-consumer/consumption-report.json
          if-no-files-found: warn
          retention-days: 14
