name: Evidence freshness experiment

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  evidence-freshness:
    name: evidence-freshness
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: go1.27.0
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out exact head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go 1.27
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.0'
          cache: true
      - name: Format and test freshness packages
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(gofmt -l cmd/evidence-freshness cmd/evidence-freshness-decider internal/meta/evidencefreshness)"
          go test ./cmd/evidence-freshness ./cmd/evidence-freshness-decider ./internal/meta/evidencefreshness/...
      - name: Produce and independently decide freshness evidence
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="$HEAD_SHA" EVIDENCE_FRESHNESS_OUTPUT="$RUNNER_TEMP/evidence-freshness" \
            bash scripts/evidence-freshness/main.sh
      - name: Upload exact-head freshness evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: evidence-freshness-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/evidence-freshness
          if-no-files-found: error
          retention-days: 30
