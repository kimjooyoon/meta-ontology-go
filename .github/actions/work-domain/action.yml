name: Bind Gooo command work domain
description: Consume this run's prepared tool, common clock and prior command costs
inputs:
  expected-sha:
    description: Exact current source head
    required: true
runs:
  using: composite
  steps:
    - name: Consume the original tool producer
      uses: actions/download-artifact@v8
      with:
        name: work-domain-tool-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/ci-domain-tool
    - name: Bind current source and producer origin
      shell: bash
      env:
        EXPECTED_SOURCE_HEAD: ${{ inputs.expected-sha }}
      run: |
        set -euo pipefail
        root="$RUNNER_TEMP/ci-domain-tool"
        digest="$(sha256sum "$root/gooo-ci-domain" | cut -d ' ' -f 1)"
        jq -e --arg head "$EXPECTED_SOURCE_HEAD" --arg run "$GITHUB_RUN_ID" \
          --arg attempt "$GITHUB_RUN_ATTEMPT" --arg sha "$digest" \
          '.schema == "gooo/work-domain-tool-origin/v1" and .source_head == $head and
            .run_id == $run and .run_attempt == $attempt and .tool_sha256 == $sha and
             .clock_scope == "admitted_source_work" and
            .tool_revision == "aa0e33f2e5ec36f319232080361e5fc967d6c442"' \
          "$root/origin.json" > /dev/null
        started="$(jq -r .started_at "$root/origin.json")"
        remaining=$((GOOO_CI_BUDGET_MS / 1000 - ($(date +%s) - $(date -d "$started" +%s))))
        test "$remaining" -gt 0
        chmod u+x "$root/gooo-ci-domain"
        mkdir -p "$RUNNER_TEMP/command-origins-$GITHUB_JOB"
        cp "$root/origin.json" "$RUNNER_TEMP/command-origins-$GITHUB_JOB/scope-origin.json"
        {
          printf 'GOOO_CI_STARTED_AT=%s\n' "$started"
          printf 'GOOO_CI_WORKFLOW_CREATED_AT=%s\n' "$(jq -r .workflow_created_at "$root/origin.json")"
          printf 'GOOO_CI_SOURCE_HEAD=%s\n' "$EXPECTED_SOURCE_HEAD"
          printf 'GOOO_CI_DOMAIN=%s/gooo-ci-domain\n' "$root"
          printf 'GOOO_CI_ORIGIN_ROOT=%s/command-origins-%s\n' "$RUNNER_TEMP" "$GITHUB_JOB"
        } >> "$GITHUB_ENV"
    - name: Restore matching command cost origins
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/command-origins-${{ github.job }}/command-origins.jsonl
        key: command-origin-v2-${{ runner.os }}-${{ runner.arch }}-aa0e33f-${{ github.event_name }}-${{ github.base_ref || github.ref_name }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          command-origin-v2-${{ runner.os }}-${{ runner.arch }}-aa0e33f-${{ github.event_name }}-${{ github.base_ref || github.ref_name }}-${{ github.job }}-
