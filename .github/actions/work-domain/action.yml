name: Bind Gooo command work domain
description: Consume this run's prepared tool, observed runner clock and prior command costs
inputs:
  expected-sha:
    description: Exact current source head
    required: true
runs:
  using: composite
  steps:
    - name: Consume the original tool producer
      uses: actions/download-artifact@v8
      with:
        name: work-domain-tool-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/ci-domain-tool
    - name: Bind current source and producer origin
      shell: bash
      env:
        EXPECTED_SOURCE_HEAD: ${{ inputs.expected-sha }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        [[ "$GOOO_CI_DOMAIN_REVISION" =~ ^[0-9a-f]{40}$ ]]
        root="$RUNNER_TEMP/ci-domain-tool"
        digest="$(sha256sum "$root/gooo-ci-domain" | cut -d ' ' -f 1)"
        jq -e --arg head "$EXPECTED_SOURCE_HEAD" --arg run "$GITHUB_RUN_ID" \
          --arg attempt "$GITHUB_RUN_ATTEMPT" --arg sha "$digest" \
          --arg revision "$GOOO_CI_DOMAIN_REVISION" \
          '.schema == "gooo/work-domain-tool-origin/v1" and .source_head == $head and
            .run_id == $run and .run_attempt == $attempt and .tool_sha256 == $sha and
             .clock_scope == "admitted_source_work" and
            .tool_revision == $revision' \
          "$root/origin.json" > /dev/null
        chmod u+x "$root/gooo-ci-domain"
        origins="$RUNNER_TEMP/command-origins-$GITHUB_JOB"
        mkdir -p "$origins"
        printf 'GOOO_CI_ORIGIN_ROOT=%s\n' "$origins" >> "$GITHUB_ENV"
        cp "$root/origin.json" "$origins/scope-origin.json"
        job_name="$(jq -er --arg job "$GITHUB_JOB" '.[$job]' "$GITHUB_ACTION_PATH/jobs.json")"
        timeout --signal=KILL 30s bash "$GITHUB_ACTION_PATH/observe-clock.sh" \
          "$root/gooo-ci-domain" "$origins" "$job_name"
        started="$(jq -er '.effective_started_at' "$origins/runner-clock.json")"
        {
          printf 'GOOO_CI_STARTED_AT=%s\n' "$started"
          printf 'GOOO_CI_CLOCK_SCOPE=runner_active_union\n'
          printf 'GOOO_CI_WORKFLOW_CREATED_AT=%s\n' "$(jq -r .workflow_created_at "$root/origin.json")"
          printf 'GOOO_CI_SOURCE_HEAD=%s\n' "$EXPECTED_SOURCE_HEAD"
          printf 'GOOO_CI_DOMAIN=%s/gooo-ci-domain\n' "$root"
        } >> "$GITHUB_ENV"
    - name: Restore matching command cost origins
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/command-origins-${{ github.job }}/command-origins.jsonl
        key: command-origin-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.GOOO_CI_DOMAIN_REVISION }}-${{ github.event_name }}-${{ github.base_ref || github.ref_name }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          command-origin-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.GOOO_CI_DOMAIN_REVISION }}-${{ github.event_name }}-${{ github.base_ref || github.ref_name }}-${{ github.job }}-
